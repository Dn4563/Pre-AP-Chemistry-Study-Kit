se, "exp": "At 0 K (absolute zero) particles have the minimum possible motion; that is why nothing can be colder."}, {"id": "X3", "type": "tf", "topic": "States of matter", "stem": "Deposition is the change of a gas directly into a solid, such as frost forming on a window.", "ans": true, "exp": "Deposition is the reverse of sublimation and removes energy as particles slow down."}, {"id": "X4", "type": "tf", "topic": "States of matter", "stem": "Sublimation is a chemical change because the solid disappears.", "ans": false, "exp": "Sublimation is a physical change: the solid becomes a gas of the same substance, such as dry ice becoming carbon dioxide gas."}, {"id": "X5", "type": "tf", "topic": "Properties", "stem": "According to the review sheet, pH and reacting with metals are chemical properties.", "ans": true, "exp": "A chemical property is the ability to change into a new substance, or not to change; the review lists pH and reacting or not reacting."}, {"id": "X6", "type": "tf", "topic": "Classifying matter", "stem": "A suspension is a heterogeneous mixture that settles upon standing.", "ans": true, "exp": "Mud, juice with pulp and oil and water all separate if left alone."}, {"id": "X7", "type": "tf", "topic": "Classifying matter", "stem": "Steel and 18K gold are both homogeneous mixtures.", "ans": true, "exp": "Both are alloys: metals mixed uniformly, so they are the same throughout."}, {"id": "X9", "type": "tf", "topic": "Classifying matter", "stem": "The slides classify gasoline as a homogeneous mixture.", "ans": true, "exp": "Gasoline is the same throughout, so it is a homogeneous mixture (a solution)."}, {"id": "X10", "type": "tf", "topic": "Physical vs chemical change", "stem": "The growth of grass in a yard is a chemical change.", "ans": true, "exp": "The textbook lists it with rusting and digestion: a plant makes new substances from air, water and soil."}, {"id": "X11", "type": "tf", "topic": "Colloids", "stem": "A colloid can be separated by simple filtration but not by a high-speed centrifuge.", "ans": false, "exp": "It is the other way around: colloid particles pass through simple filters, but a high-speed centrifuge can separate them (for example cream from milk)."}, {"id": "X8", "type": "tf", "topic": "Separating mixtures", "stem": "In chromatography, the fixed phase is the part that carries the mixture along.", "ans": false, "exp": "The mobile phase (such as water) carries the parts along; the fixed phase (such as the paper) does not move."}, {"id": "X12", "type": "tf", "topic": "Colloids", "stem": "Fog is an aerosol made of a liquid dispersed in a gas.", "ans": true, "exp": "Tiny water droplets are spread through air, so fog is a liquid in a gas."}, {"id": "X13", "type": "tf", "topic": "Colloids", "stem": "Mayonnaise is an emulsion, which is a liquid dispersed in a liquid.", "ans": true, "exp": "Oil droplets are spread through a water-based liquid."}, {"id": "X14", "type": "tf", "topic": "Colloids", "stem": "A beam of light is visible in a colloid but not in a true solution.", "ans": true, "exp": "Colloid particles scatter light (the Tyndall effect). Solution particles are too small to scatter it."}, {"id": "X15", "type": "tf", "topic": "Colloids", "stem": "Colloid particles settle to the bottom when left standing.", "ans": false, "exp": "Colloids are stable and do not settle. Suspensions are the mixtures that settle."}, {"id": "X16", "type": "tf", "topic": "Colloids", "stem": "Brownian movement is the smooth, straight-line motion of colloid particles.", "ans": false, "exp": "It is a continuous, random zigzag path."}, {"id": "X17", "type": "tf", "topic": "Colloids", "stem": "In a colloid, the dispersion medium is the component present in the larger quantity.", "ans": true, "exp": "The dispersed phase is the smaller amount, like a solute, and the medium is the larger amount, like a solvent."}, {"id": "X18", "type": "tf", "topic": "Colloids", "stem": "A gel is a gas dispersed in a liquid.", "ans": false, "exp": "A gel is a liquid dispersed in a solid, such as jelly or cheese. A gas in a liquid is a foam."}]}, {"name": "Labeling", "kind": "label", "mode": "practice", "questions": [{"id": "L1", "type": "label", "topic": "Classifying matter", "stem": "Label each material as an element, a compound or a mixture.", "labels": ["Element", "Compound", "Mixture"], "items": [{"t": "Br₂", "ans": 0, "exp": "Only one type of atom (bromine), even though it is a molecule."}, {"t": "NaHCO₃", "ans": 1, "exp": "Contains Na, H, C and O atoms bonded in one fixed formula, and there is no & symbol."}, {"t": "C₆H₁₂O₆ & H₂O", "ans": 2, "exp": "The & shows different substances sitting together (sugar and water)."}, {"t": "Cu & Zn", "ans": 2, "exp": "Two different elements mixed, not bonded into one formula."}, {"t": "Al", "ans": 0, "exp": "One capital letter and one type of atom."}, {"t": "CO₂", "ans": 1, "exp": "Carbon and oxygen are bonded in a fixed ratio."}]}, {"id": "L2", "type": "label", "topic": "Classifying matter", "stem": "Label each material as an element, a compound or a mixture.", "labels": ["Element", "Compound", "Mixture"], "items": [{"t": "P₄", "ans": 0, "exp": "Four phosphorus atoms bonded together, still only one type of atom."}, {"t": "N₂ & O₂ & Ar & CO₂ (air)", "ans": 2, "exp": "Several different substances with & between them."}, {"t": "H₂SO₄", "ans": 1, "exp": "Hydrogen, sulfur and oxygen atoms in one formula."}, {"t": "O₃", "ans": 0, "exp": "Only oxygen atoms."}, {"t": "H₂O₂", "ans": 1, "exp": "Two different types of atoms bonded together, in a different ratio than water."}, {"t": "NaCl & H₂O", "ans": 2, "exp": "Salt water: two substances mixed together."}]}, {"id": "L3", "type": "label", "topic": "Physical vs chemical change", "stem": "Label each change as a physical change or a chemical change.", "labels": ["Physical change", "Chemical change"], "items": [{"t": "Iron metal melting", "ans": 0, "exp": "Liquid iron is still iron."}, {"t": "Iron combining with oxygen to form rust", "ans": 1, "exp": "A new substance (iron oxide) forms."}, {"t": "Sugar fermenting to form ethyl alcohol", "ans": 1, "exp": "A different substance forms."}, {"t": "Wood burning in a fireplace", "ans": 1, "exp": "Ash and gases are new substances."}, {"t": "Crushing rock salt", "ans": 0, "exp": "Smaller pieces with the same composition."}, {"t": "Dissolving sugar in water", "ans": 0, "exp": "Same substances, just spread through the water."}]}, {"id": "L4", "type": "label", "topic": "Physical vs chemical change", "stem": "Label each change as a physical change or a chemical change.", "labels": ["Physical change", "Chemical change"], "items": [{"t": "A popsicle melting on a warm day", "ans": 0, "exp": "Change of state only."}, {"t": "Water boiling to form steam", "ans": 0, "exp": "The H₂O molecules remain intact."}, {"t": "Electrolysis of water into H₂ and O₂", "ans": 1, "exp": "H₂O is replaced by different substances."}, {"t": "Milk turning sour", "ans": 1, "exp": "New substances such as acids form, and the milk cannot turn back into fresh milk."}, {"t": "The copper skin of the Statue of Liberty turning green", "ans": 1, "exp": "Copper reacts with substances in the air to form a new greenish coating."}, {"t": "Salt water being distilled", "ans": 0, "exp": "A separation by boiling point; no new substances form."}]}, {"id": "L5", "type": "label", "topic": "Colloids", "stem": "Label each mixture as a solution, a colloid or a suspension.", "labels": ["Solution", "Colloid", "Suspension"], "items": [{"t": "Sugar completely dissolved in water", "ans": 0, "exp": "Smallest particles; it does not scatter light or settle."}, {"t": "Milk", "ans": 1, "exp": "Fat droplets about 1 to 1000 nm spread through water; stable and scatters light."}, {"t": "Muddy water that clears after sitting overnight", "ans": 2, "exp": "Large particles settle upon standing."}, {"t": "Fog", "ans": 1, "exp": "Tiny liquid droplets spread through air; the beam of a flashlight is visible in it."}, {"t": "Salt dissolved in water", "ans": 0, "exp": "A true solution is uniform and does not scatter a beam of light."}, {"t": "Orange juice with pulp that sinks to the bottom", "ans": 2, "exp": "Pulp settles when the juice stands."}]}]}, {"name": "Confusion drills", "kind": "drill", "mode": "practice", "questions": [{"id": "D1", "type": "label", "topic": "Classifying matter", "stem": "Element or compound? Watch the capital letters and the subscripts.", "labels": ["Element", "Compound"], "items": [{"t": "Oxygen gas, O₂", "ans": 0, "exp": "Two atoms of the same element are bonded together. Only one kind of atom is present, so it is an element."}, {"t": "Water, H₂O", "ans": 1, "exp": "Two different elements, hydrogen and oxygen, in a fixed ratio."}, {"t": "Ozone, O₃", "ans": 0, "exp": "A subscript of 3 does not make it a compound. Only oxygen atoms are present."}, {"t": "Carbon monoxide, CO", "ans": 1, "exp": "Two capital letters, C and O, mean two different elements."}, {"t": "Cobalt, Co", "ans": 0, "exp": "One capital letter followed by a lowercase letter is one element symbol."}, {"t": "Table salt, NaCl", "ans": 1, "exp": "Sodium and chlorine are different elements bonded in a fixed ratio."}]}, {"id": "D2", "type": "label", "topic": "Classifying matter", "stem": "Compound or mixture? A compound has a fixed formula; a mixture can be mixed in any amounts.", "labels": ["Compound", "Mixture"], "items": [{"t": "Salt dissolved in water", "ans": 1, "exp": "The salt and water keep their identities and the amounts can vary, so it is a (homogeneous) mixture."}, {"t": "Carbon dioxide, CO₂", "ans": 0, "exp": "Carbon and oxygen bonded in a fixed 1 to 2 ratio."}, {"t": "Air", "ans": 1, "exp": "Mostly nitrogen and oxygen gases that are not bonded to each other."}, {"t": "Sugar, C₁₂H₂₂O₁₁", "ans": 0, "exp": "One substance with a fixed formula, made of carbon, hydrogen and oxygen."}, {"t": "Brass, copper and zinc melted together", "ans": 1, "exp": "An alloy is a solid solution; the proportions of copper and zinc can vary."}, {"t": "Rust, Fe₂O₃", "ans": 0, "exp": "A single substance with a fixed formula; iron and oxygen are chemically combined."}]}, {"id": "D3", "type": "label", "topic": "Classifying matter", "stem": "Pure substance or mixture? A pure substance is a single element or a single compound.", "labels": ["Pure substance", "Mixture"], "items": [{"t": "Distilled water", "ans": 0, "exp": "Only H₂O is present, so it is a compound and therefore a pure substance."}, {"t": "A sports drink", "ans": 1, "exp": "Water, sugar, salts and flavorings dissolved together."}, {"t": "A diamond (carbon)", "ans": 0, "exp": "Only carbon atoms, so it is an element."}, {"t": "Granite", "ans": 1, "exp": "Visible crystals of different minerals; heterogeneous."}, {"t": "Baking soda, NaHCO₃", "ans": 0, "exp": "One compound with a fixed formula."}, {"t": "Milk", "ans": 1, "exp": "Fat droplets, proteins and water; it is a colloid, which is a mixture."}]}, {"id": "D4", "type": "label", "topic": "Classifying matter", "stem": "Homogeneous or heterogeneous mixture? Homogeneous means uniform throughout.", "labels": ["Homogeneous mixture", "Heterogeneous mixture"], "items": [{"t": "Sugar stirred completely into hot tea", "ans": 0, "exp": "A solution looks the same throughout."}, {"t": "Pizza", "ans": 1, "exp": "Different parts are visible and different samples have different composition."}, {"t": "Clean air", "ans": 0, "exp": "A uniform mixture of gases."}, {"t": "Trail mix", "ans": 1, "exp": "Pieces of nuts, fruit and chocolate are visibly separate."}, {"t": "Oil and vinegar dressing before shaking", "ans": 1, "exp": "Two visible layers."}, {"t": "Apple juice with no pulp", "ans": 0, "exp": "Sugars, acids and flavor molecules dissolved evenly in water."}]}, {"id": "D5", "type": "label", "topic": "Physical vs chemical change", "stem": "These look dramatic but are they chemical? Choose physical or chemical change.", "labels": ["Physical change", "Chemical change"], "items": [{"t": "Water boiling in a pot, with bubbles rising", "ans": 0, "exp": "The bubbles are water vapor. Liquid water became gaseous water; still H₂O."}, {"t": "Sugar dissolving in tea", "ans": 0, "exp": "The sugar is still sugar and could be recovered by evaporation."}, {"t": "Dry ice turning into a foggy gas", "ans": 0, "exp": "Solid carbon dioxide becomes gaseous carbon dioxide (sublimation). Same substance."}, {"t": "A glass cup shattering", "ans": 0, "exp": "Only size and shape change."}, {"t": "Dissolving salt in water and then evaporating the water to get the salt back", "ans": 0, "exp": "Both steps are physical; the salt is recovered unchanged."}, {"t": "Melted butter hardening again in the fridge", "ans": 0, "exp": "Freezing or solidifying is a change of state."}]}, {"id": "D6", "type": "label", "topic": "Physical vs chemical change", "stem": "These look quiet but are they physical? Choose physical or chemical change.", "labels": ["Physical change", "Chemical change"], "items": [{"t": "Milk turning sour", "ans": 1, "exp": "New substances such as acids form, and the milk cannot turn back into fresh milk."}, {"t": "A cut banana turning brown", "ans": 1, "exp": "Substances in the fruit react with oxygen to form new brown substances."}, {"t": "A silver spoon tarnishing", "ans": 1, "exp": "Silver reacts with sulfur compounds in the air to form a new dark substance."}, {"t": "An egg turning from clear to white and firm when fried", "ans": 1, "exp": "The proteins change into new substances that cannot be reversed by cooling."}, {"t": "Digesting a cracker", "ans": 1, "exp": "Starch is broken down into sugars, which are new substances."}, {"t": "Cake batter baking into a cake", "ans": 1, "exp": "Gas forms, the color changes and new substances with new properties form."}]}, {"id": "D7", "type": "label", "topic": "Properties", "stem": "Physical property or chemical property?", "labels": ["Physical property", "Chemical property"], "items": [{"t": "Aluminum has a density of 2.70 g/cm³", "ans": 0, "exp": "Density can be measured without changing the substance."}, {"t": "Iron can rust", "ans": 1, "exp": "The ability to turn into a new substance is a chemical property."}, {"t": "Ethanol boils at 78 °C", "ans": 0, "exp": "Boiling point is measured without making a new substance."}, {"t": "Gasoline is flammable", "ans": 1, "exp": "Flammability describes the ability to burn and form new substances."}, {"t": "Copper conducts electricity", "ans": 0, "exp": "Conductivity is observed without changing copper."}, {"t": "Hydrogen peroxide breaks down into water and oxygen", "ans": 1, "exp": "The ability to decompose into new substances."}]}, {"id": "D8", "type": "label", "topic": "Properties", "stem": "From the textbook self-check: physical property or chemical property?", "labels": ["Physical property", "Chemical property"], "items": [{"t": "Gallium metal melts in your hand", "ans": 0, "exp": "Melting point is observed without forming a new substance."}, {"t": "Platinum does not react with oxygen at room temperature", "ans": 1, "exp": "Reacting or not reacting with other substances is a chemical property."}, {"t": "A page of the textbook is white", "ans": 0, "exp": "Color is observed without changing the paper."}, {"t": "Copper sheets acquire a greenish coating over the years", "ans": 1, "exp": "Copper reacts with substances in the air to form a new compound, so it is a chemical property (and the coating is a chemical change)."}, {"t": "A metal wire conducts an electric current", "ans": 0, "exp": "The wire has the same composition before and after the current passes."}, {"t": "Diamond is very hard", "ans": 0, "exp": "Hardness describes the substance without changing it."}]}, {"id": "D9", "type": "label", "topic": "Colloids", "stem": "Name the colloid from its structure (what is dispersed in what). Aerosol and solid sol each cover two structures.", "labels": ["Aerosol", "Foam", "Emulsion", "Sol", "Gel", "Solid sol"], "items": [{"t": "Solid dispersed in a gas (smoke)", "ans": 0, "exp": "A gas is the medium, so it is an aerosol."}, {"t": "Gas dispersed in a liquid (whipped cream)", "ans": 1, "exp": "Gas bubbles spread through a liquid make a foam."}, {"t": "Liquid dispersed in a liquid (milk)", "ans": 2, "exp": "Two liquids that do not dissolve: an emulsion."}, {"t": "Solid dispersed in a liquid (paint)", "ans": 3, "exp": "Solid particles spread through a liquid make a sol."}, {"t": "Liquid dispersed in a solid (jelly)", "ans": 4, "exp": "Liquid held inside a solid makes a gel."}, {"t": "Gas dispersed in a solid (pumice stone)", "ans": 5, "exp": "A solid is the medium and the dispersed part is a gas, so the sheet calls it a solid sol."}, {"t": "Liquid dispersed in a gas (fog)", "ans": 0, "exp": "A gas is the medium again, so fog is also an aerosol."}, {"t": "Solid dispersed in a solid (colored glass)", "ans": 5, "exp": "A solid in a solid is the other solid sol."}]}]}, {"name": "Evidence spotting", "kind": "evid", "mode": "practice", "questions": [{"id": "E1", "type": "label", "topic": "Evidence of change", "stem": "Is each observation good evidence, by itself, that a chemical change happened?", "labels": ["Evidence of a chemical change", "Not evidence of a chemical change"], "items": [{"t": "Bubbles rise from a pot of water that is at 100 °C", "ans": 1, "exp": "Boiling produces water vapor bubbles. It is a change of state."}, {"t": "Bubbles rise when zinc is added to hydrochloric acid, and the test tube warms", "ans": 0, "exp": "A gas forms from a solid and a liquid and heat is given off; a new substance (hydrogen) formed."}, {"t": "Two clear liquids are mixed and a white solid settles out", "ans": 0, "exp": "A new solid formed from liquids (a precipitate), so a new substance formed."}, {"t": "Ice cubes get smaller in a glass of water", "ans": 1, "exp": "Melting is a change of state."}, {"t": "Steel wool turns orange-brown and feels slightly warm after a day in damp air", "ans": 0, "exp": "Rust is a new substance and heat was released."}, {"t": "Sugar disappears when stirred into hot water", "ans": 1, "exp": "Dissolving is physical; the sugar is still there."}]}, {"id": "E2", "type": "label", "topic": "Evidence of change", "stem": "Is each observation good evidence, by itself, that a chemical change happened?", "labels": ["Evidence of a chemical change", "Not evidence of a chemical change"], "items": [{"t": "A glass bottle shatters", "ans": 1, "exp": "Only the shape and size change."}, {"t": "Milk turns sour and thickens into lumps", "ans": 0, "exp": "New substances formed, and the change cannot be reversed."}, {"t": "A metal spoon becomes hot when left in hot soup", "ans": 1, "exp": "Heat moved into the spoon from outside; nothing new formed."}, {"t": "A strip of magnesium burns with a bright white light and leaves a white powder", "ans": 0, "exp": "Light, heat and a new solid with different properties."}, {"t": "The color of tea gets lighter when more water is added", "ans": 1, "exp": "Dilution changes how much dye is present, not what substances exist."}, {"t": "Liquid water becomes a white solid in the freezer", "ans": 1, "exp": "Freezing is a change of state."}]}, {"id": "E3", "type": "label", "topic": "Evidence of change", "stem": "Is each observation good evidence, by itself, that a chemical change happened?", "labels": ["Evidence of a chemical change", "Not evidence of a chemical change"], "items": [{"t": "Two powders are stirred into water, the cup gets cold and a gas is released", "ans": 0, "exp": "The gas that forms from the mixture shows a new substance was made, even though the temperature dropped."}, {"t": "A bowl of soup cools on the counter", "ans": 1, "exp": "Heat leaves the soup; no new substance forms."}, {"t": "A shiny penny slowly turns dull green outdoors", "ans": 0, "exp": "A new substance, a copper compound, forms on the surface."}, {"t": "Iron filings are pulled out of sand by a magnet", "ans": 1, "exp": "Separating a mixture is a physical change."}, {"t": "Hydrogen peroxide foams when poured on a cut", "ans": 0, "exp": "Oxygen gas is released as the peroxide breaks down into new substances."}, {"t": "Wet clothes dry on a line", "ans": 1, "exp": "Liquid water evaporates; still water."}]}, {"id": "E4", "type": "label", "topic": "Evidence of change", "stem": "Dissolved or reacted? Is each observation good evidence, by itself, of a chemical change?", "labels": ["Evidence of a chemical change", "Not evidence of a chemical change"], "items": [{"t": "Salt crystals vanish in water, and crystals reappear when the water evaporates", "ans": 1, "exp": "Recovering the salt unchanged shows it only dissolved."}, {"t": "An effervescent tablet dropped in water gives off a stream of gas bubbles and shrinks away", "ans": 0, "exp": "A gas is produced that was not in the tablet as a gas, so a new substance formed."}, {"t": "Powdered drink mix turns a glass of water orange with no gas and no heat", "ans": 1, "exp": "Dissolving and spreading dye is physical."}, {"t": "A copper-colored coating forms on an iron nail in blue copper sulfate solution", "ans": 0, "exp": "A new solid with different properties forms on the nail."}, {"t": "Chalk is crushed into a fine white powder", "ans": 1, "exp": "Only the particle size changes."}, {"t": "A copper wire turns black when heated in a flame", "ans": 0, "exp": "The surface reacts with oxygen to make a new black substance."}]}, {"id": "E5", "type": "label", "topic": "Evidence of change", "stem": "Which of these is strong evidence, and which could be a physical change?", "labels": ["Strong evidence of chemical change", "Could be physical (not enough alone)"], "items": [{"t": "The color of a drink gets darker when more powder is added", "ans": 1, "exp": "A darker color can just mean more dissolved dye."}, {"t": "Bubbles appear in a soda just after the bottle is opened", "ans": 1, "exp": "Dissolved carbon dioxide leaves the liquid; it was already there."}, {"t": "Heat is released when two solutions are mixed and a new solid forms", "ans": 0, "exp": "A new solid together with heat is strong evidence."}, {"t": "Water droplets form on the outside of a cold glass", "ans": 1, "exp": "Water vapor in the air condenses; this is a change of state."}, {"t": "A gas that relights a glowing splint is produced when a liquid is poured on a powder", "ans": 0, "exp": "Oxygen gas was made by a reaction; a new substance formed."}, {"t": "A solid disappears completely in water", "ans": 1, "exp": "Dissolving is a physical change."}]}]}, {"name": "MCQ Set A", "kind": "mcq", "mode": "practice", "questions": [{"id": "A1", "type": "mcq", "topic": "Properties", "stem": "A chemist cuts a 40.0 g bar of pure silver into four equal pieces. Which set of properties would be the same for all four pieces and for the original bar?", "options": ["Density, hardness and luster", "Mass, density and melting point", "Volume, luster and boiling point", "Density, mass and hardness"], "ans": 0, "exp": "Density, hardness and luster are intensive, so they do not depend on amount. Mass and volume are extensive.", "why": ["", "Mass is extensive: each piece has a quarter of the bar, so it differs from the original.", "Volume is extensive: each piece takes up less space than the whole bar.", "Mass changes when the bar is cut, even though density and hardness do not."]}, {"id": "A2", "type": "mcq", "topic": "States of matter", "stem": "A sealed, rigid flask holds 10.0 g of liquid water. It is heated until all of the water is steam. Which statement is correct?", "options": ["The total mass decreases because steam is lighter than liquid water.", "The mass is still 10.0 g and the H₂O molecules are intact.", "The water became a new substance with a lower boiling point.", "The flask now holds separate hydrogen gas and oxygen gas."], "ans": 1, "exp": "Boiling is a physical change. The molecules stay intact and the mass is conserved in a sealed flask.", "why": ["Mass does not depend on state, and nothing left the sealed flask.", "", "It is still water with the same boiling point.", "Boiling does not break the molecules. Splitting water needs an electric current."]}, {"id": "A3", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Two clear liquids are mixed. The mixture turns cloudy as a white solid settles to the bottom. Which conclusion is best supported?", "options": ["Any change in clarity proves that a chemical change took place.", "A heterogeneous mixture formed, so no chemical change took place.", "A new solid substance formed, which indicates a chemical change.", "The liquid froze into a solid, which is a physical change."], "ans": 2, "exp": "A new solid forming from two liquids is an indicator of a chemical change.", "why": ["This is too broad; dissolving or mixing can also change appearance.", "A solid that was not in either liquid appeared, so new substances formed.", "", "Neither liquid froze. A new solid formed from the mixing."]}, {"id": "A4", "type": "mcq", "topic": "Classifying matter", "stem": "A drawing shows three separate pairs of bonded identical R atoms and two separate single Sq atoms, none touching. Which code fits?", "options": ["R₂Sq", "R₆Sq₂", "R₃Sq₂", "R₂ & Sq"], "ans": 3, "exp": "Separate, non-touching particles of different substances are written with an &.", "why": ["No & would mean one molecule containing both kinds of atom.", "That would be a single bonded molecule of eight atoms.", "That would be one molecule with three R atoms and two Sq atoms bonded together.", ""]}, {"id": "A5", "type": "mcq", "topic": "Classifying matter", "stem": "Which of the following is a mixture of two compounds?", "options": ["NaCl & H₂O", "H₂ & O₂", "CO₂", "Cu & Zn"], "ans": 0, "exp": "NaCl and H₂O are both compounds sitting together, so the sample is a mixture of two compounds.", "why": ["", "Both H₂ and O₂ are elements, so this is a mixture of two elements.", "This is one pure compound with no &.", "Both are elements, so this is a mixture of two elements."]}, {"id": "A6", "type": "mcq", "topic": "Separating mixtures", "stem": "A student has dry sand and dry table salt mixed together. Which procedure recovers both substances?", "options": ["Filter the dry mixture through a piece of filter paper.", "Add water, filter out the sand, then evaporate the water.", "Heat the dry mixture until the salt boils away from the sand.", "Run chromatography on the dry mixture of sand and salt."], "ans": 1, "exp": "Salt dissolves and sand does not, so filtering removes the sand and evaporating the water recovers the salt.", "why": ["Both solids stay on the paper; filtration separates liquid from solid.", "", "The salt does not boil away at ordinary lab temperatures.", "Chromatography needs a mobile liquid and is not how to separate sand from salt."]}, {"id": "A7", "type": "mcq", "topic": "Separating mixtures", "stem": "Which pairing of technique and property used is correct?", "options": ["Filtration and difference in boiling point", "Distillation and adherence to a surface", "Chromatography and adherence to a surface", "Evaporation and difference in state of matter"], "ans": 2, "exp": "Chromatography separates substances by how strongly they adhere to a surface.", "why": ["Filtration uses state (solid versus liquid), not boiling point.", "Distillation uses boiling point; adherence to a surface is chromatography.", "", "Evaporation uses volatility; state of matter is the basis for filtration."]}, {"id": "A8", "type": "mcq", "topic": "Particles and conservation", "stem": "A student claims \"every molecule is a compound.\" Which sample best refutes this claim?", "options": ["Hydrogen peroxide, H₂O₂", "Water, H₂O", "Carbon dioxide, CO₂", "Oxygen gas, O₂"], "ans": 3, "exp": "O₂ is a molecule made of only one type of atom, so it is an element and not a compound.", "why": ["H₂O₂ is also a molecule and a compound, so it supports the claim.", "Water is a molecule and a compound, so it supports the claim.", "CO₂ is a molecule and a compound, so it supports the claim.", ""]}, {"id": "A9", "type": "mcq", "topic": "Classifying matter", "stem": "How many atoms are in one molecule of H₂SO₄, and how is it classified?", "options": ["Seven atoms; compound", "Three atoms; compound", "Seven atoms; mixture", "Three atoms; element"], "ans": 0, "exp": "2 + 1 + 4 = 7 atoms. Three different elements are bonded in one formula, so it is a compound.", "why": ["", "There are three types of atoms, but the subscripts add up to 2 + 1 + 4 = 7 atoms.", "There is no & in the formula, so it is a single pure compound.", "The molecule has seven atoms, and three different types of atom make it a compound."]}, {"id": "A10", "type": "mcq", "topic": "Evidence of change", "stem": "A student burns steel wool and the mass of the watch glass plus solid goes from 30.00 g to 30.29 g. Which explanation best supports that the gain is real?", "options": ["Burning drove off gas, which left more mass behind on the glass.", "Iron combined with oxygen from the air, adding mass.", "The balance gave a slightly different reading once the wool cooled.", "Heat energy was converted into extra mass that stayed in the solid."], "ans": 1, "exp": "Oxygen from the air joined the iron to form iron(III) oxide, so the solid product has more mass.", "why": ["If gas left, the mass would drop, not rise.", "", "A balance does not drift by this much, and the explanation ignores the chemistry.", "Heat is not matter, so it does not add mass."]}, {"id": "A11", "type": "mcq", "topic": "Evidence of change", "stem": "In the zinc and hydrochloric acid station, which pair of observations together best supports a chemical change?", "options": ["The penny feels cold and its color is unchanged.", "The acid stays clear and the penny keeps its shape.", "Bubbles form and the dried penny has less mass.", "The penny sinks and then floats on the acid."], "ans": 2, "exp": "Gas bubbles and a permanent loss of mass show that the zinc reacted and formed new substances.", "why": ["A temperature change alone is weak evidence, and no change in color adds nothing.", "Nothing here shows a new substance forming.", "", "Floating and sinking describe density and do not show new substances."]}, {"id": "A12", "type": "mcq", "topic": "Particles and conservation", "stem": "Six H₂O molecules are completely decomposed by an electric current. Which products form?", "options": ["Six H₂ and six O₂ molecules", "Twelve H₂ and six O₂ molecules", "Three H₂ and six O₂ molecules", "Six H₂ and three O₂ molecules"], "ans": 3, "exp": "Six H₂O contain 12 H atoms and 6 O atoms, which make 6 H₂ molecules and 3 O₂ molecules.", "why": ["This would need 12 oxygen atoms, but six water molecules have only six.", "Six water molecules contain 12 hydrogen atoms, which make only 6 H₂.", "This reverses the ratio: hydrogen forms twice as many molecules as oxygen.", ""]}, {"id": "A13", "type": "mcq", "topic": "Properties", "stem": "Which statement describes a chemical property of magnesium?", "options": ["Magnesium can burn in oxygen to form a new substance.", "Magnesium is a shiny, silver-gray solid at room temperature.", "Magnesium melts at about 650°C under normal pressure.", "Magnesium has a density of about 1.74 g/cm³ as a solid."], "ans": 0, "exp": "A chemical property is the ability to change into a new substance, such as burning in oxygen.", "why": ["", "Color and luster are physical properties.", "A melting point is a physical property.", "Density is a physical property."]}, {"id": "A14", "type": "mcq", "topic": "Classifying matter", "stem": "Which statement about homogeneous mixtures is correct?", "options": ["They are pure substances because their parts cannot be seen.", "They are uniform throughout but can still be separated physically.", "They cannot be separated because the particles are completely mixed.", "They must contain exactly two substances."], "ans": 1, "exp": "A solution has uniform composition but is still a mixture, so physical methods can separate it.", "why": ["Appearance does not decide purity; a solution can be separated into substances.", "", "Physical methods such as distillation can separate them.", "A homogeneous mixture can contain any number of substances."]}]}, {"name": "MCQ Set B", "kind": "mcq", "mode": "practice", "questions": [{"id": "B1", "type": "mcq", "topic": "Classifying matter", "stem": "Which list contains only pure substances?", "options": ["Brass, oxygen, salt", "Air, water, helium", "Gold, CO₂, hydrogen", "Gasoline, sugar, iron"], "ans": 2, "exp": "Gold and hydrogen are elements and carbon dioxide is a compound, so all three are pure substances.", "why": ["Brass is a mixture of copper and zinc.", "Air is a mixture of gases.", "", "Gasoline is a mixture of many compounds."]}, {"id": "B2", "type": "mcq", "topic": "Classifying matter", "stem": "The code for a molecule is TSq₂R. How many atoms does the molecule contain and how many different types?", "options": ["Three atoms of four types", "Four atoms of two types", "Three atoms of three types", "Four atoms of three types"], "ans": 3, "exp": "T + 2 Sq + R = 4 atoms, and the three symbols T, Sq and R are three different types of atom.", "why": ["The count of types cannot exceed the count of atoms, and the code lists three symbols.", "T, Sq and R are three different types.", "The subscript 2 means two Sq atoms, so there are four atoms in total.", ""]}, {"id": "B3", "type": "mcq", "topic": "Classifying matter", "stem": "A sample is written Sq₂ & R. Which statement is true?", "options": ["It is a mixture of two elements.", "It is a compound made of Sq and R.", "It is one molecule containing three atoms.", "It is an element because it has two symbols."], "ans": 0, "exp": "Sq₂ and R are both elements, and the & shows they are mixed together.", "why": ["", "The & means the substances are not bonded into one compound.", "The & shows separate particles, not one molecule.", "More than one symbol, with an &, signals a mixture."]}, {"id": "B4", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Which group contains only chemical changes?", "options": ["Melting ice, boiling water, crushing chalk", "Rusting a nail, fermenting juice, burning wax", "Dissolving sugar, rusting a nail, evaporating water", "Burning wood, freezing water, tarnishing silver"], "ans": 1, "exp": "Rusting, fermenting and burning each form new substances.", "why": ["All three are physical changes.", "", "Dissolving and evaporating are physical.", "Freezing water is a physical change."]}, {"id": "B5", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Wax is melted over a flame and then catches fire and burns. How should the sequence be described?", "options": ["Both steps are chemical because a flame is involved.", "Both steps are physical because wax stays wax.", "Melting is physical and burning is chemical.", "Neither step changes the wax in any way."], "ans": 2, "exp": "Melting only changes state; burning forms new substances. The sequence contains both kinds of change.", "why": ["A flame supplies heat; melting alone does not form a new substance.", "Burning forms new substances, so it cannot be physical.", "", "Both steps change the wax, one physically and one chemically."]}, {"id": "B6", "type": "mcq", "topic": "Separating mixtures", "stem": "A student boils salt water, collects and condenses the steam, and finds white solid left in the flask. Which statement is justified?", "options": ["The salt was made from the water while it boiled away.", "The water decomposed into hydrogen and oxygen gases.", "Distillation is chemical because heat was applied.", "No new substance formed, so it was physical."], "ans": 3, "exp": "Water and salt were separated without forming anything new, which is a physical separation.", "why": ["The salt was already dissolved; boiling just left it behind.", "The collected steam condensed back to water, so it did not decompose.", "Heat does not make a change chemical; no new substances formed.", ""]}, {"id": "B7", "type": "mcq", "topic": "Properties", "stem": "Which pair of properties are both extensive?", "options": ["Volume and mass", "Boiling point and length", "Mass and color", "Density and volume"], "ans": 0, "exp": "Both volume and mass depend on how much matter is present.", "why": ["", "Boiling point is intensive.", "Color is intensive.", "Density is intensive."]}, {"id": "B8", "type": "mcq", "topic": "States of matter", "stem": "A gas in a 1 L container is moved to an empty 2 L container. What happens to its volume?", "options": ["It stays at 1 L and the shape changes.", "It expands to fill the whole 2 L.", "It condenses to a liquid on the container floor.", "It stays exactly the same as before."], "ans": 1, "exp": "A gas has no fixed volume or shape, so it takes the volume of its container.", "why": ["That describes a liquid. A gas fills all of the new container.", "", "Nothing in the situation cools or compresses the gas.", "A gas has no fixed volume."]}, {"id": "B9", "type": "mcq", "topic": "Classifying matter", "stem": "How many of these are compounds: NaHCO₃, P₄, CO, Co, H₂O₂, N₂, KBr?", "options": ["Three", "Four", "Five", "Six"], "ans": 1, "exp": "NaHCO₃, CO, H₂O₂ and KBr are compounds. P₄, Co and N₂ are elements.", "why": ["Counting only three misses at least one compound; CO has two capital letters.", "", "Co (cobalt) is an element: one capital letter and one lowercase letter.", "P₄, Co and N₂ are all elements, so six is too many."]}, {"id": "B10", "type": "mcq", "topic": "Particles and conservation", "stem": "A drawing shows four separate H₂O molecules and two separate O₂ molecules, none touching. Which description is correct?", "options": ["Six particles; six atoms; a compound", "Sixteen particles; sixteen atoms; a mixture", "Six particles; sixteen atoms; a mixture", "Two particles; sixteen atoms; a mixture"], "ans": 2, "exp": "Four H₂O (3 atoms each) and two O₂ (2 atoms each) give 12 + 4 = 16 atoms in 6 particles. The code H₂O & O₂ is a mixture.", "why": ["Each molecule has more than one atom, so there are more than six atoms, and the & makes it a mixture.", "A particle is a whole molecule here, so there are six particles, not sixteen.", "", "There are two kinds of particle but six individual particles in the drawing."]}, {"id": "B11", "type": "mcq", "topic": "Classifying matter", "stem": "Which statement about elements is correct?", "options": ["Any formula that includes a subscript must represent a compound.", "Elements only exist as single separate atoms.", "Elements can be broken into compounds by chemical methods.", "A subscripted formula such as P₄ can still be an element."], "ans": 3, "exp": "P₄ is made of only one type of atom, so it is an element even though it has a subscript.", "why": ["P₄ and O₃ have subscripts and are elements.", "Many elements exist as molecules such as O₂ and P₄.", "Elements cannot be broken into other substances by chemical methods.", ""]}, {"id": "B12", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Salt is dissolved in water and then the water evaporates, leaving salt crystals. Which statement describes both processes?", "options": ["Both are physical because no new substance forms.", "Both are chemical because the salt seems to disappear.", "Dissolving is chemical and evaporating is physical.", "Dissolving is physical and evaporating is chemical."], "ans": 0, "exp": "The salt and the water keep their identities in both processes.", "why": ["", "Disappearing into solution is not evidence of a chemical change.", "Dissolving does not form a new substance either.", "Evaporation of water is only a change of state."]}, {"id": "B13", "type": "mcq", "topic": "Classifying matter", "stem": "A student claims a homogeneous mixture and a pure substance are the same because neither shows visible parts. Which evidence best shows they differ?", "options": ["Only the pure substance can be found as a liquid at room temperature.", "Distillation can split the mixture into pure substances.", "Filtration can split a pure substance into its elements.", "The mixture always shows a visible boundary between its parts."], "ans": 1, "exp": "A homogeneous mixture can be separated by physical methods into pure substances; a pure substance cannot.", "why": ["Both a solution and a pure substance can be liquids.", "", "Filtration is a physical method and cannot split any pure substance.", "A homogeneous mixture has no visible boundary."]}, {"id": "B14", "type": "mcq", "topic": "Evidence of change", "stem": "In the vinegar and TUMS station, which statement about the solid left on the filter paper is best supported?", "options": ["It is the gas that formed, collected as a solid on the paper.", "It is pure vinegar that was trapped by the filter paper.", "It is tablet material that did not react with the vinegar.", "It is a new compound created only by the act of filtering."], "ans": 2, "exp": "Filtration only separates undissolved solid from liquid, so the solid is leftover tablet material that did not react.", "why": ["A gas escapes into the air and does not collect on filter paper.", "Vinegar is a liquid and passes through the filter paper.", "", "Filtering is a physical separation and does not create new substances."]}]}, {"name": "MCQ Set C: review sheet", "kind": "mcq", "mode": "practice", "questions": [{"id": "C9", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Wax is melted over a flame and then catches fire and burns. How does the textbook classify this?", "options": ["A physical change only, because wax stays wax", "A chemical change only, because a flame was involved", "Neither, because the wax simply disappears", "Both: melting is physical, burning is chemical"], "ans": 3, "exp": "Melting wax is a physical change, and burning it forms new substances, so the process is a combination of the two.", "why": ["Only the melting step is physical; the burning makes new substances.", "The melting step is still a physical change of state.", "The wax does not just disappear; it turns into new gases when it burns.", ""]}, {"id": "C10", "type": "mcq", "topic": "Classifying matter", "stem": "How many of these are compounds: H₂O, N₂O₄, NaOH, MnO₂ and HF?", "options": ["Five", "Three", "Four", "Two"], "ans": 0, "exp": "Each formula contains atoms of two or more different elements in a fixed combination, so all five are compounds.", "why": ["", "Every formula here has at least two different capital letters.", "H₂O is also a compound, and so are the other four.", "N₂O₄, NaOH, MnO₂ and HF also contain two or more different elements."]}, {"id": "C11", "type": "mcq", "topic": "Classifying matter", "stem": "Which one of these is a homogeneous mixture?", "options": ["Pure distilled water", "Gasoline from a pump", "A big jar of jelly beans", "Soil from a garden bed"], "ans": 1, "exp": "Gasoline is a uniform mixture of several substances with the same composition throughout.", "why": ["Pure water is a compound, which is a pure substance and not a mixture.", "", "The beans are visibly separate pieces, so it is heterogeneous.", "Soil has visibly different parts and regions, so it is heterogeneous."]}, {"id": "C1", "type": "mcq", "topic": "Colloids", "stem": "Pumice stone is made of gas pockets trapped inside solid rock. Which colloid name does the review sheet use for it?", "options": ["Gel", "Foam", "Solid sol", "Aerosol"], "ans": 2, "exp": "The medium is a solid and the dispersed part is a gas, so the sheet calls it a solid sol (colored glass is also a solid sol).", "why": ["A gel is a liquid dispersed in a solid, not a gas.", "A foam is a gas in a liquid; pumice has the gas inside a solid.", "", "An aerosol is dispersed in a gas, and pumice is a solid medium."]}, {"id": "C2", "type": "mcq", "topic": "Colloids", "stem": "Fog and smoke are both aerosols. What is the difference between them?", "options": ["Fog is a gas in a liquid, and smoke is a liquid in a gas", "Fog is solid in a gas, and smoke is liquid in a gas", "Fog is liquid in a liquid, and smoke is solid in a liquid", "Fog is liquid in a gas, and smoke is solid in a gas"], "ans": 3, "exp": "Both are spread through a gas (air). Fog is tiny liquid droplets and smoke is tiny solid particles.", "why": ["Fog is not a gas in a liquid; its water droplets are spread in air.", "The two are reversed: fog is water droplets and smoke is solid particles.", "Both have air (a gas) as the medium.", ""]}, {"id": "C3", "type": "mcq", "topic": "States of matter", "stem": "Why can no substance be cooled below 0 K?", "options": ["Its particles already have the least possible motion", "Kelvin is a scale for gases and fails for solids", "All particles disappear into energy at that point", "Every substance freezes solid there and cannot cool further"], "ans": 0, "exp": "Absolute zero (-273.15 °C) is where particle motion is at its minimum, so there is nothing colder.", "why": ["", "Kelvin works for any state of matter.", "Particles do not disappear; they still exist at 0 K.", "Substances can be solid well above 0 K, and freezing does not stop cooling."]}, {"id": "C4", "type": "mcq", "topic": "States of matter", "stem": "A glass holds ice and liquid water at exactly 0 °C. Which statement is correct?", "options": ["Only ice is present because 0 °C is below freezing", "Ice and water coexist, and some vapor is in the air", "Only liquid is present because ice melts at 0 °C", "Ice and water coexist, but no vapor forms below 100 °C"], "ans": 1, "exp": "At the melting point the solid and liquid are in equilibrium, and molecules also escape as water vapor, so all three states are present.", "why": ["0 °C is the freezing point, not below it, and liquid water is also in the glass.", "", "The glass still contains ice.", "Evaporation and sublimation happen below the boiling point too."]}, {"id": "C5", "type": "mcq", "topic": "Properties", "stem": "A liquid has a thick texture, a grape smell, a density of 3.4 g/mL and a pH of 4.5. Which one is a chemical property on the review sheet?", "options": ["Its thick texture", "Its grape smell", "Its pH of 4.5", "Its density of 3.4 g/mL"], "ans": 2, "exp": "The review sheet lists pH with the chemical properties, along with reacting or not reacting with substances.", "why": ["Texture is a physical property.", "Odor is observed without changing the liquid.", "", "Density is a measured physical (intensive) property."]}, {"id": "C6", "type": "mcq", "topic": "Classifying matter", "stem": "Which of these will settle into layers or sediment if left standing?", "options": ["Salt dissolved in water", "Clean air in a room", "An 18K gold ring", "Juice with pulp"], "ans": 3, "exp": "A suspension is a heterogeneous mixture that settles; juice with pulp, mud and oil and water are examples.", "why": ["A solution stays evenly mixed.", "Air is a uniform mixture of gases.", "An alloy is uniform throughout.", ""]}, {"id": "C7", "type": "mcq", "topic": "Particles and conservation", "stem": "Zinc is placed in copper sulfate solution, and copper metal forms while zinc ends up in solution. Which type of reaction is this?", "options": ["Single displacement", "Decomposition", "Synthesis", "Double displacement"], "ans": 0, "exp": "One element (zinc) pushes another element (copper) out of a compound, which is single displacement.", "why": ["", "Decomposition starts with a single compound.", "Synthesis joins substances into one product, and here there are two products.", "Double displacement swaps the positive parts of two compounds, and an element is not involved."]}, {"id": "C8", "type": "mcq", "topic": "Separating mixtures", "stem": "In paper chromatography of black ink, which part is the mobile phase?", "options": ["The strip of filter paper", "The water moving up", "The spot of black ink", "The beaker holding it"], "ans": 1, "exp": "The water carries the ink pigments up the paper, and each pigment travels a different distance.", "why": ["The paper is the fixed phase and does not move.", "", "The ink is the sample being separated.", "The beaker only holds the solvent."]}]}, {"name": "MCQ Set D: colloids", "kind": "mcq", "mode": "practice", "questions": [{"id": "K1", "type": "mcq", "topic": "Colloids", "stem": "Whipped cream is gas bubbles spread through a liquid. What is this type of colloid called?", "options": ["Aerosol", "Emulsion", "Foam", "Gel"], "ans": 2, "exp": "A gas dispersed in a liquid is a foam. Soap lather and froth are also foams.", "why": ["An aerosol is dispersed in a gas.", "An emulsion is a liquid in a liquid.", "", "A gel is a liquid held in a solid."]}, {"id": "K2", "type": "mcq", "topic": "Colloids", "stem": "Mayonnaise is tiny oil droplets spread through a water-based liquid. What is this type of colloid called?", "options": ["Sol", "Foam", "Gel", "Emulsion"], "ans": 3, "exp": "A liquid dispersed in a liquid is an emulsion. Milk and hair cream are other examples.", "why": ["A sol is a solid in a liquid.", "A foam is a gas in a liquid.", "A gel is a liquid in a solid.", ""]}, {"id": "K3", "type": "mcq", "topic": "Colloids", "stem": "Smoke and fog are both called aerosols. What do they have in common?", "options": ["Both have a gas as the medium for the particles", "Both are made of a gas dispersed in a gas", "Both are made of a liquid dispersed in a liquid", "Both are made of a solid dispersed in a solid"], "ans": 0, "exp": "The name aerosol depends on the medium: when a gas holds the particles, it is an aerosol. Smoke has solid particles and fog has liquid droplets.", "why": ["", "Both of these have particles of solid or liquid, not gas.", "Neither has a liquid as the medium.", "Air is the medium for both, and it is a gas."]}, {"id": "K4", "type": "mcq", "topic": "Colloids", "stem": "A flashlight beam is visible in a glass of cloudy liquid but not in a glass of clear salt water. What does this show?", "options": ["The salt water is a colloid and the cloudy liquid is a solution", "The cloudy liquid is a colloid, and the salt water is a solution", "Both liquids are true solutions", "The cloudy liquid is a pure substance, and the salt water is not"], "ans": 1, "exp": "Colloid particles are large enough to scatter light (the Tyndall effect). Solution particles are too small to scatter it.", "why": ["It is the other way around: the beam is scattered by the colloid.", "", "A true solution would not show the beam.", "Neither result tells you about pure substances."]}, {"id": "K5", "type": "mcq", "topic": "Colloids", "stem": "Which statement correctly compares a colloid with a suspension?", "options": ["A colloid settles on standing, and a suspension does not", "A colloid is a pure substance, and a suspension is a mixture", "A colloid stays mixed, while a suspension settles", "Both settle quickly, but only a colloid can be filtered"], "ans": 2, "exp": "Colloids are stable, with particles about 1 to 1000 nm. A suspension is a heterogeneous mixture that settles upon standing.", "why": ["It is the other way around.", "Both are mixtures.", "", "A colloid does not settle on standing."]}, {"id": "K6", "type": "mcq", "topic": "Colloids", "stem": "Cream can be separated from milk. Which method works, according to the notes?", "options": ["Simple filtration with filter paper", "Letting the milk sit for five minutes", "Dissolving the milk in more water", "A high-speed centrifuge"], "ans": 3, "exp": "A colloid cannot be separated by simple filtration, but a high-speed centrifuge can separate it.", "why": ["Colloid particles are small enough to pass through simple filters.", "A colloid does not settle on standing.", "Adding water does not separate the parts.", ""]}, {"id": "K7", "type": "mcq", "topic": "Colloids", "stem": "In a colloid, what is the dispersed phase?", "options": ["The part present in the smaller quantity", "The component present in the larger amount", "The light that is scattered by the particles", "The container that holds the colloid"], "ans": 0, "exp": "The dispersed phase is like a solute (smaller amount). The dispersion medium is like a solvent (larger amount) and holds the particles.", "why": ["", "That is the dispersion medium.", "Light is not a part of the colloid.", "The container is not part of the mixture."]}, {"id": "K8", "type": "mcq", "topic": "Colloids", "stem": "Jelly and cheese are each a liquid dispersed in a solid. What is this type of colloid called?", "options": ["Sol", "Gel", "Emulsion", "Solid sol"], "ans": 1, "exp": "A liquid dispersed in a solid is a gel.", "why": ["A sol is a solid in a liquid.", "", "An emulsion is a liquid in a liquid.", "A solid sol is a solid or a gas in a solid."]}, {"id": "K9", "type": "mcq", "topic": "Colloids", "stem": "About how large are colloid particles?", "options": ["Less than 1 nm across, so they pass through any filter", "About 1 mm to 1 cm across, so they settle quickly", "About 1 nm to 1000 nm across", "Exactly 1000 nm across for every colloid"], "ans": 2, "exp": "Colloid particles are about 1 nm to 1000 nm, big enough to scatter light but small enough to stay mixed.", "why": ["That size describes the particles in a true solution.", "That size is much larger than a colloid and is more like a suspension.", "", "Colloid particles are a range of sizes."]}, {"id": "K10", "type": "mcq", "topic": "Colloids", "stem": "Under a microscope, colloid particles move in a continuous, random zigzag path. What is this called?", "options": ["The Tyndall effect", "Sublimation", "Chromatography", "Brownian movement"], "ans": 3, "exp": "Brownian movement is the random zigzag motion of colloid particles.", "why": ["The Tyndall effect is the scattering of light.", "Sublimation is a solid changing straight to a gas.", "Chromatography is a way of separating mixtures.", ""]}, {"id": "K11", "type": "mcq", "topic": "Colloids", "stem": "Which of these is NOT a colloid?", "options": ["Salt dissolved in water", "Butter spread on warm toast", "Smoke from a small campfire", "Fog drifting over a farm field"], "ans": 0, "exp": "Salt water is a solution. Its particles are too small to scatter light, and fog, butter and smoke are colloids.", "why": ["", "Butter is an emulsion.", "Smoke is an aerosol.", "Fog is an aerosol."]}]}, {"name": "Day 1: all four FRQ types", "kind": "mock1", "mode": "exam", "questions": [{"id": "V1", "type": "frq", "title": "Test-style FRQ 1: States of matter", "stem": "Use what you know about the states of matter and temperature to answer the questions about a glass of ice water.", "data": [], "parts": [{"k": "a", "prompt": "A glass of ice water sits in the sun. Explain why ice, liquid water and a little water vapor can all be present at 0 °C.", "model": "At 0 °C ice and liquid water are at the melting and freezing point, so they coexist. Some molecules also leave both the ice and the liquid as water vapor (sublimation and evaporation). Solid, liquid and gas are all present."}, {"k": "b", "prompt": "Describe the spacing, motion and organization of the particles in a solid, a liquid and a gas of the same substance.", "model": "Solid: close together in fixed positions, vibrating, most organized. Liquid: close together but able to slide past each other, less organized. Gas: far apart, moving fast and randomly, least organized."}, {"k": "c", "prompt": "What happens to particle motion as a substance is cooled toward 0 K, and why can it not be cooled below 0 K?", "model": "The particles move more and more slowly. At 0 K (-273.15 °C) they have the minimum possible motion, so there is no lower temperature. That is why 0 K is absolute zero."}, {"k": "d", "prompt": "Name the change of state for each and say whether energy is added or removed: ice to water, steam to water, water to ice, dry ice to gas, frost forming on a window.", "model": "Ice to water: melting, energy added. Steam to water: condensation, energy removed. Water to ice: freezing, energy removed. Dry ice to gas: sublimation, energy added. Frost forming: deposition, energy removed."}], "topic": "States of matter"}, {"id": "V2", "type": "frq", "title": "Test-style FRQ 2: Colloids", "stem": "A food truck sells several colloids. Whipped cream and mayonnaise are made, hair spray is sprayed from a can, marshmallows are served and gelatin dessert is chilled. A sign beside the truck says \"FOG WARNING\" because a smoke machine is running.", "data": [], "parts": [{"k": "a", "prompt": "Give the structure (what is dispersed in what) and the colloid name for whipped cream, mayonnaise, hair spray mist, marshmallow and gelatin dessert.", "model": "Whipped cream: gas in a liquid, foam. Mayonnaise: liquid in a liquid, emulsion. Hair spray mist: liquid in a gas, aerosol. Marshmallow: gas in a solid, solid sol. Gelatin dessert: liquid in a solid, gel."}, {"k": "b", "prompt": "Smoke from the machine and fog from the same machine are both colloids with the same name. Give the name and the structure of each.", "model": "Both are aerosols. Smoke is a solid dispersed in a gas; fog is a liquid dispersed in a gas."}, {"k": "c", "prompt": "Describe an experiment that shows the mayonnaise is a colloid and not a solution.", "model": "Shine a light beam through a dilute sample. If it is a colloid the particles scatter the light and the beam is visible (Tyndall effect); a solution does not scatter the beam."}, {"k": "d", "prompt": "Compare a colloid, a solution and a suspension on particle size and settling.", "model": "A solution has the smallest particles and does not settle or scatter light. A colloid has particles about 1 to 1000 nm, is stable, does not settle on standing and scatters light. A suspension has large particles that settle upon standing."}], "topic": "Colloids"}, {"id": "V3", "type": "frq", "title": "Test-style FRQ 3: Defining the liquids", "stem": "In another lab, Liquid X is pale yellow, thin and smells like lemon. It has a density of 0.85 g/mL and a pH of 3.1, and its data sheet says it reacts with metals and with bases. Liquid Y is colorless and has no odor. It has a density of 1.00 g/mL and a pH of 7.0, and its data sheet says it does not react with metals. When X and Y are mixed in a flask, the mixture fizzes, the temperature rises from 21 °C to 27 °C, and a white solid settles out.", "data": [], "parts": [{"k": "a", "prompt": "List the physical properties you can see in the description.", "model": "Liquid X: pale yellow, thin, lemon smell, density 0.85 g/mL. Liquid Y: colorless, no odor, density 1.00 g/mL."}, {"k": "b", "prompt": "List the chemical properties you can see in the description.", "model": "Liquid X: pH 3.1 (acidic), reacts with metals, reacts with bases. Liquid Y: pH 7.0 (neutral) and does not react with metals."}, {"k": "c", "prompt": "Decide whether mixing X and Y is a physical or chemical change and give three pieces of evidence.", "model": "Chemical change. Evidence: fizzing (a gas was given off), a temperature change from 21 °C to 27 °C (+6 °C), and a white solid (precipitate) formed."}, {"k": "d", "prompt": "Is density an intensive or extensive property? Explain with Liquid X.", "model": "Intensive. Density does not depend on the amount: 10 mL or 1 L of Liquid X still has a density of 0.85 g/mL. Mass and volume are extensive."}], "topic": "Properties"}, {"id": "V4", "type": "frq", "title": "Test-style FRQ 4: Putting it in order", "stem": "A student is organizing thoughts from the chapter. Answer each comparison.", "data": [], "parts": [{"k": "a", "prompt": "What is the difference between a solute, a solvent and a solution? Use sugar water as the example.", "model": "In sugar water the solvent (water) does the dissolving, the solute (sugar) is dissolved, and the solution is the mixture of the two."}, {"k": "b", "prompt": "Compare and contrast intensive and extensive physical properties with an example of each.", "model": "Both are physical properties observed without changing the substance. An intensive property is always true for the substance whatever the amount (density, color, boiling point); an extensive property depends on the amount of matter (mass, volume, length)."}, {"k": "c", "prompt": "Compare and contrast a solution and a suspension.", "model": "Both are mixtures. A solution is homogeneous and does not settle (salt water); a suspension is heterogeneous and settles upon standing (mud, juice with pulp, oil and water)."}, {"k": "d", "prompt": "Compare and contrast evaporation and distillation.", "model": "Both boil off a liquid and are physical. Evaporation lets the liquid escape as a gas to leave a solid behind; distillation traps and condenses the vapor to collect the liquid."}, {"k": "e", "prompt": "Compare and contrast synthesis and decomposition reactions.", "model": "Both are chemical changes that make new substances. In synthesis two or more substances combine to form something new; in decomposition one substance breaks down into two or more."}], "topic": "Classifying matter"}]}, {"name": "Day 2: T/F, Labeling, MCQ", "kind": "mock2", "mode": "exam", "questions": [{"id": "MT1", "type": "tf", "topic": "Separating mixtures", "stem": "A heterogeneous mixture can be separated by physical methods.", "ans": true, "exp": "Every mixture can be separated into its pure substances by physical means."}, {"id": "MT2", "type": "tf", "topic": "Properties", "stem": "Flammability is a chemical property.", "ans": true, "exp": "Flammability describes the ability to burn, which forms new substances."}, {"id": "MT4", "type": "tf", "topic": "Classifying matter", "stem": "A compound has the same composition no matter where the sample came from.", "ans": true, "exp": "A compound always has the same combination of atoms."}, {"id": "MT5", "type": "tf", "topic": "Properties", "stem": "Boiling point is an extensive property.", "ans": false, "exp": "Boiling point does not depend on the amount, so it is intensive."}, {"id": "MT6", "type": "tf", "topic": "Physical vs chemical change", "stem": "In a chemical change, atoms are rearranged to form new substances.", "ans": true, "exp": "Bonds are broken and re-formed, so the products differ from the starting substances."}, {"id": "MT7", "type": "tf", "topic": "Particles and conservation", "stem": "A drawing of one lone atom is enough to prove the sample is an element.", "ans": false, "exp": "A single atom could be a tiny piece of a mixture. You need to see the other particles in the sample."}, {"id": "MT9", "type": "tf", "topic": "Colloids", "stem": "A beam of light is visible in a colloid but not in a true solution.", "ans": true, "exp": "Colloid particles scatter light (the Tyndall effect). Solution particles are too small to do that."}, {"id": "MT10", "type": "tf", "topic": "Colloids", "stem": "Whipped cream is an emulsion because it contains a liquid.", "ans": false, "exp": "Whipped cream is gas bubbles in a liquid, which is a foam. An emulsion is a liquid in a liquid."}, {"id": "ML1", "type": "label", "topic": "Classifying matter", "stem": "Label each material as an element, a compound or a mixture.", "labels": ["Element", "Compound", "Mixture"], "items": [{"t": "Ne", "ans": 0, "exp": "One capital letter, one type of atom."}, {"t": "KBr", "ans": 1, "exp": "Potassium and bromine bonded in one formula."}, {"t": "N₂ & O₂", "ans": 2, "exp": "The & separates two different substances (two elements)."}, {"t": "H₂O₂", "ans": 1, "exp": "Hydrogen and oxygen in a different ratio than water: still one compound."}, {"t": "S₈", "ans": 0, "exp": "Eight sulfur atoms bonded, only one type of atom."}, {"t": "CO₂ & H₂O", "ans": 2, "exp": "Two compounds sitting together."}]}, {"id": "ML2", "type": "label", "topic": "Physical vs chemical change", "stem": "Label each change as a physical change or a chemical change.", "labels": ["Physical change", "Chemical change"], "items": [{"t": "Ice melting in a glass", "ans": 0, "exp": "Only the state changes."}, {"t": "Baking soda fizzing in vinegar", "ans": 1, "exp": "A gas forms as a new substance."}, {"t": "Cutting a piece of paper in half", "ans": 0, "exp": "Size changes but not composition."}, {"t": "Gasoline burning in an engine", "ans": 1, "exp": "Burning forms new substances and releases energy."}, {"t": "Salt dissolving in water", "ans": 0, "exp": "The salt keeps its identity and can be recovered."}, {"t": "A cut apple slice turning brown", "ans": 1, "exp": "The apple reacts with oxygen in the air and forms new substances."}]}, {"id": "M1", "type": "mcq", "topic": "States of matter", "stem": "A liquid and a gas are each in a sealed 500 mL container. Which observation distinguishes the liquid?", "options": ["It takes the shape of the container and fills all 500 mL.", "It has a definite volume that can be less than 500 mL.", "Its particles are far apart and move randomly.", "Its particles are locked into rigid positions."], "ans": 1, "exp": "A liquid has a definite volume and takes the shape of its container without filling it.", "why": ["That describes a gas; a liquid fills only the volume it has.", "", "This describes a gas.", "This describes a solid."]}, {"id": "M2", "type": "mcq", "topic": "Physical vs chemical change", "stem": "Which of the following is a chemical change?", "options": ["Alcohol evaporating from your skin", "A glass bottle shattering on the floor", "A silver spoon tarnishing in air", "Butter softening on a warm counter"], "ans": 2, "exp": "Tarnish is a new substance formed when silver reacts with substances in the air.", "why": ["Evaporation is a change of state, a physical change.", "Breaking glass only changes shape and size.", "", "Softening is a physical change."]}, {"id": "M3", "type": "mcq", "topic": "Classifying matter", "stem": "Which list contains one element, one compound and one mixture, in that order?", "options": ["H₂O, Br₂, Cu & Zn", "N₂, N₂ & O₂, NO₂", "CO, Co, C₆H₁₂O₆ & H₂O", "Au, CO₂, NaCl & H₂O"], "ans": 3, "exp": "Au is an element, CO₂ is a compound and NaCl & H₂O is a mixture.", "why": ["The order is compound, element, mixture.", "The order is element, mixture, compound.", "The order is compound, element, mixture.", ""]}, {"id": "M4", "type": "mcq", "topic": "Separating mixtures", "stem": "Which separation depends on a difference in boiling point?", "options": ["Collecting pure water from salt water in a condenser", "Separating ink pigments on a strip of absorbent paper", "Leaving a puddle of salt water to sit in the sun", "Removing sand from water with a piece of filter paper"], "ans": 0, "exp": "Distillation boils the component with the lower boiling point and condenses it.", "why": ["", "This depends on adherence to a surface.", "This is evaporation, which relies on volatility.", "This depends on state or particle size."]}, {"id": "M5", "type": "mcq", "topic": "Classifying matter", "stem": "Which of the following is NOT matter?", "options": ["Helium gas inside a party balloon", "A beam of light from a flashlight", "Steam rising from a boiling kettle", "Dust floating in the flashlight beam"], "ans": 1, "exp": "Light has no mass and does not take up space like matter does.", "why": ["Helium has mass and volume.", "", "Steam is water in the gas state.", "Dust has mass and takes up space."]}, {"id": "M7", "type": "mcq", "topic": "Evidence of change", "stem": "A white solid disappears when stirred into water. Which finding best shows it dissolved instead of reacting?", "options": ["Gas bubbles leave the liquid as it is being stirred.", "The liquid turns a color that neither substance had before.", "Evaporating the water leaves the original solid behind.", "The beaker becomes warm and a new solid forms in it."], "ans": 2, "exp": "Recovering the original solid shows it did not become a new substance, so the change was physical.", "why": ["Bubbles point toward a chemical change.", "A new color points toward a chemical change.", "", "Heat and a new solid point toward a chemical change."]}, {"id": "M8", "type": "mcq", "topic": "Particles and conservation", "stem": "Which drawing best represents a sample of an element?", "options": ["One single atom shown all by itself in the drawing", "Separate atoms of two different kinds mixed together", "Two different atoms bonded together into pairs", "Many identical atoms, none of a different kind"], "ans": 3, "exp": "Many identical particles with one type of atom show a pure substance made of one element.", "why": ["A lone atom could come from a mixture; more of the sample is needed.", "Two kinds of atom would be a mixture.", "Bonded different atoms would be a compound.", ""]}, {"id": "M9", "type": "mcq", "topic": "Particles and conservation", "stem": "Which result of electrolysis best shows that water is a compound?", "options": ["Two different gases form from one pure substance.", "The volume of liquid water slowly increases over time.", "The water gets hot as the current passes through it.", "Bubbles appear near each electrode as current flows."], "ans": 0, "exp": "A compound can be broken into simpler substances, here hydrogen and oxygen.", "why": ["", "The liquid does not increase; gas forms as the water is used up.", "Heat does not show composition.", "Bubbles alone do not show that the substance is a compound."]}, {"id": "M11", "type": "mcq", "topic": "Classifying matter", "stem": "Which formula represents a mixture of an element and a compound?", "options": ["H₂ & O₂", "O₂ & H₂O", "CO₂", "NaCl & KBr"], "ans": 1, "exp": "O₂ is an element and H₂O is a compound, joined by an &.", "why": ["Both are elements.", "", "There is no & here, so this is one compound.", "Both are compounds."]}, {"id": "M12", "type": "mcq", "topic": "Evidence of change", "stem": "A student watches a tea light burn for 20 minutes. Which observation best shows a chemical change?", "options": ["The wax near the wick turned to liquid and then pooled around it.", "The wax became a little softer as the candle burned down.", "A flame formed and wax was used up, giving off heat and light.", "The candle was warm to the touch after twenty minutes."], "ans": 2, "exp": "Burning wax reacts with oxygen to form new substances and releases heat and light.", "why": ["Melting is physical.", "Softening is a physical change.", "", "Warmth alone is weak evidence of a new substance."]}, {"id": "M13", "type": "mcq", "topic": "Particles and conservation", "stem": "Steel wool is heated until it glows inside a sealed flask that contains air. What happens to the total mass of the sealed flask?", "options": ["It increases because oxygen combined with the iron.", "It decreases because the iron burned away.", "It increases because heat added mass.", "It stays the same because nothing entered or left."], "ans": 3, "exp": "In a sealed flask the oxygen that joins the iron is already inside, so the total mass is unchanged.", "why": ["The oxygen came from inside the flask, so the total mass stays the same.", "Nothing left the sealed flask.", "Heat is not matter.", ""]}, {"id": "M14", "type": "mcq", "topic": "Colloids", "stem": "Which pair of structures is correctly matched with a colloid name that is used for both?", "options": ["Solid in a gas and liquid in a gas: aerosol", "Solid in a liquid and liquid in a solid: sol", "Gas in a liquid and liquid in a liquid: foam", "Solid in a gas and gas in a solid: aerosol"], "ans": 0, "exp": "Aerosol is used for both solid in a gas (smoke) and liquid in a gas (fog).", "why": ["", "A sol is only a solid in a liquid. A liquid in a solid is a gel.", "These are two different colloids: foam and emulsion.", "Gas in a solid is a solid sol, not an aerosol."]}, {"id": "M15", "type": "mcq", "topic": "Colloids", "stem": "A mixture does not settle on standing, cannot be removed by a simple filter, and makes a flashlight beam visible. What is it?", "options": ["A solution", "A colloid", "A suspension", "A pure compound"], "ans": 1, "exp": "Staying mixed, passing through filters and scattering light are all properties of a colloid.", "why": ["A solution would not scatter the beam.", "", "A suspension settles on standing.", "A compound is not a mixture."]}]}]}};

function pickDir(){const d=SAVE.settings.dir;return d==='both'?(Math.random()<0.5?'t2d':'d2t'):d;}
function distractors(card,n,field){
  const target=card[field];
  const tiers=[ALL.filter(c=>c!==card&&c.sec===card.sec),ALL.filter(c=>c!==card&&c.deck===card.deck&&c.sec!==card.sec),ALL.filter(c=>c.deck!==card.deck)];
  const out=[];
  for(let ti=0;ti<tiers.length;ti++){
    const cand=shuf(tiers[ti]);
    const close=cand.filter(c=>{const r=c[field].length/target.length;return r>=0.7&&r<=1.3;});
    const rest=cand.filter(c=>close.indexOf(c)<0);
    const ord=close.concat(rest);
    for(let k=0;k<ord.length;k++){const c=ord[k];if(out.length>=n)break;if(c[field]!==target&&!out.some(o=>o[field]===c[field]))out.push(c);}
    if(out.length>=n)break;
  }
  return out;
}
function mcQ(card,dir,nopt){
  dir=dir||pickDir();nopt=nopt||4;
  const field=dir==='t2d'?'def':'term';
  const ds=distractors(card,nopt-1,field);
  const opts=shuf([{t:card[field],ok:true}].concat(ds.map(c=>({t:c[field],ok:false,why:(dir==='t2d'?'That description belongs to "'+c.term+'", not to "'+card.term+'".':'"'+c.term+'" means: '+c.def+' That is a different idea from the description in the question, which fits "'+card.term+'".')}))));
  return {kind:'mc',card:card,dir:dir,ask:dir==='t2d'?'Which description best matches this term?':'Which term matches this description?',
    prompt:dir==='t2d'?'<b>'+esc(card.term)+'</b>':esc(card.def),options:opts,
    explain:'<b>'+esc(card.term)+'</b>: '+esc(card.def)+(card.hook?'<br><i>Hook: '+esc(card.hook)+'</i>':'')};
}
function tfQ(card){
  let isTrue=Math.random()<0.5,other=null;
  if(!isTrue){const pool=ALL.filter(c=>c!==card&&c.sec===card.sec);const pool2=pool.length?pool:ALL.filter(c=>c!==card&&c.deck===card.deck);if(pool2.length)other=shuf(pool2)[0];else isTrue=true;}
  const shown=isTrue?card.def:other.def;
  return {kind:'tf',card:card,ask:'True or false: this definition matches the term.',prompt:'<b>'+esc(card.term)+'</b><br>'+esc(shown),
    options:[{t:'True',ok:isTrue},{t:'False',ok:!isTrue}],
    explain:(isTrue?'True. ':'False. That definition belongs to <b>'+esc(other.term)+'</b>. ')+'<b>'+esc(card.term)+'</b>: '+esc(card.def)};
}

 label:['Click one label for every item, then press Check Answer. You earn partial credit: each correct item counts toward the point for the question.','Element, compound or mixture: look for the & first, then count capital letters.','Physical or chemical: ask whether a new substance forms. Changes of state, dissolving and crushing are physical.'],

 evid:['Ask what new substance could have formed. If you cannot name one, the observation is probably physical.','Boiling, dissolving, melting, condensing and crushing are never evidence of a chemical change on their own.','Gas made by a reaction, a new solid from liquids, a color change, a temperature change, and light given off are the usual evidence. Odor is a physical property, so a smell by itself is not evidence.'],
 mock1:['The real Day 1 gives you 2 of 4 FRQ types at random: states of matter (Bunsen and Beaker), colloids (Blobby), defining properties (Ada Twist) and comparisons (Elmo). This section has one of each, so do all four.','The real Day 1 gives you 2 random FRQs. Turn the Timer on, leave Shuffle off, and write full answers before you check.','Show work on any calculation and give a reason for every classification.'],
 mock2:['The real Day 2 has 8 true/false, 2 labeling questions and about 13 multiple choice. This section mirrors that order.','Turn the Timer on and check answers at the end to match test conditions. Use Flag for review on hard ones.']

function qResult(sec,q){
  const s=sec.st[q.id],f=frac(q,s);
  return {done:f!==null,good:f===1,f:f===null?0:f,s:s};
}
function resDetail(q,s){
  let h='';
  if(q.type==='mcq'||q.type==='tf'){
    h+='<div><b>Your answer:</b> '+(s.sel===null||s.sel===undefined?'none':esc(q.options[s.sel]))+'</div><div><b>Correct answer:</b> '+esc(q.options[q.ai])+'</div><div class="muted">'+esc(q.exp)+'</div>';
  }else if(q.type==='label'){
    h+=q.items.map((it,i)=>{const sel=s.items[i];const ok=sel===it.ans;return '<div>'+(ok?'✓':'✗')+' '+esc(it.t)+' → '+(ok?'<b>'+esc(q.labels[it.ans])+'</b>':'you said '+(sel===undefined?'nothing':esc(q.labels[sel]))+', correct is <b>'+esc(q.labels[it.ans])+'</b>. <span class="muted">'+esc(it.exp)+'</span>')+'</div>';}).join('');
  }else{
    h+='<ol class="fparts" type="a">'+q.parts.map(p=>'<li><div class="skill">'+(s.pm&&s.pm[p.k]===true?'✓ ':(s.pm&&s.pm[p.k]===false?'✗ ':''))+esc(p.prompt)+'</div><div>'+esc(p.model)+'</div></li>').join('')+'</ol>';
  }
  return h;
}

function syncMain(){
  const R=PT.retest;if(!R||R.sec!==PT.sec)return;const sec=PT.secs[R.sec],c=cur3(),m=sec.st[c.id],r=R.st[c.id];
