  if(c.q.type==='frq'){c.s.revealed=true;}
  else if(c.q.type==='label'){if(c.s.checked||!c.q.items.every((it,i)=>c.s.items[i]!==undefined))return;c.s.checked=true;c.s.correct=c.q.items.every((it,i)=>c.s.items[i]===it.ans);}
  else{if(c.s.sel===null||c.s.checked)return;c.s.checked=true;c.s.correct=(c.s.sel===c.q.ai);}
  syncMain();render();
};
ACT.ptmark=t=>{const c=cur3(),v=(t.dataset.v==='1');c.s.mark=v;c.s.pm={};c.q.parts.forEach(p=>{c.s.pm[p.k]=v;});syncMain();render();};
ACT.ptpart=t=>{const c=cur3();c.s.pm=c.s.pm||{};c.s.pm[t.dataset.p]=(t.dataset.v==='1');c.s.mark=null;syncMain();render();};
ACT.ptflag=()=>{const c=cur3();c.s.flag=!c.s.flag;render();};
ACT.ptshuffle=()=>{PT.secs.forEach(sec=>{sec.order=shuf(sec.orig);sec.cur=0;sec.qs.forEach(q=>{if(q.type==='mcq')sec.oo[q.id]=shuf([0,1,2,3]);});});PT.shuffled=true;render();};
ACT.ptunshuffle=()=>{PT.secs.forEach(sec=>{sec.order=sec.orig.slice();sec.cur=0;sec.qs.forEach(q=>{if(q.type==='mcq')sec.oo[q.id]=[0,1,2,3];});});PT.shuffled=false;render();};
function freshSec(sec){sec.qs.forEach(q=>{sec.st[q.id]=newSt();});sec.cur=0;}
ACT.ptresetsec=()=>{freshSec(PT.secs[PT.sec]);if(PT.retest&&PT.retest.sec===PT.sec)PT.retest=null;render();};
ACT.ptresetall=()=>{const M=UI.tab==='exam'?'exam':'practice';if(!ask(M==='exam'?'Reset the entire full exam?':'Reset all practice sections?'))return;PT.secs.forEach(x=>{if(x.mode===M)freshSec(x);});PT.retest=null;PT.elapsed=0;render();};
ACT.ptretest=()=>{
  const sec=PT.secs[PT.sec],ids=sec.order.filter(id=>status(sec.byId[id],sec.st[id])==='bad'||status(sec.byId[id],sec.st[id])==='partial');
  if(!ids.length){PT.msg='No missed questions in this section yet. Check some answers first.';render();return;}
  const st={};ids.forEach(id=>{st[id]=newSt();});PT.retest={sec:PT.sec,ids:ids,st:st,cur:0};render();
};
ACT.ptendretest=()=>{PT.retest=null;render();};
ACT.pttimer=()=>{PT.timerOn=!PT.timerOn;clearInterval(PT.iv);if(PT.timerOn)PT.iv=setInterval(()=>{PT.elapsed++;const e=document.getElementById('pttime');if(e)e.textContent=fmt(PT.elapsed);if(PT.elapsed%5===0)PTsave();},1000);render();};
ACT.ptprint=()=>{
  const sec=PT.secs[PT.sec];let b='';
  sec.order.forEach((id,n)=>{const q=sec.byId[id];
    if(q.type==='mcq')b+='<div class="q"><b>'+(n+1)+'.</b> '+esc(q.stem)+sec.oo[id].map((oi,pos)=>'<div>'+'ABCD'[pos]+'. '+esc(q.options[oi])+'</div>').join('')+'</div>';
    else if(q.type==='tf')b+='<div class="q"><b>'+(n+1)+'.</b> True or false: '+esc(q.stem)+'</div>';
    else if(q.type==='label')b+='<div class="q"><b>'+(n+1)+'.</b> '+esc(q.stem)+' ('+q.labels.map(esc).join(' / ')+')'+q.items.map((it,i)=>'<div>'+(i+1)+'. '+esc(it.t)+' ______________</div>').join('')+'</div>';
    else b+='<div class="q"><b>'+esc(q.title)+'.</b> '+esc(q.stem)+(q.data.length?'<div class="src">'+q.data.map(esc).join('<br>')+'</div>':'')+q.parts.map(p=>'<p>('+p.k+') '+esc(p.prompt)+'</p><div class="ln"></div><div class="ln"></div><div class="ln"></div>').join('')+'</div>';});
  const w=window.open('','_blank');
  if(!w){PT.msg='Your browser blocked the print window. Allow pop-ups and try again.';render();return;}
  w.document.write('<html><head><title>'+esc(sec.name)+'</title><style>body{font:14px Georgia,serif;margin:24px;line-height:1.45}.src{border:1px solid #888;padding:8px;margin:12px 0}.q{margin:14px 0}.ln{border-bottom:1px solid #999;height:24px}</style></head><body><h2>Pre-AP Chemistry · Chapter 3 · '+esc(sec.name)+'</h2>'+b+'</body></html>');
  w.document.close();w.focus();setTimeout(()=>w.print(),300);
};
/* ---------- persistence ---------- */
const PTK='chem3_matter_pt_v1';
function PTpack(){return {sec:PT.sec,timerOn:PT.timerOn,elapsed:PT.elapsed,shuffled:PT.shuffled,intro:PT.intro,
  secs:PT.secs.map(s=>({name:s.name,order:s.order,cur:s.cur,st:s.st,oo:s.oo})),
  retest:PT.retest?{sec:PT.retest.sec,ids:PT.retest.ids,st:PT.retest.st,cur:PT.retest.cur}:null};}
function PTsave(){try{localStorage.setItem(PTK,JSON.stringify(PTpack()));}catch(e){}}
function PTload(o){
  try{
    if(!o||!o.secs)return;
    o.secs.forEach(x=>{const s=PT.secs.find(y=>y.name===x.name);if(!s)return;
      if(Array.isArray(x.order)&&x.order.length===s.orig.length&&x.order.every(id=>s.byId[id]))s.order=x.order;
      if(typeof x.cur==='number')s.cur=Math.min(Math.max(0,x.cur),s.order.length-1);
      s.qs.forEach(q=>{const st=x.st&&x.st[q.id];if(st&&typeof st==='object')s.st[q.id]=Object.assign(newSt(),st,{items:Object.assign({},st.items||{}),pm:Object.assign({},st.pm||{})});
        const oo=x.oo&&x.oo[q.id];if(q.type==='mcq'&&Array.isArray(oo)&&oo.length===4)s.oo[q.id]=oo;});});
    if(typeof o.sec==='number'&&PT.secs[o.sec])PT.sec=o.sec;
    PT.shuffled=!!o.shuffled;PT.intro=o.intro||{};PT.elapsed=Number(o.elapsed)||0;
    PT.retest=null;
    if(o.retest&&PT.secs[o.retest.sec]&&Array.isArray(o.retest.ids)){const rs=PT.secs[o.retest.sec];if(o.retest.ids.every(id=>rs.byId[id])){PT.retest={sec:o.retest.sec,ids:o.retest.ids,st:{},cur:o.retest.cur||0};o.retest.ids.forEach(id=>{PT.retest.st[id]=Object.assign(newSt(),o.retest.st[id]||{});});}}
    if(o.timerOn&&!PT.timerOn){PT.timerOn=true;PT.iv=setInterval(()=>{PT.elapsed++;const e=document.getElementById('pttime');if(e)e.textContent=fmt(PT.elapsed);if(PT.elapsed%5===0)PTsave();},1000);}
  }catch(e){}
}
function PTreset(){PT.secs.forEach(s=>{s.qs.forEach(q=>{s.st[q.id]=newSt();if(q.type==='mcq')s.oo[q.id]=[0,1,2,3];});s.order=s.orig.slice();s.cur=0;});PT.retest=null;PT.elapsed=0;PT.shuffled=false;PT.sec=0;PTsave();}
try{const r=localStorage.getItem(PTK);if(r)PTload(JSON.parse(r));}catch(e){}
render();

</script></body></html>
