</style></head><body><div id="app"></div><script>const DATA={"decks": [{"id": 1, "name": "States of Matter", "color": "#2f6fdb", "optional": false, "sections": [{"id": "1.0", "name": "What matter is", "cards": [{"term": "Matter", "def": "Anything that takes up space (has volume) and has mass.", "hook": "No mass and no space means not matter."}, {"term": "Solid", "def": "Rigid state with a fixed volume and a fixed shape. Its particles are locked in rigid positions, close together (they still vibrate). Examples: ice cube, diamond, iron bar.", "hook": "Solid = stuck in place."}, {"term": "Liquid", "def": "State with a definite volume that takes the shape of its container. Its particles are close together but can move around. Examples: gasoline, water, alcohol, blood.", "hook": "Liquid = fills the bottom of the bowl."}, {"term": "Gas", "def": "State with no fixed volume and no fixed shape: it takes both the shape and the volume of its container. Its particles are far apart and move randomly. Examples: air, helium, oxygen.", "hook": "Gas = goes everywhere."}]}, {"id": "1.1", "name": "Water at the particle level", "cards": [{"term": "Ice (solid water)", "def": "Water molecules locked into rigid positions, close together.", "hook": "Ice = a fixed grid."}, {"term": "Liquid water", "def": "Water molecules still close together but able to move around to some extent.", "hook": "Liquid = close but sliding."}, {"term": "Steam (gaseous water)", "def": "Water molecules far apart, moving randomly and hitting each other and the container walls.", "hook": "Steam = spread out and zooming."}, {"term": "Intact molecules", "def": "In ice, liquid water and steam the H₂O molecules are still intact. Only the motion of the molecules and the distances between them change.", "hook": "Same molecule, different spacing."}]}, {"id": "1.2", "name": "Particle motion in each state", "cards": [{"term": "Solid particles", "def": "Particles vibrate in fixed positions, closely packed and orderly.", "hook": "Solid = vibrate in place."}, {"term": "Liquid particles", "def": "Particles are close together but slide past each other.", "hook": "Liquid = close but sliding."}, {"term": "Gas particles", "def": "Particles are far apart, moving fast and randomly.", "hook": "Gas = far apart and fast."}, {"term": "Energy and state", "def": "Energy increases from solid to liquid to gas. More energy means more motion and less order.", "hook": "More energy = more motion = less order."}]}, {"id": "1.3", "name": "Changes of state (part 1 of 2)", "cards": [{"term": "Melting", "def": "Solid to liquid. A physical change. The particles speed up and become less organized.", "hook": "Melting = solid to liquid."}, {"term": "Freezing", "def": "Liquid to solid. A physical change. The particles slow down and become more organized.", "hook": "Freezing = liquid to solid."}, {"term": "Evaporation or boiling", "def": "Liquid to gas. A physical change. The particles speed up and become less organized.", "hook": "Boiling = liquid to gas."}]}, {"id": "1.4", "name": "Changes of state (part 2 of 2)", "cards": [{"term": "Condensation", "def": "Gas to liquid. A physical change. The particles slow down and become more organized.", "hook": "Condensation = gas to liquid."}, {"term": "Sublimation", "def": "Solid to gas, skipping the liquid. A physical change. The particles speed up and become less organized.", "hook": "Sublimation = solid to gas."}, {"term": "Deposition", "def": "Gas to solid, skipping the liquid. A physical change. The particles slow down and become more organized.", "hook": "Deposition = gas to solid."}, {"term": "Speed up or slow down", "def": "Particles that speed up move to a state with less organization (melting, boiling, evaporation, sublimation). Particles that slow down move to a state with more organization (freezing, condensation, deposition). All six are physical changes.", "hook": "Speed up = less order. Slow down = more order."}]}, {"id": "1.5", "name": "Water at 0 °C and absolute zero", "cards": [{"term": "Water at 0 °C", "def": "At 0 °C water is at its melting and freezing point, so ice and liquid water can sit together in equilibrium. Some water molecules also escape into the air as water vapor (evaporation from the liquid and sublimation from the ice), so all three states are present.", "hook": "Ice + water + a little vapor."}, {"term": "Absolute zero (0 K)", "def": "The lowest possible temperature, 0 K = -273.15 °C. Particles have their minimum possible motion, so nothing can be colder. The Kelvin scale starts at absolute zero, so it has no negative numbers.", "hook": "Zero Kelvin = the bottom."}]}]}, {"id": 2, "name": "Properties and Changes", "color": "#e07b1a", "optional": false, "sections": [{"id": "2.0", "name": "Types of properties", "cards": [{"term": "Physical property", "def": "A characteristic that can be observed or measured without changing the substance into a different substance.", "hook": "Look, do not change."}, {"term": "Chemical property", "def": "The ability of a substance to change into a different (new) substance.", "hook": "Chemical = can become something new."}, {"term": "Intensive property", "def": "A physical property that does NOT depend on the amount of substance present. Examples: boiling point, color, temperature, luster, hardness, density, ductile (drawn into thin wires) and malleable (hammered into thin sheets).", "hook": "Intensive = unchanged when you cut it in half."}, {"term": "Extensive property", "def": "A physical property that DOES depend on the amount of substance present. Examples: mass, volume, size, weight, length.", "hook": "Extensive = more stuff, bigger value."}]}, {"id": "2.1", "name": "Examples of properties", "cards": [{"term": "Physical properties you observe", "def": "Odor, color and state (solid, liquid or gas).", "hook": "Use your senses."}, {"term": "Physical properties you measure", "def": "Volume, density, melting point, boiling point and hardness.", "hook": "Use an instrument."}, {"term": "Ethyl alcohol boiling at 78°C is an example of what change?", "def": "A physical change: boiling is a change of state, and no new substance forms. The boiling point itself is a physical property.", "hook": "Boiling point is always physical."}, {"term": "Sugar fermenting to form ethyl alcohol is an example of what change?", "def": "A chemical change: a new substance (alcohol) forms.", "hook": "New substance = chemical."}]}, {"id": "2.2", "name": "Chemical property examples", "cards": [{"term": "Flammability", "def": "The ability to burn. A chemical property, because burning makes new substances.", "hook": "Flammable = can burn."}, {"term": "Rusting of steel", "def": "Steel reacting with oxygen to form rust. A chemical property.", "hook": "Rust = new substance."}, {"term": "Digestion of food", "def": "Food is broken down into new substances in your body. A chemical property.", "hook": "Digest = new substances."}, {"term": "Reacting with acid", "def": "Whether a substance reacts with an acid, such as vinegar on chalk. A chemical property.", "hook": "Acid reaction = chemical."}, {"term": "Other chemical properties", "def": "The review sheet also lists reacting or not reacting with oxygen or water, being corrosive, being toxic, and pH.", "hook": "Reacts or not, corrosive, toxic, pH."}]}, {"id": "2.3", "name": "Physical and chemical changes", "cards": [{"term": "Physical change", "def": "A change in one or more physical properties of a substance but NOT in its chemical composition. Chemical bonds are not broken. Example: boiling or freezing water.", "hook": "Same stuff, new look."}, {"term": "Chemical change", "def": "A given substance becomes a new substance or substances with different properties and different composition. The atoms are reorganized.", "hook": "New stuff."}, {"term": "Reaction", "def": "Another name for a chemical change. Example: in a Bunsen burner methane reacts with oxygen to form carbon dioxide and water.", "hook": "Reaction = chemical change."}]}, {"id": "2.4", "name": "Signs of a chemical change", "cards": [{"term": "Precipitate", "def": "A solid that forms when two pure substances react. A sign that a new substance was made.", "hook": "New solid = chemical."}, {"term": "Gas given off", "def": "Bubbles form because a new gas is made. A sign of a chemical change. Odor is a physical property, so a smell alone is not a sign.", "hook": "Bubbles = new gas."}, {"term": "Color change", "def": "A new color can show that a new substance was made.", "hook": "New color = maybe new substance."}, {"term": "Temperature change", "def": "The mixture gets hotter or colder on its own as the reaction happens.", "hook": "Heats or cools by itself."}, {"term": "Light given off", "def": "A flame or glow shows that a reaction is giving off energy as light.", "hook": "Glow = reaction."}]}, {"id": "2.5", "name": "Key cases", "cards": [{"term": "Melting", "def": "Solid to liquid. A physical change of state.", "hook": "Melting is physical."}, {"term": "Boiling", "def": "Liquid to gas. A physical change of state.", "hook": "Boiling is physical."}, {"term": "Electrolysis of water (decomposition)", "def": "An electric current splits water (H₂O) into hydrogen (H₂) and oxygen (O₂) gases. A chemical change: two H₂O make two H₂ and one O₂.", "hook": "Electric current breaks bonds."}, {"term": "Combustion (burning)", "def": "A chemical change in which a substance reacts with oxygen, giving off heat and light and forming new substances. Burning wood leaves ash and gases.", "hook": "Fire = new substances."}, {"term": "Rusting", "def": "Iron combines with oxygen to form rust (iron oxide). A chemical change.", "hook": "Iron + oxygen = rust."}]}, {"id": "2.6", "name": "Types of reactions", "cards": [{"term": "Synthesis", "def": "Two or more substances combine to form something NEW.", "hook": "Synthesis = build up."}, {"term": "Decomposition", "def": "A substance breaks down to make two or more substances. Electrolysis of water is an example.", "hook": "Decompose = break apart."}, {"term": "Single displacement", "def": "An element is \"pushed out\" of a compound by another element.", "hook": "Single = one element swaps."}, {"term": "Double displacement", "def": "The positive elements switch places in two compounds.", "hook": "Double = two partners swap."}]}]}, {"id": 3, "name": "Elements, Compounds and Mixtures", "color": "#2e9d57", "optional": false, "sections": [{"id": "3.0", "name": "Pure substances and mixtures", "cards": [{"term": "Element", "def": "A substance that cannot be broken down into other substances by chemical methods. Examples: Fe, Al, O₂, H₂, Au.", "hook": "Element = one type of atom."}, {"term": "Compound", "def": "A substance made of a given combination of elements (two or more types of atoms) that can be broken down into those elements by chemical methods. It always has the same composition. Examples: H₂O, CO₂, C₁₂H₂₂O₁₁.", "hook": "Compound = a fixed recipe."}, {"term": "Pure substance", "def": "Matter that always has the same composition. It is either an element or a compound.", "hook": "Pure means element or compound."}, {"term": "Mixture", "def": "Matter with variable composition, made of two or more pure substances that can be separated by physical means. Examples: wood, wine, coffee.", "hook": "Mixture = no fixed recipe."}]}, {"id": "3.1", "name": "Types of mixtures", "cards": [{"term": "Homogeneous mixture", "def": "A mixture that is the same throughout, with visibly indistinguishable parts. Examples: air, brass, table salt stirred into water, gasoline.", "hook": "Homo = same."}, {"term": "Heterogeneous mixture", "def": "A mixture with visibly distinguishable parts and regions that have different properties. Examples: oil-and-vinegar dressing, sand stirred into water, a jar of jelly beans, soil.", "hook": "Hetero = different."}, {"term": "Solution", "def": "Another name for a homogeneous mixture.", "hook": "Solution = uniform mixture."}]}, {"id": "3.2", "name": "Reading formulas", "cards": [{"term": "Subscript", "def": "A small number in a formula showing how many atoms of that type are in one molecule. H₂O has 2 H and 1 O. C₁₂H₂₂O₁₁ has 45 atoms.", "hook": "Subscript counts atoms."}, {"term": "The & symbol", "def": "In a formula code, & separates different substances that are just sitting together, so it signals a MIXTURE (for example NaCl & H₂O).", "hook": "& means mixture."}, {"term": "Element formula clue", "def": "One capital letter (one type of atom), such as Br₂, Al, P₄, O₃. A subscript alone does not make something a compound.", "hook": "One capital letter = element."}, {"term": "Compound formula clue", "def": "Two or more capital letters (different atoms) bonded in one formula with no &, such as CO₂, NaHCO₃, H₂SO₄.", "hook": "Two or more capitals, no & = compound."}, {"term": "Mixture formula clue", "def": "A code with & between substances, such as C₆H₁₂O₆ & H₂O or Cu & Zn.", "hook": "Look for & first."}]}, {"id": "3.3", "name": "Particles versus bulk samples", "cards": [{"term": "Atom", "def": "A single particle of an element. Atoms can be bonded together into molecules.", "hook": "Atom = one particle."}, {"term": "Molecule", "def": "Two or more atoms held together by chemical bonds. A molecule can contain one type of atom (Br₂) or several (H₂O).", "hook": "Molecule = bonded atoms."}, {"term": "Particle", "def": "Any individual atom or molecule in a drawing. A single atom can be a particle and so can a molecule.", "hook": "Count each separate piece."}, {"term": "Bulk terms versus particle terms", "def": "Element, compound and mixture describe bulk samples. Atom and molecule describe particles. Atom does NOT equal element and molecule does NOT equal compound (Br₂ is a molecule but an element).", "hook": "Bulk = E/C/M. Particles = atom/molecule."}]}, {"id": "3.4", "name": "Solutions and suspensions", "cards": [{"term": "Solvent", "def": "The part of a solution that does the dissolving (example: water). A solution is a mixture of two or more substances.", "hook": "Solvent dissolves."}, {"term": "Solute", "def": "The part of a solution that is dissolved (example: sugar).", "hook": "Solute is dissolved."}, {"term": "Suspension", "def": "A heterogeneous mixture that settles upon standing. Examples: mud, juice with pulp, oil and water.", "hook": "Suspension = settles."}]}, {"id": "3.5", "name": "Mixture examples from the review sheet", "cards": [{"term": "Homogeneous examples", "def": "Salt water, lemonade, tea, coffee, 18K gold, air, steel, rain water.", "hook": "Same throughout."}, {"term": "Heterogeneous examples", "def": "Coke float, sand in water, milk, chocolate chip cookies, pizza, salad.", "hook": "You can see phases."}]}]}, {"id": 4, "name": "Separation of Mixtures", "color": "#8a4fd6", "optional": false, "sections": [{"id": "4.0", "name": "Techniques", "cards": [{"term": "Physical means", "def": "Methods that separate a mixture without changing the identity of its parts. No bonds are broken.", "hook": "Physical = separate, do not change."}, {"term": "Distillation", "def": "Separates substances using differences in boiling point: boil, then condense the vapor. Salt water gives pure water, and the salt stays in the flask.", "hook": "Distill = boiling point."}, {"term": "Filtration", "def": "Separates a liquid from an undissolved solid using filter paper (state of matter). Dissolved salt or sugar passes through the filter.", "hook": "Filter = solid versus liquid."}, {"term": "Chromatography", "def": "Separates substances by how strongly they adhere to a surface: a mobile phase carries the parts of the mixture across a fixed phase, and each part travels a different distance.", "hook": "Chromatography = sticks to a surface."}, {"term": "Evaporation", "def": "Separates substances using volatility: the volatile component leaves as a vapor and the other stays behind.", "hook": "Evaporate = volatility."}]}, {"id": "4.1", "name": "Mixtures versus compounds", "cards": [{"term": "Separating mixtures", "def": "Mixtures can be separated by physical methods into pure substances (elements and/or compounds).", "hook": "Mixture = physical."}, {"term": "Separating compounds", "def": "Compounds need chemical methods (breaking bonds), such as electrolysis or decomposition, to be separated into elements.", "hook": "Compound = chemical."}, {"term": "Distillation of salt water", "def": "A physical method: no chemical change occurs. A saltwater solution (a homogeneous mixture) becomes salt plus pure water.", "hook": "Same salt, same water."}]}, {"id": "4.2", "name": "Magnets and chromatography", "cards": [{"term": "Magnetism", "def": "A separation that works when some particles are magnetic and stick to a magnet (for example iron filings in sand). It is a physical method.", "hook": "Magnet picks out the magnetic part."}, {"term": "Mobile phase", "def": "In chromatography the mobile phase (such as water) moves the parts of the mixture across the paper. Example: separating ink into its colors with water and paper.", "hook": "Mobile moves."}, {"term": "Fixed phase", "def": "In chromatography the fixed phase (such as paper) does not move. The parts of the mixture stick to it by different amounts.", "hook": "Fixed stays."}, {"term": "Picking pieces out", "def": "The simplest physical means: you can pick the pieces out by hand, like separating the parts of a salad.", "hook": "Salad = pick it apart."}]}]}, {"id": 5, "name": "Lab Stations and Colloids", "color": "#7a8394", "optional": false, "sections": [{"id": "5.0", "name": "Lab stations 1 to 3", "cards": [{"term": "Station 1: paper", "def": "Tearing paper is a physical change. Igniting the paper is a chemical change (flame, heat, ash and gases).", "hook": "Tear = physical, burn = chemical."}, {"term": "Station 2: tea lights", "def": "Melting a tea light on a hot plate is a physical change. Burning one is a chemical change: the wax reacts with oxygen and gives off heat and light.", "hook": "Melt = physical, burn = chemical."}, {"term": "Station 3: steel wool", "def": "Burning steel wool is a chemical change: iron combines with oxygen to form iron(III) oxide, so the mass INCREASES.", "hook": "Gains oxygen, gains mass."}]}, {"id": "5.1", "name": "Lab stations 4 to 6", "cards": [{"term": "Station 4: vinegar and chalk (TUMS)", "def": "Calcium carbonate reacts with vinegar, forming bubbles of gas (a chemical change). Filtering the leftover solid is a physical separation.", "hook": "Bubbles mean a new gas."}, {"term": "Station 5: zinc in hydrochloric acid", "def": "A post-1982 penny has a zinc core. Once it is cut, the zinc reacts with hydrochloric acid, bubbles form and the penny loses mass (a chemical change).", "hook": "Zinc reacts, mass lost."}, {"term": "Station 6: nail and peroxide", "def": "Hydrogen peroxide reacts with the iron nail (a chemical change). It is a dangerous material, so the safety rules apply.", "hook": "Peroxide plus iron: react, be careful."}]}, {"id": "5.2", "name": "Colloids (part 1 of 2)", "cards": [{"term": "Colloid", "def": "A heterogeneous mixture that may appear homogeneous to the naked eye.", "hook": "Looks smooth but is heterogeneous."}, {"term": "Colloid particle size", "def": "Colloid particles are about 1 nm to 1000 nm across.", "hook": "Colloid = 1 to 1000 nm."}, {"term": "Colloid stability", "def": "Colloids are stable: the particles do not settle on standing. They cannot be separated by simple filtration.", "hook": "Stable = never settles."}, {"term": "Tyndall effect", "def": "Colloidal particles scatter a light beam so the beam is visible. A true solution does not scatter the beam.", "hook": "Tyndall = beam visible."}, {"term": "Brownian movement", "def": "Colloidal particles move in a continuous, random zigzag path.", "hook": "Brownian = zigzag."}]}, {"id": "5.3", "name": "Colloids (part 2 of 2)", "cards": [{"term": "Centrifuge", "def": "A high-speed centrifuge can separate a colloid, which simple filtration cannot. Example: separating cream from milk.", "hook": "Too small to filter, so spin it."}, {"term": "Dispersed phase", "def": "The component of a colloid present in the smaller quantity, like a solute. It is the part spread out in the mixture.", "hook": "Dispersed = the small amount."}, {"term": "Dispersion medium", "def": "The component of a colloid present in the larger quantity, like a solvent. The particles are spread through it.", "hook": "Medium = the big amount."}]}, {"id": "5.4", "name": "Types of colloids (part 1 of 2)", "cards": [{"term": "Aerosol", "def": "A solid or a liquid dispersed in a gas. Solid in a gas: smoke and dust. Liquid in a gas: fog, mist, cloud and insecticide sprays. The name aerosol is used for both.", "hook": "Aerosol = in a gas."}, {"term": "Foam", "def": "A gas dispersed in a liquid. Examples: whipped cream, froth and soap lather.", "hook": "Foam = gas bubbles in a liquid."}, {"term": "Emulsion", "def": "A liquid dispersed in a liquid. Examples: milk, hair cream and butter.", "hook": "Emulsion = liquid in liquid."}]}, {"id": "5.5", "name": "Types of colloids (part 2 of 2)", "cards": [{"term": "Sol", "def": "A solid dispersed in a liquid. Examples: paints and cell fluids.", "hook": "Sol = solid in a liquid."}, {"term": "Gel", "def": "A liquid dispersed in a solid. Examples: cheese and jellies.", "hook": "Gel = liquid in a solid."}, {"term": "Solid sol", "def": "A solid or a gas dispersed in a solid. Solid in a solid: colored glass and gemstones. Gas in a solid: pumice stone and foam rubber. The name solid sol is used for both.", "hook": "Solid sol = in a solid."}]}]}], "sq": [{"deck": 1, "q": "A student heats a sealed flask of liquid water until it is all steam. Which statement best describes the molecules in the steam?", "opts": ["They are still H₂O molecules, but now far apart.", "Each H₂O molecule has split into hydrogen and oxygen atoms.", "The water has become a different compound as it boiled.", "The molecules shrink, so the gas takes up less space."], "ans": 0, "exp": "Boiling is a physical change. The H₂O molecules stay intact; only their motion and spacing change.", "why": ["", "Boiling is a physical change, so the molecules are not split apart. Splitting water needs electrolysis.", "The substance is still water. A different compound would need a chemical change.", "The molecules do not change size; the spaces between them grow, so the gas spreads out."]}, {"deck": 2, "q": "You crush a block of rock salt into powder and then dissolve the powder in water. How should the two changes be classified?", "opts": ["Crushing is physical and dissolving is chemical.", "Both crushing and dissolving are physical changes.", "Crushing is chemical and dissolving is physical.", "Both crushing and dissolving are chemical changes."], "ans": 1, "exp": "The salt keeps its composition in both steps, so both are physical changes.", "why": ["Dissolving only spreads the salt through the water. No new substance forms, so it is physical.", "", "Crushing only changes the size of the pieces. The composition stays the same, so it is physical.", "Neither process makes a new substance. Both are physical."]}, {"deck": 2, "q": "A student drops an antacid tablet into vinegar and sees bubbles. What does this show?", "opts": ["Only a physical change, because the tablet gets smaller.", "A change of state of the tablet into a gas.", "A chemical change, because a new gas formed.", "A mixture forming, because two substances were combined."], "ans": 2, "exp": "Gas formation is an indicator of a chemical change.", "why": ["A shrinking tablet alone could be dissolving, but bubbles of gas signal a new substance forming.", "The tablet does not turn into gas; a gas forms from the reaction between the tablet and the vinegar.", "", "Combining substances can make a mixture, but bubbles of new gas show a reaction took place."]}, {"deck": 2, "q": "Steel wool is massed, burned and massed again. The mass went up by 0.38 g. What is the best explanation?", "opts": ["Burning always adds mass to metals.", "The iron atoms got heavier from the heat.", "The steel wool absorbed water from the air.", "Oxygen from the air combined with the iron."], "ans": 3, "exp": "Iron plus oxygen forms iron(III) oxide, which has more mass than the iron alone.", "why": ["Burning does not simply add mass. The extra mass comes from a specific reactant.", "Heat does not make atoms heavier. The mass gain comes from additional atoms joining the iron.", "Nothing in the data points to water. Burning iron combines with oxygen.", ""]}, {"deck": 2, "q": "Two samples of pure copper are compared: a tiny wire and a large block. Which property is identical?", "opts": ["Density", "Volume", "Length", "Mass"], "ans": 0, "exp": "Density is intensive, so it does not depend on how much copper there is.", "why": ["", "The block takes up more space, so volume differs. Volume is extensive.", "Length depends on the size of the sample, so it is extensive.", "The block has more matter, so its mass is greater. Mass is extensive."]}, {"deck": 3, "q": "A jar holds pieces of Cu and Zn mixed together, written Cu & Zn. How should it be labeled?", "opts": ["An element, since both Cu and Zn are elements.", "A mixture, because the & shows two substances.", "A compound, since two types of atom are present.", "A solution that cannot be separated."], "ans": 1, "exp": "The & symbol marks a mixture of two elements.", "why": ["Each of the two is an element, but the jar holds two different substances together, which is not one element.", "", "Compounds are written as one bonded formula. The & shows separate substances.", "Mixtures can be separated by physical methods, so the claim is false."]}, {"deck": 3, "q": "A particle drawing shows several separate, identical Br₂ molecules. How should the sample be labeled?", "opts": ["A compound, because it contains molecules of bonded atoms.", "A mixture, because there are so many particles present.", "An element, because only bromine atoms are present.", "A compound, because the atoms in each molecule are bonded."], "ans": 2, "exp": "Identical Br₂ molecules contain one type of atom, so the sample is an element.", "why": ["Molecules can contain only one type of atom. Br₂ has only bromine atoms.", "Many identical particles still make a pure substance; a mixture needs different particles.", "", "Bonding alone does not make a compound. A compound needs two or more types of atoms."]}, {"deck": 4, "q": "Muddy water is poured through filter paper. What passes through and what stays on the paper?", "opts": ["Dissolved salt stays; undissolved dirt passes through.", "Everything passes through because it is wet.", "Water decomposes and the hydrogen stays on the paper.", "Clear liquid passes through; undissolved dirt stays."], "ans": 3, "exp": "Filtration separates undissolved solids from liquids.", "why": ["This reverses the process. Dissolved particles pass through filter paper.", "The paper traps solid particles that are too large to pass through.", "Filtering is a physical method and does not break water apart.", ""]}, {"deck": 4, "q": "How would you recover pure water from salt water?", "opts": ["Boil it and condense the steam.", "Run an electric current through the mixture.", "Add more salt until the water separates.", "Filter the salt water through paper."], "ans": 0, "exp": "Distillation uses the difference in boiling points; the salt stays behind.", "why": ["", "An electric current would decompose water into gases; it would not separate it from the salt.", "Adding salt just makes the solution more concentrated.", "Dissolved salt passes through filter paper, so the water would not be pure."]}, {"deck": 4, "q": "Which approach would you use to break water into hydrogen and oxygen?", "opts": ["Distillation, a physical method.", "Electrolysis, a chemical method.", "Filtration, a physical method.", "Evaporation, a physical method."], "ans": 1, "exp": "Water is a compound, so separating its elements takes a chemical method.", "why": ["Distillation only boils and condenses, so the water stays water.", "", "Filtration separates solids from liquids and cannot split a compound.", "Evaporation turns water into vapor but does not break the molecules apart."]}, {"deck": 3, "q": "A student writes NaCl & H₂O for a drawing. What does the drawing most likely show?", "opts": ["A heterogeneous mixture of sand and water.", "A compound containing sodium and chlorine.", "Salt water, a homogeneous mixture.", "A pure substance made of three elements."], "ans": 2, "exp": "The & shows two substances mixed together; salt in water is the same throughout.", "why": ["The formulas show salt and water, and dissolved salt is uniform throughout.", "NaCl alone would be the compound; the & and H₂O show a second substance.", "", "A pure substance has no & in its code; this is two substances together."]}, {"deck": 2, "q": "A tea light is melted, and then a different one is lit. Which statement is correct?", "opts": ["Melting is chemical; burning is physical.", "Both are chemical changes.", "Both are physical changes.", "Melting is physical; burning is chemical."], "ans": 3, "exp": "Melted wax is still wax, but burning makes new substances.", "why": ["This swaps them. Melted wax is still wax.", "Melting does not form a new substance.", "Burning wax reacts with oxygen and forms new substances.", ""]}, {"deck": 3, "q": "A student says \"Br₂ is a molecule, so it must be a compound.\" What is the best reply?", "opts": ["Wrong, because Br₂ has only one type of atom.", "Correct, because it has a subscript of two.", "Wrong, because Br₂ is actually a mixture of two things.", "Correct, since all molecules are compounds."], "ans": 0, "exp": "A compound needs two or more different atom types. Br₂ is an element made of molecules.", "why": ["", "A subscript only counts atoms. It does not decide whether something is a compound.", "There is no & in Br₂, so it is a single pure substance.", "Not all molecules are compounds. Molecules of a single element exist."]}, {"deck": 3, "q": "Which substance is a heterogeneous mixture?", "opts": ["Brass", "Soil", "Air", "Gasoline"], "ans": 1, "exp": "Soil has visibly different parts.", "why": ["Brass is the same throughout, so it is homogeneous.", "", "Air is the same throughout, so it is homogeneous.", "Gasoline looks uniform, so it is homogeneous."]}, {"deck": 2, "q": "A post-1982 penny is cut and left overnight in hydrochloric acid. It loses 0.19 g and bubbles formed. What is the best conclusion?", "opts": ["The copper coating melted in the acid, a physical change.", "The acid just washed dirt off the penny.", "The zinc core reacted with the acid, a chemical change.", "Water inside the penny evaporated during the night."], "ans": 2, "exp": "Bubbles and mass loss show that the zinc reacted with the acid.", "why": ["Melting would need heat, and bubbles would not form. Acid does not melt copper.", "Dirt cannot account for bubbles and a lost mass of 0.19 g.", "", "A penny has no water to evaporate, and evaporation would not form bubbles."]}, {"deck": 4, "q": "You stir sand into salt water, filter it, then boil the filtrate. Which is the correct order of methods?", "opts": ["Distillation first, then filtration.", "Filtration first, then chromatography.", "Chromatography first, then evaporation.", "Filtration first, then distillation."], "ans": 3, "exp": "Remove the sand first, then boil off the water from the salt solution.", "why": ["Boiling first leaves sand and salt together, so the order does not separate them.", "Chromatography separates substances by adherence to a surface and is not how you recover water from salt water.", "Chromatography does not remove sand from water.", ""]}, {"deck": 5, "q": "A flashlight beam is visible as it passes through a glass of fog-like cloudy liquid. Which conclusion is best supported?", "opts": ["The liquid is a colloid, because it scatters the light.", "The liquid is a true solution, because the beam passed through.", "The liquid is a pure element, because it is cloudy and uniform.", "The liquid is a suspension, because the beam is visible in it."], "ans": 0, "exp": "Particles of about 1 nm to 1000 nm scatter light (the Tyndall effect) and stay mixed, so the liquid is a colloid.", "why": ["", "A true solution would not scatter the beam, so the beam would not be visible.", "Being cloudy says nothing about being an element; it is a mixture.", "A suspension would also settle on standing, which this liquid does not do."]}, {"deck": 5, "q": "A baker makes a mousse by whipping air into a thick liquid, and a jelly by setting a liquid inside a solid network. Which pair of names fits?", "opts": ["The mousse is an emulsion and the jelly is a foam.", "The mousse is a foam and the jelly is a gel.", "The mousse is a sol and the jelly is an aerosol.", "The mousse is a gel and the jelly is a solid sol."], "ans": 1, "exp": "A gas dispersed in a liquid is a foam. A liquid dispersed in a solid is a gel.", "why": ["An emulsion is a liquid in a liquid, and a foam is a gas in a liquid, so these are swapped.", "", "A sol is a solid in a liquid, and an aerosol has a gas as its medium.", "A gel is a liquid in a solid, so it describes the jelly, not the mousse."]}], "flows": [{"id": "FC1", "title": "Changes of state of water", "deck": 1, "steps": ["Solid (ice)", "Melting", "Liquid (water)", "Boiling", "Gas (steam)"]}, {"id": "FC2", "title": "Is it an element, a compound or a mixture?", "deck": 3, "steps": ["Does the code contain an & (or visibly different parts)?", "Yes: mixture", "No: pure substance", "One type of atom: element", "Two or more types of atoms: compound"]}, {"id": "FC3", "title": "How matter is organized", "deck": 4, "steps": ["Matter", "Mixtures (homogeneous or heterogeneous)", "Physical methods", "Pure substances", "Compounds", "Chemical methods", "Elements"]}, {"id": "FC4", "title": "Distilling salt water", "deck": 4, "steps": ["Heat the salt water", "Water boils to steam", "Steam cools in the condenser", "Pure water drips into the collection flask", "Salt stays in the original flask"]}, {"id": "FC5", "title": "Electrolysis of water", "deck": 2, "steps": ["2 H₂O molecules", "Electric current", "Bonds break and atoms rearrange", "2 H₂ molecules + 1 O₂ molecule"]}], "trees": ["Matter\n├─ Mixtures (variable composition; separated by physical methods)\n│  ├─ Homogeneous (solutions): air, brass, salt water, gasoline\n│  └─ Heterogeneous: oil-and-vinegar dressing, sand in water, jelly beans, soil\n└─ Pure substances (fixed composition)\n   ├─ Elements (one type of atom): Fe, Al, O₂, H₂, Au, Br₂, P₄\n   └─ Compounds (two or more types of atoms; separated by chemical methods):\n      H₂O, CO₂, C₁₂H₂₂O₁₁, NaHCO₃", "Properties of matter\n├─ Physical properties (observed without changing the substance)\n│  ├─ Intensive (does not depend on amount): boiling point, color, density, luster, hardness\n│  └─ Extensive (depends on amount): mass, volume, size, weight, length\n└─ Chemical properties (ability to become a new substance): flammability, rusting, digestion", "Changes in matter\n├─ Physical change (same substance afterward)\n│  ├─ Changes of state: melting, freezing, boiling\n│  └─ Others: crushing, dissolving, tearing, distilling\n└─ Chemical change = reaction (new substance afterward)\n   ├─ Burning (combustion), rusting, fermenting, electrolysis\n   └─ Indicators: precipitate, gas, color change, temperature change, light"], "tables": [{"title": "Types of colloids", "rows": [["Structure", "Colloid", "Example"], ["Solid in a gas", "Aerosol", "Smoke or dust"], ["Liquid in a gas", "Aerosol", "Fog, mist, cloud or insecticide spray"], ["Gas in a liquid", "Foam", "Whipped cream, froth or soap lather"], ["Liquid in a liquid", "Emulsion", "Milk, hair cream or butter"], ["Solid in a liquid", "Sol", "Paints or cell fluids"], ["Liquid in a solid", "Gel", "Cheese or jellies"], ["Solid in a solid", "Solid sol", "Colored glass or gemstones"], ["Gas in a solid", "Solid sol", "Pumice stone or foam rubber"]]}, {"title": "Changes of state", "rows": [["Change", "From to", "Energy", "Example"], ["Melting", "Solid to liquid", "Added", "Ice to water"], ["Freezing", "Liquid to solid", "Removed", "Water to ice"], ["Evaporation or boiling", "Liquid to gas", "Added", "Water to steam"], ["Condensation", "Gas to liquid", "Removed", "Steam on a cold mirror"], ["Sublimation", "Solid to gas", "Added", "Dry ice to gas"], ["Deposition", "Gas to solid", "Removed", "Frost on a window"]]}, {"title": "Physical compared with chemical", "rows": [["", "Physical", "Chemical"], ["Property", "Observed without changing the substance (color, density, boiling point)", "Ability to become a new substance (flammability, rusting)"], ["Change", "Same substance afterward (melting, boiling, dissolving, crushing)", "New substance afterward (burning, rusting, fermenting, electrolysis)"], ["Bonds", "Not broken", "Broken and re-formed into new substances"], ["Evidence", "State, shape or size changes", "Precipitate, gas bubbles, color change, temperature change, light"]]}, {"title": "Element, compound and mixture compared", "rows": [["", "Element", "Compound", "Mixture"], ["Types of atoms", "One", "Two or more", "Varies (different substances are present)"], ["Composition", "Fixed", "Fixed", "Variable"], ["Separation", "Cannot be broken down chemically", "Chemical methods", "Physical methods"], ["Formula clue", "One capital letter", "Two or more capitals, no &", "Contains &"], ["Examples", "Au, Br₂, P₄", "CO₂, H₂O, NaCl", "Air, salt water, brass"]]}, {"title": "Separation techniques compared", "rows": [["Technique", "Property used", "Example"], ["Distillation", "Boiling point", "Pure water from salt water"], ["Filtration", "State of matter (solid versus liquid)", "Sand out of water"], ["Chromatography", "Adherence to a surface", "Separating ink pigments"], ["Evaporation", "Volatility", "Recovering salt by removing the water"]]}], "watch": [{"deck": 5, "text": "In the review sheet's colloid FRQ the Structure column lists \"Solid in a Gas\" and \"Liquid in a Gas\" twice. The teacher said in class that this was a mistake. The two repeats should be \"Solid in a Liquid\" (sol: paint, cell fluid) and \"Liquid in a Solid\" (gel: jelly, cheese). Aerosol and solid sol really are each used twice, exactly as on her colloid reference sheet."}, {"deck": 5, "text": "The lab sheet lists 3% hydrogen peroxide in the materials but Station 6 says (30%) hydrogen peroxide and \"extremely dangerous.\" Treat it as a hazardous material either way; the chemical change (peroxide reacting with the iron nail) is the same."}, {"deck": 1, "text": "The review asks how water can be all three states at 0 °C. Ice and liquid water coexist at 0 °C, and water vapor is also present above them, so say all three explicitly and name the change that makes the vapor."}, {"deck": 2, "text": "The review sheet lists pH as a chemical property (along with reacting or not reacting). In the Ada Twist FRQ treat pH and \"reacts with bases and metals\" as chemical properties, and thick, clear, smell and density as physical."}, {"deck": 1, "text": "The teacher's notes sheet for Section 1 garbles the states of matter (\"deficient\" and \"indeficient\" space and volume). The correct version: a solid has a fixed shape and volume, a liquid has a fixed volume but takes the shape of its container, and a gas has neither a fixed shape nor a fixed volume."}, {"deck": 2, "text": "The slides list \"rusting of steel\" as a chemical property. Rusting itself is a chemical change; the chemical property is the ability to rust. Treat both as chemical on a test."}, {"deck": 2, "text": "The teacher's intensive/extensive example (drops of food coloring changing how intense the water's color looks) is really about the amount of dye. The same notes list color as intensive. The color of a pure substance is intensive; know the notes' example if it is asked."}, {"deck": 2, "text": "The row \"Indicators of a Chemical Change\" is blank in the notes framework. This kit uses the five signs from the teacher's review sheet: precipitate, gas given off, color change, temperature change and light given off. Odor is a physical property, so it is not used as a sign."}, {"deck": 3, "text": "The answer key in the Classification of Matter activity lists \"Drain Cleaner (Al & NaOH & ...)\" as a compound, but any code with an & is a mixture. Use the & rule on a test."}, {"deck": 3, "text": "A subscript does not make something a compound: Br₂, P₄ and O₃ are elements. Atom does not equal element and molecule does not equal compound."}, {"deck": 4, "text": "Dissolving is a physical change even though the solid seems to disappear. That is why salt water can be separated by distillation with no new substances formed."}, {"deck": 5, "text": "Station 6 lists 3% hydrogen peroxide in the materials list but 30% in the procedure. Follow your teacher's safety instructions."}, {"deck": 5, "text": "The colloid reference sheet is extra and is not in the teacher's slides. The chapter treats mixtures as homogeneous (solutions) or heterogeneous."}], "cheat": [{"title": "Classify matter in order", "kind": "list", "items": ["Is there an & or the words dissolved, solution, air, alloy or mixture? It is a mixture. Mixtures can be separated by physical means and can vary in amount.", "No &: count capital letters. One capital letter (O₂, P₄, O₃, Co) is an element, even with a subscript.", "Two or more different capital letters (H₂O, CO, NaCl) is a compound. CO is a compound; Co is the element cobalt.", "Element and compound together are pure substances. A mixture is not a pure substance."]}, {"title": "States of matter", "kind": "table", "rows": [["", "Shape", "Volume", "Particles"], ["Solid", "Fixed", "Fixed", "Close together, vibrate in place"], ["Liquid", "Takes container shape", "Fixed", "Close together, slide past each other"], ["Gas", "Takes container shape", "Fills container", "Far apart, move freely"]]}, {"title": "Temperature and state changes", "kind": "list", "items": ["0 K = -273.15 °C is absolute zero: the minimum possible particle motion, so nothing is colder.", "At 0 °C ice and liquid water coexist and a little vapor is in the air: all three states.", "Speed up (melting, boiling, evaporation, sublimation) = more energy, less order. Slow down (freezing, condensation, deposition) = less energy, more order."]}, {"title": "Colloid types", "kind": "table", "rows": [["Structure", "Colloid", "Example"], ["Solid in gas / liquid in gas", "Aerosol (both)", "Smoke / fog"], ["Gas in liquid", "Foam", "Whipped cream"], ["Liquid in liquid", "Emulsion", "Milk"], ["Solid in liquid", "Sol", "Paint, cell fluid"], ["Liquid in solid", "Gel", "Jelly, cheese"], ["Solid in solid / gas in solid", "Solid sol (both)", "Colored glass / pumice"]]}, {"title": "Reaction types", "kind": "list", "items": ["Combustion: burns in oxygen to make carbon dioxide and water. Synthesis: two or more substances combine into something new.", "Decomposition: one substance breaks down into two or more. Single displacement: an element is pushed out of a compound.", "Double displacement: the positive parts of two compounds switch places."]}, {"title": "Changes of state (all physical)", "kind": "list", "items": ["Melting: solid to liquid. Freezing: liquid to solid.", "Boiling or evaporating: liquid to gas. Condensing: gas to liquid.", "Sublimation: solid straight to gas (dry ice). The substance is the same before and after."]}, {"title": "Physical or chemical?", "kind": "table", "rows": [["", "Physical", "Chemical"], ["Change", "Same substance after: melting, boiling, dissolving, crushing, cutting", "New substance after: burning, rusting, baking, souring, electrolysis"], ["Property", "Measured without changing it: color, density, melting and boiling point", "Ability to form new substances: flammability, rusting, decomposing"], ["Test", "Is the substance still the same afterward?", "Did something new form?"]]}, {"title": "Evidence of a chemical change", "kind": "list", "items": ["Precipitate: a solid forms when two liquids or pure substances react", "Gas given off: bubbles from a reaction (not from boiling, and not dissolved gas coming out of soda)", "Color change that makes a new substance (not just more dye)", "Temperature change (heat given off or absorbed)", "Light given off", "Odor is a physical property, so a smell by itself is not a sign"]}, {"title": "Separating mixtures (all physical)", "kind": "table", "rows": [["Method", "Separates", "Uses"], ["Filtration", "Insoluble solid from a liquid", "Particle size"], ["Evaporation", "Dissolved solid from a liquid (keeps the solid)", "Liquid leaves as a gas"], ["Distillation", "Liquid from a dissolved solid, or liquids from each other (keeps the liquid)", "Different boiling points"], ["Chromatography", "Dyes or other components in a sample", "A mobile phase moves each part a different distance across a fixed phase"], ["Magnetism", "Magnetic particles from non-magnetic ones", "Magnetic attraction"], ["Compounds", "Need a chemical change such as electrolysis", "Not physical means"]]}, {"title": "Traps", "kind": "list", "items": ["Atom is not the same as element, and molecule is not the same as compound. O₂ is a molecule and an element.", "Boiling bubbles are water vapor: physical. Dissolving is physical.", "Burning, rusting, cooking and souring are chemical.", "In a mixture each substance keeps its own properties. A compound has properties unlike its elements.", "Intensive properties (density, color, melting point) do not depend on amount; extensive ones (mass, volume) do.", "Electrolysis of water splits a compound into hydrogen and oxygen. Boiling water does not."]}], "topicDeck": {"Colloids": 5, "States of matter": 1, "Properties": 2, "Physical vs chemical change": 2, "Evidence of change": 2, "Classifying matter": 3, "Particles and conservation": 3, "Separating mixtures": 4}, "practice": {"sections": [{"name": "FRQs", "kind": "frq", "mode": "practice", "questions": [{"id": "R1", "type": "frq", "title": "Review FRQ 1: Bunsen quizzes Beaker", "stem": "Bunsen quizzes Beaker about the states of matter. Answer Bunsen's four questions.", "data": [], "parts": [{"k": "a", "prompt": "\"Beaker, explain to me how water can be all three states of matter at zero Celsius.\"", "model": "Zero Celsius is the melting and freezing point of water, so ice (solid) and liquid water can exist together there in equilibrium: some ice melts while some water freezes. Water molecules at the surface of the ice and the liquid also escape into the air as water vapor (sublimation and evaporation), so a little gas is present too. That makes solid, liquid and gas at 0 °C."}, {"k": "b", "prompt": "\"Beaker, thinking about the molecules in motion, describe each state of matter.\"", "model": "Solid: molecules are close together in fixed positions, vibrating in place; the most organized, with a fixed shape and volume. Liquid: molecules are close together but slide past one another; a fixed volume but the shape of the container. Gas: molecules are far apart and move fast and randomly; no fixed shape or volume and the least organized."}, {"k": "c", "prompt": "\"Beaker, why is zero Kelvin considered absolute zero?\"", "model": "0 K (-273.15 °C) is the lowest possible temperature: particles have their minimum possible motion (they have almost no kinetic energy), so nothing can be colder. The Kelvin scale starts at this point, so it has no negative numbers."}, {"k": "d", "prompt": "\"Beaker, what are the ways water can change between the states of matter?\"", "model": "Melting (ice to water) and freezing (water to ice); evaporation or boiling (water to steam) and condensation (steam to water); sublimation (ice straight to vapor) and deposition (vapor straight to ice, like frost). Melting, evaporation and sublimation add energy (particles speed up); freezing, condensation and deposition remove energy (particles slow down). All are physical changes and the molecules stay H₂O."}], "topic": "States of matter"}, {"id": "R2", "type": "frq", "title": "Review FRQ 2: Blobby on a scooter", "stem": "Blobby is traveling to the airport and must declare everything he is carrying. He pulls out a card that lists colloids, their structures and examples, but they are all mixed up. Straighten out the card. Structures (each used once): solid in a gas, liquid in a gas, gas in a liquid, liquid in a liquid, solid in a liquid, liquid in a solid, solid in a solid, gas in a solid. Colloid names: sol, solid sol (used twice), foam, gel, emulsion, aerosol (used twice). Examples: milk, whipped cream, fog, jelly or cheese, pumice stone, colored glass or gemstones, paint or cell fluid, smoke.", "data": ["Note: on the review sheet the structure list repeated \"solid in a gas\" and \"liquid in a gas\". The teacher said in class that was a mistake. The two repeats should be \"solid in a liquid\" and \"liquid in a solid\", which is how this question lists them."], "parts": [{"k": "a", "prompt": "Match each structure with its colloid name.", "model": "Solid in a gas: aerosol. Liquid in a gas: aerosol. Gas in a liquid: foam. Liquid in a liquid: emulsion. Solid in a liquid: sol. Liquid in a solid: gel. Solid in a solid: solid sol. Gas in a solid: solid sol."}, {"k": "b", "prompt": "Match each structure with its example.", "model": "Solid in a gas: smoke. Liquid in a gas: fog. Gas in a liquid: whipped cream. Liquid in a liquid: milk. Solid in a liquid: paint or cell fluid. Liquid in a solid: jelly or cheese. Solid in a solid: colored glass or gemstones. Gas in a solid: pumice stone."}, {"k": "c", "prompt": "Which two names are used twice, and why?", "model": "Aerosol is used for both solid in a gas (smoke) and liquid in a gas (fog). Solid sol is used for both solid in a solid (colored glass) and gas in a solid (pumice stone). The name depends on the medium that holds the particles: a gas gives an aerosol and a solid gives a solid sol."}, {"k": "d", "prompt": "How could Blobby tell that fog is a colloid and not a solution?", "model": "Shine a beam of light through it. Colloid particles (about 1 to 1000 nm) scatter the light so the beam is visible (the Tyndall effect); a true solution would not scatter the beam. Colloids are also stable and do not settle on standing."}], "topic": "Colloids"}, {"id": "R3", "type": "frq", "title": "Review FRQ 3: Ada Twist defining lab", "stem": "On the workbench there is a clear liquid that is thick and smells like grape jelly. It has a pH of 4.5 and a density of 3.4 g/mL. The chemical's data sheet says that it will react with bases and metals. A second liquid is clear and smells like bubble gum. It has a density of 1.2 g/mL and a pH of 9.2. Its data sheet says it will NOT react with metals but it will react with acids. Ada sees that when the two clear liquids are combined they make a bubbly, pink liquid with a purple solid sinking to the bottom of her flask.", "data": [], "parts": [{"k": "a", "prompt": "List the physical properties that you can see in this description.", "model": "Liquid 1: clear, thick, smells like grape jelly, density 3.4 g/mL. Liquid 2: clear, smells like bubble gum, density 1.2 g/mL. (These can be observed or measured without changing the substance. Density is also intensive.)"}, {"k": "b", "prompt": "List the chemical properties that you can see in this description.", "model": "Liquid 1: pH of 4.5 (acidic); reacts with bases; reacts with metals. Liquid 2: pH of 9.2 (basic); does not react with metals; reacts with acids. (A chemical property is the ability to change into a new substance, or not to change.)"}, {"k": "c", "prompt": "Decide if this is a physical or chemical change. Give evidence from the description to back up your response.", "model": "Chemical change. Evidence: bubbles formed (a gas was given off), the color changed to pink, and a purple solid formed from two liquids (a precipitate). Each is a sign that a new substance was made."}], "topic": "Properties"}, {"id": "R4", "type": "frq", "title": "Review FRQ 4: Elmo is thinking", "stem": "Elmo read the chemistry book and is trying to get his thoughts in order. Help him compare these ideas.", "data": [], "parts": [{"k": "a", "prompt": "What is the difference between a pure substance and a mixture?", "model": "A pure substance (an element or a compound) always has the same composition and cannot be broken down by physical means. A mixture has two or more substances that keep their own properties, can vary in amounts and can be separated by physical means."}, {"k": "b", "prompt": "Compare and contrast chemical and physical changes.", "model": "Both involve changes to matter and both can involve energy. A physical change makes no new substance (changes of state, breaking, cutting, tearing, dissolving); a chemical change makes a new substance, shown by a precipitate, gas, color change, temperature change or light."}, {"k": "c", "prompt": "Compare and contrast heterogeneous and homogeneous mixtures.", "model": "Both are mixtures whose parts keep their own properties and can be separated physically. A homogeneous mixture is the same throughout (salt water, air, steel); a heterogeneous mixture has different phases you can see (pizza, sand in water, a salad)."}, {"k": "d", "prompt": "Compare and contrast elements and compounds.", "model": "Both are pure substances. An element is one type of atom, is on the periodic table and cannot be broken down by physical or chemical means. A compound is two or more elements in a set ratio, can be broken down by chemical but not physical means, and has properties different from its elements."}, {"k": "e", "prompt": "Compare and contrast filtration and distillation.", "model": "Both are physical ways to separate a mixture. Filtration passes a mixture through a filter to remove a solid from a liquid (uses particle size). Distillation boils a solution and condenses the vapor to collect the liquid, leaving the dissolved solid behind (uses boiling point)."}], "topic": "Classifying matter"}, {"id": "F1", "type": "frq", "title": "FRQ 1: Paper", "stem": "A student tears a sheet of paper into small pieces and places them on a watch glass. The student then ignites the pieces.", "data": [], "parts": [{"k": "a", "prompt": "Classify tearing and burning as physical or chemical change.", "model": "Tearing = physical change. Burning = chemical change."}, {"k": "b", "prompt": "Justify each classification using the idea of chemical composition.", "model": "Tearing only changes size and shape; every small piece has the same composition as the whole sheet. Burning changes the paper into new substances with different composition and properties (ash, carbon dioxide, water vapor and other gases)."}, {"k": "c", "prompt": "Give two observations during burning that indicate a chemical change.", "model": "Any two: light or flame, heat given off, smoke or gas produced, color change to black or gray ash."}, {"k": "d", "prompt": "Can the original paper be recovered from the ash? Explain.", "model": "No. A chemical change forms new substances, and the ash cannot simply be turned back into paper. The torn pieces, however, could be taped back together, because tearing was only a physical change."}], "topic": "Physical vs chemical change"}, {"id": "F2", "type": "frq", "title": "FRQ 2: Tea light", "stem": "A student places a tea light on a hot plate at its highest setting and watches the wax melt. Later the student lights a different tea light and observes it at the start and again 20 minutes later.", "data": [], "parts": [{"k": "a", "prompt": "Classify melting the wax and burning the tea light as physical or chemical.", "model": "Melting = physical. Burning = chemical."}, {"k": "b", "prompt": "Explain the evidence for each, using what happens to the substance itself.", "model": "Melted wax is still wax and can cool and solidify again, so no new substance formed. Burning produces a flame, heat and light, and the wax reacts with oxygen to form new substances such as carbon dioxide and water vapor."}, {"k": "c", "prompt": "Name one physical property of the wax that changed during melting.", "model": "The state changed from solid to liquid. (Also acceptable: shape or texture.)"}, {"k": "d", "prompt": "The student says \"the candle got smaller when it burned, so matter disappeared.\" Correct this.", "model": "Matter did not disappear. The wax reacted with oxygen and became gases (carbon dioxide and water vapor) that spread into the air. The atoms were rearranged into new substances."}], "topic": "Physical vs chemical change"}, {"id": "F3", "type": "frq", "title": "FRQ 3: Steel wool", "stem": "A student masses a watch glass with a piece of steel wool on it, pulls the steel wool into a fine mesh, lights the edge, lets it cool, then masses the watch glass and the burned steel wool again.", "data": ["Mass of steel wool + watch glass before burning = 45.20 g", "Mass of iron(III) oxide + watch glass after burning = 45.58 g"], "parts": [{"k": "a", "prompt": "Calculate the change in mass. Did the mass increase or decrease?", "model": "45.58 g - 45.20 g = +0.38 g. The mass increased."}, {"k": "b", "prompt": "Explain why this happened, in terms of the substances involved.", "model": "Iron in the steel wool combined with oxygen from the air to form iron(III) oxide. The extra 0.38 g is the mass of the oxygen that joined the iron."}, {"k": "c", "prompt": "Is this a physical or chemical change? Give two pieces of evidence.", "model": "Chemical change. Evidence: a new substance (iron(III) oxide) formed with different properties; the steel wool glowed and gave off heat and light; the mass changed because oxygen was added."}, {"k": "d", "prompt": "A classmate predicted the mass would decrease because \"it burned away.\" Explain the error.", "model": "The classmate forgot that oxygen from the air is a reactant. Nothing was lost: oxygen atoms were added to the iron, so the solid product has more mass than the starting iron."}], "topic": "Evidence of change"}, {"id": "F4", "type": "frq", "title": "FRQ 4: Zinc in hydrochloric acid", "stem": "A post-1982 penny has a zinc core with a thin copper coating. A student cuts into the penny to expose the core, masses it, places it in 10.0 mL of 0.1 M hydrochloric acid overnight, then rinses and dries it and masses it again.", "data": ["Mass before = 2.50 g", "Mass after = 2.31 g"], "parts": [{"k": "a", "prompt": "Calculate the mass lost to the reaction.", "model": "2.50 g - 2.31 g = 0.19 g lost."}, {"k": "b", "prompt": "Classify the change and give two indicators you would see.", "model": "Chemical change. Indicators: gas bubbles form on the penny; the zinc is used up (mass is lost); the solution may change appearance. A new substance (a zinc compound in solution and a gas) forms."}, {"k": "c", "prompt": "Why did the student cut into the penny first?", "model": "The copper coating protects the zinc. Cutting through it exposes the zinc core so the acid can react with it."}, {"k": "d", "prompt": "Why must the penny be rinsed and dried before the final mass?", "model": "Leftover acid and water would add mass or keep reacting, giving an inaccurate final mass. Rinsing and drying makes sure only the remaining penny is massed."}], "topic": "Evidence of change"}, {"id": "F5", "type": "frq", "title": "FRQ 5: Vinegar and TUMS", "stem": "TUMS is calcium carbonate (chalk). A student places a TUMS tablet in a beaker, adds 20.0 mL of vinegar, observes, then filters the mixture and dries the filter paper overnight.", "data": ["Mass of filter paper = 0.85 g", "Mass of filter paper + material after drying = 1.12 g"], "parts": [{"k": "a", "prompt": "Calculate the mass of the solid left on the filter paper.", "model": "1.12 g - 0.85 g = 0.27 g."}, {"k": "b", "prompt": "Describe an observation that shows a chemical change happened.", "model": "Bubbles of gas (carbon dioxide) formed as the tablet reacted with the vinegar, and the tablet got smaller."}, {"k": "c", "prompt": "What do you think the solid on the filter paper is? Explain.", "model": "Leftover tablet material that did not react: unreacted calcium carbonate and/or the non-reacting ingredients (binders and fillers) in the tablet."}, {"k": "d", "prompt": "Filtering is which kind of separation method, and what property does it use?", "model": "Filtration is a physical separation method. It uses the difference in state or particle size: undissolved solid is trapped by the filter paper while liquid passes through."}], "topic": "Evidence of change"}, {"id": "F6", "type": "frq", "title": "FRQ 6: Classifying matter", "stem": "Classify each sample as an element, compound or mixture. For each mixture, say homogeneous or heterogeneous. Samples: (i) gold, Au; (ii) salt water, NaCl & H₂O; (iii) carbon dioxide, CO₂; (iv) air, N₂ & O₂ & Ar & CO₂; (v) bromine, Br₂; (vi) a jar of jelly beans.", "data": [], "parts": [{"k": "a", "prompt": "Give the classification of each of the six samples.", "model": "(i) element. (ii) mixture, homogeneous (a solution). (iii) compound. (iv) mixture, homogeneous. (v) element. (vi) mixture, heterogeneous."}, {"k": "b", "prompt": "A student says \"Br₂ must be a compound because it is a molecule.\" Explain what is wrong.", "model": "A molecule is two or more atoms bonded together, but it can be made of one type of atom. Br₂ contains only bromine atoms, so it is an element. A compound needs two or more different types of atoms. Atom does not equal element and molecule does not equal compound; element, compound and mixture describe bulk samples, while atom and molecule describe particles."}], "topic": "Classifying matter"}, {"id": "F7", "type": "frq", "title": "FRQ 7: Separating a mixture", "stem": "A mixture contains sand, table salt and water (the salt is dissolved).", "data": [], "parts": [{"k": "a", "prompt": "Design a plan to recover the sand, the salt and the pure water as three separate things. Name each technique.", "model": "Step 1: filtration removes the sand (it stays on the filter paper). Step 2: distillation of the salt water (the filtrate): boil it, collect and condense the steam as pure water, and the salt stays behind in the flask. (Evaporating the water also recovers the salt, but not the water.)"}, {"k": "b", "prompt": "For each technique, name the physical property that makes it work.", "model": "Filtration uses state or particle size (undissolved solid versus liquid). Distillation uses different boiling points (water boils off, salt does not)."}, {"k": "c", "prompt": "Are your separation steps physical or chemical? Justify.", "model": "Physical. The sand, salt and water keep their identities; no new substances form and no bonds are broken."}, {"k": "d", "prompt": "Explain why separating water into hydrogen and oxygen requires a different type of method.", "model": "Water is a compound. Its H and O atoms are bonded together, so it can only be separated into elements by chemical methods (such as electrolysis, which uses an electric current) that break bonds and form new substances (H₂ and O₂)."}], "topic": "Separating mixtures"}, {"id": "F8", "type": "frq", "title": "FRQ 8: Water, three states and electrolysis", "stem": "Water can be a solid, a liquid or a gas, and it can also be split by an electric current.", "data": [], "parts": [{"k": "a", "prompt": "Describe the arrangement and motion of water molecules in ice, liquid water and steam.", "model": "Ice: molecules locked in rigid positions, close together (vibrating). Liquid: still close together but able to move around and slide past each other. Steam: far apart and moving randomly, hitting each other and the container walls."}, {"k": "b", "prompt": "Explain why melting and boiling are physical changes.", "model": "In all three states the H₂O molecules are still intact. Only the motion and distances between molecules change, so the substance is still water."}, {"k": "c", "prompt": "When an electric current is run through water, hydrogen and oxygen gases form. Classify this change and explain, naming the formulas of the particles before and after.", "model": "Chemical change (decomposition, called electrolysis). H₂O molecules are replaced by H₂ and O₂ molecules, which are different substances with different properties."}, {"k": "d", "prompt": "State how many molecules of H₂ form for each O₂ when two water molecules decompose.", "model": "Two H₂O make two H₂ and one O₂, so two H₂ molecules form for each O₂."}], "topic": "States of matter"}, {"id": "F9", "type": "frq", "title": "FRQ 9: Iron and sulfur (extra)", "stem": "A student mixes gray iron filings with yellow sulfur powder. A magnet held over the mixture pulls out the iron and leaves the yellow powder behind. The student then strongly heats a fresh sample of the mixture. It glows, and after cooling a dark solid remains. The magnet does not pick up this solid.", "data": [], "parts": [{"k": "a", "prompt": "Classify the iron and sulfur before heating and the dark solid after heating as element, compound or mixture.", "model": "Before heating: a mixture (of two elements). After heating: a compound (iron sulfide)."}, {"k": "b", "prompt": "Explain how the magnet observation supports your classification of the first sample.", "model": "Each substance in a mixture keeps its own properties. The iron is still magnetic and the sulfur is still yellow, so a physical method can pull them apart."}, {"k": "c", "prompt": "Classify heating as physical or chemical and give two pieces of evidence.", "model": "Chemical change. Evidence: glowing (light and heat given off) and a new dark solid with different properties from either starting material (it is not attracted to the magnet)."}, {"k": "d", "prompt": "Could you now separate the iron from the dark solid with the magnet? Explain what kind of process would be needed.", "model": "No. The iron is chemically combined, so it has lost its magnetic property. Separating a compound into its elements requires a chemical change, not a physical method."}], "topic": "Classifying matter"}, {"id": "F10", "type": "frq", "title": "FRQ 10: Heating a solid (extra)", "stem": "A student heats a solid sample steadily and records its temperature every 2 minutes.", "data": ["Time (min): 0, 2, 4, 6, 8, 10, 12, 14, 16", "Temperature (°C): -10, 0, 0, 0, 35, 70, 100, 100, 100"], "parts": [{"k": "a", "prompt": "State what state or states are present at 0 min, 4 min, 9 min and 15 min.", "model": "0 min: solid. 4 min: solid and liquid (melting). 9 min: liquid. 15 min: liquid and gas (boiling)."}, {"k": "b", "prompt": "Explain why the temperature stays constant from 2 to 6 minutes and from 12 to 16 minutes even though heat is still being added.", "model": "During a change of state the added energy goes into changing the arrangement and attractions between particles instead of raising the temperature. The first plateau is melting and the second is boiling."}, {"k": "c", "prompt": "Give the melting point and boiling point from the data and say whether they are physical or chemical properties.", "model": "Melting point 0 °C and boiling point 100 °C. Both are physical properties because they are measured without forming a new substance."}, {"k": "d", "prompt": "The data match water. Is water an element, compound or mixture? Does boiling it produce hydrogen and oxygen?", "model": "Water is a compound. Boiling does not produce hydrogen and oxygen; it is a physical change and the gas is still H₂O. Electrolysis would be needed to split it."}], "topic": "States of matter"}, {"id": "F11", "type": "frq", "title": "FRQ 11: Copper properties (extra)", "stem": "A copper sample is reddish-brown and shiny. It can be hammered into a thin sheet, conducts electricity, melts at 1085 °C and has a density of 8.96 g/cm³. A copper roof left outside for many years slowly turns green.", "data": [], "parts": [{"k": "a", "prompt": "List three physical properties of copper from the description.", "model": "Any three: reddish-brown color, shiny, can be hammered into sheets, conducts electricity, melting point 1085 °C, density 8.96 g/cm³."}, {"k": "b", "prompt": "Classify the change that turns the roof green and name the chemical property involved.", "model": "Chemical change. Copper reacts with substances in the air to form a new green compound. The chemical property is copper's ability to react with substances in the air (corrode)."}, {"k": "c", "prompt": "A small piece and a large piece of copper are compared. Which property would be the same and which would be different, and what are these called?", "model": "The density would be the same (an intensive property that does not depend on the amount). The mass and volume would differ (extensive properties that depend on the amount)."}, {"k": "d", "prompt": "The student cuts the copper sheet in half. Classify this and justify.", "model": "Physical change. Only the size changes; each half is still copper with the same composition and properties."}], "topic": "Properties"}, {"id": "F12", "type": "frq", "title": "FRQ 12: Baking a cake (extra)", "stem": "A baker stirs flour, sugar, eggs and baking powder with milk to make a batter, melts butter in a pan, and then bakes the batter in an oven. The cake rises and turns golden brown.", "data": [], "parts": [{"k": "a", "prompt": "Classify the batter as element, compound or mixture and justify.", "model": "Mixture. The ingredients are mixed together without being chemically combined and each keeps its own properties."}, {"k": "b", "prompt": "Classify melting the butter and justify.", "model": "Physical change. Solid butter becomes liquid butter, a change of state; it is still butter and can solidify again."}, {"k": "c", "prompt": "Classify baking and give two pieces of evidence from the description.", "model": "Chemical change. Evidence: the cake rises (gas is produced) and the color changes to golden brown."}, {"k": "d", "prompt": "Can the baker get the flour back out of the finished cake? Explain.", "model": "No. Baking formed new substances, so the original ingredients cannot be recovered by physical means."}], "topic": "Physical vs chemical change"}, {"id": "F13", "type": "frq", "title": "FRQ 13: Separating seawater (extra)", "stem": "A sample of seawater contains water, dissolved salt, and some sand and bits of seaweed.", "data": [], "parts": [{"k": "a", "prompt": "Classify the sample and identify which parts make it heterogeneous.", "model": "It is a mixture. The sand and seaweed make it heterogeneous (visible, uneven); the dissolved salt in water is homogeneous."}, {"k": "b", "prompt": "Name a method to remove the sand and seaweed and explain why it works.", "model": "Filtration. The sand and seaweed are solid particles too large to pass through the filter paper, but the water with dissolved salt passes through."}, {"k": "c", "prompt": "Describe how to collect pure water and salt from the filtered liquid.", "model": "Distillation: heat the liquid so the water boils, cool the vapor in a condenser and collect the liquid water. The salt stays behind in the flask. Evaporating the water would also leave the salt but would not collect the water."}, {"k": "d", "prompt": "Explain why all of these are physical changes and whether the water and the salt keep their identities.", "model": "Each method only separates the substances using differences in physical properties (particle size, boiling point). No new substances form, and the water is still H₂O and the salt is still NaCl."}], "topic": "Separating mixtures"}, {"id": "F14", "type": "frq", "title": "FRQ 14: Nail and peroxide (extra)", "stem": "A student carefully pours hydrogen peroxide over an iron nail in a large beaker. Bubbles form on the surface of the nail, the beaker feels warm, and the liquid and nail slowly turn orange-brown. After the nail is rinsed and dried overnight it is covered with a flaky orange-brown solid.", "data": [], "parts": [{"k": "a", "prompt": "List three observations that indicate a chemical change.", "model": "Bubbles forming (gas given off), the beaker feeling warm (temperature change), and the color change to orange-brown."}, {"k": "b", "prompt": "The dried nail is covered in a flaky orange-brown solid. What does this solid show about the iron?", "model": "It is a new substance (rust, iron oxide) with different properties from the gray, shiny iron. Iron combined with oxygen, so the iron underwent a chemical change."}, {"k": "c", "prompt": "Classify the change as physical or chemical and justify it using the idea of new substances.", "model": "Chemical change. New substances formed: a gas and a new solid with different properties from the nail and the peroxide."}, {"k": "d", "prompt": "Before the experiment, name two physical properties of the nail and one chemical property that this experiment shows.", "model": "Physical properties: gray color, shiny luster, hard, solid, magnetic. Chemical property: iron can react (rust) with oxygen, or with peroxide, to form a new substance."}], "topic": "Evidence of change"}, {"id": "F15", "type": "frq", "title": "FRQ 15: Milk, juice and salt water", "stem": "A student has three clear glasses. One has salt water, one has milk, and one has orange juice with pulp that has stood on the counter for an hour. The student shines a flashlight beam through each glass.", "data": [], "parts": [{"k": "a", "prompt": "Classify each glass as a solution, a colloid or a suspension.", "model": "Salt water: a solution. Milk: a colloid. Orange juice with pulp: a suspension."}, {"k": "b", "prompt": "Predict what the student sees when the beam passes through each glass, and name the effect.", "model": "The beam is not visible in the salt water. It is visible in the milk because the colloid particles scatter the light (the Tyndall effect). The orange juice is cloudy and also shows the beam, but the pulp has settled to the bottom."}, {"k": "c", "prompt": "What happens to each glass if it is left standing for a day?", "model": "Salt water: stays the same. Milk: stays mixed, since a colloid is stable and does not settle. Orange juice: more pulp settles at the bottom, because a suspension settles on standing."}, {"k": "d", "prompt": "Milk is a liquid dispersed in a liquid. Give the colloid name and the dispersed phase and dispersion medium.", "model": "Milk is an emulsion. The dispersed phase is the fat droplets, which are present in the smaller quantity. The dispersion medium is the water-based liquid, present in the larger quantity."}], "topic": "Colloids"}, {"id": "F16", "type": "frq", "title": "FRQ 16: Classifying colloids", "stem": "A chef makes the following: a bowl of whipped cream, a cup of paint, a block of gelatin dessert, a can of whipped topping sprayed as a mist, and a loaf of pumice-textured sponge cake with gas pockets trapped in the solid.", "data": [], "parts": [{"k": "a", "prompt": "Give the structure of each (what is dispersed in what).", "model": "Whipped cream: gas in a liquid. Paint: solid in a liquid. Gelatin dessert: liquid in a solid. Spray mist: liquid in a gas. Sponge cake: gas in a solid."}, {"k": "b", "prompt": "Give the colloid name for each.", "model": "Whipped cream: foam. Paint: sol. Gelatin dessert: gel. Spray mist: aerosol. Sponge cake: solid sol."}, {"k": "c", "prompt": "Which two names on the review sheet are used for more than one structure, and what is the other structure for each?", "model": "Aerosol is used for solid in a gas (smoke) as well as liquid in a gas (fog). Solid sol is used for solid in a solid (colored glass) as well as gas in a solid (pumice stone)."}, {"k": "d", "prompt": "Describe two properties that show paint is a colloid and not a suspension.", "model": "Its particles are about 1 to 1000 nm and stay mixed without settling, and they scatter a beam of light (the Tyndall effect). They also move in a random zigzag path (Brownian movement)."}], "topic": "Colloids"}]}, {"name": "True/False", "kind": "tf", "mode": "practice", "questions": [{"id": "T1", "type": "tf", "topic": "Classifying matter", "stem": "Matter is anything that takes up space and has mass.", "ans": true, "exp": "By definition, matter has both mass and volume."}, {"id": "T2", "type": "tf", "topic": "States of matter", "stem": "A gas has a fixed volume but no fixed shape.", "ans": false, "exp": "A gas has neither a fixed volume nor a fixed shape: it takes the shape and volume of its container. A liquid is the state with a fixed volume but no fixed shape."}, {"id": "T3", "type": "tf", "topic": "States of matter", "stem": "In steam, the water molecules are still H₂O molecules.", "ans": true, "exp": "Changes of state do not break the molecules apart; only motion and spacing change."}, {"id": "T4", "type": "tf", "topic": "Physical vs chemical change", "stem": "Melting an ice cube is a chemical change because the state changes.", "ans": false, "exp": "Changes of state are physical changes. The substance is still water."}, {"id": "T5", "type": "tf", "topic": "Properties", "stem": "Density is an intensive property.", "ans": true, "exp": "The density of a pure substance does not depend on how much of it you have."}, {"id": "T6", "type": "tf", "topic": "Properties", "stem": "Cutting a block of copper in half changes its density.", "ans": false, "exp": "Density is intensive. Mass and volume both halve, so the ratio stays the same."}, {"id": "T7", "type": "tf", "topic": "Properties", "stem": "Mass and volume are extensive properties.", "ans": true, "exp": "They depend on the amount of matter present."}, {"id": "T8", "type": "tf", "topic": "Classifying matter", "stem": "Every pure substance is an element.", "ans": false, "exp": "Pure substances are either elements or compounds."}, {"id": "T9", "type": "tf", "topic": "Separating mixtures", "stem": "A compound can be separated into its elements by filtering.", "ans": false, "exp": "Compounds require chemical methods (breaking bonds), such as electrolysis. Filtering is a physical method."}, {"id": "T10", "type": "tf", "topic": "Classifying matter", "stem": "Salt dissolved in water is a homogeneous mixture, also called a solution.", "ans": true, "exp": "It is the same throughout, with visibly indistinguishable parts."}, {"id": "T11", "type": "tf", "topic": "Classifying matter", "stem": "A mixture has variable composition.", "ans": true, "exp": "The amounts of its components can vary, unlike a pure substance."}, {"id": "T12", "type": "tf", "topic": "Separating mixtures", "stem": "Distillation separates substances using differences in boiling point.", "ans": true, "exp": "The component with the lower boiling point vaporizes first and is condensed and collected."}, {"id": "T13", "type": "tf", "topic": "Separating mixtures", "stem": "Filtration can separate dissolved salt from water.", "ans": false, "exp": "Dissolved particles pass through filter paper. Filtration separates undissolved solids from liquids."}, {"id": "T14", "type": "tf", "topic": "Physical vs chemical change", "stem": "Burning wood is a chemical change.", "ans": true, "exp": "New substances (ash and gases such as carbon dioxide and water vapor) form."}, {"id": "T15", "type": "tf", "topic": "Physical vs chemical change", "stem": "Dissolving sugar in water is a chemical change.", "ans": false, "exp": "The sugar is still sugar. The change is physical and the result is a solution."}, {"id": "T16", "type": "tf", "topic": "Classifying matter", "stem": "The formula Br₂ represents a compound because it has a subscript.", "ans": false, "exp": "Br₂ has only one type of atom, so it is an element. A subscript only counts atoms."}, {"id": "X1", "type": "tf", "topic": "Colloids", "stem": "On the review sheet, a foam is a colloid made of a gas dispersed in a liquid.", "ans": true, "exp": "Whipped cream is the example: gas bubbles spread through a liquid."}, {"id": "X2", "type": "tf", "topic": "States of matter", "stem": "At 0 K the particles of a substance have the maximum possible motion.", "ans": fal
