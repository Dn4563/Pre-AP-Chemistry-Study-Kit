le displacement","No two compounds swap."]],"exp":"One substance breaking into two or more is decomposition."},{"q":"Which example from your cards is a decomposition?","right":"Electrolysis of water","wrong":[["Rusting of iron, because the iron slowly falls apart into flakes of rust","Rusting combines iron and oxygen."],["Melting ice","Melting is physical."],["Filtering sand","Filtering is a physical separation."]],"exp":"Electrolysis breaks water into hydrogen and oxygen."}]},{"term":"Single displacement","def":"An element is \"pushed out\" of a compound by another element.","hook":"Single = one element swaps.","asks":[{"q":"Zinc is placed in a copper compound and pushes the copper out, taking its place. Which type of reaction is this?","right":"Single displacement","wrong":[["Double displacement, since zinc and copper both end up in a different place","Only one element pushes another out of one compound."],["Synthesis","Nothing simply combines."],["Decomposition","Nothing simply breaks apart."]],"exp":"One element pushing another out of a compound is single displacement."},{"q":"How does single displacement differ from double displacement?","right":"One element replaces another","wrong":[["Two compounds trade their positive elements with each other at the same time","That is double displacement."],["Two substances combine","That is synthesis."],["One substance breaks apart","That is decomposition."]],"exp":"Single: one element is pushed out of a compound. Double: the positive elements of two compounds switch."}]},{"term":"Double displacement","def":"The positive elements switch places in two compounds.","hook":"Double = two partners swap.","asks":[{"q":"AB + CD → AD + CB. Which type of reaction is this?","right":"Double displacement","wrong":[["Single displacement, because one element pushes another out of the compound","Here both compounds swap partners."],["Synthesis","Nothing simply combines."],["Decomposition","Nothing simply breaks apart."]],"exp":"The positive elements switch places between the two compounds."},{"q":"Two salt solutions are mixed, the partners swap, and a precipitate forms. Which reaction type best fits?","right":"Double displacement","wrong":[["Decomposition, because the solid falls out of the solution as it breaks apart","Partners swapping is double displacement."],["Synthesis","Partners swapping isn't synthesis."],["Single displacement","Both compounds swap partners."]],"exp":"When the positive elements of two compounds switch places, it's double displacement."}]}],"intro":["Chemical changes come in patterns. Synthesis builds something up from parts, decomposition breaks something down, single displacement has one element push another out, and double displacement has two compounds swap partners."]}],"intro":["How do you describe a substance, and how can you tell when it has turned into something new? This deck sorts properties into physical and chemical, and changes into physical (same stuff) and chemical (new stuff), with the signs that give a chemical change away."]},{"id":3,"name":"Elements, Compounds and Mixtures","optional":false,"sections":[{"name":"Pure substances and mixtures","cards":[{"term":"Element","def":"A substance that cannot be broken down into other substances by chemical methods. Examples: Fe, Al, O₂, H₂, Au.","hook":"Element = one type of atom.","asks":[{"q":"A sample can't be broken into anything simpler, even by electrolysis or heating. What is it?","right":"An element","wrong":[["A compound, since compounds always stay together no matter what you do","Compounds can be broken down chemically."],["A mixture","Mixtures separate by physical means."],["A solution","A solution is a mixture."]],"exp":"An element can't be broken down into other substances by chemical methods."},{"q":"Which of these is an element?","right":"O₂","wrong":[["H₂O, because it is made of hydrogen and oxygen joined together","Two types of atoms make it a compound."],["CO₂","Two types of atoms: a compound."],["NaCl & H₂O","The & makes it a mixture."]],"exp":"O₂ has only one type of atom (one capital letter), so it is an element."}]},{"term":"Compound","def":"A substance made of a given combination of elements (two or more types of atoms) that can be broken down into those elements by chemical methods. It always has the same composition. Examples: H₂O, CO₂, C₁₂H₂₂O₁₁.","hook":"Compound = a fixed recipe.","asks":[{"q":"Electrolysis breaks a pure liquid into two different gases. What was the liquid?","right":"A compound","wrong":[["An element, because it was pure and had only one substance in it at the start","Elements can't be broken down chemically."],["A mixture","It was pure."],["A colloid","A colloid is a mixture."]],"exp":"A compound can be broken into its elements by chemical methods."},{"q":"Why is water always H₂O, whether it comes from a lake or a lab?","right":"A compound always has the same composition","wrong":[["Water is a mixture, and all mixtures keep the same recipe wherever they are","Mixtures have variable composition."],["Water is an element","It has two types of atoms."],["Only lab water is H₂O","All water is H₂O."]],"exp":"A compound has a fixed combination of elements."}]},{"term":"Pure substance","def":"Matter that always has the same composition. It is either an element or a compound.","hook":"Pure means element or compound.","asks":[{"q":"Which list contains only pure substances?","right":"Gold, water, carbon dioxide","wrong":[["Air, salt water and gold, since each of them looks the same throughout","Air and salt water are mixtures."],["Wood, wine, coffee","All three are mixtures."],["Soil, sand, water","Soil is a mixture."]],"exp":"A pure substance is an element or a compound: it always has the same composition."},{"q":"A sample always has exactly the same makeup, but electrolysis can split it. What is it?","right":"A compound, one kind of pure substance","wrong":[["A mixture, because anything that can be split up must be a mixture","Mixtures split by physical means; this needed chemical means."],["An element","Elements can't be split chemically."],["A solution","Solutions are mixtures."]],"exp":"A pure substance is either an element or a compound; one that splits chemically is a compound."}]},{"term":"Mixture","def":"Matter with variable composition, made of two or more pure substances that can be separated by physical means. Examples: wood, wine, coffee.","hook":"Mixture = no fixed recipe.","asks":[{"q":"Two cups of coffee from the same pot taste different: one has more sugar. What does this show?","right":"Coffee is a mixture","wrong":[["Coffee is a compound, since every cup is made from the same coffee beans","A compound's composition never varies."],["Coffee is an element","It has many substances in it."],["Coffee is a pure substance","Its makeup varies."]],"exp":"A mixture has variable composition."},{"q":"How can you tell a mixture from a compound when separating it?","right":"A mixture separates by physical means","wrong":[["A mixture needs electricity or another chemical method to be broken into its parts","That describes a compound."],["A mixture can't be separated","Mixtures can be separated."],["Only a compound can be separated","Mixtures can be, too."]],"exp":"Mixtures separate physically; compounds need chemical methods."}]}],"intro":["A pure substance always has the same makeup. It's either an element (one type of atom, can't be broken down chemically) or a compound (elements bonded in a fixed recipe, can be broken down chemically). A mixture has no fixed recipe and can be separated physically."]},{"name":"Types of mixtures","cards":[{"term":"Homogeneous mixture","def":"A blend that is the same throughout, with parts you can't tell apart by looking. Examples: air, brass, table salt stirred into water, gasoline.","hook":"Homo = same.","asks":[{"q":"Brass looks the same all the way through, but it's made of copper and zinc. What is it?","right":"A homogeneous mixture","wrong":[["A heterogeneous mixture, because it is made of two different metals","You can't see separate parts in brass."],["A compound","Brass is a mixture of two metals."],["An element","It has two metals."]],"exp":"A homogeneous mixture is the same throughout."},{"q":"Salt is stirred into water until it disappears. What do you have?","right":"A homogeneous mixture","wrong":[["A heterogeneous mixture, because two different substances were put together","It looks the same throughout."],["A compound","Salt and water aren't bonded together."],["A pure substance","It contains two substances."]],"exp":"Table salt stirred into water is a homogeneous mixture (a solution)."}]},{"term":"Heterogeneous mixture","def":"A blend with parts you can see and regions that have different properties. Examples: oil-and-vinegar dressing, sand stirred into water, a jar of jelly beans, soil.","hook":"Hetero = different.","asks":[{"q":"In oil-and-vinegar dressing you can see two layers. What is it?","right":"A heterogeneous mixture","wrong":[["A homogeneous mixture, because it is all poured from a single bottle","Visible layers mean heterogeneous."],["A compound","Oil and vinegar aren't bonded."],["A pure substance","It has two substances."]],"exp":"A heterogeneous mixture has visibly different parts."},{"q":"Which of these is heterogeneous?","right":"Soil","wrong":[["Air, because it is made of many gases mixed together","Air is homogeneous."],["Brass","Brass is homogeneous."],["Gasoline","Gasoline is homogeneous."]],"exp":"Soil has visibly different parts."}]},{"term":"Solution","def":"Another name for a homogeneous mixture.","hook":"Solution = uniform mixture.","asks":[{"q":"Which word could replace \"homogeneous mixture\" in a sentence?","right":"Solution","wrong":[["Suspension, since both words describe something mixed into a liquid","A suspension is heterogeneous."],["Compound","A compound is a pure substance."],["Colloid","A colloid is heterogeneous."]],"exp":"A solution is another name for a homogeneous mixture."},{"q":"Is air a solution?","right":"Yes; it is homogeneous","wrong":[["No, because a solution must always be a liquid like salt water","A solution is any homogeneous mixture."],["No; air is a compound","Air is a mixture."],["No; air is heterogeneous","Your card lists air as homogeneous."]],"exp":"Air is a homogeneous mixture, so it is a solution."}]}],"intro":["Mixtures are either homogeneous (the same throughout, like salt water or air) or heterogeneous (you can see different parts, like soil or sand in water). A solution is just another name for a homogeneous mixture."]},{"name":"Reading formulas","cards":[{"term":"Subscript","def":"A small number in a formula showing how many atoms of that type are in one molecule. H₂O has 2 H and 1 O. C₁₂H₂₂O₁₁ has 45 atoms.","hook":"Subscript counts atoms.","asks":[{"q":"How many hydrogen atoms are in one molecule of H₂SO₄?","right":"2","wrong":[["4, because the 4 is the biggest number written in the formula","The 4 belongs to O."],["1","The 2 after H means two."],["7","That's the total of all atoms."]],"exp":"A subscript counts the atoms of the element just before it."},{"q":"How many atoms in total are in one molecule of CO₂?","right":"3","wrong":[["2, because the 2 at the end of the formula is the total number","The 2 only counts oxygen."],["1","There's one C and two O."],["4","C plus two O makes 3."]],"exp":"One carbon plus two oxygen = 3 atoms."}]},{"term":"The & symbol","def":"In a formula code, & separates different substances that are just sitting together, so it signals a MIXTURE (for example NaCl & H₂O).","hook":"& means mixture.","asks":[{"q":"A formula code reads \"Cu & Zn.\" What does it describe?","right":"A mixture","wrong":[["A compound, because two different elements are written in the same code","The & means the two are just sitting together."],["An element","There are two kinds of atoms."],["A single molecule","& separates different substances."]],"exp":"& separates substances that are just sitting together, so it signals a mixture."},{"q":"How do NaCl and \"NaCl & H₂O\" differ?","right":"One is a compound; the other is a mixture","wrong":[["Both are compounds, because both of them contain sodium chloride","The & makes the second a mixture."],["Both are mixtures","NaCl alone is a compound."],["Both are elements","NaCl has two types of atoms."]],"exp":"NaCl alone is a compound; with & H₂O it's a mixture."}]},{"term":"Element formula clue","def":"One capital letter (one type of atom), such as Br₂, Al, P₄, O₃. A subscript alone does not make something a compound.","hook":"One capital letter = element.","asks":[{"q":"Which formula is an element?","right":"P₄","wrong":[["NaHCO₃, because it has more than one kind of atom bonded in it","Several capitals make it a compound."],["CO₂","Two capitals: a compound."],["Cu & Zn","The & makes it a mixture."]],"exp":"One capital letter means one type of atom: an element."},{"q":"A student says O₃ is a compound because it has a subscript. What's the best reply?","right":"One capital letter means it's an element","wrong":[["He's right, since any formula with a subscript has to be a compound","A subscript alone doesn't make a compound."],["It's a mixture","There's no &."],["It's a compound because it has 3 atoms","All three are oxygen."]],"exp":"O₃ has one type of atom, so it is an element; a subscript alone doesn't make a compound."}]},{"term":"Compound formula clue","def":"Two or more capital letters (different atoms) bonded in one formula with no &, such as CO₂, NaHCO₃, H₂SO₄.","hook":"Two or more capitals, no & = compound.","asks":[{"q":"Which formula is a compound?","right":"H₂SO₄","wrong":[["Br₂, because it has two atoms bonded together in the same molecule","One type of atom means element."],["Al","One capital: an element."],["C₆H₁₂O₆ & H₂O","The & makes it a mixture."]],"exp":"Two or more capital letters bonded with no & means compound."},{"q":"NaHCO₃ has how many types of atoms, and what is it?","right":"4 types; a compound","wrong":[["1 type; an element, because it is written as a single formula","Na, H, C and O are four types."],["2 types; a mixture","There's no &."],["4 types; a mixture","No & means compound."]],"exp":"Na, H, C and O are bonded in one formula with no &: a compound."}]},{"term":"Mixture formula clue","def":"A code with & between substances, such as C₆H₁₂O₆ & H₂O or Cu & Zn.","hook":"Look for & first.","asks":[{"q":"Which formula code is a mixture?","right":"C₆H₁₂O₆ & H₂O","wrong":[["C₁₂H₂₂O₁₁, because it has so many different atoms in a single formula","No & means compound."],["H₂SO₄","A compound."],["O₃","An element."]],"exp":"The & between substances signals a mixture."},{"q":"What should you look for first to sort a formula code into element, compound or mixture?","right":"An & symbol","wrong":[["The size of the subscripts, since large numbers usually mean a compound","Subscripts don't decide the category."],["The total number of atoms","That doesn't decide it."],["Whether it has a subscript","A subscript alone doesn't decide it."]],"exp":"Look for & first: it means mixture. Then count capital letters."}]}],"intro":["Formulas let you sort a substance without seeing it. Subscripts count atoms. An & means separate substances sitting together: a mixture. With no &, count the capital letters: one type means an element, two or more means a compound."]},{"name":"Particles versus bulk samples","cards":[{"term":"Atom","def":"A single particle of an element. Several of these can bond together into molecules.","hook":"Atom = one particle.","asks":[{"q":"A drawing shows a single unbonded circle labeled Ne. What is it?","right":"An atom","wrong":[["A molecule, because every particle in a drawing counts as a molecule","A molecule is two or more bonded atoms."],["A compound","A compound has two or more types of atoms."],["A mixture","One particle isn't a mixture."]],"exp":"An atom is a single particle of an element."},{"q":"Two oxygen atoms bond together. What do they form?","right":"A molecule","wrong":[["A compound, because two atoms are now bonded together into one particle","Both atoms are oxygen, so it's an element."],["A mixture","They are bonded."],["A single atom","It's two bonded atoms."]],"exp":"Atoms can be bonded together into molecules; O₂ is a molecule of an element."}]},{"term":"Molecule","def":"Two or more atoms held together by chemical bonds. It can contain one type of atom (Br₂) or several (H₂O).","hook":"Molecule = bonded atoms.","asks":[{"q":"Which is a molecule but NOT a compound?","right":"Br₂","wrong":[["H₂O, because it has fewer atoms than most of the compounds on your card","H₂O has two types of atoms: a compound."],["CO₂","Two types: a compound."],["Ne","A single atom isn't a molecule."]],"exp":"Br₂ is two bonded atoms of one element: a molecule, but an element."},{"q":"What do all molecules have in common?","right":"Two or more atoms bonded together","wrong":[["Two or more different types of atoms, like hydrogen and oxygen in water","Br₂ is a molecule with one type."],["Only one atom","A molecule has two or more."],["They are always mixtures","A molecule is bonded."]],"exp":"A molecule is two or more atoms held together by bonds, of one type or several."}]},{"term":"Particle","def":"Any individual atom or molecule in a drawing. A single atom counts as one, and so does a molecule.","hook":"Count each separate piece.","asks":[{"q":"A drawing shows 3 single He atoms and 2 O₂ molecules. How many particles are there?","right":"5","wrong":[["7, because each O₂ is two atoms and every atom counts as its own particle","Each molecule counts as one particle."],["3","The molecules are particles too."],["2","The atoms are particles too."]],"exp":"Each separate atom or molecule is one particle: 3 + 2 = 5."},{"q":"Is a single H₂O molecule in a drawing a particle?","right":"Yes; any separate atom or molecule is","wrong":[["No, because only single atoms count as particles in a drawing","Molecules count too."],["No; only elements are particles","Compounds' molecules count too."],["Only if it is a gas","State doesn't matter."]],"exp":"A particle is any individual atom or molecule."}]},{"term":"Bulk terms versus particle terms","def":"Element, compound and mixture describe bulk samples. Atom and molecule describe particles. Atom does NOT equal element and molecule does NOT equal compound (Br₂ is a molecule but an element).","hook":"Bulk = E/C/M. Particles = atom/molecule.","asks":[{"q":"Which word describes a whole sample, not a single particle?","right":"Mixture","wrong":[["Molecule, since a molecule is made of many atoms put together","Molecule is a particle term."],["Atom","Atom is a particle term."],["Particle","That's a particle term."]],"exp":"Element, compound and mixture describe bulk samples; atom and molecule describe particles."},{"q":"A jar of pure nitrogen gas (N₂) is described as \"a compound because it has molecules.\" What's wrong?","right":"Molecule doesn't mean compound","wrong":[["Nothing, because any substance made of molecules is a compound","N₂ is a molecule of an element."],["It should say mixture","It's pure."],["N₂ has no molecules","N₂ is a molecule."]],"exp":"Molecule does NOT equal compound: N₂ molecules have one type of atom, so the sample is an element."}]}],"intro":["Atom and molecule describe single particles in a drawing. Element, compound and mixture describe whole samples. The trap: a molecule is not always a compound. Br₂ is a molecule, but it has only one type of atom, so it's an element."]},{"name":"Solutions and suspensions","cards":[{"term":"Solvent","def":"The part of a solution that does the dissolving (example: water). A solution is a mixture of two or more substances.","hook":"Solvent dissolves.","asks":[{"q":"In salt water, which part is the solvent?","right":"The water","wrong":[["The salt, because it is the part that dissolves and spreads out","Salt is the solute."],["Both equally","The water does the dissolving."],["Neither","Water is the solvent."]],"exp":"The solvent does the dissolving."},{"q":"Sugar dissolves in tea. What is doing the dissolving?","right":"The water in the tea","wrong":[["The sugar, because sugar crystals break down the tea leaves as they dissolve","Sugar is what gets dissolved."],["The cup","The cup isn't part of the solution."],["The spoon","Stirring helps, but water is the solvent."]],"exp":"Water is the solvent: it does the dissolving."}]},{"term":"Solute","def":"The part of a homogeneous mixture that gets dissolved (example: sugar).","hook":"Solute is dissolved.","asks":[{"q":"In lemonade, which ingredient is a solute?","right":"Sugar","wrong":[["Water, because it is the part that you can see and pour out of the glass","Water is the solvent."],["The glass","The glass isn't part of the solution."],["Ice cubes","Ice isn't dissolved."]],"exp":"The solute is the part that is dissolved."},{"q":"Which is the solute in salt water?","right":"Salt","wrong":[["Water, since it is the larger part of the mixture in the glass","Water is the solvent."],["Both","Only the salt is dissolved."],["Neither","Salt is the solute."]],"exp":"The solute is the dissolved part; the solvent is the part that dissolves it."}]},{"term":"Suspension","def":"A heterogeneous mixture that settles upon standing. Examples: mud, juice with pulp, oil and water.","hook":"Suspension = settles.","asks":[{"q":"Muddy water is left to stand and the dirt sinks to the bottom. What kind of mixture is it?","right":"A suspension","wrong":[["A solution, since the dirt was mixed evenly into the water at first","Solutions don't settle."],["A colloid","Colloids don't settle."],["A compound","Mud and water aren't bonded."]],"exp":"A suspension is a heterogeneous mixture that settles on standing."},{"q":"How do a suspension and a colloid differ?","right":"A suspension settles; a colloid doesn't","wrong":[["A colloid settles to the bottom over time but a suspension stays mixed","It's the reverse."],["A suspension is homogeneous","Both are heterogeneous."],["They are the same","Only one settles."]],"exp":"A suspension settles on standing; colloids are stable."}]}],"intro":["In a solution, the solvent does the dissolving and the solute gets dissolved (water and sugar). A suspension is different: it's a heterogeneous mixture whose pieces settle to the bottom if it sits, like mud in water."]},{"name":"Mixture examples from the review sheet","cards":[{"term":"Homogeneous examples","def":"Salt water, lemonade, tea, coffee, 18K gold, air, steel, rain water.","hook":"Same throughout.","asks":[{"q":"Which item from the review sheet is homogeneous?","right":"Tea","wrong":[["A chocolate chip cookie, because it's all baked together into a single piece","You can see the chips."],["Pizza","You can see the toppings."],["Salad","You can see the parts."]],"exp":"Tea is the same throughout."},{"q":"18K gold and steel are on the same list. Why?","right":"Both are homogeneous mixtures","wrong":[["Both are pure elements, since metals are always made of only one type of atom","Both are mixtures of metals."],["Both are heterogeneous","They're the same throughout."],["Both are compounds","They're mixtures."]],"exp":"18K gold and steel are homogeneous mixtures."}]},{"term":"Heterogeneous examples","def":"Coke float, sand in water, milk, chocolate chip cookies, pizza, salad.","hook":"You can see phases.","asks":[{"q":"Which pair from the review sheet are both heterogeneous?","right":"Pizza and sand in water","wrong":[["Rain water and lemonade, because both of them have more than one substance","Both are homogeneous."],["Air and steel","Both homogeneous."],["Coffee and tea","Both homogeneous."]],"exp":"Pizza and sand in water have visibly different parts."},{"q":"A coke float has ice cream floating in soda. Why is it heterogeneous?","right":"You can see different parts","wrong":[["It contains sugar, and anything with sugar in it counts as heterogeneous","Sugar water is homogeneous."],["It is cold","Temperature doesn't decide it."],["It is a liquid","Liquids can be homogeneous."]],"exp":"Heterogeneous mixtures have visibly distinguishable parts."}]}],"intro":["These are the review sheet's examples to sort. The question each time is the same: can you see different parts? If not, it's homogeneous; if you can, it's heterogeneous."]}],"intro":["All matter is either a pure substance or a mixture. This deck is about sorting samples into elements, compounds and mixtures, reading formulas to tell them apart, and keeping particle words (atom, molecule) separate from sample words (element, compound, mixture)."]},{"id":4,"name":"Separation of Mixtures","optional":false,"sections":[{"name":"Techniques","cards":[{"term":"Physical means","def":"Methods that separate a mixture without changing the identity of its parts. No bonds are broken.","hook":"Physical = separate, do not change.","asks":[{"q":"Which of these is NOT a physical means of separating a mixture?","right":"Electrolysis","wrong":[["Filtration through filter paper to catch an undissolved solid","Filtration is physical."],["Distillation","Distillation is physical."],["Using a magnet","A magnet is physical."]],"exp":"Electrolysis breaks bonds, so it's a chemical method."},{"q":"After a mixture is separated by physical means, what is true of its parts?","right":"Each part is the same substance as before","wrong":[["Each part has turned into a new substance with new properties of its own","Physical means don't change identity."],["The parts have reacted together","No reaction happens."],["Their bonds have broken","No bonds are broken."]],"exp":"Physical means separate a mixture without changing the identity of its parts."}]},{"term":"Distillation","def":"Separates substances using differences in boiling point: boil, then condense the vapor. Salt water gives pure water, and the salt stays in the flask.","hook":"Distill = boiling point.","asks":[{"q":"A mixture of two liquids with different boiling points needs to be separated. Which method fits best?","right":"Distillation","wrong":[["Filtration, since the filter paper will catch whichever liquid is thicker","Both are liquids; filtration separates solids from liquids."],["Magnetism","Liquids aren't picked up by magnets here."],["Picking pieces out","You can't pick out a liquid."]],"exp":"Distillation separates substances by boiling point."},{"q":"In distillation, after the liquid boils, what happens to the vapor?","right":"It is cooled and condensed","wrong":[["It is burned off so that only the substance with a high boiling point is left","The vapor is collected, not burned."],["It is filtered","It's condensed."],["It is frozen","It's condensed into a liquid."]],"exp":"Distillation boils, then condenses the vapor."}]},{"term":"Filtration","def":"Separates a liquid from an undissolved solid using filter paper (state of matter). Dissolved salt or sugar passes through the filter.","hook":"Filter = solid versus liquid.","asks":[{"q":"Sand is stirred into water. Which method separates them most simply?","right":"Filtration","wrong":[["Distillation, because the water has a much lower boiling point than sand does","That works but filtration is simpler for an undissolved solid."],["Chromatography","That's for parts that stick differently."],["A magnet","Sand isn't magnetic."]],"exp":"Filtration separates an undissolved solid from a liquid."},{"q":"Salt water is poured through filter paper. What comes out the other side?","right":"Salt water","wrong":[["Pure water, because the salt is caught by the tiny holes in the paper","Dissolved salt passes through."],["Pure salt","The salt is dissolved in the water."],["Nothing","The liquid passes through."]],"exp":"Dissolved salt or sugar passes through a filter."}]},{"term":"Chromatography","def":"Separates substances by how strongly they adhere to a surface: a mobile phase carries the parts of the mixture across a fixed phase, and each part travels a different distance.","hook":"Chromatography = sticks to a surface.","asks":[{"q":"A black marker's ink is separated into blue, red and yellow bands on paper. Which method was used?","right":"Chromatography","wrong":[["Distillation, because the colors boiled away from the paper at different times","No boiling is involved."],["Filtration","Filtration separates solids from liquids."],["Magnetism","Ink isn't magnetic."]],"exp":"Chromatography separates parts by how strongly they stick to a surface."},{"q":"In chromatography, why do the parts end up at different distances?","right":"They stick to the surface by different amounts","wrong":[["They have different boiling points, so some of them evaporate along the way","That's distillation's idea."],["Some are magnetic","That's magnetism."],["Some are bigger chunks","That's filtration's idea."]],"exp":"Each part adheres differently, so the mobile phase carries each a different distance."}]},{"term":"Evaporation","def":"Separates substances using volatility: the volatile component leaves as a vapor and the other stays behind.","hook":"Evaporate = volatility.","asks":[{"q":"Salt water is left in an open dish until only salt crystals remain. Which method is this?","right":"Evaporation","wrong":[["Filtration, because the salt was trapped and the water passed through","There's no filter."],["Chromatography","No paper or mobile phase."],["Distillation","In distillation the vapor is collected; here it just leaves."]],"exp":"Evaporation separates by volatility: the volatile water leaves and the salt stays."},{"q":"What property does evaporation use to separate a mixture?","right":"Volatility","wrong":[["Magnetism, because some of the particles are pulled away from the others","That's the magnet method."],["Particle size","That's filtration's idea."],["How strongly parts stick to paper","That's chromatography."]],"exp":"Evaporation uses volatility: the volatile part leaves as vapor."}]}],"intro":["Each technique uses one difference. Distillation uses boiling point, filtration uses whether something is a solid or a liquid, chromatography uses how strongly each part sticks to a surface, and evaporation uses which part leaves as a vapor. None of them break bonds."]},{"name":"Mixtures versus compounds","cards":[{"term":"Separating mixtures","def":"Blends with no fixed recipe come apart by physical methods into pure substances (elements and/or compounds).","hook":"Mixture = physical.","asks":[{"q":"Which pair of products could come out of separating a mixture physically?","right":"Pure water and salt","wrong":[["Hydrogen gas and oxygen gas, which come from water when it is separated","That needs a chemical method."],["Rust and iron","That's a chemical change."],["Ash and smoke","Those come from burning."]],"exp":"Mixtures separate physically into pure substances."},{"q":"A sample is separated by filtration into two parts. What was the sample?","right":"A mixture","wrong":[["A compound, since it came apart into two different substances in the end","Compounds need chemical methods."],["An element","Elements can't be separated."],["A single molecule","Filtration separates bulk parts."]],"exp":"Filtration is physical, so the sample was a mixture."}]},{"term":"Separating compounds","def":"Substances made of bonded elements need chemical methods (breaking bonds), such as electrolysis or decomposition, to be split into those elements.","hook":"Compound = chemical.","asks":[{"q":"Why can't you separate water into hydrogen and oxygen by filtering it?","right":"Water is a compound","wrong":[["Water is a mixture, but the hydrogen and oxygen are too small for filter paper","Water is a compound; its parts are bonded."],["Water has no hydrogen","It does."],["Filtering is chemical","Filtering is physical."]],"exp":"Compounds need chemical methods, such as electrolysis, to break their bonds."},{"q":"Which method can separate a compound into its elements?","right":"Electrolysis","wrong":[["Distillation, since it uses heat and heat breaks substances apart","Distillation is physical."],["Filtration","Physical."],["Chromatography","Physical."]],"exp":"Compounds need chemical methods like electrolysis or decomposition."}]},{"term":"Distillation of salt water","def":"A physical method: no chemical change occurs. A saltwater solution (a homogeneous mixture) becomes salt plus pure water.","hook":"Same salt, same water.","asks":[{"q":"After salt water is distilled, what is in the collecting flask, and what stays behind?","right":"Pure water collects; salt stays","wrong":[["Salt collects in the second flask and pure water stays in the first one","The water boils off; the salt stays."],["Hydrogen collects; oxygen stays","No chemical change happens."],["Nothing collects","Water condenses into the flask."]],"exp":"Distillation boils off the water and condenses it; the salt stays in the flask."},{"q":"Distilling salt water gives salt and water. What kind of change is it?","right":"Physical: same salt, same water","wrong":[["Chemical, because the salt water is broken down into two separate substances","Separating a mixture isn't a chemical change."],["Chemical: new substances formed","Salt and water were there all along."],["Neither","It's a physical change."]],"exp":"Distillation of salt water is a physical method; no chemical change occurs."}]}],"intro":["This is why the method matters. Mixtures come apart by physical methods. Compounds only come apart by chemical methods such as electrolysis, because their elements are bonded. Distilling salt water is physical: you get back the same salt and the same water."]},{"name":"Magnets and chromatography","cards":[{"term":"Magnetism","def":"A separation that works when some particles are magnetic and stick to a magnet (for example iron filings in sand). It is a physical method.","hook":"Magnet picks out the magnetic part.","asks":[{"q":"Iron filings are mixed into sand. What is the quickest way to separate them?","right":"A magnet","wrong":[["Distillation, because iron has a much higher boiling point than sand","There's no liquid to boil."],["Filtration","Both are solids."],["Chromatography","That's for parts carried by a liquid."]],"exp":"A magnet picks out the magnetic iron filings."},{"q":"Is pulling iron filings out of sand with a magnet a physical or chemical method?","right":"Physical","wrong":[["Chemical, because the magnet changes the iron into a different form","The iron is unchanged."],["Chemical, because the iron reacts","No reaction happens."],["Neither","It's physical."]],"exp":"Magnetism separates without changing the substances, so it's physical."}]},{"term":"Mobile phase","def":"In chromatography the mobile phase (such as water) moves the parts of the mixture across the paper. Example: separating ink into its colors with water and paper.","hook":"Mobile moves.","asks":[{"q":"In paper chromatography of ink, what is the mobile phase?","right":"The water moving up the paper","wrong":[["The paper, because the colors move along it as they separate","The paper stays put: fixed phase."],["The ink","The ink is the mixture."],["The beaker","The beaker holds things."]],"exp":"The mobile phase (such as water) carries the mixture's parts across the paper."},{"q":"What would happen in chromatography with no mobile phase?","right":"The parts wouldn't move","wrong":[["The parts would separate even faster because there is nothing to slow them","The mobile phase is what carries them."],["The paper would move","The paper is fixed."],["The ink would boil","Nothing boils here."]],"exp":"The mobile phase moves the parts; without it they stay put."}]},{"term":"Fixed phase","def":"In chromatography the fixed phase (such as paper) does not move. The parts of the mixture stick to it by different amounts.","hook":"Fixed stays.","asks":[{"q":"In paper chromatography, which part stays still?","right":"The paper","wrong":[["The water, because it soaks in and stays in the bottom of the beaker","Water moves up: mobile phase."],["The ink colors","They move different distances."],["Nothing stays still","The paper is fixed."]],"exp":"The fixed phase (such as paper) doesn't move."},{"q":"A color that sticks strongly to the paper ends up where?","right":"Close to where it started","wrong":[["Farthest from where it started, since it is held tightly by the moving water","Strong sticking to the paper holds it back."],["Off the paper","It sticks to the paper."],["In the water at the bottom","It stays on the paper."]],"exp":"Parts that stick more to the fixed phase travel less far."}]},{"term":"Picking pieces out","def":"The simplest physical means: you can pick the pieces out by hand, like separating the parts of a salad.","hook":"Salad = pick it apart.","asks":[{"q":"Which mixture could you separate just by picking pieces out by hand?","right":"A salad","wrong":[["Salt water, since salt crystals are big enough to see and pick out","Dissolved salt can't be picked out."],["Air","Gases can't be picked out."],["Brass","Brass is the same throughout."]],"exp":"The simplest physical means is picking out pieces by hand, as with a salad."},{"q":"Why can you pick the parts out of a jar of jelly beans but not out of salt water?","right":"Jelly beans are heterogeneous","wrong":[["Salt water is a compound, so its parts are bonded and can't be picked","Salt water is a mixture, but a homogeneous one."],["Jelly beans are a compound","They're a mixture."],["Salt water is an element","It's a mixture."]],"exp":"You can pick out visibly separate pieces; a homogeneous mixture has none."}]}],"intro":["A magnet pulls out magnetic pieces, like iron filings from sand. In chromatography, a mobile phase (like water) moves the mixture across a fixed phase (like paper), and each part travels a different distance. The simplest method of all is picking pieces out by hand."]}],"intro":["Because a mixture's parts aren't bonded, you can pull them apart without changing them. This deck covers how: each method uses a different difference between the parts, like boiling point, size or how strongly they stick to paper."]},{"id":5,"name":"Lab Stations and Colloids","optional":false,"sections":[{"name":"Lab stations 1 to 3","cards":[{"term":"Station 1: paper","def":"Tearing paper is a physical change. Igniting the paper is a chemical change (flame, heat, ash and gases).","hook":"Tear = physical, burn = chemical.","asks":[{"q":"At Station 1 you tear paper and then ignite it. Which step makes new substances?","right":"Igniting it","wrong":[["Tearing it, because the paper ends up in smaller and different pieces","Tearing is physical."],["Both","Only burning makes new substances."],["Neither","Burning makes ash and gases."]],"exp":"Tearing is physical; igniting is chemical (flame, heat, ash and gases)."},{"q":"Which observation from burning the paper shows a chemical change?","right":"Ash and gases form","wrong":[["The paper gets smaller as it tears into pieces before it is lit","Size change is physical."],["The paper is white","That's a property, not a change."],["The paper is thin","That's a property, not a change."]],"exp":"Flame, heat, ash and gases are signs of a chemical change."}]},{"term":"Station 2: tea lights","def":"Melting a tea light on a hot plate is a physical change. Burning one is a chemical change: the wax reacts with oxygen and gives off heat and light.","hook":"Melt = physical, burn = chemical.","asks":[{"q":"A tea light melts on a hot plate, then another is lit and burns. How do the changes compare?","right":"Melting is physical; burning is chemical","wrong":[["Both are chemical, because heat is used to change the wax in each case","Melting doesn't make a new substance."],["Both are physical","Burning makes new substances."],["Melting is chemical; burning is physical","It's the reverse."]],"exp":"Melting changes state; burning reacts the wax with oxygen."},{"q":"When a tea light burns, what does the wax react with?","right":"Oxygen","wrong":[["The hot plate, since it gives off heat that changes the wax into a new substance","Burning wax reacts with oxygen."],["Water","Burning uses oxygen."],["Nothing; it just melts","It reacts with oxygen."]],"exp":"Burning wax reacts with oxygen and gives off heat and light."}]},{"term":"Station 3: steel wool","def":"Burning steel wool is a chemical change: iron combines with oxygen to form iron(III) oxide, so the mass INCREASES.","hook":"Gains oxygen, gains mass.","asks":[{"q":"Steel wool is weighed, burned and weighed again. What happens to its mass?","right":"It increases","wrong":[["It decreases, because burning always turns some of the material into smoke","Steel wool gains oxygen."],["It stays the same","Oxygen is added."],["It drops to zero","The iron is still there."]],"exp":"Iron combines with oxygen to form iron(III) oxide, so the mass goes up."},{"q":"Burning wood loses mass but burning steel wool gains mass. Why?","right":"The iron combines with oxygen and keeps it","wrong":[["Steel wool doesn't actually burn; it only melts and absorbs some heat","It burns, a chemical change."],["Wood gains mass too","Wood leaves ash and gases."],["The scale was wrong","The gain is real."]],"exp":"The iron combines with oxygen to form iron(III) oxide, so the solid gains mass."}]}],"intro":["At each station, ask: did a new substance form? Tearing paper and melting wax don't make new substances. Burning paper, wax and steel wool do. Steel wool is the surprise: it gains mass when it burns, because the iron combines with oxygen."]},{"name":"Lab stations 4 to 6","cards":[{"term":"Station 4: vinegar and chalk (TUMS)","def":"Calcium carbonate reacts with vinegar, forming bubbles of gas (a chemical change). Filtering the leftover solid is a physical separation.","hook":"Bubbles mean a new gas.","asks":[{"q":"At Station 4, chalk fizzes in vinegar, and then the leftover solid is filtered. Which step is chemical?","right":"The fizzing","wrong":[["The filtering, because the solid is separated from the leftover liquid","Filtering is physical."],["Both","Filtering is physical."],["Neither","The bubbles show a new gas."]],"exp":"The bubbles show a chemical change; filtering is a physical separation."},{"q":"What compound in the chalk (TUMS) reacts with vinegar?","right":"Calcium carbonate","wrong":[["Sodium chloride, the same compound that is found in ordinary table salt","Chalk is calcium carbonate."],["Iron oxide","That's rust."],["Zinc","That's the penny station."]],"exp":"Calcium carbonate reacts with vinegar, forming bubbles of gas."}]},{"term":"Station 5: zinc in hydrochloric acid","def":"A post-1982 penny has a zinc core. Once it is cut, the zinc reacts with hydrochloric acid, bubbles form and the penny loses mass (a chemical change).","hook":"Zinc reacts, mass lost.","asks":[{"q":"A cut post-1982 penny is placed in hydrochloric acid. Why do bubbles form?","right":"The zinc core reacts with the acid","wrong":[["The copper coating boils away because the acid is so much hotter than the penny","It's a reaction, not boiling."],["Air leaks out of the penny","Bubbles come from the reaction."],["The acid freezes","No freezing happens."]],"exp":"The zinc core reacts with hydrochloric acid, a chemical change."},{"q":"Why must the penny be cut before it reacts?","right":"To expose the zinc core","wrong":[["To let the copper coating melt into the acid so that it can react faster","The zinc core is what reacts."],["To make it lighter","Cutting is to reach the zinc."],["To make it magnetic","Magnetism isn't involved."]],"exp":"A post-1982 penny has a zinc core; once cut, the zinc reacts and the penny loses mass."}]},{"term":"Station 6: nail and peroxide","def":"Hydrogen peroxide reacts with the iron nail (a chemical change). It is a dangerous material, so the safety rules apply.","hook":"Peroxide plus iron: react, be careful.","asks":[{"q":"At Station 6, hydrogen peroxide is put on an iron nail. What kind of change is this?","right":"Chemical","wrong":[["Physical, because the nail keeps its same size and shape the whole time","The peroxide reacts with the iron."],["A change of state","It's a reaction."],["A separation","It's a reaction."]],"exp":"Hydrogen peroxide reacts with the iron nail, a chemical change."},{"q":"Why do the safety rules matter at Station 6?","right":"Hydrogen peroxide is a dangerous material","wrong":[["The iron nail is magnetic and can pull other metal objects off the table","The danger is the peroxide."],["The nail is hot","The card names the peroxide."],["It makes a loud noise","The card names the peroxide."]],"exp":"Hydrogen peroxide is a dangerous material, so the safety rules apply."}]}],"intro":["Stations 4 to 6 all involve reactions. Chalk fizzes in vinegar, the zinc inside a cut penny reacts with acid and loses mass, and hydrogen peroxide reacts with an iron nail. Filtering the leftover solid at Station 4 is the one physical step."]},{"name":"Colloids (part 1 of 2)","cards":[{"term":"Colloid","def":"A heterogeneous mixture that may appear homogeneous to the naked eye.","hook":"Looks smooth but is heterogeneous.","asks":[{"q":"Milk looks smooth and uniform, but it's classified as heterogeneous. How can that be?","right":"It's a colloid","wrong":[["It's a solution, and solutions can be either homogeneous or heterogeneous","Solutions are homogeneous."],["It's a compound","Milk is a mixture."],["It's an element","Milk is a mixture."]],"exp":"A colloid is a heterogeneous mixture that may look homogeneous."},{"q":"Which description fits a colloid?","right":"Looks uniform but is heterogeneous","wrong":[["Has visible layers that separate from each other when it is left to stand","That's a suspension."],["Is a pure substance","A colloid is a mixture."],["Is truly homogeneous","A colloid is heterogeneous."]],"exp":"A colloid may appear homogeneous to the naked eye."}]},{"term":"Colloid particle size","def":"The spread-out bits in this kind of mixture are about 1 nm to 1000 nm across.","hook":"Colloid = 1 to 1000 nm.","asks":[{"q":"A mixture's particles are about 500 nm across. Which kind of mixture is it most likely?","right":"A colloid","wrong":[["A suspension, because any particles bigger than 100 nm must settle out","Colloid particles run up to 1000 nm."],["A pure substance","It's a mixture."],["An element","It's a mixture."]],"exp":"Colloid particles are about 1 to 1000 nm across."},{"q":"Which size range belongs to colloid particles?","right":"About 1 to 1000 nm","wrong":[["Larger than 1 cm, big enough to see with the naked eye and pick out","Colloids look smooth."],["Exactly 1 nm","It's a range."],["About 1000 to 5000 nm","That's above the range."]],"exp":"Colloid particles are about 1 nm to 1000 nm across."}]},{"term":"Colloid stability","def":"These look-smooth mixtures are stable: the particles do not settle on standing. They cannot be separated by simple filtration.","hook":"Stable = never settles.","asks":[{"q":"A jar of milk and a jar of muddy water sit for a day. What do you expect?","right":"Mud settles; milk doesn't","wrong":[["Both settle into layers, because all heterogeneous mixtures settle over time","Colloids like milk are stable."],["Milk settles; mud doesn't","It's the reverse."],["Neither settles","Mud is a suspension."]],"exp":"Colloids are stable and don't settle; suspensions do."},{"q":"Why can't you separate a colloid with filter paper?","right":"Its particles pass through simple filters","wrong":[["Its particles are so large that they block the filter paper completely","Colloid particles are too small to catch."],["It's a compound","A colloid is a mixture."],["It boils too easily","Boiling isn't the issue."]],"exp":"Colloids can't be separated by simple filtration."}]},{"term":"Tyndall effect","def":"Colloidal particles scatter a light beam so the beam is visible. A true solution does not scatter the beam.","hook":"Tyndall = beam visible.","asks":[{"q":"A laser beam shines through two glasses. You can see the beam in one but not the other. Which one is the colloid?","right":"The one where the beam is visible","wrong":[["The one where the beam is invisible, because colloids let all light pass straight through","Colloids scatter light."],["Both are colloids","A solution doesn't scatter the beam."],["Neither","Scattering shows a colloid."]],"exp":"Colloid particles scatter light so the beam is visible (Tyndall effect)."},{"q":"How could you tell salt water (a solution) from a colloid that looks just like it?","right":"Shine a light beam through each","wrong":[["Pour each one through filter paper and see which one leaves something behind","Colloids pass through simple filters."],["Let them sit to see which settles","Neither settles."],["Taste them","Never taste lab samples."]],"exp":"Only the colloid scatters a beam of light (the Tyndall effect)."}]},{"term":"Brownian movement","def":"Colloidal particles move in a continuous, random zigzag path.","hook":"Brownian = zigzag.","asks":[{"q":"Under a microscope, tiny particles in a colloid jiggle in random zigzag paths. What is this called?","right":"Brownian movement","wrong":[["The Tyndall effect, because the particles move so fast that they scatter light","Tyndall is scattering light."],["Sublimation","That's solid to gas."],["Chromatography","That's a separation method."]],"exp":"Brownian movement is the continuous, random zigzag motion of colloid particles."},{"q":"Which describes the path of a colloid particle?","right":"A continuous, random zigzag","wrong":[["A straight line down to the bottom of the container, where it settles","Colloids don't settle."],["It doesn't move","It moves continuously."],["A circle","The path is random."]],"exp":"Colloid particles move in a continuous, random zigzag path."}]}],"intro":["A colloid looks like a solution but is really heterogeneous: its particles (about 1 to 1000 nm) are bigger than in a solution but too small to settle. You can spot one because it scatters a light beam (the Tyndall effect) and its particles zigzag (Brownian movement)."]},{"name":"Colloids (part 2 of 2)","cards":[{"term":"Centrifuge","def":"A machine that spins samples at high speed; it can separate a colloid, which simple filtration cannot. Example: separating cream from milk.","hook":"Too small to filter, so spin it.","asks":[{"q":"Cream needs to be separated from milk. Filtration doesn't work. What does?","right":"A high-speed centrifuge","wrong":[["Distillation, because cream has a much higher boiling point than the rest of the milk","Your card names the centrifuge."],["A magnet","Cream isn't magnetic."],["Picking pieces out","The particles are too small."]],"exp":"A high-speed centrifuge can separate a colloid, like cream from milk."},{"q":"Why is a centrifuge needed for a colloid but not for sand in water?","right":"Colloid particles are too small to filter","wrong":[["Sand dissolves in the water, so it can't be caught by a centrifuge at all","Sand doesn't dissolve; filtration catches it."],["Colloids are compounds","They're mixtures."],["Sand is a colloid","Sand in water is a suspension."]],"exp":"Colloid particles pass through simple filters, so the colloid has to be spun."}]},{"term":"Dispersed phase","def":"The component of a colloid present in the smaller quantity, like a solute. It is the part spread out in the mixture.","hook":"Dispersed = the small amount.","asks":[{"q":"In fog, tiny water droplets are spread through air. Which is the dispersed phase?","right":"The water droplets","wrong":[["The air, because it surrounds the droplets and is spread all through the fog","Air is the larger amount: the dispersion medium."],["Both equally","One is smaller in quantity."],["Neither","The droplets are dispersed."]],"exp":"The dispersed phase is the smaller amount spread through the mixture."},{"q":"The dispersed phase in a colloid is most like which part of a solution?","right":"The solute","wrong":[["The solvent, because it's the part that the other particles are spread through","That's the dispersion medium."],["The container","Not part of the mixture."],["The precipitate","Not part of a solution."]],"exp":"The dispersed phase is the smaller amount, like a solute."}]},{"term":"Dispersion medium","def":"The component of a colloid present in the larger quantity, like a solvent. The particles are spread through it.","hook":"Medium = the big amount.","asks":[{"q":"In whipped cream, gas bubbles are spread through a liquid. What is the dispersion medium?","right":"The liquid","wrong":[["The gas bubbles, because they take up most of the space you see","The bubbles are the dispersed phase."],["The bowl","Not part of the colloid."],["Both equally","The liquid is the medium."]],"exp":"The dispersion medium is the larger amount that the particles are spread through."},{"q":"The dispersion medium of a colloid is most like which part of a solution?","right":"The solvent","wrong":[["The solute, because it is the part of the colloid that gets spread around","That's the dispersed phase."],["A precipitate","Not part of a solution."],["A filter","Not part of a solution."]],"exp":"The dispersion medium is the larger amount, like a solvent."}]}],"intro":["Filter paper can't catch colloid particles, but a high-speed centrifuge can, as with cream from milk. Every colloid has a dispersed phase (the smaller amount, like a solute) spread through a dispersion medium (the larger amount, like a solvent)."]},{"name":"Types of colloids (part 1 of 2)","cards":[{"term":"Aerosol","def":"A solid or a liquid dispersed in a gas. Solid in a gas: smoke and dust. Liquid in a gas: fog, mist, cloud and insecticide sprays. One name covers both.","hook":"Aerosol = in a gas.","asks":[{"q":"Smoke is solid particles in air, and fog is liquid droplets in air. What type of colloid are both?","right":"Aerosols","wrong":[["Foams, because both of them have a gas as one of their two parts","A foam is gas in a liquid."],["Emulsions","Emulsion is liquid in liquid."],["Gels","Gel is liquid in a solid."]],"exp":"An aerosol is a solid or liquid dispersed in a gas."},{"q":"Insecticide spray and dust are both aerosols. What do they have in common?","right":"Both are dispersed in a gas","wrong":[["Both are liquid droplets spread through a solid such as a wall or carpet","Aerosols are dispersed in a gas."],["Both are solids","Spray is liquid; dust is solid."],["Both are liquids","Dust is solid."]],"exp":"An aerosol is any solid or liquid dispersed in a gas."}]},{"term":"Foam","def":"A gas dispersed in a liquid. Examples: whipped cream, froth and soap lather.","hook":"Foam = gas bubbles in a liquid.","asks":[{"q":"Soap lather is gas trapped in a liquid. What type of colloid is it?","right":"Foam","wrong":[["Aerosol, because it has gas in it, like the air in the bubbles","An aerosol is dispersed IN a gas."],["Emulsion","Liquid in liquid."],["Sol","Solid in liquid."]],"exp":"A foam is a gas dispersed in a liquid."},{"q":"How is a foam the reverse of a liquid aerosol like fog?","right":"Foam is gas in liquid; fog is liquid in gas","wrong":[["Foam is solid in gas and fog is gas in solid, so they swap their states","Check the states: foam is gas in a liquid."],["They are the same","The parts are reversed."],["Foam is liquid in liquid","That's an emulsion."]],"exp":"Foam: gas dispersed in a liquid. Fog: liquid dispersed in a gas."}]},{"term":"Emulsion","def":"A liquid dispersed in a liquid. Examples: milk, hair cream and butter.","hook":"Emulsion = liquid in liquid.","asks":[{"q":"Milk is droplets of fat (a liquid) spread through water. What type of colloid is it?","right":"Emulsion","wrong":[["Foam, because it is white and can be whipped into a fluffy mixture","Foam is gas in a liquid."],["Sol","Solid in liquid."],["Gel","Liquid in solid."]],"exp":"An emulsion is a liquid dispersed in a liquid."},{"q":"Which pair are both emulsions on your card?","right":"Milk and butter","wrong":[["Whipped cream and soap lather, because both of them are white and fluffy","Those are foams."],["Smoke and fog","Aerosols."],["Paint and cell fluid","Sols."]],"exp":"Milk, hair cream and butter are emulsions."}]}],"intro":["Colloids are named by what is spread through what. An aerosol is something spread through a gas (smoke, fog). A foam is gas spread through a liquid (whipped cream). An emulsion is a liquid spread through a liquid (milk)."]},{"name":"Types of colloids (part 2 of 2)","cards":[{"term":"Sol","def":"A solid dispersed in a liquid. Examples: paints and cell fluids.","hook":"Sol = solid in a liquid.","asks":[{"q":"Paint is solid pigment particles spread through a liquid. What type of colloid is it?","right":"Sol","wrong":[["Gel, because the paint becomes solid as it dries on the wall","Gel is liquid in a solid."],["Foam","Gas in liquid."],["Emulsion","Liquid in liquid."]],"exp":"A sol is a solid dispersed in a liquid."},{"q":"How does a sol differ from a gel?","right":"Sol: solid in liquid. Gel: liquid in solid","wrong":[["Sol: liquid in solid, and gel: solid in liquid, the reverse of what most think","It's the other way round."],["They are the same","The parts are reversed."],["Both are gas in a solid","That's a solid sol."]],"exp":"A sol is solid in liquid; a gel is liquid in solid."}]},{"term":"Gel","def":"A liquid dispersed in a solid. Examples: cheese and jellies.","hook":"Gel = liquid in a solid.","asks":[{"q":"Jelly is liquid held inside a solid network. What type of colloid is it?","right":"Gel","wrong":[["Sol, because it contains a solid and a liquid mixed together evenly","Sol is solid in a liquid; jelly is liquid in a solid."],["Foam","Gas in liquid."],["Aerosol","Dispersed in a gas."]],"exp":"A gel is a liquid dispersed in a solid."},{"q":"Which example from your cards is a gel?","right":"Cheese","wrong":[["Butter, because it is soft and contains water mixed into a solid","Your card lists butter as an emulsion."],["Paint","A sol."],["Fog","An aerosol."]],"exp":"Cheese and jellies are gels."}]},{"term":"Solid sol","def":"A solid or a gas dispersed in a solid. Solid in a solid: colored glass and gemstones. Gas in a solid: pumice stone and foam rubber. The name solid sol is used for both.","hook":"Solid sol = in a solid.","asks":[{"q":"Pumice stone is gas bubbles trapped in a solid. What type of colloid is it?","right":"Solid sol","wrong":[["Foam, because foams are always made of gas bubbles trapped in something","Foam is gas in a liquid."],["Aerosol","Dispersed in a gas."],["Gel","Liquid in solid."]],"exp":"A solid sol is a solid or gas dispersed in a solid; pumice is gas in a solid."},{"q":"Colored glass and foam rubber are both solid sols. What do they share?","right":"Both are dispersed in a solid","wrong":[["Both have liquid droplets spread through a gas, like a mist that hardened","That's an aerosol."],["Both are gases","The medium is solid."],["Both are liquids","The medium is solid."]],"exp":"Solid sols have a solid or gas dispersed in a solid."}]}],"intro":["The rest: a sol is a solid in a liquid (paint), a gel is a liquid in a solid (cheese, jelly), and a solid sol is a solid or gas in a solid (colored glass, pumice). Sol and gel are reverses of each other."]}],"intro":["Two parts: the six lab stations you did in class, where you sorted physical and chemical changes, and colloids, mixtures that look smooth but aren't."]}],"sq":[{"deck":1,"q":"A student heats a sealed flask of liquid water until it is all steam. Which statement best describes the molecules in the steam?","opts":["They are still H₂O molecules, but now far apart.","Each H₂O molecule has split into hydrogen and oxygen atoms.","The water has become a different compound as it boiled.","The molecules shrink, so the gas takes up less space."],"ans":0,"exp":"Boiling is a physical change. The H₂O molecules stay intact; only their motion and spacing change.","why":["","Boiling is a physical change, so the molecules are not split apart. Splitting water needs electrolysis.","The substance is still water. A different compound would need a chemical change.","The molecules do not change size; the spaces between them grow, so the gas spreads out."]},{"deck":2,"q":"You crush a block of rock salt into powder and then dissolve the powder in water. How should the two changes be classified?","opts":["Crushing is physical and dissolving is chemical.","Both crushing and dissolving are physical changes.","Crushing is chemical and dissolving is physical.","Both crushing and dissolving are chemical changes."],"ans":1,"exp":"The salt keeps its composition in both steps, so both are physical changes.","why":["Dissolving only spreads the salt through the water. No new substance forms, so it is physical.","","Crushing only changes the size of the pieces. The composition stays the same, so it is physical.","Neither process makes a new substance. Both are physical."]},{"deck":2,"q":"A student drops an antacid tablet into vinegar and sees bubbles. What does this show?","opts":["Only a physical change, because the tablet gets smaller.","A change of state of the tablet into a gas.","A chemical change, because a new gas formed.","A mixture forming, because two substances were combined."],"ans":2,"exp":"Gas formation is an indicator of a chemical change.","why":["A shrinking tablet alone could be dissolving, but bubbles of gas signal a new substance forming.","The tablet does not turn into gas; a gas forms from the reaction between the tablet and the vinegar.","","Combining substances can make a mixture, but bubbles of new gas show a reaction took place."]},{"deck":2,"q":"Steel wool is massed, burned and massed again. The mass went up by 0.38 g. What is the best explanation?","opts":["Burning always adds mass to metals.","The iron atoms got heavier from the heat.","The steel wool absorbed water from the air.","Oxygen from the air combined with the iron."],"ans":3,"exp":"Iron plus oxygen forms iron(III) oxide, which has more mass than the iron alone.","why":["Burning does not simply add mass. The extra mass comes from a specific reactant.","Heat does not make atoms heavier. The mass gain comes from additional atoms joining the iron.","Nothing in the data points to water. Burning iron combines with oxygen.",""]},{"deck":2,"q":"Two samples of pure copper are compared: a tiny wire and a large block. Which property is identical?","opts":["Density","Volume","Length","Mass"],"ans":0,"exp":"Density is intensive, so it does not depend on how much copper there is.","why":["","The block takes up more space, so volume differs. Volume is extensive.","Length depends on the size of the sample, so it is extensive.","The block has more matter, so its mass is greater. Mass is extensive."]},{"deck":3,"q":"A jar holds pieces of Cu and Zn mixed together, written Cu & Zn. How should it be labeled?","opts":["An element, since both Cu and Zn are elements.","A mixture, because the & shows two substances.","A compound, since two types of atom are present.","A solution that cannot be separated."],"ans":1,"exp":"The & symbol marks a mixture of two elements.","why":["Each of the two is an element, but the jar holds two different substances together, which is not one element.","","Compounds are written as one bonded formula. The & shows separate substances.","Mixtures can be separated by physical methods, so the claim is false."]},{"deck":3,"q":"A particle drawing shows several separate, identical Br₂ molecules. How should the sample be labeled?","opts":["A compound, because it contains molecules of bonded atoms.","A mixture, because there are so many particles present.","An element, because only bromine atoms are present.","A compound, because the atoms in each molecule are bonded."],"ans":2,"exp":"Identical Br₂ molecules contain one type of atom, so the sample is an element.","why":["Molecules can contain only one type of atom. Br₂ has only bromine atoms.","Many identical particles still make a pure substance; a mixture needs different particles.","","Bonding alone does not make a compound. A compound needs two or more types of atoms."]},{"deck":4,"q":"Muddy water is poured through filter paper. What passes through and what stays on the paper?","opts":["Dissolved salt stays; undissolved dirt passes through.","Everything passes through because it is wet.","Water decomposes and the hydrogen stays on the paper.","Clear liquid passes through; undissolved dirt stays."],"ans":3,"exp":"Filtration separates undissolved solids from liquids.","why":["This reverses the process. Dissolved particles pass through filter paper.","The paper traps solid particles that are too large to pass through.","Filtering is a physical method and does not break water apart.",""]},{"deck":4,"q":"How would you recover pure water from salt water?","opts":["Boil it and condense the steam.","Run an electric current through the mixture.","Add more salt until the water separates.","Filter the salt water through paper."],"ans":0,"exp":"Distillation uses the difference in boiling points; the salt stays behind.","why":["","An electric current would decompose water into gases; it would not separate it from the salt.","Adding salt just makes the solution more concentrated.","Dissolved salt passes through filter paper, so the water would not be pure."]},{"deck":4,"q":"Which approach would you use to break water into hydrogen and oxygen?","opts":["Distillation, a physical method.","Electrolysis, a chemical method.","Filtration, a physical method.","Evaporation, a physical method."],"ans":1,"exp":"Water is a compound, so separating its elements takes a chemical method.","why":["Distillation only boils and condenses, so the water stays water.","","Filtration separates solids from liquids and cannot split a compound.","Evaporation turns water into vapor but does not break the molecules apart."]},{"deck":3,"q":"A student writes NaCl & H₂O for a drawing. What does the drawing most likely show?","opts":["A heterogeneous mixture of sand and water.","A compound containing sodium and chlorine.","Salt water, a homogeneous mixture.","A pure substance made of three elements."],"ans":2,"exp":"The & shows two substances mixed together; salt in water is the same throughout.","why":["The formulas show salt and water, and dissolved salt is uniform throughout.","NaCl alone would be the compound; the & and H₂O show a second substance.","","A pure substance has no & in its code; this is two substances together."]},{"deck":2,"q":"A tea light is melted, and then a different one is lit. Which statement is correct?","opts":["Melting is chemical; burning is physical.","Both are chemical changes.","Both are physical changes.","Melting is physical; burning is chemical."],"ans":3,"exp":"Melted wax is still wax, but burning makes new substances.","why":["This swaps them. Melted wax is still wax.","Melting does not form a new substance.","Burning wax reacts with oxygen and forms new substances.",""]},{"deck":3,"q":"A student says \"Br₂ is a molecule, so it must be a compound.\" What is the best reply?","opts":["Wrong, because Br₂ has only one type of atom.","Correct, because it has a subscript of two.","Wrong, because Br₂ is actually a mixture of two things.","Correct, since all molecules are compounds."],"ans":0,"exp":"A compound needs two or more different atom types. Br₂ is an element made of molecules.","why":["","A subscript only counts atoms. It does not decide whether something is a compound.","There is no & in Br₂, so it is a single pure substance.","Not all molecules are compounds. Molecules of a single element exist."]},{"deck":3,"q":"Which substance is a heterogeneous mixture?","opts":["Brass","Soil","Air","Gasoline"],"ans":1,"exp":"Soil has visibly different parts.","why":["Brass is the same throughout, so it is homogeneous.","","Air is the same throughout, so it is homogeneous.","Gasoline looks uniform, so it is homogeneous."]},{"deck":2,"q":"A post-1982 penny is cut and left overnight in hydrochloric acid. It loses 0.19 g and bubbles formed. What is the best conclusion?","opts":["The copper coating melted in the acid, a physical change.","The acid just washed dirt off the penny.","The zinc core reacted with the acid, a chemical change.","Water inside the penny evaporated during the night."],"ans":2,"exp":"Bubbles and mass loss show that the zinc reacted with the acid.","why":["Melting would need heat, and bubbles would not form. Acid does not melt copper.","Dirt cannot account for bubbles and a lost mass of 0.19 g.","","A penny has no water to evaporate, and evaporation would not form bubbles."]},{"deck":4,"q":"You stir sand into salt water, filter it, then boil the filtrate. Which is the correct order of methods?","opts":["Distillation first, then filtration.","Filtration first, then chromatography.","Chromatography first, then evaporation.","Filtration first, then distillation."],"ans":3,"exp":"Remove the sand first, then boil off the water from the salt solution.","why":["Boiling first leaves sand and salt together, so the order does not separate them.","Chromatography separates substances by adherence to a surface and is not how you recover water from salt water.","Chromatography does not remove sand from water.",""]},{"deck":5,"q":"A flashlight beam is visible as it passes through a glass of fog-like cloudy liquid. Which conclusion is best supported?","opts":["The liquid is a colloid, because it scatters the light.","The liquid is a true solution, because the beam passed through.","The liquid is a pure element, because it is cloudy and uniform.","The liquid is a suspension, because the beam is visible in it."],"ans":0,"exp":"Particles of about 1 nm to 1000 nm scatter light (the Tyndall effect) and stay mixed, so the liquid is a colloid.","why":["","A true solution would not scatter the beam, so the beam would not be visible.","Being cloudy says nothing about being an element; it is a mixture.","A suspension would also settle on standing, which this liquid does not do."]},{"deck":5,"q":"A baker makes a mousse by whipping air into a thick liquid, and a jelly by setting a liquid inside a solid network. Which pair of names fits?","opts":["The mousse is an emulsion and the jelly is a foam.","The mousse is a foam and the jelly is a gel.","The mousse is a sol and the jelly is an aerosol.","The mousse is a gel and the jelly is a solid sol."],"ans":1,"exp":"A gas dispersed in a liquid is a foam. A liquid dispersed in a solid is a gel.","why":["An emulsion is a liquid in a liquid, and a foam is a gas in a liquid, so these are swapped.","","A sol is a solid in a liquid, and an aerosol has a gas as its medium.","A gel is a liquid in a solid, so it describes the jelly, not the mousse."]}],"flows":[{"id":"FC1","title":"Changes of state of water","deck":1,"steps":["Solid (ice)","Melting","Liquid (water)","Boiling","Gas (steam)"]},{"id":"FC2","title":"Is it an element, a compound or a mixture?","deck":3,"steps":["Does the code contain an & (or visibly different parts)?","Yes: mixture","No: pure substance","One type of atom: element","Two or more types of atoms: compound"]},{"id":"FC3","title":"How matter is organized","deck":4,"steps":["Matter","Mixtures (homogeneous or heterogeneous)","Physical methods","Pure substances","Compounds","Chemical methods","Elements"]},{"id":"FC4","title":"Distilling salt water","deck":4,"steps":["Heat the salt water","Water boils to steam","Steam cools in the condenser","Pure water drips into the collection flask","Salt stays in the original flask"]},{"id":"FC5","title":"Electrolysis of water","deck":2,"steps":["2 H₂O molecules","Electric current","Bonds break and atoms rearrange","2 H₂ molecules + 1 O₂ molecule"]}],"trees":["Matter\n├─ Mixtures (variable composition; separated by physical methods)\n│  ├─ Homogeneous (solutions): air, brass, salt water, gasoline\n│  └─ Heterogeneous: oil-and-vinegar dressing, sand in water, jelly beans, soil\n└─ Pure substances (fixed composition)\n   ├─ Elements (one type of atom): Fe, Al, O₂, H₂, Au, Br₂, P₄\n   └─ Compounds (two or more types of atoms; separated by chemical methods):\n      H₂O, CO₂, C₁₂H₂₂O₁₁, NaHCO₃","Properties of matter\n├─ Physical properties (observed without changing the substance)\n│  ├─ Intensive (does not depend on amount): boiling point, color, density, luster, hardness\n│  └─ Extensive (depends on amount): mass, volume, size, weight, length\n└─ Chemical properties (ability to become a new substance): flammability, rusting, digestion","Changes in matter\n├─ Physical change (same substance afterward)\n│  ├─ Changes of state: melting, freezing, boiling\n│  └─ Others: crushing, dissolving, tearing, distilling\n└─ Chemical change = reaction (new substance afterward)\n   ├─ Burning (combustion), rusting, fermenting, electrolysis\n   └─ Indicators: precipitate, gas, color change, temperature change, light"],"tables":[{"title":"Types of colloids","rows":[["Structure","Colloid","Example"],["Solid in a gas","Aerosol","Smoke or dust"],["Liquid in a gas","Aerosol","Fog, mist, cloud or insecticide spray"],["Gas in a liquid","Foam","Whipped cream, froth or soap lather"],["Liquid in a liquid","Emulsion","Milk, hair cream or butter"],["Solid in a liquid","Sol","Paints or cell fluids"],["Liquid in a solid","Gel","Cheese or jellies"],["Solid in a solid","Solid sol","Colored glass or gemstones"],["Gas in a solid","Solid sol","Pumice stone or foam rubber"]]},{"title":"Changes of state","rows":[["Change","From to","Energy","Example"],["Melting","Solid to liquid","Added","Ice to water"],["Freezing","Liquid to solid","Removed","Water to ice"],["Evaporation or boiling","Liquid to gas","Added","Water to steam"],["Condensation","Gas to liquid","Removed","Steam on a cold mirror"],["Sublimation","Solid to gas","Added","Dry ice to gas"],["Deposition","Gas to solid","Removed","Frost on a window"]]},{"title":"Physical compared with chemical","rows":[["","Physical","Chemical"],["Property","Observed without changing the substance (color, density, boiling point)","Ability to become a new substance (flammability, rusting)"],["Change","Same substance afterward (melting, boiling, dissolving, crushing)","New substance afterward (burning, rusting, fermenting, electrolysis)"],["Bonds","Not broken","Broken and re-formed into new substances"],["Evidence","State, shape or size changes","Precipitate, gas bubbles, color change, temperature change, light"]]},{"title":"Element, compound and mixture compared","rows":[["","Element","Compound","Mixture"],["Types of atoms","One","Two or more","Varies (different substances are present)"],["Composition","Fixed","Fixed","Variable"],["Separation","Cannot be broken down chemically","Chemical methods","Physical methods"],["Formula clue","One capital letter","Two or more capitals, no &","Contains &"],["Examples","Au, Br₂, P₄","CO₂, H₂O, NaCl","Air, salt water, brass"]]},{"title":"Separation techniques compared","rows":[["Technique","Property used","Example"],["Distillation","Boiling point","Pure water from salt water"],["Filtration","State of matter (solid versus liquid)","Sand out of water"],["Chromatography","Adherence to a surface","Separating ink pigments"],["Evaporation","Volatility","Recovering salt by removing the water"]]}],"watch":[{"deck":5,"text":"In the review sheet's colloid FRQ the Structure column lists \"Solid in a Gas\" and \"Liquid in a Gas\" twice. The teacher said in class that this was a mistake. The two repeats should be \"Solid in a Liquid\" (sol: paint, cell fluid) and \"Liquid in a Solid\" (gel: jelly, cheese). Aerosol and solid sol really are each used twice, exactly as on her colloid reference sheet."},{"deck":5,"text":"The lab sheet lists 3% hydrogen peroxide in the materials but Station 6 says (30%) hydrogen peroxide and \"extremely dangerous.\" Treat it as a hazardous material either way; the chemical change (peroxide reacting with the iron nail) is the same."},{"deck":1,"text":"The review asks how water can be all three states at 0 °C. Ice and liquid water coexist at 0 °C, and water vapor is also present above them, so say all three explicitly and name the change that makes the vapor."},{"deck":2,"text":"The review sheet lists pH as a chemical property (along with reacting or not reacting). In the Ada Twist FRQ treat pH and \"reacts with bases and metals\" as chemical properties, and thick, clear, smell and density as physical."},{"deck":1,"text":"The teacher's notes sheet for Section 1 garbles the states of matter (\"deficient\" and \"indeficient\" space and volume). The correct version: a solid has a fixed shape and volume, a liquid has a fixed volume but takes the shape of its container, and a gas has neither a fixed shape nor a fixed volume."},{"deck":2,"text":"The slides list \"rusting of steel\" as a chemical property. Rusting itself is a chemical change; the chemical property is the ability to rust. Treat both as chemical on a test."},{"deck":2,"text":"The teacher's intensive/extensive example (drops of food coloring changing how intense the water's color looks) is really about the amount of dye. The same notes list color as intensive. The color of a pure substance is intensive; know the notes' example if it is asked."},{"deck":2,"text":"The row \"Indicators of a Chemical Change\" is blank in the notes framework. This kit uses the five signs from the teacher's review sheet: precipitate, gas given off, color change, temperature change and light given off. Odor is a physical property, so it is not used as a sign."},{"deck":3,"text":"The answer key in the Classification of Matter activity lists \"Drain Cleaner (Al & NaOH & ...)\" as a compound, but any code with an & is a mixture. Use the & rule on a test."},{"deck":3,"text":"A subscript does not make something a compound: Br₂, P₄ and O₃ are elements. Atom does not equal element and molecule does not equal compound."},{"deck":4,"text":"Dissolving is a physical change even though the solid seems to disappear. That is why salt water can be separated by distillation with no new substances formed."},{"deck":5,"text":"Station 6 lists 3% hydrogen peroxide in the materials list but 30% in the procedure. Follow your teacher's safety instructions."},{"deck":5,"text":"The colloid reference sheet is extra and is not in the teacher's slides. The chapter treats mixtures as homogeneous (solutions) or heterogeneous."}],"practice":{"sections":[{"name":"FRQs","mode":"practice","tips":["Write your steps in the work area first, then put your final answers in the answer box. Check Answer shows the worked solution.","Use units and show subtraction for mass questions (for example 45.58 g - 45.20 g = +0.38 g).","Name the evidence and the reason: \"A new substance formed because ...\" scores better than just \"chemical.\"","Self-mark honestly. Wrong or half-right answers go into Retest Missed Questions."],"questions":[{"id":"R1","type":"frq","title":"Review FRQ 1: Bunsen quizzes Beaker","stem":"Bunsen quizzes Beaker about the states of matter. Answer Bunsen's four questions.","data":[],"parts":[{"k":"a","prompt":"\"Beaker, explain to me how water can be all three states of matter at zero Celsius.\"","model":"Zero Celsius is the melting and freezing point of water, so ice (solid) and liquid water can exist together there in equilibrium: some ice melts while some water freezes. Water molecules at the surface of the ice and the liquid also escape into the air as water vapor (sublimation and evaporation), so a little gas is present too. That makes solid, liquid and gas at 0 °C."},{"k":"b","prompt":"\"Beaker, thinking about the molecules in motion, describe each state of matter.\"","model":"Solid: molecules are close together in fixed positions, vibrating in place; the most organized, with a fixed shape and volume. Liquid: molecules are close together but slide past one another; a fixed volume but the shape of the container. Gas: molecules are far apart and move fast and randomly; no fixed shape or volume and the least organized."},{"k":"c","prompt":"\"Beaker, why is zero Kelvin considered absolute zero?\"","model":"0 K (-273.15 °C) is the lowest possible temperature: particles have their minimum possible motion (they h
