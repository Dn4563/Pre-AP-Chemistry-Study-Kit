<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-AP Chemistry Study Kit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design tokens shared by the Study Hub and every kit. The course accent comes from course.json
   (set at runtime as --accent-l / --accent-d). */
:root {
  --ground: #E9EBEE; --sheet: #FFFFFF; --sunk: #F3F4F6; --ink: #1A1D21; --ink-2: #555C65; --rule: #D6DAE0;
  --ok: #23774A; --ok-wash: #E3F2E9; --bad: #B3261E; --bad-wash: #FBE9E7; --mid: #9A5B00; --mid-wash: #FCF0DC;
  --t0: #3E6FB0; --t1: #B5552F; --t2: #3D8A5F; --t3: #7A5BB5; --t4: #A8862A; --t5: #3B8C99; --t6: #A54C79; --t7: #6B7280;
  --accent: var(--accent-l, #2C5AA0); --on-accent: #FFFFFF;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --fast: 120ms; --mid-t: 180ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
  --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
  --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
  --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
    --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
    --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
    --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
  }
}
:root { --accent-wash: color-mix(in srgb, var(--accent) 10%, var(--sheet)); }

/* Study kit layout and components. Uses tokens.css only. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
#app { max-width: 60rem; margin: 0 auto; padding: 0 16px 72px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 2.8rem)/1.05 var(--serif); letter-spacing: -.01em; }
h2 { font: 600 1.55rem/1.2 var(--serif); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 22px 0 8px; }
h4 { font-size: .95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 8px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted, .hint { color: var(--ink-2); }
.hint { font-size: .9rem; }
.big { font-size: 1.25rem; font-weight: 600; }

/* header */
.top { padding: 22px 0 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.hublink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.hublink:hover { color: var(--accent); }
.credit { margin: 40px 0 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.credit a { color: inherit; }
.credit a:hover { color: var(--accent); }
.kicker { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; color: var(--ink-2); font-size: .95rem; }
.meter .bar { flex: 1 1 160px; }
.bar { display: block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--mid-t); }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--ok); }

/* tabs and chips */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); margin: 0 -16px; padding: 0 16px; }
.tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; color: var(--ink-2); font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .92rem; }
.chip small { color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.t0 { background: var(--t0); } .dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); }
.dot.t4 { background: var(--t4); } .dot.t5 { background: var(--t5); } .dot.t6 { background: var(--t6); } .dot.t7 { background: var(--t7); }
main { padding-top: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.sec:hover { border-color: var(--ink-2); background: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; padding: 8px 10px; min-height: 38px; font-weight: 500; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:not(.ghost).danger { background: var(--sheet); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; margin-bottom: 18px; }
.rtop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.rtop h2 { margin-right: auto; }
.msg { color: var(--bad); font-weight: 600; }
.kbd { color: var(--ink-2); font-size: .85rem; margin-top: -6px; }

/* questions and choices */
.lockt { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); margin-bottom: 4px; }
.qask { color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
.qprompt, .stem { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 16px; max-width: 70ch; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 12rem)); }
.optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color var(--fast), background-color var(--fast); }
.opt:not(:disabled):hover { border-color: var(--ink-2); }
.opt .k { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.opt .ot { padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-wash); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; color: var(--ink); }
.crossed .opt .ot { text-decoration: line-through; color: var(--ink-2); }
.crossed .opt { opacity: .7; }
.xoff { width: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); border-radius: var(--r-sm); }
.xoff:hover { background: var(--sunk); color: var(--ink); }
.xoff[aria-pressed="true"] { color: var(--accent); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--ink-2); }
.fb.ok { background: var(--ok-wash); border-left-color: var(--ok); }
.fb.bad { background: var(--bad-wash); border-left-color: var(--bad); }
.fb p:first-child { margin-top: 0; } .fb p:last-child { margin-bottom: 0; }
.why { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--rule); }
.why .wh { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.why.bad .wh { color: var(--bad); } .why.good .wh { color: var(--ok); }
.why p { margin: 6px 0 0; }
.qt { display: block; font-weight: 600; }
.whyall { margin-top: 10px; }
.whyall summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.whyall ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.whyall li { padding: 10px 14px; background: var(--sunk); border-radius: var(--r-sm); }
.whyall li p { margin: 4px 0 0; }
.tag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-wash); color: var(--ok); } .tag.bad { background: var(--bad-wash); color: var(--bad); }
.hook { display: block; margin-top: 6px; color: var(--ink-2); font-size: .94rem; }
.hook b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.skill { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule); padding: 0 8px; border-radius: 999px; vertical-align: 1px; }

/* learn */
.lessonbar { margin-bottom: 14px; }
.lessonbar .rtop { margin-bottom: 8px; }
.lmap { margin-top: 14px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.lmdeck h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.lmlist { display: flex; flex-wrap: wrap; gap: 6px; }
.lm { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 10px; font-size: .9rem; }
.lm.done { color: var(--ok); }
.lm[aria-current] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; color: var(--ink); }
.deckname { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin: 0 0 4px; }
.terms { margin: 16px 0 0; display: grid; gap: 0; }
.terms > div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 0; border-top: 1px solid var(--rule); }
.terms > div:first-child { border-top: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; }
.terms.guide > div { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; }
.know { align-self: start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 4px 10px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.know[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); font-weight: 600; }
.chain { margin: 18px 0; }
.chain figcaption { font-weight: 600; font-size: .92rem; color: var(--ink-2); margin-bottom: 8px; }
.chain ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; counter-reset: c; }
.chain li { position: relative; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: var(--r-sm); padding: 7px 12px; font-size: .95rem; }
.chain li + li { margin-left: 22px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; top: 50%; width: 14px; height: 2px; background: var(--ink-2); }
.chain li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--ink-2); border-right: 0; }
.watch { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--mid); background: var(--mid-wash); border-radius: var(--r-sm); }
.watch b { display: block; color: var(--mid); margin-bottom: 2px; }
.scorebig { font: 600 2.6rem/1 var(--serif); margin: 14px 0 0; }
.missed { padding-left: 20px; }
.missed li { margin: 6px 0; }

/* study guide */
.deckblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; margin-bottom: 18px; }
.deckblock > h2 { display: flex; align-items: center; gap: 10px; }
.tree { background: var(--sunk); border-radius: var(--r-sm); padding: 14px 16px; overflow-x: auto; font: .92rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.tablewrap { margin: 16px 0; }
.tablewrap figcaption { font-weight: 600; margin-bottom: 8px; }
.scrollx { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: .95rem; }
.gt th, .gt td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.gt th { background: var(--sunk); font-weight: 600; }
.breakdown { max-width: 34rem; margin: 14px 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px 24px; }
.cblock h3 { margin-top: 6px; }
.cblock ul { padding-left: 18px; margin: 0; }

/* flashcards */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.ctl label, .grp label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
select, input[type="number"] { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); }
input[type="number"] { width: 4.5rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.fcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 15rem; padding: 32px; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: var(--r); text-align: center; }
.fterm { font: 600 2rem/1.15 var(--serif); }
.fdef { font-size: 1.15rem; max-width: 50ch; }
.fcard small { color: var(--ink-2); }
.fcnav .btn { flex: 1 1 8rem; }
.fctools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.fctools [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fcprog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.fcprog .muted { flex: none; font-size: .92rem; }
.fcprog .bar { flex: 1 1 140px; }
.srb { margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }

/* forms */
.form fieldset { border: 0; padding: 0; margin: 18px 0 0; }
.form legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.grp { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; }
.chk input { margin-top: 3px; }
textarea { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; resize: vertical; margin-top: 12px; }

/* practice test */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stab { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 7px 13px; font-size: .92rem; color: var(--ink-2); }
.stab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }
.stab.res { border-style: dashed; }
.ptctl { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 -10px 10px; }
.score { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.banner { background: var(--accent-wash); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; }
.intro { margin-bottom: 12px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.disclose .ic { transition: transform var(--fast); }
.disclose[aria-expanded="true"] .ic { transform: rotate(90deg); }
.intro ol { margin: 8px 0; padding-left: 22px; }
.intro li { margin: 4px 0; }
.pals { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.pal { position: relative; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1.5px solid var(--rule); background: var(--sunk); color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.pal.vis { background: var(--sheet); border-color: var(--mid); color: var(--ink); }
.pal.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.pal.bad { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.pal.partial { background: var(--mid-wash); border-color: var(--mid); color: var(--mid); }
.pal.none { background: var(--sunk); }
.pal[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border: 7px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); border-top-right-radius: var(--r-sm); }
.qtitle { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
.qhead { font: 600 1.25rem/1.25 var(--serif); margin: 4px 0 8px; }
.src { margin: 0 0 16px; padding: 16px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.src figcaption b { display: block; }
.sattr, .slab { display: block; font-size: .88rem; color: var(--ink-2); }
.srcimg { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
.stext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; max-width: 68ch; }
.pn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-right: 6px; }
.litems { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.litem { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.litem.pinrow { grid-template-columns: auto minmax(0, 1fr); }
.litem.right { border-color: var(--ok); background: var(--ok-wash); }
.litem.wrong { border-color: var(--bad); background: var(--bad-wash); }
.lt { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.ln { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .8rem; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lb { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 12px; font-size: .92rem; }
.lb.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lb.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.lb.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.lb:disabled { cursor: default; }
.lfb { grid-column: 1 / -1; font-size: .93rem; }
.diagram { margin: 0 0 16px; }
.dimg { position: relative; display: inline-block; max-width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.dimg img { display: block; max-width: 100%; max-height: 34rem; width: auto; height: auto; border-radius: var(--r-sm); }
.pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1A1D21; color: #fff; font-size: .85rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px #1A1D21; }
.pin.set { background: var(--accent-l, #2C5AA0); }
.pin.right { background: #23774A; } .pin.wrong { background: #B3261E; }
.credit { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.fparts { padding-left: 22px; }
.fparts li { margin: 6px 0; }
.part { display: block; margin-top: 16px; }
.pl { display: block; font-weight: 600; }
.pl small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.model { margin-top: 20px; padding: 18px; background: var(--accent-wash); border-radius: var(--r-sm); }
.model h4 { margin-top: 0; font-size: 1rem; }
.mpart { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--accent) 25%, var(--rule)); }
.mpart:first-of-type { border-top: 0; }
.tea { margin: 8px 0; display: grid; gap: 6px; }
.tea > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.tea dt { font-weight: 600; color: var(--accent); }
.tea dd { margin: 0; }
.earns, .weak { font-size: .95rem; }
.weak { color: var(--ink-2); }
.selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.selfmark > span { font-weight: 600; font-size: .9rem; margin-right: 4px; }
.mk { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 6px 12px; font-size: .9rem; }
.mk.on.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.mk.on.wrong { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

/* results and progress */
.wk { display: grid; gap: 14px; }
.wkhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
.wkhead span { color: var(--ink-2); font-size: .92rem; }
.wkmiss, .wkrev { font-size: .92rem; margin: 6px 0 0; }
.resq { border: 1px solid var(--rule); border-radius: var(--r-sm); margin: 8px 0; }
.resq summary { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.resq summary::-webkit-details-marker { display: none; }
.resq .pal { flex: none; }
.resd { padding: 0 14px 12px 62px; }

/* course home */
.course { margin-bottom: 4px; }
.unitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.unitrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 24px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color var(--fast); }
.unitrow:hover { border-color: var(--accent); }
.ulabel { font-weight: 600; color: var(--accent); }
.ubody { display: grid; gap: 4px; }
.utitle { font: 600 1.35rem/1.2 var(--serif); }
.ublurb { color: var(--ink-2); }
.ustat { font-size: .9rem; color: var(--ink-2); }
.ugo { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .panel, .deckblock { padding: 18px 16px; }
  .terms > div, .terms.guide > div { grid-template-columns: minmax(0, 1fr); }
  .terms.guide .know { justify-self: start; }
  .litem:not(.pinrow) { grid-template-columns: minmax(0, 1fr); }
  .tea > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .unitrow { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
  .ulabel { grid-column: 1 / -1; }
  .resd { padding-left: 14px; }
  .opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  .tabs, .chips, .topbar, .meter, .noprint, .qnav, .ptctl { display: none !important; }
  .panel, .deckblock { border: 0; padding: 0; }
}

/* Plain-language intros (deck big picture, section story) */
.intro { margin: 12px 0 16px; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--sunk); border-radius: var(--r-sm); }
.intro p { margin: 0 0 8px; line-height: 1.6; }
.intro p:last-child { margin-bottom: 0; }
.intro .introhead { font-weight: 700; font-size: .92rem; color: var(--accent); margin-bottom: 6px; }
.intro.bigpic { background: transparent; border: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.introfold { margin: 8px 0 12px; }
.introfold summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* Course home: whole-course backup */
.backup { margin-top: 24px; }
.bkmsg { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--accent); }

</style></head>

ked in rigid positions, close together (they still vibrate). Examples: ice cube, diamond, iron bar.","hook":"Solid = stuck in place.","asks":[{"q":"You move an iron bar from a small box to a large box. What happens to its shape and volume?","right":"Both stay the same","wrong":[["Its shape changes to fit the bigger box but its volume stays the same","That describes a liquid."],["Both change to fill the box","That describes a gas."],["Its volume grows but its shape stays","A solid's volume is fixed."]],"exp":"A solid has a fixed shape and a fixed volume."},{"q":"Why does a diamond keep its shape no matter what container it is in?","right":"Its particles are locked in rigid positions","wrong":[["Its particles are far apart and move randomly around the container","That describes a gas."],["Its particles have stopped moving completely","Solid particles still vibrate."],["Its particles slide past each other","That describes a liquid."]],"exp":"Solid particles are close together and locked in place, though they still vibrate."}]},{"term":"Liquid","def":"State with a definite volume that takes the shape of its container. Its particles are close together but can move around. Examples: gasoline, water, alcohol, blood.","hook":"Liquid = fills the bottom of the bowl.","asks":[{"q":"You pour 200 mL of water from a tall glass into a wide bowl. What happens?","right":"The shape changes; the volume stays 200 mL","wrong":[["The shape stays the same and the volume spreads out to fill the bowl","A liquid takes its container's shape, and its volume is fixed."],["Both the shape and the volume change","A liquid's volume is definite."],["Neither changes","A liquid takes the shape of its container."]],"exp":"A liquid has a definite volume but takes the shape of its container."},{"q":"Blood flows through your blood vessels and fills whatever shape they have. Which particle picture explains this?","right":"Close together but able to move around","wrong":[["Far apart and moving randomly, hitting the walls of the vessels","That is a gas; blood is a liquid."],["Locked in rigid positions","That is a solid."],["Not moving at all","Liquid particles move around."]],"exp":"Liquid particles are close together but can move, so a liquid flows and takes its container's shape."}]},{"term":"Gas","def":"State with no fixed volume and no fixed shape: it takes both the shape and the volume of its container. Its particles are far apart and move randomly. Examples: air, helium, oxygen.","hook":"Gas = goes everywhere.","asks":[{"q":"A small amount of helium is released into an empty room. What happens to it?","right":"It spreads to fill the whole room","wrong":[["It stays in one small cloud near the tank, keeping its own volume","A gas has no fixed volume."],["It sinks to the floor and forms a puddle","That is a liquid's behavior."],["It keeps the shape of the tank","A gas has no fixed shape."]],"exp":"A gas takes both the shape and the volume of its container."},{"q":"Why can you squeeze a lot more air into a bike tire, but not more water into a full bottle?","right":"Gas particles are far apart","wrong":[["Water particles are far apart and air particles are packed tightly","It's the reverse."],["Air has no mass","Air is matter, so it has mass."],["Water is a solid","Water in a bottle is a liquid."]],"exp":"Gas particles are far apart with lots of empty space between them, so a gas has no fixed volume."}]}],"intro":["Matter is anything with mass that takes up space, even air you can't see. The state depends on two things: whether it keeps its own shape and whether it keeps its own volume. A solid keeps both, a liquid keeps only its volume, and a gas keeps neither."]},{"name":"Water at the particle level","cards":[{"term":"Ice (solid water)","def":"Water molecules locked into rigid positions, close together.","hook":"Ice = a fixed grid.","asks":[{"q":"An ice cube keeps its cube shape on a plate. What are its water molecules doing?","right":"Holding rigid positions, close together","wrong":[["Moving far apart and hitting the plate and the air around it","That describes steam."],["Sliding past each other","That describes liquid water."],["Breaking apart into hydrogen and oxygen","The molecules stay intact."]],"exp":"In ice the molecules are locked in rigid positions, close together."},{"q":"Compare the spacing of the molecules in ice and in steam.","right":"Close together in ice, far apart in steam","wrong":[["Far apart in ice and close together in steam, because steam is hotter","It's the reverse."],["The same in both","The spacing changes between states."],["There are no molecules in steam","Steam is still H₂O molecules."]],"exp":"Ice molecules are close and locked in place; steam molecules are far apart."}]},{"term":"Liquid water","def":"Water molecules still close together but able to move around to some extent.","hook":"Liquid = close but sliding.","asks":[{"q":"How does liquid water differ from ice at the particle level?","right":"Its molecules can move around","wrong":[["Its molecules are far apart and hit the walls of the container","That describes steam."],["Its molecules are different from ice's","Both are intact H₂O molecules."],["Its molecules are locked in place","That describes ice."]],"exp":"Liquid water molecules are still close together, but they can move around to some extent."},{"q":"Water poured on a table spreads out but stays as one puddle instead of filling the room. Why?","right":"Its molecules are close but can move","wrong":[["Its molecules are far apart and move randomly in every direction","That would be a gas."],["Its molecules are locked in rigid positions","Then it wouldn't spread out."],["It has no mass","Water has mass."]],"exp":"Close-together molecules that can still slide around give a liquid its definite volume and changing shape."}]},{"term":"Steam (gaseous water)","def":"Water molecules far apart, moving randomly and hitting each other and the container walls.","hook":"Steam = spread out and zooming.","asks":[{"q":"Steam in a closed pot pushes on the lid. What are the water molecules doing?","right":"Moving randomly and hitting the walls","wrong":[["Holding fixed positions close together against the lid","That is ice."],["Sliding past each other at the bottom of the pot","That is liquid water."],["Splitting into hydrogen and oxygen gas","The molecules stay intact."]],"exp":"Steam molecules are far apart, moving randomly and hitting each other and the container walls."},{"q":"Which state of water has its molecules farthest apart?","right":"Steam","wrong":[["Ice, because it is the coldest of the three states of water","Ice molecules are close together."],["Liquid water","Liquid molecules are close together."],["All three are the same","Spacing changes from state to state."]],"exp":"In steam the molecules are far apart and moving randomly."}]},{"term":"Intact molecules","def":"In ice, liquid water and steam the H₂O molecules are still intact. Only the motion of the molecules and the distances between them change.","hook":"Same molecule, different spacing.","asks":[{"q":"Ice melts into water and the water boils into steam. What happens to the H₂O molecules?","right":"They stay H₂O; only motion and spacing change","wrong":[["They break into hydrogen and oxygen atoms when the water turns to steam","The molecules stay intact; boiling is physical."],["They turn into a new substance","No new substance forms."],["They get bigger","Only the spacing changes, not the molecules."]],"exp":"In ice, liquid water and steam the H₂O molecules are intact; only their motion and distance apart change."},{"q":"Why is boiling water a physical change and not a chemical one?","right":"The H₂O molecules stay intact","wrong":[["Bubbles form, and bubbles always mean that a new substance was made","These bubbles are still water vapor."],["Heat is added","Adding heat doesn't decide the type of change."],["The water gets hotter","A temperature rise alone doesn't decide it."]],"exp":"The molecules don't change; only their motion and spacing do, so no new substance forms."}]}],"intro":["Water is the easiest example because you know all three forms: ice, liquid water and steam. The key idea: the H₂O molecules themselves never change. Only how close together they are and how much they move changes from one state to the next."]},{"name":"Particle motion in each state","cards":[{"term":"Solid particles","def":"Particles vibrate in fixed positions, closely packed and orderly.","hook":"Solid = vibrate in place.","asks":[{"q":"A drawing shows particles in neat rows, touching, each with short wiggle lines. Which state is it?","right":"Solid","wrong":[["Gas, because the particles are moving, as the wiggle lines show","Gas particles are far apart and not in rows."],["Liquid","Liquid particles aren't in orderly rows."],["No state; particles never vibrate","Solid particles vibrate in place."]],"exp":"Closely packed, orderly particles that vibrate in place are a solid."},{"q":"Do the particles in a solid move at all?","right":"Yes, they vibrate in fixed positions","wrong":[["No, they are perfectly still until the solid melts into a liquid","Solid particles vibrate."],["Yes, they slide past each other","That is a liquid."],["Yes, they move fast and randomly","That is a gas."]],"exp":"Solid particles vibrate in place; they are closely packed and orderly."}]},{"term":"Liquid particles","def":"Particles are close together but slide past each other.","hook":"Liquid = close but sliding.","asks":[{"q":"Which drawing best shows a liquid?","right":"Particles touching but in no fixed pattern","wrong":[["Particles far apart with long arrows pointing in random directions","That is a gas."],["Particles in neat rows, touching","That is a solid."],["A single large particle","A liquid is made of many particles."]],"exp":"Liquid particles are close together but slide past each other, so they have no fixed pattern."},{"q":"Why can you stir a liquid with a spoon but not a solid?","right":"Liquid particles slide past each other","wrong":[["Liquid particles are far apart with empty space between them for the spoon","Liquid particles are close together."],["Liquid particles don't move","They do move."],["Solid particles are far apart","Solid particles are closely packed."]],"exp":"In a liquid the particles are close together but can slide past each other."}]},{"term":"Gas particles","def":"Particles are far apart, moving fast and randomly.","hook":"Gas = far apart and fast.","asks":[{"q":"Why can you smell perfume across a room a short time after it is sprayed?","right":"Gas particles move fast and randomly","wrong":[["The perfume particles are locked in place and the smell travels as heat","Gas particles are not locked in place."],["The particles slide slowly along the floor","That's not how a gas behaves."],["Perfume is a solid","Sprayed perfume becomes a gas in the air."]],"exp":"Gas particles are far apart and move fast and randomly, so they spread through the room."},{"q":"Of the three states, which has the least order in its particles?","right":"Gas","wrong":[["Solid, because its particles are always vibrating back and forth","Solid particles are the most orderly."],["Liquid","Liquid particles are still close together."],["All have the same order","Order drops from solid to gas."]],"exp":"Gas particles are far apart and move randomly, the least ordered state."}]},{"term":"Energy and state","def":"Energy increases from solid to liquid to gas. More energy means more motion and less order.","hook":"More energy = more motion = less order.","asks":[{"q":"Put the three states of the same substance in order from least to most energy.","right":"Solid, liquid, gas","wrong":[["Gas, liquid, solid, since gas particles are the farthest apart","That's from most to least."],["Liquid, solid, gas","Solid has the least energy."],["Solid, gas, liquid","Gas has the most energy."]],"exp":"Energy increases from solid to liquid to gas."},{"q":"You add heat to a substance and it changes state. What happens to its particles?","right":"More motion, less order","wrong":[["Less motion and more order, since heat makes them settle into place","Adding energy does the opposite."],["No change in motion","More energy means more motion."],["They turn into a new substance","A change of state is physical."]],"exp":"More energy means more motion and less order."}]}],"intro":["Picture the particles. In a solid they vibrate in place in neat rows; in a liquid they touch but slide past each other; in a gas they are far apart and fly around. Going from solid to liquid to gas adds energy, so the particles move more and get less orderly."]},{"name":"Changes of state (part 1 of 2)","cards":[{"term":"Melting","def":"Solid to liquid. A physical change. The particles speed up and become less organized.","hook":"Melting = solid to liquid."},{"term":"Freezing","def":"Liquid to solid. A physical change. The particles slow down and become more organized.","hook":"Freezing = liquid to solid.","asks":[{"q":"Water in an ice tray turns to ice in the freezer. Which change is this, and what do the particles do?","right":"Freezing; they slow down","wrong":[["Melting; the particles speed up and become less organized as they cool","That's the reverse process."],["Condensation; they slow down","Condensation is gas to liquid."],["Deposition; they speed up","Deposition is gas to solid, and particles slow down."]],"exp":"Freezing is liquid to solid: the particles slow down and become more organized."},{"q":"Melted candle wax hardens again as it cools. Is it a new substance?","right":"No, freezing is a physical change","wrong":[["Yes, because hardening always means a chemical reaction has happened","Liquid to solid is freezing, a physical change."],["Yes, because its shape changed","A change in shape is physical."],["Yes, because it cooled","Cooling alone doesn't make a new substance."]],"exp":"Freezing (liquid to solid) is a physical change."}]},{"term":"Evaporation or boiling","def":"Liquid to gas. A physical change. The particles speed up and become less organized.","hook":"Boiling = liquid to gas.","asks":[{"q":"A puddle disappears on a sunny day. Which change of state happened?","right":"Evaporation: liquid to gas","wrong":[["Condensation, because the water moved from the ground into the air","Condensation is gas to liquid."],["Sublimation","That is solid to gas."],["A chemical change","The water is still water, now as a vapor."]],"exp":"Evaporation is liquid to gas, a physical change."},{"q":"When water boils, how do its particles change?","right":"They speed up and become less organized","wrong":[["They slow down and become more organized as they leave the pot","That describes condensation or freezing."],["They split into hydrogen and oxygen","Boiling doesn't break the molecules."],["They stay exactly the same","They speed up and spread out."]],"exp":"Boiling is liquid to gas: the particles speed up and become less organized."}]}],"intro":["There are six changes of state, and all six are physical: the substance stays the same. Each one either speeds the particles up (less order) or slows them down (more order). Start with melting, freezing and boiling."]},{"name":"Changes of state (part 2 of 2)","cards":[{"term":"Condensation","def":"Gas to liquid. A physical change. The particles slow down and become more organized.","hook":"Condensation = gas to liquid.","asks":[{"q":"Drops of water form on the outside of a cold glass of lemonade. Which change of state is this?","right":"Condensation","wrong":[["Evaporation of lemonade leaking out through tiny holes in the glass","The water comes from the air, gas to liquid."],["Melting","Melting is solid to liquid."],["Sublimation","Sublimation is solid to gas."]],"exp":"Water vapor in the air turns to liquid on the cold glass: gas to liquid is condensation."},{"q":"When steam hits a cold mirror and turns to liquid, what do the water particles do?","right":"Slow down and become more organized","wrong":[["Speed up and become less organized as they touch the cold mirror","That's the opposite of condensation."],["Break into hydrogen and oxygen","Condensation is physical."],["Become a new substance","It is still water."]],"exp":"Condensation is gas to liquid: the particles slow down and become more organized."}]},{"term":"Sublimation","def":"Solid to gas, skipping the liquid. A physical change. The particles speed up and become less organized.","hook":"Sublimation = solid to gas.","asks":[{"q":"Dry ice (solid carbon dioxide) turns directly into gas without melting. Which change is this?","right":"Sublimation","wrong":[["Evaporation, since a gas forms from the substance as it warms up","Evaporation starts from a liquid."],["Deposition","Deposition is gas to solid."],["Condensation","Condensation is gas to liquid."]],"exp":"Solid straight to gas, skipping the liquid, is sublimation."},{"q":"Which pair of changes both make the particles speed up and become less organized?","right":"Sublimation and melting","wrong":[["Deposition and freezing, since both of them start from a gas or a liquid","Both of those slow particles down."],["Condensation and freezing","Both slow particles down."],["Deposition and condensation","Both slow particles down."]],"exp":"Sublimation (solid to gas) and melting (solid to liquid) both speed particles up."}]},{"term":"Deposition","def":"Gas to solid, skipping the liquid. A physical change. The particles slow down and become more organized.","hook":"Deposition = gas to solid.","asks":[{"q":"On a cold night, water vapor in the air forms frost directly on a car window. Which change is this?","right":"Deposition","wrong":[["Freezing, because the window is cold enough to turn the water into ice","Freezing starts from a liquid; this starts from a gas."],["Sublimation","Sublimation is solid to gas."],["Condensation","Condensation is gas to liquid."]],"exp":"Gas straight to solid, skipping the liquid, is deposition."},{"q":"Deposition is the reverse of which change?","right":"Sublimation","wrong":[["Condensation, because both of them start with a gas and end with less motion","Condensation's reverse is evaporation."],["Melting","Melting's reverse is freezing."],["Freezing","Freezing's reverse is melting."]],"exp":"Deposition is gas to solid; sublimation is solid to gas."}]},{"term":"Speed up or slow down","def":"Particles that speed up move to a state with less organization (melting, boiling, evaporation, sublimation). Particles that slow down move to a state with more organization (freezing, condensation, deposition). All six are physical changes.","hook":"Speed up = less order. Slow down = more order.","asks":[{"q":"In which group do ALL the changes make the particles slow down?","right":"Freezing, condensation, deposition","wrong":[["Melting, boiling and sublimation, which all need heat to be added","Those speed particles up."],["Freezing, melting, boiling","Melting and boiling speed particles up."],["Condensation, evaporation, deposition","Evaporation speeds particles up."]],"exp":"Freezing, condensation and deposition move to more organized states, so particles slow down."},{"q":"A substance's particles slow down and become more organized. What can you conclude?","right":"It moved to a more ordered state","wrong":[["A chemical reaction happened and the substance became something new","All six changes of state are physical."],["It moved to a less ordered state","Slowing down means more order."],["It must have boiled","Boiling speeds particles up."]],"exp":"Slowing down means moving to a state with more organization, such as freezing, condensation or deposition."}]}],"intro":["The other three: condensation (gas to liquid), and two changes that skip the liquid: sublimation (solid to gas) and deposition (gas to solid). The rule that ties all six together is speed up = less order, slow down = more order."]},{"name":"Water at 0 °C and absolute zero","cards":[{"term":"Water at 0 °C","def":"At 0 °C water is at its melting and freezing point, so ice and liquid water can sit together in equilibrium. Some water molecules also escape into the air as water vapor (evaporation from the liquid and sublimation from the ice), so all three states are present.","hook":"Ice + water + a little vapor.","asks":[{"q":"A glass of ice water sits at exactly 0 °C. Which states of water are present?","right":"Solid, liquid and some gas","wrong":[["Only solid, because 0 °C is the temperature at which all water must freeze","At 0 °C ice and liquid water exist together."],["Only liquid","Ice can stay at 0 °C."],["Only solid and liquid","Some molecules escape as vapor too."]],"exp":"At 0 °C ice and liquid water sit in equilibrium, and some molecules escape as vapor."},{"q":"At 0 °C, how can water vapor be present even though water boils at 100 °C?","right":"Some molecules escape from the surface","wrong":[["The ice is boiling, because 0 °C is the boiling point of solid water","0 °C is the melting/freezing point."],["Water vapor can only exist at 100 °C","Vapor forms by evaporation and sublimation below boiling."],["The vapor is a new substance","Vapor is still water."]],"exp":"Some molecules escape into the air by evaporation from the liquid and sublimation from the ice."}]},{"term":"Absolute zero (0 K)","def":"The lowest possible temperature, 0 K = -273.15 °C. Particles have their minimum possible motion, so nothing can be colder. The Kelvin scale starts at absolute zero, so it has no negative numbers.","hook":"Zero Kelvin = the bottom.","asks":[{"q":"Why are there no negative numbers on the Kelvin scale?","right":"It starts at the coldest possible temperature","wrong":[["Kelvin only measures temperatures above the freezing point of water","Kelvin starts much lower, at absolute zero."],["Negative numbers are rounded to zero","Nothing can be colder than 0 K."],["Kelvin only measures hot objects","It measures any temperature."]],"exp":"The Kelvin scale starts at absolute zero, the lowest possible temperature."},{"q":"A sample is cooled to 0 K. What is true of its particles?","right":"They have their minimum possible motion","wrong":[["They move faster than ever, because energy builds up when it is cold","Cooling lowers motion."],["They turn into a gas","Gases have the most motion."],["They have their maximum motion","0 K is the minimum."]],"exp":"At absolute zero (−273.15 °C) particles have their minimum possible motion."}]}],"intro":["Two special temperatures. At 0 °C water is at its melting and freezing point, so ice and liquid water sit together, with a little vapor too. Absolute zero (0 K) is the coldest anything can be, which is why the Kelvin scale has no negative numbers."]}],"intro":["Everything around you is matter, and it comes in three states: solid, liquid and gas. This deck answers one question: what are the particles doing in each state, and what happens to them when a substance melts, boils or freezes?"]},{"id":2,"name":"Properties and Changes","optional":false,"sections":[{"name":"Types of properties","cards":[{"term":"Physical property","def":"A characteristic that can be observed or measured without changing the substance into a different substance.","hook":"Look, do not change.","asks":[{"q":"Which of these is a physical property of copper?","right":"It is reddish-brown","wrong":[["It turns green when it reacts with the air over many years","Reacting into something new is a chemical property."],["It reacts with acid","That is a chemical property."],["It can burn","Burning is a chemical property."]],"exp":"Color can be observed without changing the copper into something else."},{"q":"You measure a metal's density. Afterwards, is it still the same metal?","right":"Yes; density is a physical property","wrong":[["No, because measuring a property always changes the substance a little bit","Physical properties are measured without changing the substance."],["No; density is a chemical property","Density is physical."],["Only if it is a liquid","State doesn't matter here."]],"exp":"A physical property can be observed or measured without changing the substance."}]},{"term":"Chemical property","def":"The ability of a substance to change into a different (new) substance.","hook":"Chemical = can become something new.","asks":[{"q":"Which statement describes a chemical property of wood?","right":"It can burn","wrong":[["It floats in water because it is less dense than the water around it","Density is a physical property."],["It is brown","Color is a physical property."],["It is hard","Hardness is a physical property."]],"exp":"Being able to change into new substances (burning) is a chemical property."},{"q":"To find out a substance's chemical property, what usually has to happen?","right":"It has to change into a new substance","wrong":[["You only need to look at it closely under a bright light or a microscope","Looking reveals physical properties."],["You weigh it","Mass is physical."],["You measure its volume","Volume is physical."]],"exp":"A chemical property is the ability to change into a new substance, so you see it when that happens."}]},{"term":"Intensive property","def":"A trait you can observe or measure without changing the substance, and that does NOT depend on the amount present. Examples: boiling point, color, temperature, luster, hardness, density, ductile (drawn into thin wires) and malleable (hammered into thin sheets).","hook":"Intensive = unchanged when you cut it in half.","asks":[{"q":"You cut a gold bar in half. Which property is the same for each half as for the whole bar?","right":"Density","wrong":[["Mass, because both halves are made of exactly the same kind of gold","Mass halves; it depends on amount."],["Volume","Volume halves."],["Length","Length depends on amount."]],"exp":"Density doesn't depend on how much you have, so it's intensive."},{"q":"A teaspoon and a pot of the same water both boil at the same temperature. What does this show about boiling point?","right":"It doesn't depend on the amount","wrong":[["It depends on how much water there is, so a bigger pot boils hotter","The two boil at the same temperature."],["It is a chemical property","Boiling point is physical."],["It is an extensive property","Extensive properties change with amount."]],"exp":"Boiling point is an intensive property: it doesn't depend on amount."}]},{"term":"Extensive property","def":"A trait you can observe or measure without changing the substance, and that DOES depend on the amount present. Examples: mass, volume, size, weight, length.","hook":"Extensive = more stuff, bigger value.","asks":[{"q":"Which of these would double if you doubled the amount of a substance?","right":"Volume","wrong":[["Density, because there is twice as much matter packed into the sample","Density stays the same."],["Color","Color doesn't change with amount."],["Boiling point","Boiling point doesn't change with amount."]],"exp":"Volume depends on the amount of substance, so it's extensive."},{"q":"Why can't you identify a substance by its mass alone?","right":"Mass changes with how much you have","wrong":[["Mass is a chemical property, so you would have to destroy the sample first","Mass is a physical property."],["All substances have the same mass","They don't."],["Mass can't be measured","It can, with a balance."]],"exp":"Mass is extensive, so any substance can have any mass. Intensive properties like density help identify a substance."}]}],"intro":["A physical property can be seen or measured without changing the substance, like color or density. A chemical property is what the substance can turn into, like being able to burn. Physical properties are also either intensive (the same no matter how much you have) or extensive (they grow with the amount)."]},{"name":"Examples of properties","cards":[{"term":"Physical properties you observe","def":"Odor, color and state (solid, liquid or gas).","hook":"Use your senses.","asks":[{"q":"Which physical property can you find with your senses alone, without an instrument?","right":"Odor","wrong":[["Boiling point, which you can feel when the liquid gets hot enough","Boiling point is measured."],["Density","Density is measured."],["Melting point","Melting point is measured."]],"exp":"Odor, color and state are observed; density and melting and boiling points are measured."},{"q":"A student notes that a sample is a yellow solid. What kind of properties did the student record?","right":"Observed physical properties","wrong":[["Chemical properties, because the student is describing what the sample is like","Color and state don't involve a new substance."],["Measured physical properties","Color and state need no instrument."],["Extensive properties","Color and state don't depend on amount."]],"exp":"Color and state are physical properties you observe."}]},{"term":"Physical properties you measure","def":"Volume, density, melting point, boiling point and hardness.","hook":"Use an instrument.","asks":[{"q":"Which physical property needs an instrument to find?","right":"Melting point","wrong":[["Color, which you have to see under the proper light to be sure of","Color is observed."],["Odor","Odor is observed."],["State","State is observed."]],"exp":"Volume, density, melting point, boiling point and hardness are measured."},{"q":"A student uses a graduated cylinder on a liquid. Which physical property is she most likely finding?","right":"Volume","wrong":[["Flammability, by checking how quickly the liquid burns in the cylinder","Flammability is chemical."],["Odor","Odor is observed, not measured."],["Color","Color is observed."]],"exp":"A graduated cylinder measures volume, a measured physical property."}]},{"term":"Ethyl alcohol boiling at 78°C is an example of what change?","def":"A physical change: boiling is a change of state, and no new substance forms. The boiling point itself is a physical property.","hook":"Boiling point is always physical.","asks":[{"q":"Water boils at 100 °C and ethyl alcohol at 78 °C. What do both boiling points describe?","right":"A physical property of each liquid","wrong":[["A chemical property, because each liquid turns into something different","No new substance forms when a liquid boils."],["Proof that the liquids react","Boiling isn't a reaction."],["An extensive property","Boiling point doesn't depend on amount."]],"exp":"Boiling point is a physical property; the boiling itself is a physical change."},{"q":"Alcohol vapor from boiling is cooled and turns back into liquid alcohol. What does this show about the boiling?","right":"No new substance formed","wrong":[["A new substance formed and then reacted back into alcohol when it cooled","Boiling is only a change of state."],["Boiling is a chemical change","The alcohol is still alcohol."],["Alcohol has no boiling point","It boils at 78 °C."]],"exp":"Boiling is a change of state, a physical change; the vapor is still alcohol."}]},{"term":"Sugar fermenting to form ethyl alcohol is an example of what change?","def":"A chemical change: a new substance (alcohol) forms.","hook":"New substance = chemical.","asks":[{"q":"Yeast turns the sugar in grape juice into alcohol. Why is this a chemical change?","right":"A new substance forms","wrong":[["The juice changes from a solid into a liquid as the sugar disappears","The juice is a liquid the whole time."],["The juice gets warm","Warming alone doesn't make a change chemical."],["The sugar dissolves","Dissolving doesn't make a new substance."]],"exp":"Fermenting makes alcohol, a new substance, so it's chemical."},{"q":"Which pair correctly classifies the two changes?","right":"Alcohol boiling: physical; sugar fermenting: chemical","wrong":[["Alcohol boiling: chemical; sugar fermenting: physical, since no flame is involved","It's the reverse."],["Both are physical","Fermenting makes a new substance."],["Both are chemical","Boiling doesn't make a new substance."]],"exp":"Boiling is a change of state; fermenting forms a new substance."}]}],"intro":["Some physical properties you get from your senses (odor, color, state) and some you need an instrument for (volume, density, melting and boiling point). The two example cards show the test of a change: if no new substance forms it's physical, and if a new substance forms it's chemical."]},{"name":"Chemical property examples","cards":[{"term":"Flammability","def":"The ability to burn. A chemical property, because burning makes new substances.","hook":"Flammable = can burn.","asks":[{"q":"Gasoline catches fire easily but water does not. What property is being compared?","right":"Flammability, a chemical property","wrong":[["Boiling point, a physical property of the two liquids being compared","Catching fire is about burning, not boiling."],["Flammability, a physical property","Burning makes new substances, so it's chemical."],["Density","Density isn't about catching fire."]],"exp":"Flammability is the ability to burn, a chemical property."},{"q":"Why is flammability a chemical property and not a physical one?","right":"Burning makes new substances","wrong":[["You can see a flame with your eyes, so it is observed without any instrument","Being visible doesn't make it physical."],["It can be measured","Physical properties can also be measured."],["It depends on the amount","That's about extensive properties."]],"exp":"Flammability is chemical because burning turns a substance into new substances."}]},{"term":"Rusting of steel","def":"Steel reacting with oxygen to form rust. A chemical property.","hook":"Rust = new substance.","asks":[{"q":"A steel bike left in the rain develops a flaky reddish coating. What happened?","right":"The steel reacted with oxygen to form rust","wrong":[["The steel melted a little in the rain and then hardened again as a coating","Rust is a new substance, not melted steel."],["The steel dissolved","Rust forms from a reaction."],["Paint washed onto it","Rust comes from the steel itself."]],"exp":"Steel reacting with oxygen to form rust is a chemical property in action."},{"q":"Is steel's ability to rust a physical or chemical property?","right":"Chemical: rust is a new substance","wrong":[["Physical, because you can see the color change from silver to reddish-brown","Seeing it doesn't make it physical; rust is new."],["Physical: no new substance forms","Rust is a new substance."],["Neither","It's a chemical property."]],"exp":"Rusting forms a new substance, so it's a chemical property."}]},{"term":"Digestion of food","def":"Food is broken down into new substances in your body. A chemical property.","hook":"Digest = new substances.","asks":[{"q":"Bread is chewed into smaller pieces and then broken down into new substances in your body. Which step is chemical?","right":"Breaking it down into new substances","wrong":[["Chewing it into small pieces, since the bread becomes smaller and softer","Chewing only changes size, a physical change."],["Neither step","Making new substances is chemical."],["Both steps equally","Chewing alone doesn't make new substances."]],"exp":"Digestion breaks food into new substances, a chemical process."},{"q":"Why is digestion listed as a chemical property of food?","right":"Food becomes new substances","wrong":[["Food changes shape and size as it moves through your stomach and intestines","Shape and size are physical."],["Food gets warm in your body","Warming alone isn't chemical."],["Food dissolves in water","Dissolving isn't the key point."]],"exp":"Food is broken down into new substances, so digestion shows a chemical property."}]},{"term":"Reacting with acid","def":"Whether a substance reacts with an acid, such as vinegar on chalk. A chemical property.","hook":"Acid reaction = chemical.","asks":[{"q":"Vinegar is poured on chalk and it bubbles. What does this show about chalk?","right":"It reacts with acid, a chemical property","wrong":[["It dissolves in vinegar, which is a physical property of the chalk","The bubbles show a reaction, not just dissolving."],["It has a low boiling point","Bubbles here come from a reaction, not boiling."],["It is a gas","Chalk is a solid."]],"exp":"Reacting with an acid such as vinegar is a chemical property."},{"q":"Which property tells you something about how a substance reacts, rather than how it looks?","right":"Whether it reacts with acid","wrong":[["Its color, which can change depending on what kind of light hits it","Color is physical."],["Its hardness","Hardness is physical."],["Its density","Density is physical."]],"exp":"Reacting with an acid is a chemical property."}]},{"term":"Other chemical properties","def":"The review sheet also lists reacting or not reacting with oxygen or water, being corrosive, being toxic, and pH.","hook":"Reacts or not, corrosive, toxic, pH.","asks":[{"q":"Which item from the review sheet's list is a chemical property?","right":"Being toxic","wrong":[["Being shiny, like a metal that reflects light well","Luster is a physical property."],["Being hard","Hardness is physical."],["Having a high melting point","Melting point is physical."]],"exp":"The review sheet lists corrosive, toxic, pH and reacting with oxygen or water as chemical properties."},{"q":"A label says a cleaner is corrosive. What kind of property is that?","right":"A chemical property","wrong":[["A physical property, because you can read it on the bottle without opening it","Where you read it doesn't matter; corrosive is chemical."],["An extensive property","It doesn't depend on amount."],["A change of state","It isn't a change of state."]],"exp":"Being corrosive is on the review sheet's list of chemical properties."}]}],"intro":["Each of these is about what a substance can turn into: burning, rusting, being digested, reacting with an acid. You only see a chemical property when the substance changes into something new."]},{"name":"Physical and chemical changes","cards":[{"term":"Physical change","def":"Something about how a substance looks or measures (its state, shape or size) changes, but what it is made of does NOT. Chemical bonds are not broken. Example: boiling or freezing water.","hook":"Same stuff, new look.","asks":[{"q":"Which of these is a physical change?","right":"Crushing a can","wrong":[["Burning a piece of paper until only ash and smoke are left behind","Burning makes new substances."],["Rusting a nail","Rust is a new substance."],["Digesting food","Digestion makes new substances."]],"exp":"Crushing changes shape only; the metal's composition stays the same."},{"q":"Water freezes into ice. What happens to its chemical bonds?","right":"They are not broken","wrong":[["They break apart and then form again in a new way as the water cools","A physical change doesn't break bonds."],["They all break","Bonds aren't broken."],["New bonds form a new substance","Ice is still water."]],"exp":"In a physical change, composition stays the same and bonds aren't broken."}]},{"term":"Chemical change","def":"A given substance becomes a new substance or substances with different properties and different composition. The atoms are reorganized.","hook":"New stuff.","asks":[{"q":"Which of these is a chemical change?","right":"Baking a cake","wrong":[["Melting butter in a pan so that it can be mixed into the batter","Melting is physical."],["Cutting an apple","Cutting is physical."],["Boiling water","Boiling is physical."]],"exp":"Baking turns the ingredients into new substances."},{"q":"In a chemical change, what happens to the atoms?","right":"They are reorganized into new substances","wrong":[["They stay arranged the same way but move farther apart from each other","That describes a change of state."],["They disappear","Atoms are reorganized, not lost."],["Nothing happens to them","They are reorganized."]],"exp":"In a chemical change the atoms are reorganized into new substances with different properties."}]},{"term":"Reaction","def":"Another name for a chemical change. Example: in a Bunsen burner methane reacts with oxygen to form carbon dioxide and water.","hook":"Reaction = chemical change.","asks":[{"q":"A Bunsen burner burns methane with oxygen to make carbon dioxide and water. What is this?","right":"A reaction","wrong":[["A physical change, because the methane only changes from one state to another","New substances form."],["A mixture","New substances formed."],["A change of state","Methane became new substances."]],"exp":"A reaction is a chemical change; methane and oxygen become new substances."},{"q":"A teacher says, \"This reaction makes a gas.\" What kind of change is she describing?","right":"A chemical change","wrong":[["A physical change, because gases are always made by heating something up","Reaction means chemical change."],["A change of state","A reaction is chemical."],["A separation","A reaction makes new substances."]],"exp":"Reaction is another name for a chemical change."}]}],"intro":["This is the main idea of the deck. A physical change alters how something looks or what state it's in, but not what it's made of; no bonds break. A chemical change (also called a reaction) reorganizes the atoms into new substances with new properties."]},{"name":"Signs of a chemical change","cards":[{"term":"Precipitate","def":"A solid that forms when two pure substances react. A sign that a new substance was made.","hook":"New solid = chemical.","asks":[{"q":"Two clear liquids are mixed and a cloudy solid appears. What does this solid suggest?","right":"A new substance formed","wrong":[["One of the liquids froze when the two of them were poured together","A precipitate comes from a reaction."],["The liquids didn't mix","They mixed and reacted."],["Nothing changed","A new solid is a sign of change."]],"exp":"A precipitate is a new solid, a sign of a chemical change."},{"q":"Which observation is a precipitate?","right":"A solid forming when two liquids mix","wrong":[["Ice forming when liquid water is put in a freezer overnight","That's freezing, a physical change."],["Sand settling in water","Sand was already a solid."],["Salt left after water evaporates","That's a physical separation."]],"exp":"A precipitate is a solid that forms when substances react."}]},{"term":"Gas given off","def":"Bubbles form because a new gas is made. A sign of a chemical change. Odor is a physical property, so a smell alone is not a sign.","hook":"Bubbles = new gas.","asks":[{"q":"Baking soda and vinegar fizz when mixed. What does the fizzing show?","right":"A new gas formed","wrong":[["The vinegar is boiling because the baking soda heated it up quickly","The bubbles are a new gas, not boiling."],["Air was trapped in the powder","The gas is made by a reaction."],["Nothing changed","Bubbles from mixing are a sign of a reaction."]],"exp":"Bubbles of a new gas are a sign of a chemical change."},{"q":"A student smells something sharp in a beaker and says a chemical change happened. What is wrong with this reasoning?","right":"Odor alone isn't a sign","wrong":[["Nothing is wrong, since any smell always comes from a chemical reaction","Odor is a physical property."],["Smells only come from gases","Odor alone still isn't a sign."],["Chemical changes never smell","A smell just isn't enough evidence."]],"exp":"Odor is a physical property, so a smell alone isn't a sign of a chemical change."}]},{"term":"Color change","def":"When a mixture turns a new shade, that can show a new substance was made.","hook":"New color = maybe new substance.","asks":[{"q":"A cut apple turns brown in the air. Which sign suggests a chemical change?","right":"The new color","wrong":[["The smaller size of the apple pieces after it has been cut up","Cutting is physical."],["The apple stays solid","Staying solid isn't a sign of change."],["Its shape","Shape is physical."]],"exp":"A new color can show that a new substance was made."},{"q":"Why is a color change only a possible sign of a chemical change, not proof?","right":"Color can change without a new substance","wrong":[["A color change always means a new substance was made in a reaction","A color change alone isn't proof."],["Color is a chemical property","Color is physical."],["Colors never change in reactions","They often do."]],"exp":"A new color can show a new substance, but it is a clue, not proof (adding food coloring changes color too)."}]},{"term":"Temperature change","def":"The mixture gets hotter or colder on its own as the reaction happens.","hook":"Heats or cools by itself.","asks":[{"q":"Two solutions are mixed and the beaker gets hot on its own. What does this suggest?","right":"A chemical change","wrong":[["A physical change, because heating something only changes how fast it moves","Getting hot on its own is a sign of a reaction."],["Nothing; beakers always warm up","A beaker doesn't warm up by itself."],["Boiling","No boiling is described."]],"exp":"A mixture getting hotter or colder on its own is a sign of a chemical change."},{"q":"Two liquids are mixed in a test tube, and the tube turns cold by itself without being cooled. Which sign is this?","right":"A temperature change","wrong":[["A precipitate, since a solid must form whenever two liquids are mixed","No solid forming is described."],["A gas given off","No bubbles are described."],["Light given off","No glow is described."]],"exp":"Getting colder on its own is a temperature change, a sign of a reaction."}]},{"term":"Light given off","def":"A flame or glow shows that a reaction is releasing energy you can see.","hook":"Glow = reaction.","asks":[{"q":"A glow stick glows after you bend it. Which sign of a chemical change is this?","right":"Light given off","wrong":[["A precipitate, because something inside the stick turns into a solid","Nothing solid is described."],["A color change","It's a glow, light given off."],["A gas given off","No bubbles."]],"exp":"A glow shows a reaction giving off energy as light."},{"q":"A light bulb glows when switched on. Why isn't that a sign of a chemical change?","right":"No new substance forms","wrong":[["It is a chemical change, because any light means a reaction is happening","Light alone isn't proof; the bulb doesn't change."],["Light bulbs don't give off light","They do."],["It isn't hot","Heat isn't the point."]],"exp":"A flame or glow from a reaction is a sign, but a bulb glowing makes no new substance."}]}],"intro":["You can't see atoms rearrange, so you look for clues: a new solid (precipitate), bubbles of a new gas, a new color, a temperature change on its own, or light. These are clues, not proof. A smell alone doesn't count, because odor is a physical property."]},{"name":"Key cases","cards":[{"term":"Melting","def":"Solid to liquid. A physical change of state.","hook":"Melting is physical.","asks":[{"q":"Butter left in a hot pan turns from a solid into a liquid. What happens to its particles?","right":"They speed up and become less organized","wrong":[["They slow down and settle into a more organized pattern than before","That is freezing."],["They break apart into new substances","Melting is a physical change."],["They stop moving","Particles speed up when something melts."]],"exp":"Melting is solid to liquid: the particles speed up and become less organized."},{"q":"A chocolate bar melts in your pocket. What kind of change is it?","right":"Physical: still chocolate","wrong":[["Chemical, because it changed from a solid into a liquid","A change of state is physical."],["Chemical, because it got warm","Warming alone doesn't make a change chemical."],["Neither; nothing changed","Its state changed."]],"exp":"Melting is a physical change: the substance stays the same."},{"q":"Which of these is the same kind of change as melting ice?","right":"Melting a candle on a hot plate","wrong":[["Burning a candle until the wax is used up and only smoke is left","Burning is chemical."],["Rusting a nail","Rusting is chemical."],["Fermenting sugar","Fermenting is chemical."]],"exp":"Melting is always a physical change of state."},{"q":"Ice is melted and the water is refrozen. What does this show about melting?","right":"It is physical; the water is still water","wrong":[["It is chemical, because the ice can't come back after the water is frozen","It comes back; melting is physical."],["It made a new substance","It's still water."],["It broke the water molecules","Molecules stay intact."]],"exp":"Melting is a physical change of state."}]},{"term":"Boiling","def":"Liquid to gas. A physical change of state.","hook":"Boiling is physical.","asks":[{"q":"A student says boiling water is chemical because bubbles form. What is the best correction?","right":"The bubbles are water vapor","wrong":[["The student is right, because bubbles always mean that a new gas was made","These bubbles are still water."],["The bubbles are hydrogen gas","Boiling doesn't split water."],["The bubbles are oxygen gas","Boiling doesn't split water."]],"exp":"Boiling is a physical change: the bubbles are water as a gas."},{"q":"Which pair contains one physical change and one chemical change?","right":"Boiling water; electrolysis of water","wrong":[["Boiling water; melting ice, since both of them require heat to happen","Both are physical."],["Rusting; combustion","Both are chemical."],["Melting; freezing","Both are physical."]],"exp":"Boiling is physical; electrolysis splits water into new substances."}]},{"term":"Electrolysis of water (decomposition)","def":"An electric current splits water (H₂O) into hydrogen (H₂) and oxygen (O₂) gases. A chemical change: two H₂O make two H₂ and one O₂.","hook":"Electric current breaks bonds.","asks":[{"q":"An electric current is passed through water and two gases bubble out. What are they?","right":"Hydrogen and oxygen","wrong":[["Water vapor from both ends, since the current heats the water until it boils","Electrolysis splits water."],["Carbon dioxide and water","Those come from burning methane."],["Oxygen and rust","Rust is iron oxide."]],"exp":"Electrolysis splits water (H₂O) into hydrogen (H₂) and oxygen (O₂)."},{"q":"In electrolysis, 2 H₂O make 2 H₂ and 1 O₂. Why is this a decomposition?","right":"One substance breaks into two","wrong":[["Two substances combine to form one new and different substance","That is synthesis."],["One element pushes another out of a compound","That is single displacement."],["Two compounds swap partners","That is double displacement."]],"exp":"Decomposition breaks one substance into two or more; water becomes hydrogen and oxygen."}]},{"term":"Combustion (burning)","def":"A chemical change in which a substance reacts with oxygen, giving off heat and light and forming new substances. Burning wood leaves ash and gases.","hook":"Fire = new substances.","asks":[{"q":"Wood burns in a fireplace and leaves ash. Which change happened?","right":"A chemical change: new substances formed","wrong":[["A physical change, because the wood only changed from a solid to a gas and ash","Ash and gases are new substances."],["Melting","Wood doesn't melt into ash."],["A separation","Burning makes new substances."]],"exp":"Combustion reacts a substance with oxygen, giving off heat and light and forming new substances."},{"q":"What does every combustion need, according to your card?","right":"Oxygen","wrong":[["Water, because burning can't happen unless the fuel is wet enough first","Combustion uses oxygen."],["An electric current","That's electrolysis."],["An acid","That's not part of combustion."]],"exp":"In combustion a substance reacts with oxygen."}]},{"term":"Rusting","def":"Iron combines with oxygen to form rust (iron oxide). A chemical change.","hook":"Iron + oxygen = rust.","asks":[{"q":"An iron gate rusts. Which substances combined?","right":"Iron and oxygen","wrong":[["Iron and hydrogen, which come from the water that falls on the gate as rain","Rust is iron oxide."],["Iron and carbon dioxide","Rust is iron oxide."],["Steel and paint","Rust forms from iron and oxygen."]],"exp":"Iron combines with oxygen to form rust (iron oxide)."},{"q":"Rusting is iron + oxygen making one new substance. Which type of reaction is that?","right":"Synthesis","wrong":[["Decomposition, because the iron breaks down and falls apart into flakes","Two substances combine into one."],["Single displacement","No element is pushed out."],["Double displacement","No two compounds swap."]],"exp":"Two substances combining to form something new is synthesis."}]}],"intro":["These are the cases your class used to practice sorting changes. Melting and boiling only change state, so they are physical. Electrolysis, combustion and rusting all make new substances, so they are chemical."]},{"name":"Types of reactions","cards":[{"term":"Synthesis","def":"Two or more substances combine to form something NEW.","hook":"Synthesis = build up.","asks":[{"q":"Hydrogen and oxygen combine to form water. Which type of reaction is this?","right":"Synthesis","wrong":[["Decomposition, because the hydrogen and oxygen are broken into water","Decomposition breaks one substance into two or more."],["Single displacement","No element is pushed out."],["Double displacement","No two compounds swap."]],"exp":"Two or more substances combining to form something new is synthesis."},{"q":"Synthesis is the reverse of which reaction type?","right":"Decomposition","wrong":[["Double displacement, since both of them involve two substances at the start","Synthesis builds up; decomposition breaks down."],["Single displacement","That's an element pushing another out."],["Combustion","Combustion is reacting with oxygen."]],"exp":"Synthesis builds something up; decomposition breaks something down."}]},{"term":"Decomposition","def":"A substance breaks down to make two or more substances. Electrolysis of water is an example.","hook":"Decompose = break apart.","asks":[{"q":"Heating a compound breaks it into a metal and a gas. Which type of reaction is this?","right":"Decomposition","wrong":[["Synthesis, because two products were made from the substance by heating it","Synthesis combines substances."],["Single displacement","No element pushes another out."],["Doub
