ave almost no kinetic energy), so nothing can be colder. The Kelvin scale starts at this point, so it has no negative numbers."},{"k":"d","prompt":"\"Beaker, what are the ways water can change between the states of matter?\"","model":"Melting (ice to water) and freezing (water to ice); evaporation or boiling (water to steam) and condensation (steam to water); sublimation (ice straight to vapor) and deposition (vapor straight to ice, like frost). Melting, evaporation and sublimation add energy (particles speed up); freezing, condensation and deposition remove energy (particles slow down). All are physical changes and the molecules stay H₂O."}],"topic":"States of matter"},{"id":"R2","type":"frq","title":"Review FRQ 2: Blobby on a scooter","stem":"Blobby is traveling to the airport and must declare everything he is carrying. He pulls out a card that lists colloids, their structures and examples, but they are all mixed up. Straighten out the card. Structures (each used once): solid in a gas, liquid in a gas, gas in a liquid, liquid in a liquid, solid in a liquid, liquid in a solid, solid in a solid, gas in a solid. Colloid names: sol, solid sol (used twice), foam, gel, emulsion, aerosol (used twice). Examples: milk, whipped cream, fog, jelly or cheese, pumice stone, colored glass or gemstones, paint or cell fluid, smoke.","data":["Note: on the review sheet the structure list repeated \"solid in a gas\" and \"liquid in a gas\". The teacher said in class that was a mistake. The two repeats should be \"solid in a liquid\" and \"liquid in a solid\", which is how this question lists them."],"parts":[{"k":"a","prompt":"Match each structure with its colloid name.","model":"Solid in a gas: aerosol. Liquid in a gas: aerosol. Gas in a liquid: foam. Liquid in a liquid: emulsion. Solid in a liquid: sol. Liquid in a solid: gel. Solid in a solid: solid sol. Gas in a solid: solid sol."},{"k":"b","prompt":"Match each structure with its example.","model":"Solid in a gas: smoke. Liquid in a gas: fog. Gas in a liquid: whipped cream. Liquid in a liquid: milk. Solid in a liquid: paint or cell fluid. Liquid in a solid: jelly or cheese. Solid in a solid: colored glass or gemstones. Gas in a solid: pumice stone."},{"k":"c","prompt":"Which two names are used twice, and why?","model":"Aerosol is used for both solid in a gas (smoke) and liquid in a gas (fog). Solid sol is used for both solid in a solid (colored glass) and gas in a solid (pumice stone). The name depends on the medium that holds the particles: a gas gives an aerosol and a solid gives a solid sol."},{"k":"d","prompt":"How could Blobby tell that fog is a colloid and not a solution?","model":"Shine a beam of light through it. Colloid particles (about 1 to 1000 nm) scatter the light so the beam is visible (the Tyndall effect); a true solution would not scatter the beam. Colloids are also stable and do not settle on standing."}],"topic":"Colloids"},{"id":"R3","type":"frq","title":"Review FRQ 3: Ada Twist defining lab","stem":"On the workbench there is a clear liquid that is thick and smells like grape jelly. It has a pH of 4.5 and a density of 3.4 g/mL. The chemical's data sheet says that it will react with bases and metals. A second liquid is clear and smells like bubble gum. It has a density of 1.2 g/mL and a pH of 9.2. Its data sheet says it will NOT react with metals but it will react with acids. Ada sees that when the two clear liquids are combined they make a bubbly, pink liquid with a purple solid sinking to the bottom of her flask.","data":[],"parts":[{"k":"a","prompt":"List the physical properties that you can see in this description.","model":"Liquid 1: clear, thick, smells like grape jelly, density 3.4 g/mL. Liquid 2: clear, smells like bubble gum, density 1.2 g/mL. (These can be observed or measured without changing the substance. Density is also intensive.)"},{"k":"b","prompt":"List the chemical properties that you can see in this description.","model":"Liquid 1: pH of 4.5 (acidic); reacts with bases; reacts with metals. Liquid 2: pH of 9.2 (basic); does not react with metals; reacts with acids. (A chemical property is the ability to change into a new substance, or not to change.)"},{"k":"c","prompt":"Decide if this is a physical or chemical change. Give evidence from the description to back up your response.","model":"Chemical change. Evidence: bubbles formed (a gas was given off), the color changed to pink, and a purple solid formed from two liquids (a precipitate). Each is a sign that a new substance was made."}],"topic":"Properties"},{"id":"R4","type":"frq","title":"Review FRQ 4: Elmo is thinking","stem":"Elmo read the chemistry book and is trying to get his thoughts in order. Help him compare these ideas.","data":[],"parts":[{"k":"a","prompt":"What is the difference between a pure substance and a mixture?","model":"A pure substance (an element or a compound) always has the same composition and cannot be broken down by physical means. A mixture has two or more substances that keep their own properties, can vary in amounts and can be separated by physical means."},{"k":"b","prompt":"Compare and contrast chemical and physical changes.","model":"Both involve changes to matter and both can involve energy. A physical change makes no new substance (changes of state, breaking, cutting, tearing, dissolving); a chemical change makes a new substance, shown by a precipitate, gas, color change, temperature change or light."},{"k":"c","prompt":"Compare and contrast heterogeneous and homogeneous mixtures.","model":"Both are mixtures whose parts keep their own properties and can be separated physically. A homogeneous mixture is the same throughout (salt water, air, steel); a heterogeneous mixture has different phases you can see (pizza, sand in water, a salad)."},{"k":"d","prompt":"Compare and contrast elements and compounds.","model":"Both are pure substances. An element is one type of atom, is on the periodic table and cannot be broken down by physical or chemical means. A compound is two or more elements in a set ratio, can be broken down by chemical but not physical means, and has properties different from its elements."},{"k":"e","prompt":"Compare and contrast filtration and distillation.","model":"Both are physical ways to separate a mixture. Filtration passes a mixture through a filter to remove a solid from a liquid (uses particle size). Distillation boils a solution and condenses the vapor to collect the liquid, leaving the dissolved solid behind (uses boiling point)."}],"topic":"Classifying matter"},{"id":"F1","type":"frq","title":"FRQ 1: Paper","stem":"A student tears a sheet of paper into small pieces and places them on a watch glass. The student then ignites the pieces.","data":[],"parts":[{"k":"a","prompt":"Classify tearing and burning as physical or chemical change.","model":"Tearing = physical change. Burning = chemical change."},{"k":"b","prompt":"Justify each classification using the idea of chemical composition.","model":"Tearing only changes size and shape; every small piece has the same composition as the whole sheet. Burning changes the paper into new substances with different composition and properties (ash, carbon dioxide, water vapor and other gases)."},{"k":"c","prompt":"Give two observations during burning that indicate a chemical change.","model":"Any two: light or flame, heat given off, smoke or gas produced, color change to black or gray ash."},{"k":"d","prompt":"Can the original paper be recovered from the ash? Explain.","model":"No. A chemical change forms new substances, and the ash cannot simply be turned back into paper. The torn pieces, however, could be taped back together, because tearing was only a physical change."}],"topic":"Physical vs chemical change"},{"id":"F2","type":"frq","title":"FRQ 2: Tea light","stem":"A student places a tea light on a hot plate at its highest setting and watches the wax melt. Later the student lights a different tea light and observes it at the start and again 20 minutes later.","data":[],"parts":[{"k":"a","prompt":"Classify melting the wax and burning the tea light as physical or chemical.","model":"Melting = physical. Burning = chemical."},{"k":"b","prompt":"Explain the evidence for each, using what happens to the substance itself.","model":"Melted wax is still wax and can cool and solidify again, so no new substance formed. Burning produces a flame, heat and light, and the wax reacts with oxygen to form new substances such as carbon dioxide and water vapor."},{"k":"c","prompt":"Name one physical property of the wax that changed during melting.","model":"The state changed from solid to liquid. (Also acceptable: shape or texture.)"},{"k":"d","prompt":"The student says \"the candle got smaller when it burned, so matter disappeared.\" Correct this.","model":"Matter did not disappear. The wax reacted with oxygen and became gases (carbon dioxide and water vapor) that spread into the air. The atoms were rearranged into new substances."}],"topic":"Physical vs chemical change"},{"id":"F3","type":"frq","title":"FRQ 3: Steel wool","stem":"A student masses a watch glass with a piece of steel wool on it, pulls the steel wool into a fine mesh, lights the edge, lets it cool, then masses the watch glass and the burned steel wool again.","data":["Mass of steel wool + watch glass before burning = 45.20 g","Mass of iron(III) oxide + watch glass after burning = 45.58 g"],"parts":[{"k":"a","prompt":"Calculate the change in mass. Did the mass increase or decrease?","model":"45.58 g - 45.20 g = +0.38 g. The mass increased."},{"k":"b","prompt":"Explain why this happened, in terms of the substances involved.","model":"Iron in the steel wool combined with oxygen from the air to form iron(III) oxide. The extra 0.38 g is the mass of the oxygen that joined the iron."},{"k":"c","prompt":"Is this a physical or chemical change? Give two pieces of evidence.","model":"Chemical change. Evidence: a new substance (iron(III) oxide) formed with different properties; the steel wool glowed and gave off heat and light; the mass changed because oxygen was added."},{"k":"d","prompt":"A classmate predicted the mass would decrease because \"it burned away.\" Explain the error.","model":"The classmate forgot that oxygen from the air is a reactant. Nothing was lost: oxygen atoms were added to the iron, so the solid product has more mass than the starting iron."}],"topic":"Evidence of change"},{"id":"F4","type":"frq","title":"FRQ 4: Zinc in hydrochloric acid","stem":"A post-1982 penny has a zinc core with a thin copper coating. A student cuts into the penny to expose the core, masses it, places it in 10.0 mL of 0.1 M hydrochloric acid overnight, then rinses and dries it and masses it again.","data":["Mass before = 2.50 g","Mass after = 2.31 g"],"parts":[{"k":"a","prompt":"Calculate the mass lost to the reaction.","model":"2.50 g - 2.31 g = 0.19 g lost."},{"k":"b","prompt":"Classify the change and give two indicators you would see.","model":"Chemical change. Indicators: gas bubbles form on the penny; the zinc is used up (mass is lost); the solution may change appearance. A new substance (a zinc compound in solution and a gas) forms."},{"k":"c","prompt":"Why did the student cut into the penny first?","model":"The copper coating protects the zinc. Cutting through it exposes the zinc core so the acid can react with it."},{"k":"d","prompt":"Why must the penny be rinsed and dried before the final mass?","model":"Leftover acid and water would add mass or keep reacting, giving an inaccurate final mass. Rinsing and drying makes sure only the remaining penny is massed."}],"topic":"Evidence of change"},{"id":"F5","type":"frq","title":"FRQ 5: Vinegar and TUMS","stem":"TUMS is calcium carbonate (chalk). A student places a TUMS tablet in a beaker, adds 20.0 mL of vinegar, observes, then filters the mixture and dries the filter paper overnight.","data":["Mass of filter paper = 0.85 g","Mass of filter paper + material after drying = 1.12 g"],"parts":[{"k":"a","prompt":"Calculate the mass of the solid left on the filter paper.","model":"1.12 g - 0.85 g = 0.27 g."},{"k":"b","prompt":"Describe an observation that shows a chemical change happened.","model":"Bubbles of gas (carbon dioxide) formed as the tablet reacted with the vinegar, and the tablet got smaller."},{"k":"c","prompt":"What do you think the solid on the filter paper is? Explain.","model":"Leftover tablet material that did not react: unreacted calcium carbonate and/or the non-reacting ingredients (binders and fillers) in the tablet."},{"k":"d","prompt":"Filtering is which kind of separation method, and what property does it use?","model":"Filtration is a physical separation method. It uses the difference in state or particle size: undissolved solid is trapped by the filter paper while liquid passes through."}],"topic":"Evidence of change"},{"id":"F6","type":"frq","title":"FRQ 6: Classifying matter","stem":"Classify each sample as an element, compound or mixture. For each mixture, say homogeneous or heterogeneous. Samples: (i) gold, Au; (ii) salt water, NaCl & H₂O; (iii) carbon dioxide, CO₂; (iv) air, N₂ & O₂ & Ar & CO₂; (v) bromine, Br₂; (vi) a jar of jelly beans.","data":[],"parts":[{"k":"a","prompt":"Give the classification of each of the six samples.","model":"(i) element. (ii) mixture, homogeneous (a solution). (iii) compound. (iv) mixture, homogeneous. (v) element. (vi) mixture, heterogeneous."},{"k":"b","prompt":"A student says \"Br₂ must be a compound because it is a molecule.\" Explain what is wrong.","model":"A molecule is two or more atoms bonded together, but it can be made of one type of atom. Br₂ contains only bromine atoms, so it is an element. A compound needs two or more different types of atoms. Atom does not equal element and molecule does not equal compound; element, compound and mixture describe bulk samples, while atom and molecule describe particles."}],"topic":"Classifying matter"},{"id":"F7","type":"frq","title":"FRQ 7: Separating a mixture","stem":"A mixture contains sand, table salt and water (the salt is dissolved).","data":[],"parts":[{"k":"a","prompt":"Design a plan to recover the sand, the salt and the pure water as three separate things. Name each technique.","model":"Step 1: filtration removes the sand (it stays on the filter paper). Step 2: distillation of the salt water (the filtrate): boil it, collect and condense the steam as pure water, and the salt stays behind in the flask. (Evaporating the water also recovers the salt, but not the water.)"},{"k":"b","prompt":"For each technique, name the physical property that makes it work.","model":"Filtration uses state or particle size (undissolved solid versus liquid). Distillation uses different boiling points (water boils off, salt does not)."},{"k":"c","prompt":"Are your separation steps physical or chemical? Justify.","model":"Physical. The sand, salt and water keep their identities; no new substances form and no bonds are broken."},{"k":"d","prompt":"Explain why separating water into hydrogen and oxygen requires a different type of method.","model":"Water is a compound. Its H and O atoms are bonded together, so it can only be separated into elements by chemical methods (such as electrolysis, which uses an electric current) that break bonds and form new substances (H₂ and O₂)."}],"topic":"Separating mixtures"},{"id":"F8","type":"frq","title":"FRQ 8: Water, three states and electrolysis","stem":"Water can be a solid, a liquid or a gas, and it can also be split by an electric current.","data":[],"parts":[{"k":"a","prompt":"Describe the arrangement and motion of water molecules in ice, liquid water and steam.","model":"Ice: molecules locked in rigid positions, close together (vibrating). Liquid: still close together but able to move around and slide past each other. Steam: far apart and moving randomly, hitting each other and the container walls."},{"k":"b","prompt":"Explain why melting and boiling are physical changes.","model":"In all three states the H₂O molecules are still intact. Only the motion and distances between molecules change, so the substance is still water."},{"k":"c","prompt":"When an electric current is run through water, hydrogen and oxygen gases form. Classify this change and explain, naming the formulas of the particles before and after.","model":"Chemical change (decomposition, called electrolysis). H₂O molecules are replaced by H₂ and O₂ molecules, which are different substances with different properties."},{"k":"d","prompt":"State how many molecules of H₂ form for each O₂ when two water molecules decompose.","model":"Two H₂O make two H₂ and one O₂, so two H₂ molecules form for each O₂."}],"topic":"States of matter"},{"id":"F9","type":"frq","title":"FRQ 9: Iron and sulfur (extra)","stem":"A student mixes gray iron filings with yellow sulfur powder. A magnet held over the mixture pulls out the iron and leaves the yellow powder behind. The student then strongly heats a fresh sample of the mixture. It glows, and after cooling a dark solid remains. The magnet does not pick up this solid.","data":[],"parts":[{"k":"a","prompt":"Classify the iron and sulfur before heating and the dark solid after heating as element, compound or mixture.","model":"Before heating: a mixture (of two elements). After heating: a compound (iron sulfide)."},{"k":"b","prompt":"Explain how the magnet observation supports your classification of the first sample.","model":"Each substance in a mixture keeps its own properties. The iron is still magnetic and the sulfur is still yellow, so a physical method can pull them apart."},{"k":"c","prompt":"Classify heating as physical or chemical and give two pieces of evidence.","model":"Chemical change. Evidence: glowing (light and heat given off) and a new dark solid with different properties from either starting material (it is not attracted to the magnet)."},{"k":"d","prompt":"Could you now separate the iron from the dark solid with the magnet? Explain what kind of process would be needed.","model":"No. The iron is chemically combined, so it has lost its magnetic property. Separating a compound into its elements requires a chemical change, not a physical method."}],"topic":"Classifying matter"},{"id":"F10","type":"frq","title":"FRQ 10: Heating a solid (extra)","stem":"A student heats a solid sample steadily and records its temperature every 2 minutes.","data":["Time (min): 0, 2, 4, 6, 8, 10, 12, 14, 16","Temperature (°C): -10, 0, 0, 0, 35, 70, 100, 100, 100"],"parts":[{"k":"a","prompt":"State what state or states are present at 0 min, 4 min, 9 min and 15 min.","model":"0 min: solid. 4 min: solid and liquid (melting). 9 min: liquid. 15 min: liquid and gas (boiling)."},{"k":"b","prompt":"Explain why the temperature stays constant from 2 to 6 minutes and from 12 to 16 minutes even though heat is still being added.","model":"During a change of state the added energy goes into changing the arrangement and attractions between particles instead of raising the temperature. The first plateau is melting and the second is boiling."},{"k":"c","prompt":"Give the melting point and boiling point from the data and say whether they are physical or chemical properties.","model":"Melting point 0 °C and boiling point 100 °C. Both are physical properties because they are measured without forming a new substance."},{"k":"d","prompt":"The data match water. Is water an element, compound or mixture? Does boiling it produce hydrogen and oxygen?","model":"Water is a compound. Boiling does not produce hydrogen and oxygen; it is a physical change and the gas is still H₂O. Electrolysis would be needed to split it."}],"topic":"States of matter"},{"id":"F11","type":"frq","title":"FRQ 11: Copper properties (extra)","stem":"A copper sample is reddish-brown and shiny. It can be hammered into a thin sheet, conducts electricity, melts at 1085 °C and has a density of 8.96 g/cm³. A copper roof left outside for many years slowly turns green.","data":[],"parts":[{"k":"a","prompt":"List three physical properties of copper from the description.","model":"Any three: reddish-brown color, shiny, can be hammered into sheets, conducts electricity, melting point 1085 °C, density 8.96 g/cm³."},{"k":"b","prompt":"Classify the change that turns the roof green and name the chemical property involved.","model":"Chemical change. Copper reacts with substances in the air to form a new green compound. The chemical property is copper's ability to react with substances in the air (corrode)."},{"k":"c","prompt":"A small piece and a large piece of copper are compared. Which property would be the same and which would be different, and what are these called?","model":"The density would be the same (an intensive property that does not depend on the amount). The mass and volume would differ (extensive properties that depend on the amount)."},{"k":"d","prompt":"The student cuts the copper sheet in half. Classify this and justify.","model":"Physical change. Only the size changes; each half is still copper with the same composition and properties."}],"topic":"Properties"},{"id":"F12","type":"frq","title":"FRQ 12: Baking a cake (extra)","stem":"A baker stirs flour, sugar, eggs and baking powder with milk to make a batter, melts butter in a pan, and then bakes the batter in an oven. The cake rises and turns golden brown.","data":[],"parts":[{"k":"a","prompt":"Classify the batter as element, compound or mixture and justify.","model":"Mixture. The ingredients are mixed together without being chemically combined and each keeps its own properties."},{"k":"b","prompt":"Classify melting the butter and justify.","model":"Physical change. Solid butter becomes liquid butter, a change of state; it is still butter and can solidify again."},{"k":"c","prompt":"Classify baking and give two pieces of evidence from the description.","model":"Chemical change. Evidence: the cake rises (gas is produced) and the color changes to golden brown."},{"k":"d","prompt":"Can the baker get the flour back out of the finished cake? Explain.","model":"No. Baking formed new substances, so the original ingredients cannot be recovered by physical means."}],"topic":"Physical vs chemical change"},{"id":"F13","type":"frq","title":"FRQ 13: Separating seawater (extra)","stem":"A sample of seawater contains water, dissolved salt, and some sand and bits of seaweed.","data":[],"parts":[{"k":"a","prompt":"Classify the sample and identify which parts make it heterogeneous.","model":"It is a mixture. The sand and seaweed make it heterogeneous (visible, uneven); the dissolved salt in water is homogeneous."},{"k":"b","prompt":"Name a method to remove the sand and seaweed and explain why it works.","model":"Filtration. The sand and seaweed are solid particles too large to pass through the filter paper, but the water with dissolved salt passes through."},{"k":"c","prompt":"Describe how to collect pure water and salt from the filtered liquid.","model":"Distillation: heat the liquid so the water boils, cool the vapor in a condenser and collect the liquid water. The salt stays behind in the flask. Evaporating the water would also leave the salt but would not collect the water."},{"k":"d","prompt":"Explain why all of these are physical changes and whether the water and the salt keep their identities.","model":"Each method only separates the substances using differences in physical properties (particle size, boiling point). No new substances form, and the water is still H₂O and the salt is still NaCl."}],"topic":"Separating mixtures"},{"id":"F14","type":"frq","title":"FRQ 14: Nail and peroxide (extra)","stem":"A student carefully pours hydrogen peroxide over an iron nail in a large beaker. Bubbles form on the surface of the nail, the beaker feels warm, and the liquid and nail slowly turn orange-brown. After the nail is rinsed and dried overnight it is covered with a flaky orange-brown solid.","data":[],"parts":[{"k":"a","prompt":"List three observations that indicate a chemical change.","model":"Bubbles forming (gas given off), the beaker feeling warm (temperature change), and the color change to orange-brown."},{"k":"b","prompt":"The dried nail is covered in a flaky orange-brown solid. What does this solid show about the iron?","model":"It is a new substance (rust, iron oxide) with different properties from the gray, shiny iron. Iron combined with oxygen, so the iron underwent a chemical change."},{"k":"c","prompt":"Classify the change as physical or chemical and justify it using the idea of new substances.","model":"Chemical change. New substances formed: a gas and a new solid with different properties from the nail and the peroxide."},{"k":"d","prompt":"Before the experiment, name two physical properties of the nail and one chemical property that this experiment shows.","model":"Physical properties: gray color, shiny luster, hard, solid, magnetic. Chemical property: iron can react (rust) with oxygen, or with peroxide, to form a new substance."}],"topic":"Evidence of change"},{"id":"F15","type":"frq","title":"FRQ 15: Milk, juice and salt water","stem":"A student has three clear glasses. One has salt water, one has milk, and one has orange juice with pulp that has stood on the counter for an hour. The student shines a flashlight beam through each glass.","data":[],"parts":[{"k":"a","prompt":"Classify each glass as a solution, a colloid or a suspension.","model":"Salt water: a solution. Milk: a colloid. Orange juice with pulp: a suspension."},{"k":"b","prompt":"Predict what the student sees when the beam passes through each glass, and name the effect.","model":"The beam is not visible in the salt water. It is visible in the milk because the colloid particles scatter the light (the Tyndall effect). The orange juice is cloudy and also shows the beam, but the pulp has settled to the bottom."},{"k":"c","prompt":"What happens to each glass if it is left standing for a day?","model":"Salt water: stays the same. Milk: stays mixed, since a colloid is stable and does not settle. Orange juice: more pulp settles at the bottom, because a suspension settles on standing."},{"k":"d","prompt":"Milk is a liquid dispersed in a liquid. Give the colloid name and the dispersed phase and dispersion medium.","model":"Milk is an emulsion. The dispersed phase is the fat droplets, which are present in the smaller quantity. The dispersion medium is the water-based liquid, present in the larger quantity."}],"topic":"Colloids"},{"id":"F16","type":"frq","title":"FRQ 16: Classifying colloids","stem":"A chef makes the following: a bowl of whipped cream, a cup of paint, a block of gelatin dessert, a can of whipped topping sprayed as a mist, and a loaf of pumice-textured sponge cake with gas pockets trapped in the solid.","data":[],"parts":[{"k":"a","prompt":"Give the structure of each (what is dispersed in what).","model":"Whipped cream: gas in a liquid. Paint: solid in a liquid. Gelatin dessert: liquid in a solid. Spray mist: liquid in a gas. Sponge cake: gas in a solid."},{"k":"b","prompt":"Give the colloid name for each.","model":"Whipped cream: foam. Paint: sol. Gelatin dessert: gel. Spray mist: aerosol. Sponge cake: solid sol."},{"k":"c","prompt":"Which two names on the review sheet are used for more than one structure, and what is the other structure for each?","model":"Aerosol is used for solid in a gas (smoke) as well as liquid in a gas (fog). Solid sol is used for solid in a solid (colored glass) as well as gas in a solid (pumice stone)."},{"k":"d","prompt":"Describe two properties that show paint is a colloid and not a suspension.","model":"Its particles are about 1 to 1000 nm and stay mixed without settling, and they scatter a beam of light (the Tyndall effect). They also move in a random zigzag path (Brownian movement)."}],"topic":"Colloids"}]},{"name":"True/False","mode":"practice","tips":["Read the whole statement. One wrong word makes a true-sounding statement false.","Check the subject: element, compound, mixture, atom and molecule are different ideas.","Statements with \"always\" or \"only\" are often false; statements about the definitions in the notes are often true."],"questions":[{"id":"T1","type":"tf","topic":"Classifying matter","stem":"Matter is anything that takes up space and has mass.","ans":true,"exp":"By definition, matter has both mass and volume."},{"id":"T2","type":"tf","topic":"States of matter","stem":"A gas has a fixed volume but no fixed shape.","ans":false,"exp":"A gas has neither a fixed volume nor a fixed shape: it takes the shape and volume of its container. A liquid is the state with a fixed volume but no fixed shape."},{"id":"T3","type":"tf","topic":"States of matter","stem":"In steam, the water molecules are still H₂O molecules.","ans":true,"exp":"Changes of state do not break the molecules apart; only motion and spacing change."},{"id":"T4","type":"tf","topic":"Physical vs chemical change","stem":"Melting an ice cube is a chemical change because the state changes.","ans":false,"exp":"Changes of state are physical changes. The substance is still water."},{"id":"T5","type":"tf","topic":"Properties","stem":"Density is an intensive property.","ans":true,"exp":"The density of a pure substance does not depend on how much of it you have."},{"id":"T6","type":"tf","topic":"Properties","stem":"Cutting a block of copper in half changes its density.","ans":false,"exp":"Density is intensive. Mass and volume both halve, so the ratio stays the same."},{"id":"T7","type":"tf","topic":"Properties","stem":"Mass and volume are extensive properties.","ans":true,"exp":"They depend on the amount of matter present."},{"id":"T8","type":"tf","topic":"Classifying matter","stem":"Every pure substance is an element.","ans":false,"exp":"Pure substances are either elements or compounds."},{"id":"T9","type":"tf","topic":"Separating mixtures","stem":"A compound can be separated into its elements by filtering.","ans":false,"exp":"Compounds require chemical methods (breaking bonds), such as electrolysis. Filtering is a physical method."},{"id":"T10","type":"tf","topic":"Classifying matter","stem":"Salt dissolved in water is a homogeneous mixture, also called a solution.","ans":true,"exp":"It is the same throughout, with visibly indistinguishable parts."},{"id":"T11","type":"tf","topic":"Classifying matter","stem":"A mixture has variable composition.","ans":true,"exp":"The amounts of its components can vary, unlike a pure substance."},{"id":"T12","type":"tf","topic":"Separating mixtures","stem":"Distillation separates substances using differences in boiling point.","ans":true,"exp":"The component with the lower boiling point vaporizes first and is condensed and collected."},{"id":"T13","type":"tf","topic":"Separating mixtures","stem":"Filtration can separate dissolved salt from water.","ans":false,"exp":"Dissolved particles pass through filter paper. Filtration separates undissolved solids from liquids."},{"id":"T14","type":"tf","topic":"Physical vs chemical change","stem":"Burning wood is a chemical change.","ans":true,"exp":"New substances (ash and gases such as carbon dioxide and water vapor) form."},{"id":"T15","type":"tf","topic":"Physical vs chemical change","stem":"Dissolving sugar in water is a chemical change.","ans":false,"exp":"The sugar is still sugar. The change is physical and the result is a solution."},{"id":"T16","type":"tf","topic":"Classifying matter","stem":"The formula Br₂ represents a compound because it has a subscript.","ans":false,"exp":"Br₂ has only one type of atom, so it is an element. A subscript only counts atoms."},{"id":"X1","type":"tf","topic":"Colloids","stem":"On the review sheet, a foam is a colloid made of a gas dispersed in a liquid.","ans":true,"exp":"Whipped cream is the example: gas bubbles spread through a liquid."},{"id":"X2","type":"tf","topic":"States of matter","stem":"At 0 K the particles of a substance have the maximum possible motion.","ans":false,"exp":"At 0 K (absolute zero) particles have the minimum possible motion; that is why nothing can be colder."},{"id":"X3","type":"tf","topic":"States of matter","stem":"Deposition is the change of a gas directly into a solid, such as frost forming on a window.","ans":true,"exp":"Deposition is the reverse of sublimation and removes energy as particles slow down."},{"id":"X4","type":"tf","topic":"States of matter","stem":"Sublimation is a chemical change because the solid disappears.","ans":false,"exp":"Sublimation is a physical change: the solid becomes a gas of the same substance, such as dry ice becoming carbon dioxide gas."},{"id":"X5","type":"tf","topic":"Properties","stem":"According to the review sheet, pH and reacting with metals are chemical properties.","ans":true,"exp":"A chemical property is the ability to change into a new substance, or not to change; the review lists pH and reacting or not reacting."},{"id":"X6","type":"tf","topic":"Classifying matter","stem":"A suspension is a heterogeneous mixture that settles upon standing.","ans":true,"exp":"Mud, juice with pulp and oil and water all separate if left alone."},{"id":"X7","type":"tf","topic":"Classifying matter","stem":"Steel and 18K gold are both homogeneous mixtures.","ans":true,"exp":"Both are alloys: metals mixed uniformly, so they are the same throughout."},{"id":"X9","type":"tf","topic":"Classifying matter","stem":"The slides classify gasoline as a homogeneous mixture.","ans":true,"exp":"Gasoline is the same throughout, so it is a homogeneous mixture (a solution)."},{"id":"X10","type":"tf","topic":"Physical vs chemical change","stem":"The growth of grass in a yard is a chemical change.","ans":true,"exp":"The textbook lists it with rusting and digestion: a plant makes new substances from air, water and soil."},{"id":"X11","type":"tf","topic":"Colloids","stem":"A colloid can be separated by simple filtration but not by a high-speed centrifuge.","ans":false,"exp":"It is the other way around: colloid particles pass through simple filters, but a high-speed centrifuge can separate them (for example cream from milk)."},{"id":"X8","type":"tf","topic":"Separating mixtures","stem":"In chromatography, the fixed phase is the part that carries the mixture along.","ans":false,"exp":"The mobile phase (such as water) carries the parts along; the fixed phase (such as the paper) does not move."},{"id":"X12","type":"tf","topic":"Colloids","stem":"Fog is an aerosol made of a liquid dispersed in a gas.","ans":true,"exp":"Tiny water droplets are spread through air, so fog is a liquid in a gas."},{"id":"X13","type":"tf","topic":"Colloids","stem":"Mayonnaise is an emulsion, which is a liquid dispersed in a liquid.","ans":true,"exp":"Oil droplets are spread through a water-based liquid."},{"id":"X14","type":"tf","topic":"Colloids","stem":"A beam of light is visible in a colloid but not in a true solution.","ans":true,"exp":"Colloid particles scatter light (the Tyndall effect). Solution particles are too small to scatter it."},{"id":"X15","type":"tf","topic":"Colloids","stem":"Colloid particles settle to the bottom when left standing.","ans":false,"exp":"Colloids are stable and do not settle. Suspensions are the mixtures that settle."},{"id":"X16","type":"tf","topic":"Colloids","stem":"Brownian movement is the smooth, straight-line motion of colloid particles.","ans":false,"exp":"It is a continuous, random zigzag path."},{"id":"X17","type":"tf","topic":"Colloids","stem":"In a colloid, the dispersion medium is the component present in the larger quantity.","ans":true,"exp":"The dispersed phase is the smaller amount, like a solute, and the medium is the larger amount, like a solvent."},{"id":"X18","type":"tf","topic":"Colloids","stem":"A gel is a gas dispersed in a liquid.","ans":false,"exp":"A gel is a liquid dispersed in a solid, such as jelly or cheese. A gas in a liquid is a foam."}]},{"name":"Labeling","mode":"practice","tips":["Click one label for every item, then press Check Answer. You earn partial credit: each correct item counts toward the point for the question.","Element, compound or mixture: look for the & first, then count capital letters.","Physical or chemical: ask whether a new substance forms. Changes of state, dissolving and crushing are physical."],"questions":[{"id":"L1","type":"label","topic":"Classifying matter","stem":"Label each material as an element, a compound or a mixture.","labels":["Element","Compound","Mixture"],"items":[{"t":"Br₂","ans":0,"exp":"Only one type of atom (bromine), even though it is a molecule."},{"t":"NaHCO₃","ans":1,"exp":"Contains Na, H, C and O atoms bonded in one fixed formula, and there is no & symbol."},{"t":"C₆H₁₂O₆ & H₂O","ans":2,"exp":"The & shows different substances sitting together (sugar and water)."},{"t":"Cu & Zn","ans":2,"exp":"Two different elements mixed, not bonded into one formula."},{"t":"Al","ans":0,"exp":"One capital letter and one type of atom."},{"t":"CO₂","ans":1,"exp":"Carbon and oxygen are bonded in a fixed ratio."}]},{"id":"L2","type":"label","topic":"Classifying matter","stem":"Label each material as an element, a compound or a mixture.","labels":["Element","Compound","Mixture"],"items":[{"t":"P₄","ans":0,"exp":"Four phosphorus atoms bonded together, still only one type of atom."},{"t":"N₂ & O₂ & Ar & CO₂ (air)","ans":2,"exp":"Several different substances with & between them."},{"t":"H₂SO₄","ans":1,"exp":"Hydrogen, sulfur and oxygen atoms in one formula."},{"t":"O₃","ans":0,"exp":"Only oxygen atoms."},{"t":"H₂O₂","ans":1,"exp":"Two different types of atoms bonded together, in a different ratio than water."},{"t":"NaCl & H₂O","ans":2,"exp":"Salt water: two substances mixed together."}]},{"id":"L3","type":"label","topic":"Physical vs chemical change","stem":"Label each change as a physical change or a chemical change.","labels":["Physical change","Chemical change"],"items":[{"t":"Iron metal melting","ans":0,"exp":"Liquid iron is still iron."},{"t":"Iron combining with oxygen to form rust","ans":1,"exp":"A new substance (iron oxide) forms."},{"t":"Sugar fermenting to form ethyl alcohol","ans":1,"exp":"A different substance forms."},{"t":"Wood burning in a fireplace","ans":1,"exp":"Ash and gases are new substances."},{"t":"Crushing rock salt","ans":0,"exp":"Smaller pieces with the same composition."},{"t":"Dissolving sugar in water","ans":0,"exp":"Same substances, just spread through the water."}]},{"id":"L4","type":"label","topic":"Physical vs chemical change","stem":"Label each change as a physical change or a chemical change.","labels":["Physical change","Chemical change"],"items":[{"t":"A popsicle melting on a warm day","ans":0,"exp":"Change of state only."},{"t":"Water boiling to form steam","ans":0,"exp":"The H₂O molecules remain intact."},{"t":"Electrolysis of water into H₂ and O₂","ans":1,"exp":"H₂O is replaced by different substances."},{"t":"Milk turning sour","ans":1,"exp":"New substances such as acids form, and the milk cannot turn back into fresh milk."},{"t":"The copper skin of the Statue of Liberty turning green","ans":1,"exp":"Copper reacts with substances in the air to form a new greenish coating."},{"t":"Salt water being distilled","ans":0,"exp":"A separation by boiling point; no new substances form."}]},{"id":"L5","type":"label","topic":"Colloids","stem":"Label each mixture as a solution, a colloid or a suspension.","labels":["Solution","Colloid","Suspension"],"items":[{"t":"Sugar completely dissolved in water","ans":0,"exp":"Smallest particles; it does not scatter light or settle."},{"t":"Milk","ans":1,"exp":"Fat droplets about 1 to 1000 nm spread through water; stable and scatters light."},{"t":"Muddy water that clears after sitting overnight","ans":2,"exp":"Large particles settle upon standing."},{"t":"Fog","ans":1,"exp":"Tiny liquid droplets spread through air; the beam of a flashlight is visible in it."},{"t":"Salt dissolved in water","ans":0,"exp":"A true solution is uniform and does not scatter a beam of light."},{"t":"Orange juice with pulp that sinks to the bottom","ans":2,"exp":"Pulp settles when the juice stands."}]},{"id":"D1","type":"diagram","topic":"Separating mixtures","stem":"This setup separates salt water by distillation. Label what happens at each numbered pin.","img":"distill","alt":"Distillation setup: a round flask of liquid on a hot plate, a slanted water-cooled tube leading to a second flask in a cold-water bath.","credit":"Image: Simple distillation apparatus, Wikimedia Commons (File:Simple_distillation_apparatus.png). Printed part numbers removed.","labels":["The mixture boils and the salt stays behind","The vapor condenses back into a liquid","Pure water collects"],"pins":[{"x":17,"y":78,"ans":0,"exp":"Distillation boils the salt water. Salt does not boil off, so it stays in this flask."},{"x":52,"y":55,"ans":1,"exp":"Distillation boils, then condenses the vapor. This cooled tube turns the vapor back into a liquid."},{"x":88,"y":79,"ans":2,"exp":"The condensed liquid is pure water. Salt water gives pure water, and the salt stays in the first flask."}]},{"id":"D2","type":"diagram","topic":"Separating mixtures","stem":"This paper strip shows a mixture of plant pigments separated by chromatography. Label each numbered pin.","img":"chrom","alt":"A tall paper strip with a faint circle near the bottom and colored bands of yellow, green and gray at different heights.","credit":"Photo: Chromatography of chlorophyll, step 7, Wikimedia Commons (File:Chromatography_of_chlorophyll_-_Step_7.jpg).","labels":["Where the mixture started","A separated part of the mixture","The fixed phase (the paper)"],"pins":[{"x":49,"y":87,"ans":0,"exp":"The mixture is spotted near one end. The mobile phase then carries its parts across the paper."},{"x":50,"y":65,"ans":1,"exp":"Each part of the mixture travels a different distance, so the parts end up as separate bands."},{"x":13,"y":27,"ans":2,"exp":"The paper is the fixed phase: it does not move, and the parts of the mixture stick to it by different amounts."},{"x":52,"y":10,"ans":1,"exp":"This band is another part of the mixture. It traveled a different distance from the others."}]}]},{"name":"Confusion drills","mode":"practice","tips":["Each drill isolates one pair that students mix up. Say the rule out loud before you click.","If you miss an item, read its note and then redo the drill later with the same pair in mind.","You earn partial credit for each item you get right, but only a perfect drill counts as fully correct."],"questions":[{"id":"D1","type":"label","topic":"Classifying matter","stem":"Element or compound? Watch the capital letters and the subscripts.","labels":["Element","Compound"],"items":[{"t":"Oxygen gas, O₂","ans":0,"exp":"Two atoms of the same element are bonded together. Only one kind of atom is present, so it is an element."},{"t":"Water, H₂O","ans":1,"exp":"Two different elements, hydrogen and oxygen, in a fixed ratio."},{"t":"Ozone, O₃","ans":0,"exp":"A subscript of 3 does not make it a compound. Only oxygen atoms are present."},{"t":"Carbon monoxide, CO","ans":1,"exp":"Two capital letters, C and O, mean two different elements."},{"t":"Cobalt, Co","ans":0,"exp":"One capital letter followed by a lowercase letter is one element symbol."},{"t":"Table salt, NaCl","ans":1,"exp":"Sodium and chlorine are different elements bonded in a fixed ratio."}]},{"id":"D2","type":"label","topic":"Classifying matter","stem":"Compound or mixture? A compound has a fixed formula; a mixture can be mixed in any amounts.","labels":["Compound","Mixture"],"items":[{"t":"Salt dissolved in water","ans":1,"exp":"The salt and water keep their identities and the amounts can vary, so it is a (homogeneous) mixture."},{"t":"Carbon dioxide, CO₂","ans":0,"exp":"Carbon and oxygen bonded in a fixed 1 to 2 ratio."},{"t":"Air","ans":1,"exp":"Mostly nitrogen and oxygen gases that are not bonded to each other."},{"t":"Sugar, C₁₂H₂₂O₁₁","ans":0,"exp":"One substance with a fixed formula, made of carbon, hydrogen and oxygen."},{"t":"Brass, copper and zinc melted together","ans":1,"exp":"An alloy is a solid solution; the proportions of copper and zinc can vary."},{"t":"Rust, Fe₂O₃","ans":0,"exp":"A single substance with a fixed formula; iron and oxygen are chemically combined."}]},{"id":"D3","type":"label","topic":"Classifying matter","stem":"Pure substance or mixture? A pure substance is a single element or a single compound.","labels":["Pure substance","Mixture"],"items":[{"t":"Distilled water","ans":0,"exp":"Only H₂O is present, so it is a compound and therefore a pure substance."},{"t":"A sports drink","ans":1,"exp":"Water, sugar, salts and flavorings dissolved together."},{"t":"A diamond (carbon)","ans":0,"exp":"Only carbon atoms, so it is an element."},{"t":"Granite","ans":1,"exp":"Visible crystals of different minerals; heterogeneous."},{"t":"Baking soda, NaHCO₃","ans":0,"exp":"One compound with a fixed formula."},{"t":"Milk","ans":1,"exp":"Fat droplets, proteins and water; it is a colloid, which is a mixture."}]},{"id":"D4","type":"label","topic":"Classifying matter","stem":"Homogeneous or heterogeneous mixture? Homogeneous means uniform throughout.","labels":["Homogeneous mixture","Heterogeneous mixture"],"items":[{"t":"Sugar stirred completely into hot tea","ans":0,"exp":"A solution looks the same throughout."},{"t":"Pizza","ans":1,"exp":"Different parts are visible and different samples have different composition."},{"t":"Clean air","ans":0,"exp":"A uniform mixture of gases."},{"t":"Trail mix","ans":1,"exp":"Pieces of nuts, fruit and chocolate are visibly separate."},{"t":"Oil and vinegar dressing before shaking","ans":1,"exp":"Two visible layers."},{"t":"Apple juice with no pulp","ans":0,"exp":"Sugars, acids and flavor molecules dissolved evenly in water."}]},{"id":"D5","type":"label","topic":"Physical vs chemical change","stem":"These look dramatic but are they chemical? Choose physical or chemical change.","labels":["Physical change","Chemical change"],"items":[{"t":"Water boiling in a pot, with bubbles rising","ans":0,"exp":"The bubbles are water vapor. Liquid water became gaseous water; still H₂O."},{"t":"Sugar dissolving in tea","ans":0,"exp":"The sugar is still sugar and could be recovered by evaporation."},{"t":"Dry ice turning into a foggy gas","ans":0,"exp":"Solid carbon dioxide becomes gaseous carbon dioxide (sublimation). Same substance."},{"t":"A glass cup shattering","ans":0,"exp":"Only size and shape change."},{"t":"Dissolving salt in water and then evaporating the water to get the salt back","ans":0,"exp":"Both steps are physical; the salt is recovered unchanged."},{"t":"Melted butter hardening again in the fridge","ans":0,"exp":"Freezing or solidifying is a change of state."}]},{"id":"D6","type":"label","topic":"Physical vs chemical change","stem":"These look quiet but are they physical? Choose physical or chemical change.","labels":["Physical change","Chemical change"],"items":[{"t":"Milk turning sour","ans":1,"exp":"New substances such as acids form, and the milk cannot turn back into fresh milk."},{"t":"A cut banana turning brown","ans":1,"exp":"Substances in the fruit react with oxygen to form new brown substances."},{"t":"A silver spoon tarnishing","ans":1,"exp":"Silver reacts with sulfur compounds in the air to form a new dark substance."},{"t":"An egg turning from clear to white and firm when fried","ans":1,"exp":"The proteins change into new substances that cannot be reversed by cooling."},{"t":"Digesting a cracker","ans":1,"exp":"Starch is broken down into sugars, which are new substances."},{"t":"Cake batter baking into a cake","ans":1,"exp":"Gas forms, the color changes and new substances with new properties form."}]},{"id":"D7","type":"label","topic":"Properties","stem":"Physical property or chemical property?","labels":["Physical property","Chemical property"],"items":[{"t":"Aluminum has a density of 2.70 g/cm³","ans":0,"exp":"Density can be measured without changing the substance."},{"t":"Iron can rust","ans":1,"exp":"The ability to turn into a new substance is a chemical property."},{"t":"Ethanol boils at 78 °C","ans":0,"exp":"Boiling point is measured without making a new substance."},{"t":"Gasoline is flammable","ans":1,"exp":"Flammability describes the ability to burn and form new substances."},{"t":"Copper conducts electricity","ans":0,"exp":"Conductivity is observed without changing copper."},{"t":"Hydrogen peroxide breaks down into water and oxygen","ans":1,"exp":"The ability to decompose into new substances."}]},{"id":"D8","type":"label","topic":"Properties","stem":"From the textbook self-check: physical property or chemical property?","labels":["Physical property","Chemical property"],"items":[{"t":"Gallium metal melts in your hand","ans":0,"exp":"Melting point is observed without forming a new substance."},{"t":"Platinum does not react with oxygen at room temperature","ans":1,"exp":"Reacting or not reacting with other substances is a chemical property."},{"t":"A page of the textbook is white","ans":0,"exp":"Color is observed without changing the paper."},{"t":"Copper sheets acquire a greenish coating over the years","ans":1,"exp":"Copper reacts with substances in the air to form a new compound, so it is a chemical property (and the coating is a chemical change)."},{"t":"A metal wire conducts an electric current","ans":0,"exp":"The wire has the same composition before and after the current passes."},{"t":"Diamond is very hard","ans":0,"exp":"Hardness describes the substance without changing it."}]},{"id":"D9","type":"label","topic":"Colloids","stem":"Name the colloid from its structure (what is dispersed in what). Aerosol and solid sol each cover two structures.","labels":["Aerosol","Foam","Emulsion","Sol","Gel","Solid sol"],"items":[{"t":"Solid dispersed in a gas (smoke)","ans":0,"exp":"A gas is the medium, so it is an aerosol."},{"t":"Gas dispersed in a liquid (whipped cream)","ans":1,"exp":"Gas bubbles spread through a liquid make a foam."},{"t":"Liquid dispersed in a liquid (milk)","ans":2,"exp":"Two liquids that do not dissolve: an emulsion."},{"t":"Solid dispersed in a liquid (paint)","ans":3,"exp":"Solid particles spread through a liquid make a sol."},{"t":"Liquid dispersed in a solid (jelly)","ans":4,"exp":"Liquid held inside a solid makes a gel."},{"t":"Gas dispersed in a solid (pumice stone)","ans":5,"exp":"A solid is the medium and the dispersed part is a gas, so the sheet calls it a solid sol."},{"t":"Liquid dispersed in a gas (fog)","ans":0,"exp":"A gas is the medium again, so fog is also an aerosol."},{"t":"Solid dispersed in a solid (colored glass)","ans":5,"exp":"A solid in a solid is the other solid sol."}]}]},{"name":"Evidence spotting","mode":"practice","tips":["Ask what new substance could have formed. If you cannot name one, the observation is probably physical.","Boiling, dissolving, melting, condensing and crushing are never evidence of a chemical change on their own.","Gas made by a reaction, a new solid from liquids, a color change, a temperature change, and light given off are the usual evidence. Odor is a physical property, so a smell by itself is not evidence."],"questions":[{"id":"E1","type":"label","topic":"Evidence of change","stem":"Is each observation good evidence, by itself, that a chemical change happened?","labels":["Evidence of a chemical change","Not evidence of a chemical change"],"items":[{"t":"Bubbles rise from a pot of water that is at 100 °C","ans":1,"exp":"Boiling produces water vapor bubbles. It is a change of state."},{"t":"Bubbles rise when zinc is added to hydrochloric acid, and the test tube warms","ans":0,"exp":"A gas forms from a solid and a liquid and heat is given off; a new substance (hydrogen) formed."},{"t":"Two clear liquids are mixed and a white solid settles out","ans":0,"exp":"A new solid formed from liquids (a precipitate), so a new substance formed."},{"t":"Ice cubes get smaller in a glass of water","ans":1,"exp":"Melting is a change of state."},{"t":"Steel wool turns orange-brown and feels slightly warm after a day in damp air","ans":0,"exp":"Rust is a new substance and heat was released."},{"t":"Sugar disappears when stirred into hot water","ans":1,"exp":"Dissolving is physical; the sugar is still there."}]},{"id":"E2","type":"label","topic":"Evidence of change","stem":"Is each observation good evidence, by itself, that a chemical change happened?","labels":["Evidence of a chemical change","Not evidence of a chemical change"],"items":[{"t":"A glass bottle shatters","ans":1,"exp":"Only the shape and size change."},{"t":"Milk turns sour and thickens into lumps","ans":0,"exp":"New substances formed, and the change cannot be reversed."},{"t":"A metal spoon becomes hot when left in hot soup","ans":1,"exp":"Heat moved into the spoon from outside; nothing new formed."},{"t":"A strip of magnesium burns with a bright white light and leaves a white powder","ans":0,"exp":"Light, heat and a new solid with different properties."},{"t":"The color of tea gets lighter when more water is added","ans":1,"exp":"Dilution changes how much dye is present, not what substances exist."},{"t":"Liquid water becomes a white solid in the freezer","ans":1,"exp":"Freezing is a change of state."}]},{"id":"E3","type":"label","topic":"Evidence of change","stem":"Is each observation good evidence, by itself, that a chemical change happened?","labels":["Evidence of a chemical change","Not evidence of a chemical change"],"items":[{"t":"Two powders are stirred into water, the cup gets cold and a gas is released","ans":0,"exp":"The gas that forms from the mixture shows a new substance was made, even though the temperature dropped."},{"t":"A bowl of soup cools on the counter","ans":1,"exp":"Heat leaves the soup; no new substance forms."},{"t":"A shiny penny slowly turns dull green outdoors","ans":0,"exp":"A new substance, a copper compound, forms on the surface."},{"t":"Iron filings are pulled out of sand by a magnet","ans":1,"exp":"Separating a mixture is a physical change."},{"t":"Hydrogen peroxide foams when poured on a cut","ans":0,"exp":"Oxygen gas is released as the peroxide breaks down into new substances."},{"t":"Wet clothes dry on a line","ans":1,"exp":"Liquid water evaporates; still water."}]},{"id":"E4","type":"label","topic":"Evidence of change","stem":"Dissolved or reacted? Is each observation good evidence, by itself, of a chemical change?","labels":["Evidence of a chemical change","Not evidence of a chemical change"],"items":[{"t":"Salt crystals vanish in water, and crystals reappear when the water evaporates","ans":1,"exp":"Recovering the salt unchanged shows it only dissolved."},{"t":"An effervescent tablet dropped in water gives off a stream of gas bubbles and shrinks away","ans":0,"exp":"A gas is produced that was not in the tablet as a gas, so a new substance formed."},{"t":"Powdered drink mix turns a glass of water orange with no gas and no heat","ans":1,"exp":"Dissolving and spreading dye is physical."},{"t":"A copper-colored coating forms on an iron nail in blue copper sulfate solution","ans":0,"exp":"A new solid with different properties forms on the nail."},{"t":"Chalk is crushed into a fine white powder","ans":1,"exp":"Only the particle size changes."},{"t":"A copper wire turns black when heated in a flame","ans":0,"exp":"The surface reacts with oxygen to make a new black substance."}]},{"id":"E5","type":"label","topic":"Evidence of change","stem":"Which of these is strong evidence, and which could be a physical change?","labels":["Strong evidence of chemical change","Could be physical (not enough alone)"],"items":[{"t":"The color of a drink gets darker when more powder is added","ans":1,"exp":"A darker color can just mean more dissolved dye."},{"t":"Bubbles appear in a soda just after the bottle is opened","ans":1,"exp":"Dissolved carbon dioxide leaves the liquid; it was already there."},{"t":"Heat is released when two solutions are mixed and a new solid forms","ans":0,"exp":"A new solid together with heat is strong evidence."},{"t":"Water droplets form on the outside of a cold glass","ans":1,"exp":"Water vapor in the air condenses; this is a change of state."},{"t":"A gas that relights a glowing splint is produced when a liquid is poured on a powder","ans":0,"exp":"Oxygen gas was made by a reaction; a new substance formed."},{"t":"A solid disappears completely in water","ans":1,"exp":"Dissolving is a physical change."}]}]},{"name":"MCQ Set A","mode":"practice","tips":["Read every choice before you pick one, then cross off the ones you can prove wrong with the red X.","Hard questions often mix up near-neighbors: element versus molecule, compound versus mixture, physical change versus chemical change. Decide which pair the question is testing.","For formula codes, look for an & first (mixture). Then count capital letters: one means an element, two or more means a compound.","When data is given (masses, bubbles, a leftover solid), say what the data shows before you look at the choices.","Watch extreme words such as \"only,\" \"always,\" \"never\" and \"all.\" They are usually wrong."],"questions":[{"id":"A1","type":"mcq","topic":"Properties","stem":"A chemist cuts a 40.0 g bar of pure silver into four equal pieces. Which set of properties would be the same for all four pieces and for the original bar?","options":["Density, hardness and luster","Mass, density and melting point","Volume, luster and boiling point","Density, mass and hardness"],"ans":0,"exp":"Density, hardness and luster are intensive, so they do not depend on amount. Mass and volume are extensive.","why":["","Mass is extensive: each piece has a quarter of the bar, so it differs from the original.","Volume is extensive: each piece takes up less space than the whole bar.","Mass changes when the bar is cut, even though density and hardness do not."]},{"id":"A2","type":"mcq","topic":"States of matter","stem":"A sealed, rigid flask holds 10.0 g of liquid water. It is heated until all of the water is steam. Which statement is correct?","options":["The total mass decreases because steam is lighter than liquid water.","The mass is still 10.0 g and the H₂O molecules are intact.","The water became a new substance with a lower boiling point.","The flask now holds separate hydrogen gas and oxygen gas."],"ans":1,"exp":"Boiling is a physical change. The molecules stay intact and the mass is conserved in a sealed flask.","why":["Mass does not depend on state, and nothing left the sealed flask.","","It is still water with the same boiling point.","Boiling does not break the molecules. Splitting water needs an electric current."]},{"id":"A3","type":"mcq","topic":"Physical vs chemical change","stem":"Two clear liquids are mixed. The mixture turns cloudy as a white solid settles to the bottom. Which conclusion is best supported?","options":["Any change in clarity proves that a chemical change took place.","A heterogeneous mixture formed, so no chemical change took place.","A new solid substance formed, which indicates a chemical change.","The liquid froze into a solid, which is a physical change."],"ans":2,"exp":"A new solid forming from two liquids is an indicator of a chemical change.","why":["This is too broad; dissolving or mixing can also change appearance.","A solid that was not in either liquid appeared, so new substances formed.","","Neither liquid froze. A new solid formed from the mixing."]},{"id":"A4","type":"mcq","topic":"Classifying matter","stem":"A drawing shows three separate pairs of bonded identical R atoms and two separate single Sq atoms, none touching. Which code fits?","options":["R₂Sq","R₆ & Sq₂","R₃Sq₂","R₂ & Sq"],"ans":3,"exp":"Separate, non-touching particles of different substances are written with an &.","why":["No & would mean one molecule containing both kinds of atom.","Each pair is its own R₂ molecule, so the code names the substance R₂, not R₆; count each kind of substance once.","That would be one molecule with three R atoms and two Sq atoms bonded together.",""]},{"id":"A5","type":"mcq","topic":"Classifying matter","stem":"Which of the following is a mixture of two compounds?","options":["NaCl & H₂O","H₂ & O₂ & N₂","CO₂","Cu & Zn"],"ans":0,"exp":"NaCl and H₂O are both compounds sitting together, so the sample is a mixture of two compounds.","why":["","H₂, O₂ and N₂ each have one type of atom, so this is a mixture of three elements, not two compounds.","This is one pure compound with no &.","Both are elements, so this is a mixture of two elements."]},{"id":"A6","type":"mcq","topic":"Separating mixtures","stem":"A student has dry sand and dry table salt mixed together. Which procedure recovers both substances?","options":["Filter the dry mixture through a piece of filter paper.","Add water, filter out the sand, then evaporate the water.","Heat the dry mixture until the salt boils away from the sand.","Run chromatography on the dry mixture of sand and salt."],"ans":1,"exp":"Salt dissolves and sand does not, so filtering removes the sand and evaporating the water recovers the salt.","why":["Both solids stay on the paper; filtration separates liquid from solid.","","The salt does not boil away at ordinary lab temperatures.","Chromatography needs a mobile liquid and is not how to separate sand from salt."]},{"id":"A7","type":"mcq","topic":"Separating mixtures","stem":"Which pairing of technique and property used is correct?","options":["Filtration and difference in boiling point","Distillation and adherence to a surface","Chromatography and adherence to a surface","Evaporation and difference in state of matter"],"ans":2,"exp":"Chromatography separates substances by how strongly they adhere to a surface.","why":["Filtration uses state (solid versus liquid), not boiling point.","Distillation uses boiling point; adherence to a surface is chromatography.","","Evaporation uses volatility; state of matter is the basis for filtration."]},{"id":"A8","type":"mcq","topic":"Particles and conservation","stem":"A student claims \"every molecule is a compound.\" Which sample best refutes this claim?","options":["Hydrogen peroxide, H₂O₂","Water, H₂O","Carbon dioxide, CO₂","Oxygen gas, O₂"],"ans":3,"exp":"O₂ is a molecule made of only one type of atom, so it is an element and not a compound.","why":["H₂O₂ is also a molecule and a compound, so it supports the claim.","Water is a molecule and a compound, so it supports the claim.","CO₂ is a molecule and a compound, so it supports the claim.",""]},{"id":"A9","type":"mcq","topic":"Classifying matter","stem":"How many atoms are in one molecule of H₂SO₄, and how is it classified?","options":["Seven atoms; compound","Three atoms; compound","Seven atoms; mixture","Three atoms; element"],"ans":0,"exp":"2 + 1 + 4 = 7 atoms. Three different elements are bonded in one formula, so it is a compound.","why":["","There are three types of atoms, but the subscripts add up to 2 + 1 + 4 = 7 atoms.","There is no & in the formula, so it is a single pure compound.","The molecule has seven atoms, and three different types of atom make it a compound."]},{"id":"A10","type":"mcq","topic":"Evidence of change","stem":"A student burns steel wool and the mass of the watch glass plus solid goes from 30.00 g to 30.29 g. Which explanation best supports that the gain is real?","options":["Burning drove off gas, which left more mass behind on the glass.","Iron combined with oxygen from the air, adding mass.","The balance gave a slightly different reading once the wool cooled.","Heat energy was converted into extra mass that stayed in the solid."],"ans":1,"exp":"Oxygen from the air joined the iron to form iron(III) oxide, so the solid product has more mass.","why":["If gas left, the mass would drop, not rise.","","A balance does not drift by this much, and the explanation ignores the chemistry.","Heat is not matter, so it does not add mass."]},{"id":"A11","type":"mcq","topic":"Evidence of change","stem":"In the zinc and hydrochloric acid station, which pair of observations together best supports a chemical change?","options":["The penny feels cold and its color is unchanged.","The acid stays clear and the penny keeps its shape.","Bubbles form and the dried penny has less mass.","The penny sinks and then floats on the acid."],"ans":2,"exp":"Gas bubbles and a permanent loss of mass show that the zinc reacted and formed new substances.","why":["A temperature change alone is weak evidence, and no change in color adds nothing.","Nothing here shows a new substance forming.","","Floating and sinking describe density and do not show new substances."]},{"id":"A12","type":"mcq","topic":"Particles and conservation","stem":"Six H₂O molecules are completely decomposed by an electric current. Which products form?","options":["Six H₂ and six O₂ molecules","Twelve H₂ and six O₂ molecules","Three H₂ and six O₂ molecules","Six H₂ and three O₂ molecules"],"ans":3,"exp":"Six H₂O contain 12 H atoms and 6 O atoms, which make 6 H₂ molecules and 3 O₂ molecules.","why":["This would need 12 oxygen atoms, but six water molecules have only six.","Six water molecules contain 12 hydrogen atoms, which make only 6 H₂.","This reverses the ratio: hydrogen forms twice as many molecules as oxygen.",""]},{"id":"A13","type":"mcq","topic":"Properties","stem":"Which statement describes a chemical property of magnesium?","options":["Magnesium can burn in oxygen to form a new substance.","Magnesium is a shiny, silver-gray solid at room temperature.","Magnesium melts at about 650°C under normal pressure.","Magnesium has a density of about 1.74 g/cm³ as a solid."],"ans":0,"exp":"A chemical property is the ability to change into a new substance, such as burning in oxygen.","why":["","Color and luster are physical properties.","A melting point is a physical property.","Density is a physical property."]},{"id":"A14","type":"mcq","topic":"Classifying matter","stem":"Which statement about homogeneous mixtures is correct?","options":["They are pure substances because their parts cannot be seen.","They are uniform throughout but can still be separated physically.","They cannot be separated because the particles are completely mixed.","They must contain exactly two substances."],"ans":1,"exp":"A solution has uniform composition but is still a mixture, so physical methods can separate it.","why":["Appearance does not decide purity; a solution can be separated into substances.","","Physical methods such as distillation can separate them.","A homogeneous mixture can contain any number of substances."]}]},{"name":"MCQ Set B","mode":"practice","tips":["Read every choice before you pick one, then cross off the ones you can prove wrong with the red X.","Hard questions often mix up near-neighbors: element versus molecule, compound versus mixture, physical change versus chemical change. Decide which pair the question is testing.","For formula codes, look for an & first (mixture). Then count capital letters: one means an element, two or more means a compound.","When data is given (masses, bubbles, a leftover solid), say what the data shows before you look at the choices.","Watch extreme words such as \"only,\" \"always,\" \"never\" and \"all.\" They are usually wrong."],"questions":[{"id":"B1","type":"mcq","topic":"Classifying matter","stem":"Which list contains only pure substances?","options":["Brass, oxygen, salt","Air, water, helium","Gold, CO₂, hydrogen","Gasoline, sugar, iron"],"ans":2,"exp":"Gold and hydrogen are elements and carbon dioxide is a compound, so all three are pure substances.","why":["Brass is a mixture of copper and zinc.","Air is a mixture of gases.","","Gasoline is a mixture of many compounds."]},{"id":"B2","type":"mcq","topic":"Classifying matter","stem":"The code for a molecule is TSq₂R. How many atoms does the molecule contain and how many different types?","options":["Three atoms of four types","Four atoms of two types","Three atoms of three types","Four atoms of three types"],"ans":3,"exp":"T + 2 Sq + R = 4 atoms, and the three symbols T, Sq and R are three different types of atom.","why":["The count of types cannot exceed the count of atoms, and the code lists three symbols.","T, Sq and R are three different types.","The subscript 2 means two Sq atoms, so there are four atoms in total.",""]},{"id":"B3","type":"mcq","topic":"Classifying matter","stem":"A sample is written Sq₂ & R. Which statement is true?","options":["It is a mixture of two elements.","It is a compound made of Sq and R.","It is one molecule containing three atoms.","It is an element because it has two symbols."],"ans":0,"exp":"Sq₂ and R are both elements, and the & shows they are mixed together.","why":["","The & means the substances are not bonded into one compound.","The & shows separate particles, not one molecule.","More than one symbol, with an &, signals a mixture."]},{"id":"B4","type":"mcq","topic":"Physical vs chemical change","stem":"Which group contains only chemical changes?","options":["Melting ice, boiling water, crushing chalk","Rusting a nail, fermenting juice, burning wax","Dissolving sugar, rusting a nail, evaporating water","Burning wood, freezing water, tarnishing silver"],"ans":1,"exp":"Rusting, fermenting and burning each form new substances.","why":["All three are physical changes.","","Dissolving and evaporating are physical.","Freezing water is a physical change."]},{"id":"B5","type":"mcq","topic":"Physical vs chemical change","stem":"Wax is melted over a flame and then catches fire and burns. How should the sequence be described?","options":["Both steps are chemical because a flame is involved.","Both steps are physical because wax stays wax.","Melting is physical and burning is chemical.","Neither step changes the wax in any way."],"ans":2,"exp":"Melting only changes state; burning forms new substances. The sequence contains both kinds of change.","why":["A flame supplies heat; melting alone does not form a new substance.","Burning forms new substances, so it cannot be physical.","","Both steps change the wax, one physically and one chemically."]},{"id":"B6","type":"mcq","topic":"Separating mixtures","stem":"A student boils salt water, collects and condenses the steam, and finds white solid left in the flask. Which statement is justified?","options":["The salt was made from the water while it boiled away.","The water decomposed into hydrogen and oxygen gases.","Distillation is chemical because heat was applied.","No new substance formed, so it was physical."],"ans":3,"exp":"Water and salt were separated without forming anything new, which is a physical separation.","why":["The salt was already dissolved; boiling just left it behind.","The collected steam condensed back to water, so it did not decompose.","Heat does not make a change chemical; no new substances formed.",""]},{"id":"B7","type":"mcq","topic":"Properties","stem":"Which pair of properties are both extensive?","options":["Volume and mass","Boiling point and length","Mass and color","Density and volume"],"ans":0,"exp":"Both volume and mass depend on how much matter is present.","why":["","Boiling point is intensive.","Color is intensive.","Density is intensive."]},{"id":"B8","type":"mcq","topic":"States of matter","stem":"A gas in a 1 L container is moved to an empty 2 L container. What happens to its volume?","options":["It stays at 1 L and the shape changes.","It expands to fill the whole 2 L.","It condenses to a liquid on the container floor.","It stays exactly the same as before."],"ans":1,"exp":"A gas has no fixed volume or shape, so it takes the volume of its container.","why":["That describes a liquid. A gas fills all of the new container.","","Nothing in the situation cools or compresses the gas.","A gas has no fixed volume."]},{"id":"B9","type":"mcq","topic":"Classifying matter","stem":"How many of these are compounds: NaHCO₃, P₄, CO, Co, H₂O₂, N₂, KBr?","options":["Three","Four","Five","Six"],"ans":1,"exp":"NaHCO₃, CO, H₂O₂ and KBr are compounds. P₄, Co and N₂ are elements.","why":["Counting only three misses at least one compound; CO has two capital letters.","","Co (cobalt) is an element: one capital letter and one lowercase letter.","P₄, Co and N₂ are all elements, so six is too many."]},{"id":"B10","type":"mcq","topic":"Particles and conservation","stem":"A drawing shows four separate H₂O molecules and two separate O₂ molecules, none touching. Which description is correct?","options":["Six particles; six atoms; a compound","Sixteen particles; sixteen atoms; a mixture","Six particles; sixteen atoms; a mixture","Two particles; sixteen atoms; a mixture"],"ans":2,"exp":"Four H₂O (3 atoms each) and two O₂ (2 atoms each) give 12 + 4 = 16 atoms in 6 particles. The code H₂O & O₂ is a mixture.","why":["Each molecule has more than one atom, so there are more than six atoms, and the & makes it a mixture.","A particle is a whole molecule here, so there are six particles, not sixteen.","","There are two kinds of particle but six individual particles in the drawing."]},{"id":"B11","type":"mcq","topic":"Classifying matter","stem":"Which statement about elements is correct?","options":["Any formula that includes a subscript must represent a compound.","Elements only exist as single separate atoms.","Elements can be broken into compounds by chemical methods.","A subscripted formula such as P₄ can still be an element."],"ans":3,"exp":"P₄ is made of only one type of atom, so it is an element even though it has a subscript.","why":["P₄ and O₃ have subscripts and are elements.","Many elements exist as molecules such as O₂ and P₄.","Elements cannot be broken into other substances by chemical methods.",""]},{"id":"B12","type":"mcq","topic":"Physical vs chemical change","stem":"Salt is dissolved in water and then the water evaporates, leaving salt crystals. Which statement describes both processes?","options":["Both are physical because no new substance forms.","Both are chemical because the salt seems to disappear.","Dissolving is chemical and evaporating is physical.","Dissolving is physical and evaporating is chemical."],"ans":0,"exp":"The salt and the water keep their identities in both processes.","why":["","Disappearing into solution is not evidence of a chemical change.","Dissolving does not form a new substance either.","Evaporation of water is only a change of state."]},{"id":"B13","type":"mcq","topic":"Classifying matter","stem":"A student claims a homogeneous mixture and a pure substance are the same because neither shows visible parts. Which evidence best shows they differ?","options":["Only the pure substance can be found as a liquid at room temperature.","Distillation can split the mixture into pure substances.","Filtration can split a pure substance into its elements.","The mixture always shows a visible boundary between its parts."],"ans":1,"exp":"A homogeneous mixture can be separated by physical methods into pure substances; a pure substance cannot.","why":["Both a solution and a pure substance can be liquids.","","Filtration is a physical method and cannot split any pure substance.","A homogeneous mixture has no visible boundary."]},{"id":"B14","type":"mcq","topic":"Evidence of change","stem":"In the vinegar and TUMS station, which statement about the solid left on the filter paper is best supported?","options":["It is the gas that formed, collected as a solid on the paper.","It is pure vinegar that was trapped by the filter paper.","It is tablet material that did not react with the vinegar.","It is a new compound created only by the act of filtering."],"ans":2,"exp":"Filtration only separates undissolved solid from liquid, so the solid is leftover tablet material that did not react.","why":["A gas escapes into the air and does not collect on filter paper.","Vinegar is a liquid and passes through the filter paper.","","Filtering is a physical separation and does not create new substances."]}]},{"name":"MCQ Set C: review sheet","mode":"practice","tips":["Read every choice before you pick one, then cross off the ones you can prove wrong with the red X.","Hard questions often mix up near-neighbors: element versus molecule, compound versus mixture, physical change versus chemical change. Decide which pair the question is testing.","For formula codes, look for an & first (mixture). Then count capital letters: one means an element, two or more means a compound.","When data is given (masses, bubbles, a leftover solid), say what the data shows before you look at the choices.","Watch extreme words such as \"only,\" \"always,\" \"never\" and \"all.\" They are usually wrong."],"questions":[{"id":"C9","type":"mcq","topic":"Physical vs chemical change","stem":"Wax is melted over a flame and then catches fire and burns. How does the textbook classify this?","options":["A physical change only, because wax stays wax","A chemical change only, because a flame was involved","Neither, because the wax simply disappears","Both: melting is physical, burning is chemical"],"ans":3,"exp":"Melting wax is a physical change, and burning it forms new substances, so the process is a combination of the two.","why":["Only the melting step is physical; the burning makes new substances.","The melting step is still a physical change of state.","The wax does not just disappear; it turns into new gases when it burns.",""]},{"id":"C10","type":"mcq","topic":"Classifying matter","stem":"How many of these are compounds: H₂O, N₂O₄, NaOH, MnO₂ and HF?","options":["Five","Three","Four","Two"],"ans":0,"exp":"Each formula contains atoms of two or more different elements in a fixed combination, so all five are compounds.","why":["","Every formula here has at least two different capital letters.","H₂O is also a compound, and so are the other four.","N₂O₄, NaOH, MnO₂ and HF also contain two or more different elements."]},{"id":"C11","type":"mcq","topic":"Classifying matter","stem":"Which one of these is a homogeneous mixture?","options":["Pure distilled water","Gasoline from a pump","A big jar of jelly beans","Soil from a garden bed"],"ans":1,"exp":"Gasoline is a uniform mixture of several substances with the same composition throughout.","why":["Pure water is a compound, which is a pure substance and not a mixture.","","The beans are visibly separate pieces, so it is heterogeneous.","Soil has visibly different parts and regions, so it is heterogeneous."]},{"id":"C1","type":"mcq","topic":"Colloids","stem":"Pumice stone is made of gas pockets trapped inside solid rock. Which colloid name does the review sheet use for it?","options":["Gel","Foam","Solid sol","Liquid aerosol"],"ans":2,"exp":"The medium is a solid and the dispersed part is a gas, so the sheet calls it a solid sol (colored glass is also a solid sol).","why":["A gel is a liquid dispersed in a solid, not a gas.","A foam is a gas in a liquid; pumice has the gas inside a solid.","","An aerosol is something dispersed in a gas; pumice is gas trapped in a solid."]},{"id":"C2","type":"mcq","topic":"Colloids","stem":"Fog and smoke are both aerosols. What is the difference between them?","options":["Fog is a gas in a liquid, and smoke is a liquid in a gas","Fog is solid in a gas, and smoke is liquid in a gas","Fog is liquid in a liquid, and smoke is solid in a liquid","Fog is liquid in a gas, and smoke is solid in a gas"],"ans":3,"exp":"Both are spread through a gas (air). Fog is tiny liquid droplets and smoke is tiny solid particles.","why":["Fog is not a gas in a liquid; its water droplets are spread in air.","The two are reversed: fog is water droplets and smoke is solid particles.","Both have air (a gas) as the medium.",""]},{"id":"C3","type":"mcq","topic":"States of matter","stem":"Why can no substance be cooled below 0 K?","options":["Its particles already have the least possible motion","Kelvin is a scale for gases and fails for solids","All particles disappear into energy at that point","Every substance freezes solid there and cannot cool further"],"ans":0,"exp":"Absolute zero (-273.15 °C) is where particle motion is
