iment bounced almost straight back. What does that tell you?","options":["Electrons strongly repel alpha particles","The foil atoms are solid, packed spheres","A tiny, dense, positive center exists","Alpha particles carry a negative charge"],"ans":2,"exp":"Positive alpha particles were repelled by a small, dense, positive region: the nucleus.","why":["Electrons are negative and nearly massless, so they attract rather than repel positive alpha particles and could not turn them back.","If atoms were solid spheres, most particles would bounce back, not just a few.","","Alpha particles are positive. The bounce comes from repulsion between two positive charges."]},{"id":"A4","type":"mcq","topic":"Isotopes","stem":"Which pair of symbols shows two isotopes of the same element?","options":["²²₁₀X and ²²₁₁X","²⁰₁₀X and ²⁰₁₂X","²¹₉X and ²²₁₁X","²⁰₁₀X and ²²₁₀X"],"ans":3,"exp":"Isotopes share an atomic number (bottom number) and differ in mass number. Both of these have Z = 10.","why":["Same mass number, but the atomic numbers differ (10 and 11), so these are different elements.","The atomic numbers differ (10 and 12), so these are different elements.","The atomic numbers differ (9 and 11), so these are different elements.",""]},{"id":"A5","type":"mcq","topic":"Subatomic particles","stem":"How many protons, neutrons and electrons are in a neutral atom of ¹³⁶₅₆Ba?","options":["56 p, 80 n, 56 e","56 p, 136 n, 56 e","80 p, 56 n, 80 e","56 p, 80 n, 54 e"],"ans":0,"exp":"Protons = Z = 56; neutrons = 136 - 56 = 80; neutral, so electrons = 56.","why":["","136 is the mass number. Neutrons = 136 - 56 = 80.","Protons and neutrons are swapped. The bottom number, 56, is the proton count.","54 electrons would make Ba²⁺. A neutral atom has as many electrons as protons."]},{"id":"A6","type":"mcq","topic":"Ions","stem":"How many electrons are in the ion ⁷⁵₃₃As³⁻?","options":["30","36","33","42"],"ans":1,"exp":"Electrons = Z - charge = 33 - (-3) = 36.","why":["Subtracting 3 is for a positive ion. A 3- ion gained 3 electrons: 33 + 3 = 36.","","33 is the count for a neutral arsenic atom. The 3- charge means 3 extra electrons.","42 is the neutron count (75 - 33), not the electron count."]},{"id":"A7","type":"mcq","topic":"Average atomic mass","stem":"Boron has two isotopes: boron-10 (20% abundance) and boron-11 (80%). What is boron's average atomic mass?","options":["10.50 amu","10.20 amu","10.80 amu","21.00 amu"],"ans":2,"exp":"0.20 × 10 + 0.80 × 11 = 10.80 amu.","why":["That is a plain average. Boron-11 is four times as common, so the average sits closer to 11.","The abundances are swapped: 0.80 × 10 + 0.20 × 11 = 10.20. Boron-11 is the 80% isotope.","","That just adds the two mass numbers. Each mass must be multiplied by its abundance first."]},{"id":"A8","type":"mcq","topic":"Average atomic mass","stem":"Rhenium is 37.40% Re-185 and 62.60% Re-187. What is its average atomic mass?","options":["186.00 amu","185.75 amu","187.00 amu","186.25 amu"],"ans":3,"exp":"0.3740 × 185 + 0.6260 × 187 = 186.25 amu.","why":["That is the plain average of 185 and 187. Re-187 is more common, so the answer is above 186.","The abundances are swapped. Re-187 is the 62.60% isotope.","That is only the most common isotope. The average must include Re-185 too.",""]},{"id":"A9","type":"mcq","topic":"Isotopes","stem":"Why is the atomic mass on the periodic table a decimal?","options":["It averages isotopes by abundance","Electrons add fractional mass","It is rounded from the mass number","Each atom has a fractional neutron count"],"ans":0,"exp":"Elements are mixtures of isotopes, so the table lists a weighted average of their masses.","why":["","Electrons are nearly massless. The decimal comes from averaging isotopes.","The mass number is a whole count. The table value is a weighted average, not a rounding of it.","Every atom has a whole number of neutrons. Only the average across isotopes is fractional."]},{"id":"A10","type":"mcq","topic":"Subatomic particles","stem":"Which change would turn an atom into a different element?","options":["Changing its number of neutrons","Changing its number of protons","Changing its number of electrons","Changing only its mass number"],"ans":1,"exp":"The number of protons (atomic number) sets the element's identity.","why":["That makes a different isotope of the same element.","","That makes an ion of the same element.","Isotopes of one element have different mass numbers. Only the proton count sets the element."]},{"id":"A11","type":"mcq","topic":"History of the atom","stem":"Which observation led Thomson to his plum pudding model?","options":["Alpha particles bounced off a metal foil","Electrons occupy fixed energy levels","Atoms emit tiny negative particles","Beryllium gives off neutral radiation"],"ans":2,"exp":"Thomson found that atoms give off electrons and reasoned that positive charge must balance them.","why":["That was Rutherford's result, and it disproved the plum pudding model.","That was Bohr's idea, proposed after Thomson's model.","","That was Chadwick's 1932 discovery of the neutron."]},{"id":"A12","type":"mcq","topic":"History of the atom","stem":"How does the modern (orbital) model of the atom differ from Bohr's model?","options":["Electrons travel in fixed circular orbits","Electrons are scattered in positive charge","Electrons sit inside the nucleus","Electrons have regions, not paths"],"ans":3,"exp":"Orbitals are regions where an electron is likely to be (about 90% of the time); exact positions cannot be predicted.","why":["That is Bohr's model, which the orbital model replaced.","That is Thomson's plum pudding model.","Electrons are always outside the nucleus; only protons and neutrons are inside.",""]},{"id":"A13","type":"mcq","topic":"Periodic table","stem":"What does an element's period (row) number tell you?","options":["Its number of energy levels","Its number of valence electrons","Its number of protons","Its number of neutrons"],"ans":0,"exp":"The period number equals the number of principal energy levels (electron shells).","why":["","That comes from the group (column) for representative elements.","That is the atomic number.","That is the mass number minus the atomic number."]}]},{"name":"MCQ Set B: ions and formulas","mode":"practice","tips":["Read every choice, then cross off the ones you can prove wrong.","For particle questions write Z, A and the charge first: p = Z, n = A - Z, e = Z - charge.","For formulas, write both ion charges before you look at the choices, then check the sum is zero.","Distractors are built from real mistakes: a skipped subscript, swapped abundances, a reversed crossover. Name the mistake behind each wrong choice."],"questions":[{"id":"B1","type":"mcq","topic":"Ions","stem":"An ion with a 3+ charge contains 23 electrons. Which ion is it?","options":["V³⁺","Fe³⁺","Sc³⁺","Ca³⁺"],"ans":1,"exp":"Protons = electrons + charge = 23 + 3 = 26, which is iron.","why":["Vanadium has 23 protons, so V³⁺ has only 20 electrons. You matched the electron count to the atomic number.","","Scandium has 21 protons, so Sc³⁺ has 18 electrons.","Calcium is in group 2 and forms 2+ ions, not 3+. It also has only 20 protons."]},{"id":"B2","type":"mcq","topic":"Ions","stem":"A compound has the formula XCl₂, and ion X contains 20 electrons. What is X?","options":["Ca²⁺","Sc⁺","Ti²⁺","Cr²⁺"],"ans":2,"exp":"Two Cl⁻ ions mean X is 2+. Protons = 20 + 2 = 22, which is titanium.","why":["Calcium has 20 protons, so Ca²⁺ has 18 electrons, not 20.","XCl₂ needs a 2+ cation to balance two Cl⁻ ions. A 1+ ion would form XCl.","","Chromium has 24 protons, so Cr²⁺ has 22 electrons."]},{"id":"B3","type":"mcq","topic":"Ionic formulas","stem":"An alkaline earth metal whose most stable ion has 36 electrons bonds with bromine. What is the formula?","options":["CaBr₂","RbBr","KrBr","SrBr₂"],"ans":3,"exp":"Alkaline earth ions are 2+, so protons = 36 + 2 = 38: strontium. Sr²⁺ needs two Br⁻: SrBr₂.","why":["Ca²⁺ has 18 electrons, not 36.","Rubidium is an alkali metal (group 1), not an alkaline earth metal.","Krypton is a noble gas; 36 is its electron count as a neutral atom.",""]},{"id":"B4","type":"mcq","topic":"Ionic formulas","stem":"What ionic compound forms when barium bonds with phosphorus?","options":["Ba₃P₂","Ba₂P₃","BaP","Ba₃P"],"ans":0,"exp":"Ba²⁺ and P³⁻: cross the charges to get Ba₃P₂, since 3(+2) + 2(-3) = 0.","why":["","The subscripts are on the wrong ions: 2(+2) + 3(-3) = -5, not zero.","Ba²⁺ and P³⁻ do not cancel one to one: +2 - 3 = -1.","3(+2) + (-3) = +3. Two phosphide ions are needed."]},{"id":"B5","type":"mcq","topic":"Ionic formulas","stem":"What ionic compound forms when aluminum bonds with sulfur?","options":["Al₃S₂","Al₂S₃","AlS","Al₂S"],"ans":1,"exp":"Al³⁺ and S²⁻ cross over to Al₂S₃: 2(+3) + 3(-2) = 0.","why":["The subscripts are reversed: 3(+3) + 2(-2) = +5.","","Al³⁺ and S²⁻ do not cancel one to one: +3 - 2 = +1.","2(+3) + (-2) = +4. Three sulfide ions are needed."]},{"id":"B6","type":"mcq","topic":"Ions","stem":"Which element forms a 2- ion?","options":["Bromine","Arsenic","Selenium","Strontium"],"ans":2,"exp":"Selenium is in group 16 (oxygen family), which forms 2- ions.","why":["Bromine is a halogen (group 17) and forms a 1- ion.","Arsenic is in group 15, which forms 3- ions.","","Strontium is a metal in group 2 and forms a 2+ ion, not 2-."]},{"id":"B7","type":"mcq","topic":"Periodic table","stem":"Which series is NOT matched with the correct description?","options":["F, Cl, Br: halogens","Mg, Ca, Sr: alkaline earth metals","Fe, Co, Ni: transition metals","B, Si, Ge: metals"],"ans":3,"exp":"Boron, silicon and germanium are metalloids, on the staircase, not metals.","why":["These are all in group 17, the halogens. This one is correct.","These are all in group 2. This one is correct.","These are all in groups 3 to 12. This one is correct.",""]},{"id":"B8","type":"mcq","topic":"Ionic formulas","stem":"When does a solid ionic compound such as NaCl conduct electricity?","options":["Melted or dissolved in water","As a solid at room temperature","Only after it is crushed to powder","Never, since the compound is neutral"],"ans":0,"exp":"Ionic compounds conduct electricity when melted or dissolved in water, because the ions can then move.","why":["","In the solid, the ions are locked in place and cannot move, so it does not conduct.","Powder is still a solid with locked ions, so it still does not conduct.","The compound is neutral overall but made of charged ions, which conduct once they can move."]},{"id":"B9","type":"mcq","topic":"Ions","stem":"What happens to a halogen atom when it forms its most common ion?","options":["Loses one electron: X⁺","Gains one electron: X⁻","Gains seven electrons: X⁷⁻","Loses seven electrons: X⁷⁺"],"ans":1,"exp":"Halogens have 7 valence electrons, so each gains 1 to complete the octet and becomes a 1- anion.","why":["Halogens are nonmetals with 7 valence electrons; they gain one to complete the octet, not lose one.","","A halogen needs only one more electron to reach eight.","Gaining one electron is far easier than losing seven; halogens form 1- ions."]},{"id":"B10","type":"mcq","topic":"Ionic formulas","stem":"Which of these is a covalent compound?","options":["MgCl₂","Na₂S","CF₄","Li₃N"],"ans":2,"exp":"Carbon and fluorine are both nonmetals, so they share electrons: a covalent compound.","why":["Magnesium is a metal, so MgCl₂ is ionic.","Sodium is a metal, so Na₂S is ionic.","","Lithium is a metal, so Li₃N is ionic."]},{"id":"B12","type":"mcq","topic":"Ions","stem":"Which ion has the same number of electrons as a neutral neon atom?","options":["Ca²⁺","Cl⁻","S²⁻","Mg²⁺"],"ans":3,"exp":"Neon has 10 electrons. Mg has 12 protons; losing 2 leaves 10.","why":["Calcium has 20 protons, so Ca²⁺ has 18 electrons, like argon.","Chlorine has 17 protons, so Cl⁻ has 18 electrons.","Sulfur has 16 protons, so S²⁻ has 18 electrons.",""]}]},{"name":"MCQ Set C: molar mass and moles","mode":"practice","tips":["Read every choice, then cross off the ones you can prove wrong.","For particle questions write Z, A and the charge first: p = Z, n = A - Z, e = Z - charge.","For formulas, write both ion charges before you look at the choices, then check the sum is zero.","Distractors are built from real mistakes: a skipped subscript, swapped abundances, a reversed crossover. Name the mistake behind each wrong choice."],"questions":[{"id":"C1","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of calcium cyanide, Ca(CN)₂?","options":["92.12 g/mol","66.10 g/mol","80.11 g/mol","132.20 g/mol"],"ans":0,"exp":"40.08 + 2(12.01) + 2(14.01) = 92.12 g/mol.","why":["","That counts only one C and one N. The 2 outside the parentheses doubles both.","That doubles only N. The 2 applies to everything inside the parentheses.","That doubles calcium too. Only the CN inside the parentheses is doubled."]},{"id":"C2","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of carbonic acid, H₂CO₃?","options":["61.02 g/mol","62.03 g/mol","30.03 g/mol","63.03 g/mol"],"ans":1,"exp":"2(1.008) + 12.01 + 3(16.00) = 62.03 g/mol.","why":["That counts only one hydrogen. The subscript 2 means two H.","","That counts only one oxygen. The subscript 3 means three O.","That counts three hydrogens. The formula has two."]},{"id":"C3","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of aluminum oxide, Al₂O₃?","options":["112.94 g/mol","74.98 g/mol","101.96 g/mol","69.96 g/mol"],"ans":2,"exp":"2(26.98) + 3(16.00) = 101.96 g/mol.","why":["That is 3 Al and 2 O: the subscripts were swapped. Al₂O₃ has 2 Al and 3 O.","That counts only one aluminum. The formula has two.","","That counts only one oxygen. The formula has three."]},{"id":"C4","type":"mcq","topic":"Mole conversions","stem":"How many moles of MgCl₂ are in 45.8 g? (Molar mass 95.21 g/mol.)","options":["2.08 mol","0.962 mol","0.240 mol","0.481 mol"],"ans":3,"exp":"45.8 g ÷ 95.21 g/mol = 0.481 mol MgCl₂.","why":["That divides the molar mass by the grams. Divide grams by molar mass.","That is the moles of Cl atoms, not of MgCl₂.","That halves the answer. Nothing in this step uses the subscript.",""]},{"id":"C5","type":"mcq","topic":"Mole conversions","stem":"How many chlorine atoms are in 45.8 g of MgCl₂?","options":["5.79 × 10²³ atoms","2.90 × 10²³ atoms","0.962 atoms","2.76 × 10²⁵ atoms"],"ans":0,"exp":"45.8 ÷ 95.21 × 2 × 6.022 × 10²³ = 5.79 × 10²³ Cl atoms.","why":["","That skips the subscript: each MgCl₂ has 2 Cl atoms.","That stops at moles of Cl. Multiply by 6.022 × 10²³ to count atoms.","That multiplies by the molar mass instead of dividing by it."]},{"id":"C6","type":"mcq","topic":"Mole conversions","stem":"How many hydrogen atoms are in 2.50 mol of methane, CH₄?","options":["1.51 × 10²⁴","6.02 × 10²⁴","2.41 × 10²⁴","10.0"],"ans":1,"exp":"2.50 mol × 4 × 6.022 × 10²³ = 6.02 × 10²⁴ H atoms.","why":["That counts molecules, not H atoms. Each CH₄ has 4 H.","","That is the H count for 1 mol of CH₄, not 2.50 mol.","10.0 is the moles of H. Multiply by 6.022 × 10²³ to count atoms."]},{"id":"C7","type":"mcq","topic":"Mole conversions","stem":"A sample holds 1.25 × 10²² formula units of Al₂S₃. How many aluminum atoms does it contain?","options":["1.25 × 10²²","3.75 × 10²²","2.50 × 10²²","6.25 × 10²²"],"ans":2,"exp":"1.25 × 10²² × 2 = 2.50 × 10²² Al atoms.","why":["That is the number of formula units. Each has 2 Al atoms.","That uses sulfur's subscript (3). Aluminum's subscript is 2.","","That counts all 5 atoms in each formula unit, not just aluminum."]},{"id":"C8","type":"mcq","topic":"Mole conversions","stem":"How many atoms in total (P and Cl) are in 15.0 g of PCl₃?","options":["6.58 × 10²²","1.97 × 10²³","4.37 × 10⁻¹","2.63 × 10²³"],"ans":3,"exp":"15.0 ÷ 137.32 × 4 × 6.022 × 10²³ = 2.63 × 10²³ atoms.","why":["That is the number of PCl₃ molecules. Each has 4 atoms.","That counts only chlorine atoms. Phosphorus adds one more per molecule.","That stops at moles of atoms. Multiply by 6.022 × 10²³.",""]},{"id":"C9","type":"mcq","topic":"Mole conversions","stem":"A sample of SiO₂ contains 4.82 × 10²³ oxygen atoms. What is the sample's mass?","options":["24.0 g","48.1 g","12.8 g","11.2 g"],"ans":0,"exp":"4.82 × 10²³ ÷ 6.022 × 10²³ = 0.8004 mol O; ÷ 2 = 0.4002 mol SiO₂; × 60.09 = 24.0 g.","why":["","That skips dividing by 2: each SiO₂ has 2 O atoms.","That is the mass of the oxygen only, not the whole SiO₂.","That uses silicon's mass instead of the molar mass of SiO₂."]},{"id":"C10","type":"mcq","topic":"Molar mass","stem":"Which statement fits the law of constant composition?","options":["Water's ratio depends on its source","Water is always 2 H to 1 O","A compound's ratio changes when heated","Mixtures always have fixed ratios"],"ans":1,"exp":"A compound always has the same elements bonded in the same ratio.","why":["Every sample of a compound has the same ratio, wherever it comes from.","","Heating can change state, but the compound's atom ratio stays the same.","Mixtures have variable composition. The law is about compounds."]},{"id":"C11","type":"mcq","topic":"Mole conversions","stem":"What does one mole of any substance contain?","options":["6.022 × 10²³ grams","Exactly 1 gram of matter","6.022 × 10²³ particles","One atom of each element"],"ans":2,"exp":"One mole = 6.022 × 10²³ particles (Avogadro's number).","why":["A mole is a count of particles. Its mass is the molar mass, which differs by substance.","The mass of a mole depends on the substance (its molar mass).","","A mole is a huge count: 6.022 × 10²³ particles."]},{"id":"C12","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of sulfur hexafluoride, SF₆?","options":["51.07 g/mol","211.42 g/mol","165.07 g/mol","146.07 g/mol"],"ans":3,"exp":"32.07 + 6(19.00) = 146.07 g/mol.","why":["That ignores the subscript 6 on fluorine.","That puts the 6 on sulfur instead of fluorine.","That counts seven fluorines; the formula has six.",""]}]},{"name":"Molar mass and moles","mode":"practice","tips":["Write the setup with units, then the answer. Check Answer shows the worked solution.","Self-mark each part honestly; partly right goes into Retest Missed Questions."],"questions":[{"id":"M1","type":"frq","topic":"Molar mass","title":"Molar mass practice","stem":"Find the molar mass of each compound. Show each element's mass times its subscript.","data":[],"parts":[{"k":"a","prompt":"CaCl₂","model":"40.08 + 2(35.45) = 110.98 g/mol."},{"k":"b","prompt":"CO₂","model":"12.01 + 2(16.00) = 44.01 g/mol."},{"k":"c","prompt":"Al₂O₃","model":"2(26.98) + 3(16.00) = 101.96 g/mol."},{"k":"d","prompt":"SF₆","model":"32.07 + 6(19.00) = 146.07 g/mol."}]},{"id":"M2","type":"frq","topic":"Molar mass","title":"Molar mass practice","stem":"Find the molar mass of each compound.","data":[],"parts":[{"k":"a","prompt":"FeBr₃","model":"55.85 + 3(79.90) = 295.55 g/mol."},{"k":"b","prompt":"PCl₅","model":"30.97 + 5(35.45) = 208.22 g/mol."},{"k":"c","prompt":"Na₂S","model":"2(22.99) + 32.07 = 78.05 g/mol."},{"k":"d","prompt":"N₂O₄","model":"2(14.01) + 4(16.00) = 92.02 g/mol."}]},{"id":"M3","type":"frq","topic":"Mole conversions","title":"Multi-step conversion","stem":"How many hydrogen atoms are in 2.50 mol of methane, CH₄?","data":[],"parts":[{"k":"a","prompt":"Moles of H atoms","model":"2.50 mol CH₄ × (4 mol H / 1 mol CH₄) = 10.0 mol H."},{"k":"b","prompt":"Number of H atoms","model":"10.0 mol × 6.022 × 10²³ = 6.02 × 10²⁴ H atoms."}]},{"id":"M4","type":"frq","topic":"Mole conversions","title":"Multi-step conversion","stem":"Determine the number of chlorine atoms in 45.8 g of MgCl₂.","data":[],"parts":[{"k":"a","prompt":"Moles of MgCl₂","model":"45.8 g ÷ 95.21 g/mol = 0.481 mol."},{"k":"b","prompt":"Moles of Cl","model":"0.481 × 2 = 0.962 mol Cl."},{"k":"c","prompt":"Cl atoms","model":"0.962 × 6.022 × 10²³ = 5.79 × 10²³ atoms."}]},{"id":"M5","type":"frq","topic":"Mole conversions","title":"Multi-step conversion","stem":"A sample contains 1.25 × 10²² formula units of Al₂S₃. How many aluminum atoms are present?","data":[],"parts":[{"k":"a","prompt":"Aluminum atoms","model":"1.25 × 10²² × (2 Al / 1 Al₂S₃) = 2.50 × 10²² Al atoms. No moles needed: the count stays in particles."}]},{"id":"M6","type":"frq","topic":"Mole conversions","title":"Multi-step conversion","stem":"Calculate the total number of atoms in 15.0 g of PCl₃.","data":[],"parts":[{"k":"a","prompt":"Molar mass and moles","model":"30.97 + 3(35.45) = 137.32 g/mol; 15.0 ÷ 137.32 = 0.1092 mol."},{"k":"b","prompt":"Total atoms","model":"Each PCl₃ has 4 atoms: 0.1092 × 4 × 6.022 × 10²³ = 2.63 × 10²³ atoms."}]},{"id":"M7","type":"frq","topic":"Mole conversions","title":"Challenge","stem":"A sample of SiO₂ contains 4.82 × 10²³ oxygen atoms. Calculate the mass of the sample.","data":[],"parts":[{"k":"a","prompt":"Moles of O","model":"4.82 × 10²³ ÷ 6.022 × 10²³ = 0.8004 mol O."},{"k":"b","prompt":"Moles of SiO₂","model":"0.8004 ÷ 2 = 0.4002 mol SiO₂."},{"k":"c","prompt":"Mass","model":"0.4002 × 60.09 g/mol = 24.0 g."}]}]},{"name":"Mock test: multiple choice","mode":"exam","exam":"Mock test","examTips":["Your teacher's review sheet points to a multiple choice and long answer test; the exact format is not confirmed, so this mock is a best guess.","Turn the Timer on, leave Shuffle off, and finish both parts before you look at results."],"tips":["Read every choice, then cross off the ones you can prove wrong.","For particle questions write Z, A and the charge first: p = Z, n = A - Z, e = Z - charge.","For formulas, write both ion charges before you look at the choices, then check the sum is zero.","Distractors are built from real mistakes: a skipped subscript, swapped abundances, a reversed crossover. Name the mistake behind each wrong choice."],"questions":[{"id":"MK1","type":"mcq","topic":"Isotopes","stem":"A certain isotope contains 23 protons and 28 neutrons. What are its mass number and identity?","options":["23, vanadium","28, nickel","51, vanadium","51, antimony"],"ans":2,"exp":"Mass number = protons + neutrons = 23 + 28 = 51. Atomic number 23 is vanadium (V).","why":["23 is the atomic number. The mass number adds protons and neutrons: 23 + 28 = 51.","28 is the neutron count, not the atomic number. The element is set by the 23 protons.","","Antimony has 51 protons. Here 51 is the mass number; the 23 protons make it vanadium."]},{"id":"MK2","type":"mcq","topic":"Isotopes","stem":"Which pair of symbols shows two isotopes of the same element?","options":["²²₁₀X and ²²₁₁X","²⁰₁₀X and ²⁰₁₂X","²¹₉X and ²²₁₁X","²⁰₁₀X and ²²₁₀X"],"ans":3,"exp":"Isotopes share an atomic number (bottom number) and differ in mass number. Both of these have Z = 10.","why":["Same mass number, but the atomic numbers differ (10 and 11), so these are different elements.","The atomic numbers differ (10 and 12), so these are different elements.","The atomic numbers differ (9 and 11), so these are different elements.",""]},{"id":"MK3","type":"mcq","topic":"Ions","stem":"How many electrons are in the ion ⁷⁵₃₃As³⁻?","options":["30","36","33","42"],"ans":1,"exp":"Electrons = Z - charge = 33 - (-3) = 36.","why":["Subtracting 3 is for a positive ion. A 3- ion gained 3 electrons: 33 + 3 = 36.","","33 is the count for a neutral arsenic atom. The 3- charge means 3 extra electrons.","42 is the neutron count (75 - 33), not the electron count."]},{"id":"MK4","type":"mcq","topic":"Average atomic mass","stem":"Rhenium is 37.40% Re-185 and 62.60% Re-187. What is its average atomic mass?","options":["186.00 amu","185.75 amu","186.25 amu","187.00 amu"],"ans":2,"exp":"0.3740 × 185 + 0.6260 × 187 = 186.25 amu.","why":["That is the plain average of 185 and 187. Re-187 is more common, so the answer is above 186.","The abundances are swapped. Re-187 is the 62.60% isotope.","","That is only the most common isotope. The average must include Re-185 too."]},{"id":"MK5","type":"mcq","topic":"Ions","stem":"An ion with a 3+ charge contains 23 electrons. Which ion is it?","options":["V³⁺","Fe³⁺","Sc³⁺","Ca³⁺"],"ans":1,"exp":"Protons = electrons + charge = 23 + 3 = 26, which is iron.","why":["Vanadium has 23 protons, so V³⁺ has only 20 electrons. You matched the electron count to the atomic number.","","Scandium has 21 protons, so Sc³⁺ has 18 electrons.","Calcium is in group 2 and forms 2+ ions, not 3+. It also has only 20 protons."]},{"id":"MK6","type":"mcq","topic":"Ionic formulas","stem":"An alkaline earth metal whose most stable ion has 36 electrons bonds with bromine. What is the formula?","options":["CaBr₂","RbBr","KrBr","SrBr₂"],"ans":3,"exp":"Alkaline earth ions are 2+, so protons = 36 + 2 = 38: strontium. Sr²⁺ needs two Br⁻: SrBr₂.","why":["Ca²⁺ has 18 electrons, not 36.","Rubidium is an alkali metal (group 1), not an alkaline earth metal.","Krypton is a noble gas; 36 is its electron count as a neutral atom.",""]},{"id":"MK7","type":"mcq","topic":"Ionic formulas","stem":"What ionic compound forms when barium bonds with phosphorus?","options":["Ba₃P₂","Ba₂P₃","BaP","Ba₃P"],"ans":0,"exp":"Ba²⁺ and P³⁻: cross the charges to get Ba₃P₂, since 3(+2) + 2(-3) = 0.","why":["","The subscripts are on the wrong ions: 2(+2) + 3(-3) = -5, not zero.","Ba²⁺ and P³⁻ do not cancel one to one: +2 - 3 = -1.","3(+2) + (-3) = +3. Two phosphide ions are needed."]},{"id":"MK8","type":"mcq","topic":"Periodic table","stem":"Which series is NOT matched with the correct description?","options":["F, Cl, Br: halogens","Mg, Ca, Sr: alkaline earth metals","Fe, Co, Ni: transition metals","B, Si, Ge: metals"],"ans":3,"exp":"Boron, silicon and germanium are metalloids, on the staircase, not metals.","why":["These are all in group 17, the halogens. This one is correct.","These are all in group 2. This one is correct.","These are all in groups 3 to 12. This one is correct.",""]},{"id":"MK9","type":"mcq","topic":"Ions","stem":"Which ion has the same number of electrons as a neutral neon atom?","options":["Ca²⁺","Cl⁻","S²⁻","Mg²⁺"],"ans":3,"exp":"Neon has 10 electrons. Mg has 12 protons; losing 2 leaves 10.","why":["Calcium has 20 protons, so Ca²⁺ has 18 electrons, like argon.","Chlorine has 17 protons, so Cl⁻ has 18 electrons.","Sulfur has 16 protons, so S²⁻ has 18 electrons.",""]},{"id":"MK10","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of calcium cyanide, Ca(CN)₂?","options":["80.11 g/mol","66.10 g/mol","92.12 g/mol","132.20 g/mol"],"ans":2,"exp":"40.08 + 2(12.01) + 2(14.01) = 92.12 g/mol.","why":["That doubles only N. The 2 applies to everything inside the parentheses.","That counts only one C and one N. The 2 outside the parentheses doubles both.","","That doubles calcium too. Only the CN inside the parentheses is doubled."]},{"id":"MK11","type":"mcq","topic":"Mole conversions","stem":"How many chlorine atoms are in 45.8 g of MgCl₂?","options":["5.79 × 10²³ atoms","2.90 × 10²³ atoms","0.962 atoms","2.76 × 10²⁵ atoms"],"ans":0,"exp":"45.8 ÷ 95.21 × 2 × 6.022 × 10²³ = 5.79 × 10²³ Cl atoms.","why":["","That skips the subscript: each MgCl₂ has 2 Cl atoms.","That stops at moles of Cl. Multiply by 6.022 × 10²³ to count atoms.","That multiplies by the molar mass instead of dividing by it."]},{"id":"MK12","type":"mcq","topic":"Mole conversions","stem":"A sample of SiO₂ contains 4.82 × 10²³ oxygen atoms. What is the sample's mass?","options":["24.0 g","48.1 g","12.8 g","11.2 g"],"ans":0,"exp":"4.82 × 10²³ ÷ 6.022 × 10²³ = 0.8004 mol O; ÷ 2 = 0.4002 mol SiO₂; × 60.09 = 24.0 g.","why":["","That skips dividing by 2: each SiO₂ has 2 O atoms.","That is the mass of the oxygen only, not the whole SiO₂.","That uses silicon's mass instead of the molar mass of SiO₂."]},{"id":"MK13","type":"mcq","topic":"Molar mass","stem":"What is the molar mass of carbonic acid, H₂CO₃?","options":["61.02 g/mol","62.03 g/mol","30.03 g/mol","63.03 g/mol"],"ans":1,"exp":"2(1.008) + 12.01 + 3(16.00) = 62.03 g/mol.","why":["That counts only one hydrogen. The subscript 2 means two H.","","That counts only one oxygen. The subscript 3 means three O.","That counts three hydrogens. The formula has two."]}]},{"name":"Mock test: long answer","mode":"exam","exam":"Mock test","examTips":["Your teacher's review sheet points to a multiple choice and long answer test; the exact format is not confirmed, so this mock is a best guess.","Turn the Timer on, leave Shuffle off, and finish both parts before you look at results."],"tips":["Write the setup with units, then the answer. Check Answer shows the worked solution.","Self-mark each part honestly; partly right goes into Retest Missed Questions."],"questions":[{"id":"MF1","type":"frq","topic":"Ions","title":"Long answer 2","stem":"A compound contains an unknown ion X and forms the ionic compound XCl₂. Ion X contains 10 electrons.","data":[],"parts":[{"k":"a","prompt":"What is the charge on X? Explain.","model":"2+. Two Cl⁻ ions give 2-, so X must be 2+ for the compound to be neutral."},{"k":"b","prompt":"What is the identity of element X?","model":"Protons = 10 + 2 = 12, so X is magnesium (Mg²⁺)."}]},{"id":"MF2","type":"frq","topic":"Subatomic particles","title":"Long answer 4","stem":"An ion of Pb-297 has lost 2 electrons. (VERIFY: real lead isotopes are about Pb-204 to Pb-208, so 297 may be a typo. Use the number as given; the method is the same.)","data":[],"parts":[{"k":"a","prompt":"How many protons, neutrons and electrons are in the ion?","model":"Protons = 82 (lead's atomic number). Neutrons = 297 - 82 = 215. Electrons = 82 - 2 = 80."},{"k":"b","prompt":"How many subatomic particles in total?","model":"82 + 215 + 80 = 377."},{"k":"c","prompt":"Write the isotopic notation.","model":"²⁹⁷₈₂Pb²⁺: mass number 297 on top, atomic number 82 below, charge 2+ at the upper right."}]},{"id":"MF3","type":"frq","topic":"Ions","title":"Long answer 8","stem":"An ion with a charge of 4+ has 46 electrons and 70 neutrons.","data":[],"parts":[{"k":"a","prompt":"What element is this?","model":"Protons = 46 + 4 = 50, so it is tin (Sn⁴⁺)."},{"k":"b","prompt":"What is its mass number?","model":"Mass number = protons + neutrons = 50 + 70 = 120."}]},{"id":"MF4","type":"frq","topic":"Subatomic particles","title":"Long answer 10","stem":"Explain each of the following.","data":[],"parts":[{"k":"a","prompt":"Why does an ionic bond form?","model":"A metal loses electrons to become a cation and a nonmetal gains them to become an anion, so both complete their octets. The opposite charges attract: that electrostatic force is the ionic bond."},{"k":"b","prompt":"Why does the identity of an element depend on the number of protons it has?","model":"The number of protons is the atomic number, which sets the element. Electrons can be gained or lost (ions) and neutrons can vary (isotopes), but changing the protons makes a different element."},{"k":"c","prompt":"Why is atomic mass on the periodic table a decimal?","model":"Elements exist as a mixture of isotopes. The table lists the average of their masses, weighted by each isotope's abundance, so it is usually not a whole number."},{"k":"d","prompt":"Why do elements in the same group have similar chemical behavior?","model":"Elements in the same group have the same number of valence electrons, and chemical behavior comes from the electrons, so they bond in similar ways."}]}]}]},"cheat":[{"title":"Count the particles","kind":"list","items":["Protons = atomic number (Z).","Neutrons = mass number - Z. Round the atomic mass only when no isotope is named.","Electrons = Z - charge. Lost electrons give +; gained electrons give -.","Isotopic notation: mass number on top, atomic number on the bottom, charge at the upper right."]},{"title":"Charges by group","kind":"table","rows":[["Group","1","2","13","15","16","17","18"],["Charge","+1","+2","+3","-3","-2","-1","none"]]},{"title":"Write an ionic formula","kind":"list","items":["Cation (metal) first, anion (nonmetal) second.","Cross the charge numbers over to become subscripts, then reduce.","Check that the charges add to zero.","Keep polyatomic ions whole; use parentheses for more than one, as in Ca(CN)₂."]},{"title":"Average atomic mass","kind":"list","items":["Sum of (abundance as a decimal × isotope mass).","Boron: 0.20(10) + 0.80(11) = 10.8.","The answer lands nearest the most common isotope."]},{"title":"Molar mass and moles","kind":"list","items":["Molar mass = sum of all atomic masses in the formula, in g/mol.","grams ÷ molar mass = moles.","moles × subscript = moles of that element.","moles × 6.022 × 10²³ = particles."]},{"title":"Who discovered what","kind":"table","rows":[["Scientist","Discovery or model"],["Dalton","Atomic theory: atoms regroup, never created or destroyed"],["Thomson","Electron; plum pudding model"],["Rutherford","Nucleus (gold foil, alpha particles)"],["Bohr","Electrons in fixed orbits (energy levels)"],["Chadwick","Neutron"],["Modern model","Orbitals: likely regions, not exact paths"]]}],"topicDeck":{"Periodic table":1,"History of the atom":2,"Subatomic particles":3,"Isotopes":4,"Average atomic mass":4,"Ions":5,"Ionic formulas":5,"Molar mass":6,"Mole conversions":6}}};

};

      if (legacy[part] && localStorage.getItem(k) === null) {

/* Credit line on every kit page. The engine is MIT-licensed (kit-core/LICENSE): copies must keep this line. */
const CREDIT_URL = "https://dn4563.github.io/Study-Hub-by-David/";

  return '<footer class="credit">Study kit engine by <a href="' + CREDIT_URL + '">David Noskow</a></footer>';
}

function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

function loadSave() {
  SAVE = { settings: Object.assign({}, DEF), known: {}, trouble: {}, done: {}, li: 0, revHist: [], secRev: {}, star: {} };
  const o = readJSON(LSK);
  if (!o) return;
  SAVE.known = o.known || {};
  SAVE.trouble = o.trouble || {};
  SAVE.done = o.done || {};
  SAVE.li = o.li || 0;
  SAVE.ui = o.ui || null;
  SAVE.revHist = o.revHist || [];
  SAVE.secRev = o.secRev || {};
  SAVE.star = o.star || {};
  const s = o.settings || {};
  /* Older kits kept theme and size per kit; carry them over once. */
  if (!readJSON(PREFK) && (s.theme || s.size !== undefined)) {
    if (s.theme) PREFS.theme = s.theme;
    if (typeof s.size === "number") PREFS.size = s.size;
    writeJSON(PREFK, PREFS);
    applyPrefs();
  }
  delete s.theme;
  delete s.size;
  SAVE.settings = Object.assign({}, DEF, s);
}

  writeJSON(LSK, SAVE);
}

function indexCards() {
  BYID = {};
  D.allDecks = D.allDecks || D.decks;
  D.allDecks.forEach((dk, di) => {
    dk.tone = di % 8;
    dk.sections.forEach((sc, si) =>
      sc.cards.forEach((c, ci) => {
        c.id = dk.id + "." + si + "." + ci;
        c.deck = dk.id;
        c.sec = dk.id + "." + si;
        BYID[c.id] = c;
      }),
    );
  });
}
/* Optional decks stay out of "All decks", the meter and the mixed quiz unless turned on in Settings. */
function rebuild() {
  D.decks = D.allDecks.filter((d) => !d.optional || SAVE.settings.optDeck);
  ALL = [];
  LESSONS = [];
  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

/* Answer choices shared by Learn, Quiz and the Practice Test: cross-off, Lock in, and per-choice explanations.
   Explanations name the choice by its text, never by letter, because choices are shuffled. */
function whyHTML(opts, picked, okTxt) {
  const ci = opts.findIndex((o) => o.ok);
  const quote = (o) => '<span class="qt">' + esc(o.t) + "</span>";
  let h = "";
  if (picked >= 0 && !opts[picked].ok)
    h +=
      '<div class="why bad"><div class="wh">Why your answer is wrong</div>' +
      quote(opts[picked]) +
      (opts[picked].why ? "<p>" + esc(opts[picked].why) + "</p>" : "") +
      "</div>";
  if (ci >= 0 && okTxt) h += '<div class="why good"><div class="wh">Why the correct answer is right</div>' + quote(opts[ci]) + "<p>" + okTxt + "</p></div>";
  if (opts.some((o) => o.why))
    h +=
      '<details class="whyall"><summary>Every choice explained</summary><ul>' +
      opts
        .map(
          (o) =>
            "<li>" +
            quote(o) +
            (o.ok ? '<span class="tag ok">Correct</span>' + (okTxt ? "<p>" + okTxt + "</p>" : "") : '<span class="tag bad">Wrong</span><p>' + esc(o.why || "") + "</p>") +
            "</li>",
        )
        .join("") +
      "</ul></details>";
  return h;
}

/* 30-runner.js */
/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,
  TM = null;
const LET = "ABCDE";
function stopTM() {
  clearInterval(TM);
  TM = null;
}
function pickDir() {
  const d = SAVE.settings.dir;
  return d === "both" ? (Math.random() < 0.5 ? "t2d" : "d2t") : d;
}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;
  }
  return out;
}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions
   or choices, and mix in each card's applied questions. Units without it behave exactly as before. */
const MIX = !!(UNIT && UNIT.learnMix);
const STOP = /^(with|from|into|that|this|they|their|than|then|have|each|also|only|some|more|most)$/i;
/* A word counts as the term when it starts with the term word's stem and adds at most a short ending
   (isotope -> isotopes, isotopic). Longer words that merely share letters (mole -> molecules) don't. */
function termStems(term) {
  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));
}
function maskTerm(text, term) {
  const stems = termStems(term);
  let hidden = 0;
  const out = text.replace(/[A-Za-z]+/g, (w) => {
    const lw = w.toLowerCase();
    if (stems.some((st) => lw.startsWith(st) && lw.length - st.length <= 3)) {
      hidden++;
      return "_____";
    }
    return w;
  });
  return { text: out, ratio: hidden / Math.max(1, (text.match(/[A-Za-z]+/g) || []).length) };
}
/* Mixed units: a definition used as the clue has the term blanked out (and is skipped if that leaves too
   little). Answer choices are never blanked: a term -> definition question is only asked when the card's
   definition doesn't contain its own term, and wrong choices that mention the asked term are left out. */
const hasTerm = (text, term) => maskTerm(text, term).ratio > 0;
const clueOK = (card) => !MIX || maskTerm(card.def, card.term).ratio <= 0.2;
const choicesOK = (card) => !MIX || !hasTerm(card.def, card.term);
const shownDef = (c) => (MIX ? maskTerm(c.def, c.term).text : c.def);
function askQ(card, a) {
  return {
    kind: "ap",
    card: card,
    ask: "Apply it",
    prompt: esc(a.q),
    options: shuf([{ t: a.right, ok: true }].concat(a.wrong.map((w) => ({ t: w[0], ok: false, why: w[1] })))),
    explain: (a.exp ? esc(a.exp) + "<br>" : "") + "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function mcQ(card, dir, nopt) {
  dir = dir || pickDir();
  const okDir = (d) => (d === "d2t" ? clueOK(card) : choicesOK(card));
  if (!okDir(dir)) dir = dir === "d2t" ? "t2d" : "d2t";
  /* No fair definition question for this card: ask its applied question instead. */
  if (!okDir(dir) && card.asks && card.asks.length) return askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
  nopt = nopt || 4;
  const field = dir === "t2d" ? "def" : "term";
  const opts = shuf(
    [{ t: card[field], ok: true }].concat(
      distractors(card, nopt - 1, field).map((c) => ({
        t: c[field],
        ok: false,
        why:
          dir === "t2d"
            ? 'That description belongs to "' + c.term + '", not to "' + card.term + '".'
            : '"' + c.term + '" means: ' + c.def + ' That is a different idea from the description in the question, which fits "' + card.term + '".',
      })),
    ),
  );
  return {
    kind: "mc",
    card: card,
    dir: dir,
    ask: dir === "t2d" ? "Which description best matches this term?" : "Which term matches this description?",
    prompt: dir === "t2d" ? "<b>" + esc(card.term) + "</b>" : esc(shownDef(card)),
    options: opts,

      tr = saved.trouble || {},
      kn = saved.known || {},
      seen = saved.recallSeen || {};
    unitCards(u).forEach((c) => cands.push({ u: u.id, id: c.id, w: tr[c.id] > 0 && !kn[c.id] ? 3 : 1, seen: seen[c.id] || 0 }));

    .filter((c) => c.seen)
    .sort((x, y) => y.seen - x.seen)
    .slice(0, RECALL_COOLDOWN_N);

  if (!pool.length) pool = cands;
  let r = Math.random() * pool.reduce((n, c) => n + c.w, 0),
    pick = pool[pool.length - 1];

  const u = COURSE.units.find((x) => x.id === pick.u),
    k = keyOf(u, "kit"),

function recallQ(item) {

    card = cards.find((c) => c.id === item.id);
  const label = "From " + u.label + ": " + u.title + ". ";
  let q;
  if (u.learnMix && card.asks && card.asks.length && Math.random() < AP_REVIEW) q = askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
  else {
    const dir = Math.random() < 0.5 ? "t2d" : "d2t",
      field = dir === "t2d" ? "def" : "term",
      same = shuf(cards.filter((c) => c !== card && c.sec === card.sec)),
      rest = shuf(cards.filter((c) => c !== card && c.sec !== card.sec)),
      ds = same.concat(rest).filter((c, i, a) => c[field] !== card[field] && a.findIndex((x) => x[field] === c[field]) === i).slice(0, 3);
    q = {
      kind: "mc",
      dir: dir,
      ask: dir === "t2d" ? "Which description best matches this term?" : "Which term matches this description?",
      prompt: dir === "t2d" ? "<b>" + esc(card.term) + "</b>" : esc(card.def),
      options: shuf([{ t: card[field], ok: true }].concat(ds.map((c) => ({ t: c[field], ok: false, why: dir === "t2d" ? 'That describes "' + c.term + '".' : '"' + c.term + '" means: ' + c.def })))),

function recallResult(r, ok) {

function learnQ(item) {
  if (item.type === "recall") return recallQ(item);
  if (item.type === "sc") return scQ(D.sq[item.idx], "Checkpoint: apply it");
  const card = BYID[item.id];
  /* Mixed units: a lesson asks each new term as a definition question first (form "mc"), then most terms come
     back as their applied question (form "ap"). Review questions lean 2:1 toward definitions. A term that comes
     back after a miss switches form: missed a definition question, get an applied one, and the other way round. */
  const hasAsk = MIX && card.asks && card.asks.length;
  const applied =
    hasAsk && (item.avoid === "ap" ? false : item.avoid ? true : item.form === "ap" ? true : item.form === "mc" ? false : Math.random() < AP_REVIEW);
  if (applied) {
    const q = askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
    if (item.review) q.ask = "Review from an earlier lesson. " + q.ask;
    return q;
  }
  const q = mcQ(card, Math.random() < 0.35 ? "t2d" : "d2t", 4);

}

    other = shuf(cards.filter((c) => !(SAVE.trouble[c.id] > 0)));
  const q = shuf(weak.concat(other).slice(0, Math.min(SR_N, cards.length))).map((c) => ({ type: "card", id: c.id }));
  UI.L = { phase: "quiz", sr: true, queue: q, cur: null, picked: null, first: 0, firstTotal: q.length, missed: new Set(), scenMiss: [], scenMissIdx: [], recallMiss: [], tried: new Set() };

ACT.lquiz = () => {
  const li = LI(),
    lesson = LESSONS[li];
  const doneC = [];
  LESSONS.forEach((l, i) => {
    if (i !== li && SAVE.done[l.id]) l.cards.forEach((c) => doneC.push(c));
  });
  /* Mixed units: a term used as a review in either of the last 2 lessons sits out this one. */
  const cool = MIX ? [].concat(...(SAVE.revHist || []).slice(-2)) : [];
  const pool = cool.length && doneC.filter((c) => cool.indexOf(c.id) < 0).length >= 3 ? doneC.filter((c) => cool.indexOf(c.id) < 0) : doneC;
  const weak = shuf(pool.filter((c) => SAVE.trouble[c.id] > 0)),
    other = shuf(pool.filter((c) => !(SAVE.trouble[c.id] > 0)));
  const reviews = weak
    .concat(other)
    .slice(0, Math.min(3, doneC.length))
    .map((c) => ({ type: "card", id: c.id, review: true }));
  if (MIX) {
    SAVE.revHist = (SAVE.revHist || []).concat([reviews.map((r) => r.id)]).slice(-2);
    save();
  }
  let q = shuf(lesson.cards).map((c) => (MIX ? { type: "card", id: c.id, form: "mc" } : { type: "card", id: c.id }));
  reviews.forEach((r) => q.splice(1 + Math.floor(Math.random() * q.length), 0, r));
  /* Mixed units, round 2: about 3 of every 4 lesson terms that have an applied question come back as one. */
  if (MIX) {
    const withAsk = shuf(lesson.cards.filter((c) => c.asks && c.asks.length));
    const n = Math.round(withAsk.length * AP_SHARE);
    q = q.concat(shuf(withAsk.slice(0, n)).map((c) => ({ type: "card", id: c.id, form: "ap", r2: true })));

function learnPick(k) {
  const L = UI.L;

  L.picked = k;
  if (L.cur.recall) {
    const ok = !!L.cur.options[k].ok;
    recallResult(L.cur.recall, ok);
    if (!ok) (L.recallMiss = L.recallMiss || []).push(L.cur);
    return render();
  }
  const q = L.cur,
    ok = !!q.options[k].ok,
    key = L.item.type === "sc" ? "s" + L.item.idx : L.item.r2 ? L.item.id + "#ap" : L.item.id,
    firstTime = !L.tried.has(key);
  L.tried.add(key);

  if (q.card) {
    const id = q.card.id;
    if (ok) {

      const gap = MIX ? 2 + Math.floor(Math.random() * 2) : 2;

/* Every sort records enough to undo it exactly. */

};
ACT.fcswap = () => {

ACT.fcshuf = () => {

/* 70-quiz.js */
/* Quiz builder: decks, how many of each type, number of choices, feedback timing, order and an optional
   per-question timer. Results break down by type and topic, with retry-missed and rerun. */
function initQ() {
  if (!UI.q) UI.q = { decks: {}, mc: 10, tf: 5, sc: 6, nopt: 4, fb: "immediate", order: "shuffle", timer: SAVE.settings.timer };
  D.decks.forEach((d) => {
    if (UI.q.decks[d.id] === undefined) UI.q.decks[d.id] = true;
  });
}
function QSET(t) {
  initQ();
  if (t.dataset.qd !== undefined) {
    const d = D.decks.find((x) => String(x.id) === t.dataset.qd);
    if (d) UI.q.decks[d.id] = t.checked;
    clampQ();
    return render();
  }
  if (t.type === "number") {
    UI.q[t.dataset.q] = Math.max(0, Math.floor(Number(t.value) || 0));
    clampQ();
    return render();
  }
  UI.q[t.dataset.q] = t.value;
}
/* Real limits for the chosen decks. Multiple choice and true/false share the decks' terms (a term is asked
   once, one way or the other); applied questions are counted separately. */
function quizCaps() {
  const decks = quizDecks();
  return { terms: ALL.filter((c) => decks.indexOf(c.deck) >= 0).length, applied: appliedCount() };
}
function clampQ() {
  const c = quizCaps(),
    q = UI.q;
  q.mc = Math.min(Math.max(0, Number(q.mc) || 0), c.terms);
  q.tf = Math.min(Math.max(0, Number(q.tf) || 0), c.terms - q.mc);
  q.sc = Math.min(Math.max(0, Number(q.sc) || 0), c.applied);

let QRECENT = new Set();
/* How many applied questions the chosen decks have: scenarios plus applied (asks.json) questions. */
function appliedPool(decks) {
  const pool = [];
  D.sq.forEach((s, i) => decks.indexOf(s.deck) >= 0 && pool.push({ key: "s" + i, make: () => scQ(s) }));
  ALL.filter((c) => decks.indexOf(c.deck) >= 0).forEach((c) => (c.asks || []).forEach((a, i) => pool.push({ key: "a" + c.id + ":" + i, make: () => askQ(c, a) })));
  return pool;
}
const quizDecks = () => D.decks.map((d) => d.id).filter((id) => !UI.q || UI.q.decks[id] !== false);
function appliedCount() {
  return appliedPool(quizDecks()).length;
}

ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  clampQ();
  /* Random order, then (stable sorts) the Settings focus first and last quiz's questions last. */
  const recentLast = (key) => (QRECENT.has(key) ? 1 : 0);
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  pool.sort((a, b) => recentLast("c" + a.id) - recentLast("c" + b.id));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  /* Each term once: the first nmc as multiple choice, the next ntf as true or false. */
  nmc = Math.min(nmc, pool.length);
  ntf = Math.min(ntf, pool.length - nmc);
  const used = new Set();
  for (let i = 0; i < nmc; i++) {
    const mq = mcQ(pool[i], null, np);
    qs.push(mq);
    used.add("c" + pool[i].id);
    /* A card with no fair definition question is asked with its applied question; don't ask that one again below. */
    if (mq.kind === "ap") used.add("a" + pool[i].id + ":" + pool[i].asks.findIndex((a) => esc(a.q) === mq.prompt));
  }
  for (let i = nmc; i < nmc + ntf; i++) {
    qs.push(tfQ(pool[i]));
    used.add("c" + pool[i].id);
  }
  /* Applied pool: the decks' scenario questions plus every applied (asks.json) question, each at most once. */
  const ap = shuf(appliedPool(decks).filter((it) => !used.has(it.key)));
  ap.sort((a, b) => recentLast(a.key) - recentLast(b.key));
  ap.slice(0, nsc).forEach((it) => {
    qs.push(it.make());
    used.add(it.key);
  });
  QRECENT = used;
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};

/* 85-backup.js */
/* Whole-course backup on the course home page: one file with every unit's saved progress (and the course's
   theme and text size). Restore reads that file back. In a kit built with content/import-map.json (for example
   the Psych kit, whose content came from Phineas's kit), Restore also reads that other kit's backup file and
   carries over the cards marked known and the missed-term counts. */
let bkMsg = "";
const BK_PREFIX = "sk:" + COURSE.id + ":";
function backupData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(BK_PREFIX) === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "study-kit", course: COURSE.id, saved: new Date().toISOString(), data: data };
}
function restoreData(o) {
  if (!o || o.app !== "study-kit" || typeof o.data !== "object") throw new Error("unreadable");
  if (o.course !== COURSE.id) throw new Error("other course");
  const keys = Object.keys(o.data).filter((k) => k.indexOf(BK_PREFIX) === 0 && typeof o.data[k] === "string");
  if (!keys.length) throw new Error("empty");
  keys.forEach((k) => {
    try {
      localStorage.setItem(k, o.data[k]);
    } catch (e) {}
  });
  return "Restored your progress for " + plural(new Set(keys.map((k) => k.split(":")[2])).size - (o.data[BK_PREFIX + "prefs"] ? 1 : 0), "unit") + ".";
}
/* Every card in a unit, optional decks included, keyed by term. */
function termIds(u) {
  const out = {};
  UNITDATA[u.id].decks.forEach((dk) => dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => (out[c.term] = dk.id + "." + si + "." + ci))));
  return out;
}
function importForeign(o) {
  const M = IMPORT_MAP;
  const parse = (k) => {
    try {
      return JSON.parse((o.data || {})[k] || "null") || {};
    } catch (e) {
      return {};
    }
  };
  const known = parse(M.known),
    miss = parse(M.miss);
  const per = {};
  const ids = {};
  const touch = (hisId) => {
    const m = M.cards[hisId];
    if (!m) return null;
    const u = COURSE.units.find((x) => x.id === m[0]);
    if (!u) return null;
    ids[u.id] = ids[u.id] || termIds(u);
    const id = ids[u.id][m[1]];
    if (!id) return null;
    if (!per[u.id]) per[u.id] = { u: u, saved: readJSON(keyOf(u, "kit")) || {}, known: 0, trouble: 0 };
    const p = per[u.id];
    p.saved.known = p.saved.known || {};
    p.saved.trouble = p.saved.trouble || {};
    return { p: p, id: id };
  };
  Object.keys(known).forEach((h) => {
    if (!known[h]) return;
    const t = touch(h);
    if (!t) return;
    if (!t.p.saved.known[t.id]) t.p.known++;
    t.p.saved.known[t.id] = true;
  });
  Object.keys(miss).forEach((h) => {
    const n = Number(miss[h]) || 0;
    if (n <= 0) return;
    const t = touch(h);
    if (!t) return;
    if (!((t.p.saved.trouble[t.id] || 0) > 0)) t.p.trouble++;
    t.p.saved.trouble[t.id] = Math.max(t.p.saved.trouble[t.id] || 0, n);
  });
  const parts = [];
  let nk = 0,
    nt = 0;
  COURSE.units.forEach((u) => {
    const p = per[u.id];
    if (!p) return;
    writeJSON(keyOf(u, "kit"), p.saved);
    nk += p.known;
    nt += p.trouble;
    parts.push(u.label + ": " + p.known + " known, " + p.trouble + " to practice");
  });
  if (!parts.length) throw new Error("nothing");
  return "Brought over " + plural(nk, "known card") + " and " + plural(nt, "missed term") + " from " + M.name + ". " + parts.join(" · ") + ".";
}
function readBackupFile(text) {
  const o = JSON.parse(text);
  if (IMPORT_MAP && o && o.app === IMPORT_MAP.app) return importForeign(o);
  return restoreData(o);
}
const BK_ERR = {
  "other course": "That backup is from a different course. Restore it in that course's study kit.",
  empty: "That backup has no saved progress in it.",
  nothing: "None of the cards in that backup match this kit.",

    (IMPORT_MAP ? " Restore also accepts a backup file from " + esc(IMPORT_MAP.name) + "." : "") +
    '</p><div class="qnav"><button class="btn sec" data-act="bkdown">Download backup</button><button class="btn sec" data-act="bkup">Restore from backup</button></div>' +
    '<input type="file" id="bkfile" accept=".json,application/json" hidden>' +

}
