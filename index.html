 at its minimum, so there is nothing colder.","why":["","Kelvin works for any state of matter.","Particles do not disappear; they still exist at 0 K.","Substances can be solid well above 0 K, and freezing does not stop cooling."]},{"id":"C4","type":"mcq","topic":"States of matter","stem":"A glass holds ice and liquid water at exactly 0 °C. Which statement is correct?","options":["Only ice is present because 0 °C is below freezing","Ice and water coexist, and some vapor is in the air","Only liquid is present because ice melts at 0 °C","Ice and water coexist, but no vapor forms below 100 °C"],"ans":1,"exp":"At the melting point the solid and liquid are in equilibrium, and molecules also escape as water vapor, so all three states are present.","why":["0 °C is the freezing point, not below it, and liquid water is also in the glass.","","The glass still contains ice.","Evaporation and sublimation happen below the boiling point too."]},{"id":"C5","type":"mcq","topic":"Properties","stem":"A liquid has a thick texture, a grape smell, a density of 3.4 g/mL and a pH of 4.5. Which one is a chemical property on the review sheet?","options":["Its thick texture","Its grape smell","Its pH of 4.5","Its density of 3.4 g/mL"],"ans":2,"exp":"The review sheet lists pH with the chemical properties, along with reacting or not reacting with substances.","why":["Texture is a physical property.","Odor is observed without changing the liquid.","","Density is a measured physical (intensive) property."]},{"id":"C6","type":"mcq","topic":"Classifying matter","stem":"Which of these will settle into layers or sediment if left standing?","options":["Salt dissolved in water","Clean air in a room","An 18K gold ring","Juice with pulp"],"ans":3,"exp":"A suspension is a heterogeneous mixture that settles; juice with pulp, mud and oil and water are examples.","why":["A solution stays evenly mixed.","Air is a uniform mixture of gases.","An alloy is uniform throughout.",""]},{"id":"C7","type":"mcq","topic":"Particles and conservation","stem":"Zinc is placed in copper sulfate solution, and copper metal forms while zinc ends up in solution. Which type of reaction is this?","options":["Single displacement","Decomposition","Synthesis","Double displacement"],"ans":0,"exp":"One element (zinc) pushes another element (copper) out of a compound, which is single displacement.","why":["","Decomposition starts with a single compound.","Synthesis joins substances into one product, and here there are two products.","Double displacement swaps the positive parts of two compounds, and an element is not involved."]},{"id":"C8","type":"mcq","topic":"Separating mixtures","stem":"In paper chromatography of black ink, which part is the mobile phase?","options":["The strip of filter paper","The water moving up","The spot of black ink","The beaker holding it"],"ans":1,"exp":"The water carries the ink pigments up the paper, and each pigment travels a different distance.","why":["The paper is the fixed phase and does not move.","","The ink is the sample being separated.","The beaker only holds the solvent."]}]},{"name":"MCQ Set D: colloids","mode":"practice","tips":["Read every choice before you pick one, then cross off the ones you can prove wrong with the red X.","Hard questions often mix up near-neighbors: element versus molecule, compound versus mixture, physical change versus chemical change. Decide which pair the question is testing.","For formula codes, look for an & first (mixture). Then count capital letters: one means an element, two or more means a compound.","When data is given (masses, bubbles, a leftover solid), say what the data shows before you look at the choices.","Watch extreme words such as \"only,\" \"always,\" \"never\" and \"all.\" They are usually wrong."],"questions":[{"id":"K1","type":"mcq","topic":"Colloids","stem":"Whipped cream is gas bubbles spread through a liquid. What is this type of colloid called?","options":["Aerosol","Emulsion","Foam","Gel"],"ans":2,"exp":"A gas dispersed in a liquid is a foam. Soap lather and froth are also foams.","why":["An aerosol is dispersed in a gas.","An emulsion is a liquid in a liquid.","","A gel is a liquid held in a solid."]},{"id":"K2","type":"mcq","topic":"Colloids","stem":"Mayonnaise is tiny oil droplets spread through a water-based liquid. What is this type of colloid called?","options":["Solid sol","Foam","Gel","Emulsion"],"ans":3,"exp":"A liquid dispersed in a liquid is an emulsion. Milk and hair cream are other examples.","why":["A solid sol is a solid or gas dispersed in a solid; mayonnaise is a liquid in a liquid.","A foam is a gas in a liquid.","A gel is a liquid in a solid.",""]},{"id":"K3","type":"mcq","topic":"Colloids","stem":"Smoke and fog are both called aerosols. What do they have in common?","options":["Both have a gas as the medium for the particles","Both are made of a gas dispersed in a gas","Both are made of a liquid dispersed in a liquid","Both are made of a solid dispersed in a solid"],"ans":0,"exp":"The name aerosol depends on the medium: when a gas holds the particles, it is an aerosol. Smoke has solid particles and fog has liquid droplets.","why":["","Both of these have particles of solid or liquid, not gas.","Neither has a liquid as the medium.","Air is the medium for both, and it is a gas."]},{"id":"K4","type":"mcq","topic":"Colloids","stem":"A flashlight beam is visible in a glass of cloudy liquid but not in a glass of clear salt water. What does this show?","options":["The salt water is a colloid and the cloudy liquid is a solution","The cloudy liquid is a colloid, and the salt water is a solution","Both liquids are true solutions","The cloudy liquid is a pure substance, and the salt water is not"],"ans":1,"exp":"Colloid particles are large enough to scatter light (the Tyndall effect). Solution particles are too small to scatter it.","why":["It is the other way around: the beam is scattered by the colloid.","","A true solution would not show the beam.","Neither result tells you about pure substances."]},{"id":"K5","type":"mcq","topic":"Colloids","stem":"Which statement correctly compares a colloid with a suspension?","options":["A colloid settles on standing, and a suspension does not","A colloid is a pure substance, and a suspension is a mixture","A colloid stays mixed, while a suspension settles","Both settle quickly, but only a colloid can be filtered"],"ans":2,"exp":"Colloids are stable, with particles about 1 to 1000 nm. A suspension is a heterogeneous mixture that settles upon standing.","why":["It is the other way around.","Both are mixtures.","","A colloid does not settle on standing."]},{"id":"K6","type":"mcq","topic":"Colloids","stem":"Cream can be separated from milk. Which method works, according to the notes?","options":["Simple filtration with filter paper","Letting the milk sit for five minutes","Dissolving the milk in more water","A high-speed centrifuge"],"ans":3,"exp":"A colloid cannot be separated by simple filtration, but a high-speed centrifuge can separate it.","why":["Colloid particles are small enough to pass through simple filters.","A colloid does not settle on standing.","Adding water does not separate the parts.",""]},{"id":"K7","type":"mcq","topic":"Colloids","stem":"In a colloid, what is the dispersed phase?","options":["The part present in the smaller quantity","The component present in the larger amount","The light that is scattered by the particles","The container that holds the colloid"],"ans":0,"exp":"The dispersed phase is like a solute (smaller amount). The dispersion medium is like a solvent (larger amount) and holds the particles.","why":["","That is the dispersion medium.","Light is not a part of the colloid.","The container is not part of the mixture."]},{"id":"K8","type":"mcq","topic":"Colloids","stem":"Jelly and cheese are each a liquid dispersed in a solid. What is this type of colloid called?","options":["Sol","Gel","Emulsion","Solid sol"],"ans":1,"exp":"A liquid dispersed in a solid is a gel.","why":["A sol is a solid in a liquid.","","An emulsion is a liquid in a liquid.","A solid sol is a solid or a gas in a solid."]},{"id":"K9","type":"mcq","topic":"Colloids","stem":"About how large are colloid particles?","options":["Less than 1 nm across, so they pass through any filter","About 1 mm to 1 cm across, so they settle quickly","About 1 nm to 1000 nm across","Exactly 1000 nm across for every colloid"],"ans":2,"exp":"Colloid particles are about 1 nm to 1000 nm, big enough to scatter light but small enough to stay mixed.","why":["That size describes the particles in a true solution.","That size is much larger than a colloid and is more like a suspension.","","Colloid particles are a range of sizes."]},{"id":"K10","type":"mcq","topic":"Colloids","stem":"Under a microscope, colloid particles move in a continuous, random zigzag path. What is this called?","options":["The Tyndall effect","Sublimation","Chromatography","Brownian movement"],"ans":3,"exp":"Brownian movement is the random zigzag motion of colloid particles.","why":["The Tyndall effect is the scattering of light.","Sublimation is a solid changing straight to a gas.","Chromatography is a way of separating mixtures.",""]},{"id":"K11","type":"mcq","topic":"Colloids","stem":"Which of these is NOT a colloid?","options":["Salt dissolved in water","Butter spread on warm toast","Smoke from a small campfire","Fog drifting over a farm field"],"ans":0,"exp":"Salt water is a solution. Its particles are too small to scatter light, and fog, butter and smoke are colloids.","why":["","Butter is an emulsion.","Smoke is an aerosol.","Fog is an aerosol."]}]},{"name":"Day 1: all four FRQ types","mode":"exam","exam":"Day 1","examTips":["The real Day 1 gives you 2 of 4 FRQ types at random: states of matter (Bunsen and Beaker), colloids (Blobby), defining properties (Ada Twist) and comparisons (Elmo). This section has one of each, so do all four.","The real Day 1 gives you 2 random FRQs. Turn the Timer on, leave Shuffle off, and write full answers before you check.","Show work on any calculation and give a reason for every classification."],"tips":[],"questions":[{"id":"V1","type":"frq","title":"Test-style FRQ 1: States of matter","stem":"Use what you know about the states of matter and temperature to answer the questions about a glass of ice water.","data":[],"parts":[{"k":"a","prompt":"A glass of ice water sits in the sun. Explain why ice, liquid water and a little water vapor can all be present at 0 °C.","model":"At 0 °C ice and liquid water are at the melting and freezing point, so they coexist. Some molecules also leave both the ice and the liquid as water vapor (sublimation and evaporation). Solid, liquid and gas are all present."},{"k":"b","prompt":"Describe the spacing, motion and organization of the particles in a solid, a liquid and a gas of the same substance.","model":"Solid: close together in fixed positions, vibrating, most organized. Liquid: close together but able to slide past each other, less organized. Gas: far apart, moving fast and randomly, least organized."},{"k":"c","prompt":"What happens to particle motion as a substance is cooled toward 0 K, and why can it not be cooled below 0 K?","model":"The particles move more and more slowly. At 0 K (-273.15 °C) they have the minimum possible motion, so there is no lower temperature. That is why 0 K is absolute zero."},{"k":"d","prompt":"Name the change of state for each and say whether energy is added or removed: ice to water, steam to water, water to ice, dry ice to gas, frost forming on a window.","model":"Ice to water: melting, energy added. Steam to water: condensation, energy removed. Water to ice: freezing, energy removed. Dry ice to gas: sublimation, energy added. Frost forming: deposition, energy removed."}],"topic":"States of matter"},{"id":"V2","type":"frq","title":"Test-style FRQ 2: Colloids","stem":"A food truck sells several colloids. Whipped cream and mayonnaise are made, hair spray is sprayed from a can, marshmallows are served and gelatin dessert is chilled. A sign beside the truck says \"FOG WARNING\" because a smoke machine is running.","data":[],"parts":[{"k":"a","prompt":"Give the structure (what is dispersed in what) and the colloid name for whipped cream, mayonnaise, hair spray mist, marshmallow and gelatin dessert.","model":"Whipped cream: gas in a liquid, foam. Mayonnaise: liquid in a liquid, emulsion. Hair spray mist: liquid in a gas, aerosol. Marshmallow: gas in a solid, solid sol. Gelatin dessert: liquid in a solid, gel."},{"k":"b","prompt":"Smoke from the machine and fog from the same machine are both colloids with the same name. Give the name and the structure of each.","model":"Both are aerosols. Smoke is a solid dispersed in a gas; fog is a liquid dispersed in a gas."},{"k":"c","prompt":"Describe an experiment that shows the mayonnaise is a colloid and not a solution.","model":"Shine a light beam through a dilute sample. If it is a colloid the particles scatter the light and the beam is visible (Tyndall effect); a solution does not scatter the beam."},{"k":"d","prompt":"Compare a colloid, a solution and a suspension on particle size and settling.","model":"A solution has the smallest particles and does not settle or scatter light. A colloid has particles about 1 to 1000 nm, is stable, does not settle on standing and scatters light. A suspension has large particles that settle upon standing."}],"topic":"Colloids"},{"id":"V3","type":"frq","title":"Test-style FRQ 3: Defining the liquids","stem":"In another lab, Liquid X is pale yellow, thin and smells like lemon. It has a density of 0.85 g/mL and a pH of 3.1, and its data sheet says it reacts with metals and with bases. Liquid Y is colorless and has no odor. It has a density of 1.00 g/mL and a pH of 7.0, and its data sheet says it does not react with metals. When X and Y are mixed in a flask, the mixture fizzes, the temperature rises from 21 °C to 27 °C, and a white solid settles out.","data":[],"parts":[{"k":"a","prompt":"List the physical properties you can see in the description.","model":"Liquid X: pale yellow, thin, lemon smell, density 0.85 g/mL. Liquid Y: colorless, no odor, density 1.00 g/mL."},{"k":"b","prompt":"List the chemical properties you can see in the description.","model":"Liquid X: pH 3.1 (acidic), reacts with metals, reacts with bases. Liquid Y: pH 7.0 (neutral) and does not react with metals."},{"k":"c","prompt":"Decide whether mixing X and Y is a physical or chemical change and give three pieces of evidence.","model":"Chemical change. Evidence: fizzing (a gas was given off), a temperature change from 21 °C to 27 °C (+6 °C), and a white solid (precipitate) formed."},{"k":"d","prompt":"Is density an intensive or extensive property? Explain with Liquid X.","model":"Intensive. Density does not depend on the amount: 10 mL or 1 L of Liquid X still has a density of 0.85 g/mL. Mass and volume are extensive."}],"topic":"Properties"},{"id":"V4","type":"frq","title":"Test-style FRQ 4: Putting it in order","stem":"A student is organizing thoughts from the chapter. Answer each comparison.","data":[],"parts":[{"k":"a","prompt":"What is the difference between a solute, a solvent and a solution? Use sugar water as the example.","model":"In sugar water the solvent (water) does the dissolving, the solute (sugar) is dissolved, and the solution is the mixture of the two."},{"k":"b","prompt":"Compare and contrast intensive and extensive physical properties with an example of each.","model":"Both are physical properties observed without changing the substance. An intensive property is always true for the substance whatever the amount (density, color, boiling point); an extensive property depends on the amount of matter (mass, volume, length)."},{"k":"c","prompt":"Compare and contrast a solution and a suspension.","model":"Both are mixtures. A solution is homogeneous and does not settle (salt water); a suspension is heterogeneous and settles upon standing (mud, juice with pulp, oil and water)."},{"k":"d","prompt":"Compare and contrast evaporation and distillation.","model":"Both boil off a liquid and are physical. Evaporation lets the liquid escape as a gas to leave a solid behind; distillation traps and condenses the vapor to collect the liquid."},{"k":"e","prompt":"Compare and contrast synthesis and decomposition reactions.","model":"Both are chemical changes that make new substances. In synthesis two or more substances combine to form something new; in decomposition one substance breaks down into two or more."}],"topic":"Classifying matter"}]},{"name":"Day 2: T/F, Labeling, MCQ","mode":"exam","exam":"Day 2","examTips":["The real Day 2 has 8 true/false, 2 labeling questions and about 13 multiple choice. This section mirrors that order.","Turn the Timer on and check answers at the end to match test conditions. Use Flag for review on hard ones."],"tips":["Read every choice before you pick one, then cross off the ones you can prove wrong with the red X.","Hard questions often mix up near-neighbors: element versus molecule, compound versus mixture, physical change versus chemical change. Decide which pair the question is testing.","For formula codes, look for an & first (mixture). Then count capital letters: one means an element, two or more means a compound.","When data is given (masses, bubbles, a leftover solid), say what the data shows before you look at the choices.","Watch extreme words such as \"only,\" \"always,\" \"never\" and \"all.\" They are usually wrong."],"questions":[{"id":"MT1","type":"tf","topic":"Separating mixtures","stem":"A heterogeneous mixture can be separated by physical methods.","ans":true,"exp":"Every mixture can be separated into its pure substances by physical means."},{"id":"MT2","type":"tf","topic":"Properties","stem":"Flammability is a chemical property.","ans":true,"exp":"Flammability describes the ability to burn, which forms new substances."},{"id":"MT4","type":"tf","topic":"Classifying matter","stem":"A compound has the same composition no matter where the sample came from.","ans":true,"exp":"A compound always has the same combination of atoms."},{"id":"MT5","type":"tf","topic":"Properties","stem":"Boiling point is an extensive property.","ans":false,"exp":"Boiling point does not depend on the amount, so it is intensive."},{"id":"MT6","type":"tf","topic":"Physical vs chemical change","stem":"In a chemical change, atoms are rearranged to form new substances.","ans":true,"exp":"Bonds are broken and re-formed, so the products differ from the starting substances."},{"id":"MT7","type":"tf","topic":"Particles and conservation","stem":"A drawing of one lone atom is enough to prove the sample is an element.","ans":false,"exp":"A single atom could be a tiny piece of a mixture. You need to see the other particles in the sample."},{"id":"MT9","type":"tf","topic":"Colloids","stem":"A beam of light is visible in a colloid but not in a true solution.","ans":true,"exp":"Colloid particles scatter light (the Tyndall effect). Solution particles are too small to do that."},{"id":"MT10","type":"tf","topic":"Colloids","stem":"Whipped cream is an emulsion because it contains a liquid.","ans":false,"exp":"Whipped cream is gas bubbles in a liquid, which is a foam. An emulsion is a liquid in a liquid."},{"id":"ML1","type":"label","topic":"Classifying matter","stem":"Label each material as an element, a compound or a mixture.","labels":["Element","Compound","Mixture"],"items":[{"t":"Ne","ans":0,"exp":"One capital letter, one type of atom."},{"t":"KBr","ans":1,"exp":"Potassium and bromine bonded in one formula."},{"t":"N₂ & O₂","ans":2,"exp":"The & separates two different substances (two elements)."},{"t":"H₂O₂","ans":1,"exp":"Hydrogen and oxygen in a different ratio than water: still one compound."},{"t":"S₈","ans":0,"exp":"Eight sulfur atoms bonded, only one type of atom."},{"t":"CO₂ & H₂O","ans":2,"exp":"Two compounds sitting together."}]},{"id":"ML2","type":"label","topic":"Physical vs chemical change","stem":"Label each change as a physical change or a chemical change.","labels":["Physical change","Chemical change"],"items":[{"t":"Ice melting in a glass","ans":0,"exp":"Only the state changes."},{"t":"Baking soda fizzing in vinegar","ans":1,"exp":"A gas forms as a new substance."},{"t":"Cutting a piece of paper in half","ans":0,"exp":"Size changes but not composition."},{"t":"Gasoline burning in an engine","ans":1,"exp":"Burning forms new substances and releases energy."},{"t":"Salt dissolving in water","ans":0,"exp":"The salt keeps its identity and can be recovered."},{"t":"A cut apple slice turning brown","ans":1,"exp":"The apple reacts with oxygen in the air and forms new substances."}]},{"id":"M1","type":"mcq","topic":"States of matter","stem":"A liquid and a gas are each in a sealed 500 mL container. Which observation distinguishes the liquid?","options":["It takes the shape of the container and fills all 500 mL.","It has a definite volume that can be less than 500 mL.","Its particles are far apart and move randomly.","Its particles are locked into rigid positions."],"ans":1,"exp":"A liquid has a definite volume and takes the shape of its container without filling it.","why":["That describes a gas; a liquid fills only the volume it has.","","This describes a gas.","This describes a solid."]},{"id":"M2","type":"mcq","topic":"Physical vs chemical change","stem":"Which of the following is a chemical change?","options":["Alcohol evaporating from your skin","A glass bottle shattering on the floor","A silver spoon tarnishing in air","Butter softening on a warm counter"],"ans":2,"exp":"Tarnish is a new substance formed when silver reacts with substances in the air.","why":["Evaporation is a change of state, a physical change.","Breaking glass only changes shape and size.","","Softening is a physical change."]},{"id":"M3","type":"mcq","topic":"Classifying matter","stem":"Which list contains one element, one compound and one mixture, in that order?","options":["H₂O, Br₂, Cu & Zn","N₂, N₂ & O₂, NO₂","CO, Co, C₆H₁₂O₆ & H₂O","Au, CO₂, NaCl & H₂O"],"ans":3,"exp":"Au is an element, CO₂ is a compound and NaCl & H₂O is a mixture.","why":["The order is compound, element, mixture.","The order is element, mixture, compound.","The order is compound, element, mixture.",""]},{"id":"M4","type":"mcq","topic":"Separating mixtures","stem":"Which separation depends on a difference in boiling point?","options":["Collecting pure water from salt water in a condenser","Separating ink pigments on a strip of absorbent paper","Leaving a puddle of salt water to sit in the sun","Removing sand from water with a piece of filter paper"],"ans":0,"exp":"Distillation boils the component with the lower boiling point and condenses it.","why":["","This depends on adherence to a surface.","This is evaporation, which relies on volatility.","This depends on state or particle size."]},{"id":"M5","type":"mcq","topic":"Classifying matter","stem":"Which of the following is NOT matter?","options":["Helium gas inside a party balloon","A beam of light from a flashlight","Steam rising from a boiling kettle","Dust floating in the flashlight beam"],"ans":1,"exp":"Light has no mass and does not take up space like matter does.","why":["Helium has mass and volume.","","Steam is water in the gas state.","Dust has mass and takes up space."]},{"id":"M7","type":"mcq","topic":"Evidence of change","stem":"A white solid disappears when stirred into water. Which finding best shows it dissolved instead of reacting?","options":["Gas bubbles leave the liquid as it is being stirred.","The liquid turns a color that neither substance had before.","Evaporating the water leaves the original solid behind.","The beaker becomes warm and a new solid forms in it."],"ans":2,"exp":"Recovering the original solid shows it did not become a new substance, so the change was physical.","why":["Bubbles point toward a chemical change.","A new color points toward a chemical change.","","Heat and a new solid point toward a chemical change."]},{"id":"M8","type":"mcq","topic":"Particles and conservation","stem":"Which drawing best represents a sample of an element?","options":["One single atom shown all by itself in the drawing","Separate atoms of two different kinds mixed together","Two different atoms bonded together into pairs","Many identical atoms, none of a different kind"],"ans":3,"exp":"Many identical particles with one type of atom show a pure substance made of one element.","why":["A lone atom could come from a mixture; more of the sample is needed.","Two kinds of atom would be a mixture.","Bonded different atoms would be a compound.",""]},{"id":"M9","type":"mcq","topic":"Particles and conservation","stem":"Which result of electrolysis best shows that water is a compound?","options":["Two different gases form from one pure substance.","The volume of liquid water slowly increases over time.","The water gets hot as the current passes through it.","Bubbles appear near each electrode as current flows."],"ans":0,"exp":"A compound can be broken into simpler substances, here hydrogen and oxygen.","why":["","The liquid does not increase; gas forms as the water is used up.","Heat does not show composition.","Bubbles alone do not show that the substance is a compound."]},{"id":"M11","type":"mcq","topic":"Classifying matter","stem":"Which formula represents a mixture of an element and a compound?","options":["H₂ & O₂","O₂ & H₂O","CO₂","NaCl & KBr"],"ans":1,"exp":"O₂ is an element and H₂O is a compound, joined by an &.","why":["Both are elements.","","There is no & here, so this is one compound.","Both are compounds."]},{"id":"M12","type":"mcq","topic":"Evidence of change","stem":"A student watches a tea light burn for 20 minutes. Which observation best shows a chemical change?","options":["The wax near the wick turned to liquid and then pooled around it.","The wax became a little softer as the candle burned down.","A flame formed and wax was used up, giving off heat and light.","The candle was warm to the touch after twenty minutes."],"ans":2,"exp":"Burning wax reacts with oxygen to form new substances and releases heat and light.","why":["Melting is physical.","Softening is a physical change.","","Warmth alone is weak evidence of a new substance."]},{"id":"M13","type":"mcq","topic":"Particles and conservation","stem":"Steel wool is heated until it glows inside a sealed flask that contains air. What happens to the total mass of the sealed flask?","options":["It increases because oxygen combined with the iron.","It decreases because the iron burned away.","It increases because heat added mass.","It stays the same because nothing entered or left."],"ans":3,"exp":"In a sealed flask the oxygen that joins the iron is already inside, so the total mass is unchanged.","why":["The oxygen came from inside the flask, so the total mass stays the same.","Nothing left the sealed flask.","Heat is not matter.",""]},{"id":"M14","type":"mcq","topic":"Colloids","stem":"Which pair of structures is correctly matched with a colloid name that is used for both?","options":["Solid in a gas and liquid in a gas: aerosol","Solid in a liquid and liquid in a solid: sol","Gas in a liquid and liquid in a liquid: foam","Solid in a gas and gas in a solid: aerosol"],"ans":0,"exp":"Aerosol is used for both solid in a gas (smoke) and liquid in a gas (fog).","why":["","A sol is only a solid in a liquid. A liquid in a solid is a gel.","These are two different colloids: foam and emulsion.","Gas in a solid is a solid sol, not an aerosol."]},{"id":"M15","type":"mcq","topic":"Colloids","stem":"A mixture does not settle on standing, cannot be removed by a simple filter, and makes a flashlight beam visible. What is it?","options":["A solution","A colloid","A suspension","A pure compound"],"ans":1,"exp":"Staying mixed, passing through filters and scattering light are all properties of a colloid.","why":["A solution would not scatter the beam.","","A suspension settles on standing.","A compound is not a mixture."]}]}]},"cheat":[{"title":"Classify matter in order","kind":"list","items":["Is there an & or the words dissolved, solution, air, alloy or mixture? It is a mixture. Mixtures can be separated by physical means and can vary in amount.","No &: count capital letters. One capital letter (O₂, P₄, O₃, Co) is an element, even with a subscript.","Two or more different capital letters (H₂O, CO, NaCl) is a compound. CO is a compound; Co is the element cobalt.","Element and compound together are pure substances. A mixture is not a pure substance."]},{"title":"States of matter","kind":"table","rows":[["","Shape","Volume","Particles"],["Solid","Fixed","Fixed","Close together, vibrate in place"],["Liquid","Takes container shape","Fixed","Close together, slide past each other"],["Gas","Takes container shape","Fills container","Far apart, move freely"]]},{"title":"Temperature and state changes","kind":"list","items":["0 K = -273.15 °C is absolute zero: the minimum possible particle motion, so nothing is colder.","At 0 °C ice and liquid water coexist and a little vapor is in the air: all three states.","Speed up (melting, boiling, evaporation, sublimation) = more energy, less order. Slow down (freezing, condensation, deposition) = less energy, more order."]},{"title":"Colloid types","kind":"table","rows":[["Structure","Colloid","Example"],["Solid in gas / liquid in gas","Aerosol (both)","Smoke / fog"],["Gas in liquid","Foam","Whipped cream"],["Liquid in liquid","Emulsion","Milk"],["Solid in liquid","Sol","Paint, cell fluid"],["Liquid in solid","Gel","Jelly, cheese"],["Solid in solid / gas in solid","Solid sol (both)","Colored glass / pumice"]]},{"title":"Reaction types","kind":"list","items":["Combustion: burns in oxygen to make carbon dioxide and water. Synthesis: two or more substances combine into something new.","Decomposition: one substance breaks down into two or more. Single displacement: an element is pushed out of a compound.","Double displacement: the positive parts of two compounds switch places."]},{"title":"Changes of state (all physical)","kind":"list","items":["Melting: solid to liquid. Freezing: liquid to solid.","Boiling or evaporating: liquid to gas. Condensing: gas to liquid.","Sublimation: solid straight to gas (dry ice). The substance is the same before and after."]},{"title":"Physical or chemical?","kind":"table","rows":[["","Physical","Chemical"],["Change","Same substance after: melting, boiling, dissolving, crushing, cutting","New substance after: burning, rusting, baking, souring, electrolysis"],["Property","Measured without changing it: color, density, melting and boiling point","Ability to form new substances: flammability, rusting, decomposing"],["Test","Is the substance still the same afterward?","Did something new form?"]]},{"title":"Evidence of a chemical change","kind":"list","items":["Precipitate: a solid forms when two liquids or pure substances react","Gas given off: bubbles from a reaction (not from boiling, and not dissolved gas coming out of soda)","Color change that makes a new substance (not just more dye)","Temperature change (heat given off or absorbed)","Light given off","Odor is a physical property, so a smell by itself is not a sign"]},{"title":"Separating mixtures (all physical)","kind":"table","rows":[["Method","Separates","Uses"],["Filtration","Insoluble solid from a liquid","Particle size"],["Evaporation","Dissolved solid from a liquid (keeps the solid)","Liquid leaves as a gas"],["Distillation","Liquid from a dissolved solid, or liquids from each other (keeps the liquid)","Different boiling points"],["Chromatography","Dyes or other components in a sample","A mobile phase moves each part a different distance across a fixed phase"],["Magnetism","Magnetic particles from non-magnetic ones","Magnetic attraction"],["Compounds","Need a chemical change such as electrolysis","Not physical means"]]},{"title":"Traps","kind":"list","items":["Atom is not the same as element, and molecule is not the same as compound. O₂ is a molecule and an element.","Boiling bubbles are water vapor: physical. Dissolving is physical.","Burning, rusting, cooking and souring are chemical.","In a mixture each substance keeps its own properties. A compound has properties unlike its elements.","Intensive properties (density, color, melting point) do not depend on amount; extensive ones (mass, volume) do.","Electrolysis of water splits a compound into hydrogen and oxygen. Boiling water does not."]}],"topicDeck":{"Colloids":5,"States of matter":1,"Properties":2,"Physical vs chemical change":2,"Evidence of change":2,"Classifying matter":3,"Particles and conservation":3,"Separating mixtures":4}},"ch04":{"images":{},"decks":[{"id":1,"name":"The Periodic Table","optional":false,"sections":[{"name":"Metals, nonmetals and metalloids","cards":[{"term":"Metals","def":"Good conductors of heat and electricity that can be bent into shape and drawn into wires. Most elements are this type; they sit left of the staircase and in the two bottom rows.","hook":"Left of the staircase = metal.","asks":[{"q":"An unknown element is shiny, bends without breaking and conducts electricity. What is it most likely?","right":"A metal","wrong":[["A nonmetal","Nonmetals are brittle and poor conductors."],["A metalloid","Metalloids have only some metallic properties; this one shows all of them."],["A noble gas","Noble gases are gases, not shiny solids that bend."]],"exp":"Shiny, bendable and conductive are metal properties."},{"q":"Element Q sits to the left of the staircase in period 4. Which set of properties should it have?","right":"Shiny, bendable, conducts electricity","wrong":[["Brittle, dull and a poor conductor of both heat and electricity","Those are nonmetal properties, found right of the staircase."],["Some metal and some nonmetal traits","That's a metalloid, on the staircase."],["A gas that forms no ions","That's a noble gas, in column 18."]],"exp":"Left of the staircase means metal: good conductors that bend and draw into wires."}]},{"term":"Malleable","def":"Can be bent and shaped (hammered into sheets). A property of metals.","hook":"Malleable = mallet.","asks":[{"q":"A gold bar is hammered into a sheet thinner than paper. Which property does this show?","right":"Malleability","wrong":[["Ductility","Ductility is being drawn into wire, not hammered into sheets."],["Brittleness","Brittle materials shatter when hammered."],["Conductivity","Conductivity is about carrying heat or electricity."]],"exp":"Being hammered or bent into shape is malleability."},{"q":"A worker hammers a sample and it flattens into a sheet; a second sample shatters. What can you conclude?","right":"The first is likely a metal; the second a nonmetal","wrong":[["Both are metals, since every element will change shape if it is hit hard","Nonmetals are brittle and shatter."],["The first is a nonmetal","Nonmetals are brittle."],["Both are noble gases","Noble gases aren't hammered solids."]],"exp":"Malleability (hammered into sheets) is a metal property; nonmetals are brittle."}]},{"term":"Ductile","def":"Can be drawn out into wires. A property of metals.","hook":"Ductile = duct wire.","asks":[{"q":"Copper is pulled through a die to make electrical wire. Which property makes that possible?","right":"Ductility","wrong":[["Malleability","Malleability is being hammered into sheets, not drawn into wire."],["Brittleness","A brittle material would snap instead of stretching."],["Low density","Density has nothing to do with being drawn into wire."]],"exp":"Being drawn out into wire is ductility."},{"q":"Why are electrical wires made from metals and not from sulfur?","right":"Metals can be drawn into wires and conduct","wrong":[["Sulfur is too heavy to hang from poles, even though it conducts well","Sulfur is a brittle nonmetal and a poor conductor."],["Sulfur is a gas","Sulfur is a solid."],["Metals are brittle","Metals are ductile, not brittle."]],"exp":"Metals are ductile and good conductors; nonmetals like sulfur are brittle and poor conductors."}]},{"term":"Nonmetals","def":"Poor conductors of heat and electricity that are brittle. They sit right of the staircase, plus hydrogen, even though hydrogen sits on the left.","hook":"Right of the staircase = nonmetal (plus H).","asks":[{"q":"Sulfur is yellow, shatters when struck and does not conduct electricity. Where is it on the table?","right":"Right of the staircase","wrong":[["Left of the staircase","That is where the metals are; metals do not shatter."],["On the staircase","Metalloids have some metallic properties; sulfur has none."],["In the bottom two rows","Those are the inner transition metals."]],"exp":"Brittle and nonconducting means nonmetal, right of the staircase."},{"q":"Hydrogen sits on the left side of the table. Why is it still grouped with the nonmetals?","right":"It has nonmetal properties","wrong":[["It is a metal, because every element on the left side of the table is a metal","Hydrogen is the exception."],["It is a metalloid","Metalloids are on the staircase."],["It is a noble gas","Noble gases are in column 18."]],"exp":"Nonmetals sit right of the staircase, plus hydrogen, even though it's on the left."}]},{"term":"Metalloids","def":"Also called semimetals: elements with some metallic and some nonmetallic properties. They sit on the staircase (B, Si, Ge, As, Sb, Te on your slide). Aluminum touches the staircase but is a metal.","hook":"On the stairs = both.","asks":[{"q":"Which element has some metallic and some nonmetallic properties?","right":"Silicon (Si)","wrong":[["Sodium (Na)","Sodium is an alkali metal."],["Sulfur (S)","Sulfur is a nonmetal."],["Aluminum (Al)","Aluminum touches the staircase but is a metal."]],"exp":"Silicon sits on the staircase: a metalloid."},{"q":"Aluminum touches the staircase. A student calls it a metalloid. What's the correction?","right":"Aluminum is a metal","wrong":[["The student is right, since anything touching the staircase is a metalloid","Your slide makes aluminum the exception."],["Aluminum is a nonmetal","It's a metal."],["Aluminum is a noble gas","It's a metal."]],"exp":"Aluminum touches the staircase but is a metal; the metalloids on your slide are B, Si, Ge, As, Sb and Te."}]}],"intro":["The staircase line on the right side of the table splits the elements. Left of it are metals: shiny, good conductors, easy to hammer into sheets or draw into wires. Right of it are nonmetals: brittle and poor conductors (hydrogen counts as one even though it sits on the left). The elements right on the staircase are metalloids, with some of each. Aluminum touches the staircase but is a metal."]},{"name":"Group names","cards":[{"term":"Group","def":"A vertical column of the periodic table. Elements in one column share the same number of valence electrons, so they have similar properties and bonding tendencies.","hook":"Group = column = same valence electrons.","asks":[{"q":"Why do lithium, sodium and potassium react in similar ways?","right":"Same valence electrons","wrong":[["Same number of shells","They are in different periods, so they have different numbers of shells."],["Same number of protons","Each element has a different number of protons."],["Same atomic mass","Their atomic masses are very different."]],"exp":"Elements in the same group have the same number of valence electrons."},{"q":"Why do fluorine and chlorine react in similar ways?","right":"Same column, same valence electrons","wrong":[["They are in the same row, so they have the same number of electron shells","Same row means same shells, not similar behavior."],["They have the same mass","They don't."],["They have the same number of protons","Then they'd be the same element."]],"exp":"Elements in one group share the same number of valence electrons, so they behave alike."}]},{"term":"Alkali metals","def":"Group 1 (not hydrogen). They form +1 ions.","hook":"Group 1, charge +1.","asks":[{"q":"Which element is an alkali metal?","right":"Potassium (K)","wrong":[["Hydrogen (H)","Hydrogen sits in group 1 but is a nonmetal."],["Magnesium (Mg)","Magnesium is in group 2, the alkaline earth metals."],["Krypton (Kr)","Krypton is a noble gas."]],"exp":"Potassium is in group 1, below hydrogen."},{"q":"Hydrogen is at the top of column 1. Is it an alkali metal?","right":"No; group 1 doesn't include hydrogen","wrong":[["Yes, because every element in the first column is counted as an alkali metal","Hydrogen is excluded."],["Yes; it forms +2 ions","That's not true of hydrogen or group 1."],["Only when it's a liquid","State doesn't decide this."]],"exp":"Alkali metals are group 1, not counting hydrogen."}]},{"term":"Alkaline earth metals","def":"The elements in column 2, such as Mg, Ca and Sr. They form +2 ions.","hook":"Group 2, two words, +2.","asks":[{"q":"Strontium is in group 2. What charge does its ion have?","right":"2+","wrong":[["1+","1+ is group 1 (alkali metals)."],["2-","2- ions come from group 16 nonmetals."],["No charge","Only noble gases tend not to form ions."]],"exp":"Group 2 metals lose 2 electrons."},{"q":"Element M forms an M²⁺ ion and sits on the left of the table. Which family is it most likely in?","right":"Alkaline earth metals","wrong":[["Alkali metals, because they are the metals found on the far left of the table","Alkali metals form +1 ions."],["Halogens","Halogens form -1 ions."],["Oxygen family","That's -2, on the right."]],"exp":"Column 2, the alkaline earth metals, form +2 ions."}]},{"term":"Transition metals","def":"Groups 3 to 12. Many have variable charges.","hook":"The wide middle block.","asks":[{"q":"Why might a question about iron's ion need to tell you its charge?","right":"Its charge can vary","wrong":[["It never forms ions","Iron does form ions: Fe²⁺ and Fe³⁺."],["It is a nonmetal","Iron is a metal in the transition block."],["Its charge is always 1+","Iron's charge varies; 1+ is the alkali metal charge."]],"exp":"Transition metals in groups 3 to 12 often have variable charges."},{"q":"Copper can form Cu⁺ or Cu²⁺. Where is copper on the table?","right":"Groups 3 to 12","wrong":[["Group 1, since it can form a +1 ion just like sodium and potassium","Variable charges point to the transition metals."],["Group 17","That's -1."],["Column 18","Noble gases don't form ions."]],"exp":"Transition metals (groups 3 to 12) often have variable charges."}]},{"term":"Halogens","def":"Group 17. They form -1 ions.","hook":"Halogens grab 1 electron.","asks":[{"q":"Bromine is a halogen. What ion does it form?","right":"Br⁻","wrong":[["Br⁺","Halogens gain an electron; they do not lose one."],["Br²⁻","2- ions come from group 16, not group 17."],["No ion","Only noble gases tend not to form ions."]],"exp":"Group 17 gains one electron to complete its octet."},{"q":"Element X is in the same family as chlorine. What formula would its compound with sodium have?","right":"NaX","wrong":[["Na₂X, because the halogen needs to take two electrons to fill its octet","Halogens form -1 ions, so one Na⁺ balances one."],["NaX₂","That would need Na²⁺."],["Na₃X","That would need a -3 ion."]],"exp":"Halogens form -1 ions; Na⁺ and X⁻ combine 1:1."}]},{"term":"Noble gases","def":"Column 18, also called the inert elements. Their valence shell is already full, so they tend not to form ions.","hook":"Noble = already complete.","asks":[{"q":"Why does argon not form ions?","right":"Its outer shell is full","wrong":[["It has no electrons at all","Argon has 18 electrons."],["It is a metal","Argon is a nonmetal gas."],["It has no nucleus","Every atom has a nucleus."]],"exp":"Group 18 already has a complete valence shell."},{"q":"Which element would be least likely to appear in an ionic compound?","right":"Neon","wrong":[["Sodium, because it has only a single electron in its outer energy level","Sodium readily forms Na⁺."],["Chlorine","Chlorine readily forms Cl⁻."],["Calcium","Calcium readily forms Ca²⁺."]],"exp":"Noble gases already have a full valence shell, so they tend not to form ions."}]}],"intro":["Each column is a group, and elements in one column have the same number of valence electrons, so they act alike. The big families have names: alkali metals (group 1), alkaline earth metals (group 2), transition metals (3 to 12), halogens (17) and noble gases (18). Most names come with an ion charge you'll use in Deck 5."]},{"name":"Families and rows","cards":[{"term":"Boron family","def":"Column 13, named for the element at its top (B). These elements form +3 ions.","hook":"13 = boron.","asks":[{"q":"Gallium is in group 13. Which family is that?","right":"Boron family","wrong":[["Carbon family","The carbon family is group 14."],["Nitrogen family","The nitrogen family is group 15."],["Aluminum family","Families are named for the top element; boron is at the top of group 13."]],"exp":"Group 13 is the boron family."},{"q":"Aluminum is in the boron family. What compound does it form with chlorine?","right":"AlCl₃","wrong":[["AlCl, because aluminum and chlorine each form an ion with a charge of one","Boron family elements form +3 ions."],["Al₃Cl","That would need a -3 chloride."],["AlCl₂","That would need Al²⁺."]],"exp":"The boron family forms +3 ions, so Al³⁺ needs three Cl⁻."}]},{"term":"Carbon family","def":"Column 14, named for the element at its top (C). It has no single ion charge to memorize (4+ or 4-).","hook":"14 = carbon.","asks":[{"q":"Silicon is in group 14. Which family is that?","right":"Carbon family","wrong":[["Boron family","The boron family is group 13."],["Oxygen family","The oxygen family is group 16."],["Silicon family","Families are named for the top element; carbon is at the top of group 14."]],"exp":"Group 14 is the carbon family."},{"q":"A quiz asks for the ion charge of carbon-family elements. What does your card say?","right":"No single charge to memorize","wrong":[["+3, the same as the boron family that sits right next to it on the table","That's column 13."],["-3","That's the nitrogen family."],["-2","That's the oxygen family."]],"exp":"Column 14 has no single ion charge to memorize (4+ or 4-)."}]},{"term":"Nitrogen family","def":"Column 15, named for the element at its top (N). These elements form -3 ions.","hook":"15 = nitrogen.","asks":[{"q":"Phosphorus is in group 15. Which family is that?","right":"Nitrogen family","wrong":[["Carbon family","The carbon family is group 14."],["Oxygen family","The oxygen family is group 16."],["Phosphorus family","Families are named for the top element; nitrogen is at the top of group 15."]],"exp":"Group 15 is the nitrogen family."},{"q":"Phosphorus and magnesium form an ionic compound. What is its formula?","right":"Mg₃P₂","wrong":[["MgP, since both elements are close to each other in the third row of the table","Mg²⁺ and P³⁻ need a 3:2 ratio."],["Mg₂P₃","The subscripts are swapped."],["MgP₂","Charges don't balance."]],"exp":"Nitrogen family forms -3 ions; Mg²⁺ and P³⁻ cross over to Mg₃P₂."}]},{"term":"Oxygen family","def":"Column 16, named for the element at its top (O). These elements form -2 ions.","hook":"16 = oxygen.","asks":[{"q":"Sulfur is in group 16. Which family is that?","right":"Oxygen family","wrong":[["Nitrogen family","The nitrogen family is group 15."],["Halogen family","The halogens are group 17."],["Sulfur family","Families are named for the top element; oxygen is at the top of group 16."]],"exp":"Group 16 is the oxygen family."},{"q":"Sodium and sulfur form a compound. What is its formula?","right":"Na₂S","wrong":[["NaS, because sodium and sulfur each give or take only one electron here","Sulfur forms -2 ions."],["NaS₂","That would need Na²⁺."],["Na₃S","That would need S³⁻."]],"exp":"The oxygen family forms -2 ions, so two Na⁺ balance one S²⁻."}]},{"term":"Inner transition metals","def":"The two rows set below the table: the lanthanide series (atomic numbers 58 to 71) and the actinide series (90 to 103).","hook":"The two rows at the bottom.","asks":[{"q":"Where are the inner transition metals on the periodic table?","right":"The two bottom rows","wrong":[["The far right column","That column is group 18, the noble gases."],["The staircase","The staircase holds the metalloids."],["Groups 3 to 12","That is the main transition metal block."]],"exp":"They are the lanthanide and actinide rows set below the table."},{"q":"Why are two rows set apart below the main periodic table?","right":"They're the inner transition metals","wrong":[["They are the noble gases, which are kept apart because they rarely react","Noble gases are column 18."],["They are the metalloids","Metalloids are on the staircase."],["They are the halogens","Halogens are group 17."]],"exp":"The lanthanide and actinide series are the inner transition metals, set below the table."}]},{"term":"Lanthanide series","def":"Inner transition row of atomic numbers 58 to 71, named because it follows lanthanum (La, 57).","hook":"Follows La.","asks":[{"q":"Which atomic numbers make up the lanthanide series?","right":"58 to 71","wrong":[["90 to 103","That is the actinide series."],["3 to 12","Those are group numbers for the transition metals."],["1 to 18","Those are group numbers, not atomic numbers."]],"exp":"The lanthanides follow lanthanum (57)."},{"q":"Element 63 is in which series?","right":"Lanthanide series","wrong":[["Actinide series, because all of the elements below the main table are actinides","Actinides are 90 to 103."],["Alkali metals","Those are group 1."],["Halogens","Those are group 17."]],"exp":"The lanthanide series runs from atomic number 58 to 71."}]},{"term":"Actinide series","def":"The inner transition row of atomic numbers 90 to 103, named for element 89 (Ac), which comes just before it.","hook":"Follows Ac.","asks":[{"q":"The actinide series is named after which element?","right":"Actinium (Ac)","wrong":[["Lanthanum (La)","Lanthanum names the lanthanide series."],["Uranium (U)","Uranium is in the series but does not name it."],["Actinide (Ad)","There is no element called actinide."]],"exp":"It follows actinium, atomic number 89."},{"q":"Element 92 is in which row below the table?","right":"The actinide series","wrong":[["The lanthanide series, which holds the inner transition metals from 58 to 71","92 is outside 58 to 71."],["Period 1","That holds only H and He."],["Group 18","Those are noble gases."]],"exp":"The actinide series runs from 90 to 103."}]},{"term":"Period","def":"A horizontal row of the table of elements; there are 7. Elements in one row have the same number of electron shells (principal energy levels).","hook":"Period = row = shells.","asks":[{"q":"Sodium is in period 3. How many electron shells (energy levels) does it have?","right":"3","wrong":[["1","1 is its number of valence electrons (group 1)."],["11","11 is its atomic number."],["8","8 is a full octet, not a shell count."]],"exp":"The period number gives the number of energy levels."},{"q":"Potassium and bromine are in the same period. What do they share?","right":"The same number of electron shells","wrong":[["The same number of valence electrons, so they react in very similar ways","That's shared by a group, not a period."],["The same ion charge","K⁺ and Br⁻ differ."],["The same number of protons","Then they'd be the same element."]],"exp":"Elements in one row have the same number of electron shells."}]},{"term":"States at room temperature","def":"At 25 °C there are 11 gases and 2 liquids on the periodic table; every other element is a solid.","hook":"11 gases, 2 liquids, the rest solid.","asks":[{"q":"At 25 °C, how many elements on the periodic table are liquids?","right":"2","wrong":[["11","11 is the number of gases."],["0","Two elements are liquids at room temperature."],["7","7 is the number of periods."]],"exp":"11 gases, 2 liquids, everything else solid."},{"q":"At 25 °C, how many elements on the periodic table are gases?","right":"11","wrong":[["2, the same as the number of elements that are liquids at room temperature","2 is the liquid count."],["7","Your card says 11."],["18","Your card says 11."]],"exp":"At 25 °C there are 11 gases and 2 liquids; everything else is solid."}]}],"intro":["Columns 13 to 16 are named after the element at the top: the boron, carbon, nitrogen and oxygen families. The two rows below the table are the inner transition metals (lanthanides and actinides). A row across is a period, and the period number tells how many electron shells an atom has."]}],"intro":["The periodic table is a map: where an element sits tells you what kind of element it is and how it will behave. This deck covers the three kinds of elements, the names of the columns and rows, and what each location tells you."]},{"id":2,"name":"History of the Atom","optional":false,"sections":[{"name":"Early ideas","cards":[{"term":"Leucippus","def":"Early Greek thinker who, with a partner, proposed that matter is made of tiny particles, the idea behind the word atom.","hook":"First \"tiny particles\" idea.","asks":[{"q":"What was Leucippus's big idea?","right":"Matter is tiny particles","wrong":[["Atoms have a nucleus","That was Rutherford, about 2,300 years later."],["Mass is always conserved","That was Lavoisier."],["Electrons orbit the nucleus","That was Bohr."]],"exp":"Leucippus and a partner proposed that matter is made of tiny particles."},{"q":"Which later word comes from the idea Leucippus and his partner proposed?","right":"Atom","wrong":[["Nucleus, since they said matter has a tiny dense center that holds its mass","The nucleus came from Rutherford."],["Electron","That came from Thomson."],["Neutron","That came from Chadwick."]],"exp":"Leucippus proposed that matter is made of tiny particles, the idea behind the word atom."}]},{"term":"Antoine Lavoisier","def":"Came up with the idea that matter cannot be created or destroyed but may change in form (conservation of mass).","hook":"Lavoisier: nothing lost.","asks":[{"q":"Wood burns and the ash weighs less, but nothing is truly lost. Whose idea explains this?","right":"Antoine Lavoisier","wrong":[["J. J. Thomson","Thomson discovered electrons."],["Ernest Rutherford","Rutherford discovered the nucleus."],["James Chadwick","Chadwick discovered the neutron."]],"exp":"Lavoisier: matter is not created or destroyed, only changed in form."},{"q":"A sealed jar with steel wool is weighed before and after the steel wool burns. The mass doesn't change. Which idea does this support?","right":"Matter isn't created or destroyed","wrong":[["Matter is made of electrons scattered through a sphere of positive charge","That's the plum pudding model."],["Atoms are mostly empty space","That's Rutherford."],["Electrons travel in fixed orbits","That's Bohr."]],"exp":"Lavoisier: matter can't be created or destroyed, only change form (conservation of mass)."}]},{"term":"Dalton's atomic theory (1810)","def":"Elements are made of tiny particles called atoms; atoms of a given element are identical; atoms of different elements differ; atoms combine to form compounds with the same relative numbers and types of atoms; atoms are not created or destroyed in chemical reactions, only regrouped.","hook":"Dalton = solid-ball atoms that regroup.","asks":[{"q":"In a reaction, the atoms are rearranged into new substances. Which theory says this?","right":"Dalton's atomic theory","wrong":[["Bohr's model","Bohr's model is about where electrons are."],["The plum pudding model","Thomson's model describes the inside of an atom, not reactions."],["Heisenberg's principle","Heisenberg's work is about predicting electron positions."]],"exp":"Dalton said atoms are not created or destroyed, only regrouped."},{"q":"Which statement is part of Dalton's theory?","right":"Atoms of one element are identical","wrong":[["Atoms of one element can have different numbers of neutrons in the nucleus","That's isotopes, found later; Dalton said identical."],["Atoms are mostly empty space","That's Rutherford."],["Atoms contain electrons","That's Thomson."]],"exp":"Dalton said atoms of a given element are identical (later revised by the discovery of isotopes)."}]},{"term":"Law of constant composition","def":"A given compound always has the same relative numbers and types of atoms, bonded in the same ratio.","hook":"Same compound, same ratio.","asks":[{"q":"Water from a lake and water from a lab both have 2 H for every O. Which law is this?","right":"Constant composition","wrong":[["Conservation of mass","That law is about mass not being created or destroyed."],["Dalton's indivisibility","That is about atoms not splitting in reactions."],["The octet rule","That is about atoms completing their valence shells."]],"exp":"A compound always has the same atoms in the same ratio."},{"q":"A sample of carbon dioxide has 1 C for every 2 O. Another sample from a car's exhaust is tested. What will it show?","right":"1 C for every 2 O","wrong":[["A different ratio, because the exhaust comes from a different source than the lab","A compound always has the same ratio."],["Only carbon","It's still CO₂."],["Only oxygen","It's still CO₂."]],"exp":"A given compound always has the same relative numbers and types of atoms."}]}],"intro":["Leucippus first proposed that matter is made of tiny particles. Lavoisier showed matter isn't created or destroyed. Dalton turned these into a theory: elements are made of atoms, atoms of one element are identical, and reactions only regroup atoms. The law of constant composition says a compound always has the same ratio of atoms."]},{"name":"Finding the particles","cards":[{"term":"J. J. Thomson (1897)","def":"Showed atoms can emit tiny negative particles (electrons), using cathode ray tubes. Reasoned the atom must also hold positive charge to balance them, so atoms have zero overall charge.","hook":"Thomson found the electron.","asks":[{"q":"Which discovery belongs to J. J. Thomson?","right":"The electron","wrong":[["The nucleus","Rutherford discovered the nucleus."],["The neutron","Chadwick discovered the neutron."],["Electron orbits","Bohr proposed electron orbits."]],"exp":"Thomson used cathode ray tubes to find tiny negative particles."},{"q":"Thomson found negative particles in atoms. Why did he decide atoms must also hold positive charge?","right":"Atoms have zero overall charge","wrong":[["He saw positive particles bounce off a gold foil target during an experiment","That was Rutherford, later."],["He found the neutron","That was Chadwick."],["Electrons are heavy","Electrons are nearly massless."]],"exp":"To balance the electrons, so atoms are neutral overall."}]},{"term":"Plum pudding model","def":"Thomson's picture of the atom: a uniform sphere of positive charge with negative electrons scattered inside it.","hook":"Electrons are the plums.","asks":[{"q":"In the plum pudding model, what are the 'plums'?","right":"Electrons","wrong":[["Protons","The positive charge is the pudding, spread throughout."],["Neutrons","Neutrons had not been discovered yet."],["The nucleus","The plum pudding model has no nucleus."]],"exp":"Negative electrons were scattered in a ball of positive charge."},{"q":"Which experiment showed the plum pudding model was wrong?","right":"Rutherford's gold foil experiment","wrong":[["Thomson's cathode ray tube experiment, which first found the electrons inside atoms","That led to the plum pudding model."],["Chadwick's beryllium experiment","That found the neutron."],["Dalton's theory","That came before electrons were known."]],"exp":"Rutherford's results disproved the plum pudding model."}]},{"term":"Ernest Rutherford (1911)","def":"Fired positive alpha particles at thin metal foil. Most went straight through (the atom is mostly empty space); some bounced back (a small, dense, positive center). This disproved the plum pudding model.","hook":"Gold foil found the nucleus.","asks":[{"q":"Most alpha particles passed straight through the foil. What did Rutherford conclude?","right":"Atoms are mostly empty","wrong":[["Atoms are solid spheres","Solid atoms would stop or bounce most particles."],["Electrons are positive","Electrons are negative."],["Neutrons exist","Neutrons were found later by Chadwick."]],"exp":"Particles passing straight through means mostly empty space."},{"q":"A few alpha particles bounced straight back from the foil. What did that show?","right":"A small, dense, positive center","wrong":[["The atom is mostly empty space, so particles can pass through it freely","That came from the particles that went straight through."],["Electrons travel in orbits","That's Bohr."],["Neutrons exist","That's Chadwick."]],"exp":"Particles bouncing back showed a small, dense, positive nucleus."}]},{"term":"Nucleus","def":"The tiny, densely packed, positively charged center of the atom. It holds the protons and neutrons, so nearly all of the atom's mass.","hook":"Tiny, dense, positive.","asks":[{"q":"Where is almost all of an atom's mass?","right":"In the nucleus","wrong":[["In the electrons","Electrons are nearly massless."],["Evenly spread out","Rutherford showed the mass is packed in a tiny center."],["In the empty space","Empty space has no mass."]],"exp":"Protons and neutrons, which have mass, are in the nucleus."},{"q":"An atom's nucleus takes up a tiny space. Why is the atom's mass still mostly there?","right":"The protons and neutrons are there","wrong":[["The electrons are in the nucleus, and they are the heaviest particles of all","Electrons are outside and nearly massless."],["The nucleus is empty","It's densely packed."],["Only protons have mass","Neutrons have about the same mass."]],"exp":"The nucleus holds the protons and neutrons, so nearly all the mass."}]},{"term":"James Chadwick (1932)","def":"Bombarded beryllium with alpha particles and found neutral particles with about the same mass as a proton: the neutron. This completed the picture of the nucleus.","hook":"Chadwick found the neutron.","asks":[{"q":"Chadwick's neutral radiation from beryllium turned out to be what?","right":"Neutrons","wrong":[["Electrons","Electrons are negative, not neutral."],["Protons","Protons are positive."],["Alpha particles","Alpha particles were what he fired, not what he found."]],"exp":"Neutral particles with about a proton's mass: neutrons."},{"q":"Before Chadwick, what was missing from the picture of the nucleus?","right":"The neutron","wrong":[["The electron, which no one had yet found in any experiment on atoms","Thomson found it in 1897."],["The proton","Rutherford had shown a positive center."],["The orbit","Orbits are Bohr's idea, about electrons."]],"exp":"Chadwick's neutron completed the picture of the nucleus."}]}],"intro":["Thomson found the electron and pictured the atom as a positive sphere with electrons scattered in it (plum pudding). Rutherford's gold foil test proved that wrong: most of the atom is empty space, with a tiny dense positive nucleus. Chadwick then found the neutron, the last piece of the nucleus."]},{"name":"Where the electrons are","cards":[{"term":"Niels Bohr (1913)","def":"Proposed that electrons travel around the nucleus in orbits that are fixed energy levels, like planets around the sun.","hook":"Bohr = planetary orbits.","asks":[{"q":"Which model shows electrons circling the nucleus like planets around the sun?","right":"Bohr's model","wrong":[["Thomson's model","Thomson's model has no nucleus to circle."],["Dalton's model","Dalton's atoms had no inner parts."],["The orbital model","Orbitals are likely regions, not planet-like paths."]],"exp":"Bohr placed electrons in fixed orbits."},{"q":"How did Bohr's model differ from Rutherford's?","right":"Electrons in fixed energy-level orbits","wrong":[["A uniform sphere of positive charge with the electrons scattered inside it","That's the plum pudding model."],["It had no nucleus","Bohr kept the nucleus."],["Neutrons orbit the nucleus","Neutrons are in the nucleus."]],"exp":"Bohr placed electrons in orbits that are fixed energy levels."}]},{"term":"Energy level","def":"In the Bohr model, a fixed orbit where electrons are found. The row (period) number tells how many of these an atom has.","hook":"Period = number of levels.","asks":[{"q":"Chlorine is in period 3. How many energy levels does its Bohr model need?","right":"3","wrong":[["7","7 is chlorine's number of valence electrons."],["17","17 is chlorine's atomic number."],["1","Chlorine has more than one shell; period 3 means 3."]],"exp":"The period number gives the number of energy levels."},{"q":"Potassium is in period 4. How many energy levels does its Bohr model have?","right":"4","wrong":[["1, because potassium is in group 1 and has only one valence electron","The group gives valence electrons; the period gives levels."],["19","That's its atomic number."],["8","That's an octet."]],"exp":"The period number tells how many energy levels an atom has."}]},{"term":"Problem with Bohr's model","def":"Electrons do not follow exact orbits; we cannot know exactly where an electron is.","hook":"Orbits are too exact.","asks":[{"q":"What is wrong with Bohr's model of the atom?","right":"Electrons have no exact path","wrong":[["It puts electrons in the nucleus","Bohr placed electrons outside the nucleus, in orbits."],["Electrons are positive","Bohr's electrons are negative, as they should be."],["It leaves out protons","Bohr's model includes protons in the nucleus."]],"exp":"We cannot know exactly where an electron is."},{"q":"Why was Bohr's model replaced by orbitals?","right":"We can't know an electron's exact path","wrong":[["Electrons were found to sit inside the nucleus alongside the protons","Electrons are outside the nucleus."],["Atoms have no electrons","They do."],["Bohr forgot the protons","That isn't the problem."]],"exp":"Electrons don't follow exact orbits; we can't know exactly where one is."}]},{"term":"Orbitals (modern model)","def":"Regions of space around the nucleus where an electron is likely to be found, about 90% of the time. This replaced Bohr's fixed orbits.","hook":"Orbital = likely region, not a path.","asks":[{"q":"In the modern model, where is an electron found?","right":"In a likely region","wrong":[["In a fixed circle","That is Bohr's older model."],["Inside the nucleus","Electrons are outside the nucleus."],["Spread evenly through","That is closer to Thomson's model."]],"exp":"Orbitals are regions where an electron is likely to be about 90% of the time."},{"q":"In the modern model, what does an orbital show?","right":"Where an electron is likely to be","wrong":[["The exact circular path that each electron always follows around the nucleus","That's Bohr's fixed orbit."],["Where the protons are","Protons are in the nucleus."],["The nucleus","Orbitals are around it."]],"exp":"An orbital is a region where an electron is found about 90% of the time."}]}],"intro":["Bohr put the electrons in fixed orbits (energy levels) around the nucleus, like planets. The problem: electrons don't follow exact paths. The modern model uses orbitals instead, regions where an electron is likely to be."]}],"intro":["Nobody can see an atom, so its picture was built up one experiment at a time. This deck follows that story from a Greek idea to the modern model, and what each scientist added or proved wrong."]},{"id":3,"name":"Inside the Atom","optional":false,"sections":[{"name":"Subatomic particles","cards":[{"term":"Proton","def":"Positively charged particle in the nucleus. Has mass. Its charge is equal in size to an electron's charge.","hook":"Proton = positive.","asks":[{"q":"Which particle is positive and found in the nucleus?","right":"Proton","wrong":[["Neutron","Neutrons are in the nucleus but have no charge."],["Electron","Electrons are negative and outside the nucleus."],["Ion","An ion is a whole charged atom, not a particle inside one."]],"exp":""},{"q":"Two atoms each have 9 protons but different masses. What do you know for sure?","right":"They are the same element","wrong":[["They are different elements, because atoms with different masses can't match","Proton count sets the element."],["They have the same mass number","Their masses differ."],["They have the same number of neutrons","Different masses mean different neutron counts."]],"exp":"The number of protons decides the element."}]},{"term":"Neutron","def":"Neutral particle in the nucleus with about the same mass as a proton.","hook":"Neutron = neutral.","asks":[{"q":"Which particle is in the nucleus but has no charge?","right":"Neutron","wrong":[["Proton","Protons are positive."],["Electron","Electrons are negative and outside the nucleus."],["Cation","A cation is a positive ion, not a particle."]],"exp":""},{"q":"Adding a neutron to an atom changes which of these?","right":"Its mass number","wrong":[["Its charge, because the neutron brings an extra positive charge into the nucleus","Neutrons are neutral."],["Which element it is","Protons decide that."],["Its electron count","Neutrons don't affect electrons."]],"exp":"A neutron adds mass (about a proton's) but no charge."}]},{"term":"Electron","def":"Negatively charged particle found outside the nucleus. Nearly massless.","hook":"Electron = negative, outside, light.","asks":[{"q":"Which particle is nearly massless and found outside the nucleus?","right":"Electron","wrong":[["Proton","Protons have mass and are in the nucleus."],["Neutron","Neutrons have mass and are in the nucleus."],["The nucleus","The nucleus holds almost all the mass."]],"exp":""},{"q":"An atom loses an electron. What happens to its mass?","right":"It barely changes","wrong":[["It drops by about the same amount as losing one proton from the nucleus","Electrons are nearly massless."],["It doubles","Electrons are nearly massless."],["It drops to zero","The nucleus holds the mass."]],"exp":"Electrons are nearly massless, so losing one barely changes the mass."}]},{"term":"Number of protons","def":"Sets which element an atom is (its atomic character). Change this count and you have a different element.","hook":"Protons = name tag.","asks":[{"q":"An atom gains a proton. What happens?","right":"It becomes a new element","wrong":[["It becomes an ion","Ions form from gaining or losing electrons."],["It becomes a heavier isotope","Isotopes differ in neutrons, not protons."],["Nothing changes","Changing protons changes the atomic number."]],"exp":"The number of protons sets which element it is."},{"q":"A nucleus changes from 6 protons to 7. What has the atom become?","right":"Nitrogen","wrong":[["A heavier isotope of carbon, since only the mass of the atom has changed","Changing protons changes the element."],["A carbon ion","Ions change electrons, not protons."],["Still carbon","Protons set the element."]],"exp":"Change the proton count and you have a different element: 7 protons is nitrogen."}]},{"term":"Number of electrons","def":"Determines chemical behavior, because these particles are the ones that bond when atoms combine.","hook":"Electrons = chemistry.","asks":[{"q":"Which change would affect how an atom bonds?","right":"A change in electrons","wrong":[["A change in neutrons","Neutrons make isotopes, which react almost the same."],["A change in mass number","Mass number counts nucleus particles, which do not bond."],["None of these","Electrons do the bonding."]],"exp":"Chemical behavior comes from the electrons."},{"q":"Na and Na⁺ have the same nucleus. Why do they behave so differently?","right":"They have different numbers of electrons","wrong":[["They have different numbers of protons, so they are really different elements","Both have 11 protons."],["They have different numbers of neutrons","The nucleus is the same."],["They have different masses","That barely differs."]],"exp":"Electrons determine chemical behavior."}]}],"intro":["Protons (positive) and neutrons (neutral) sit in the nucleus and hold almost all the mass. Electrons (negative, nearly massless) sit outside. Two rules matter most: the proton count decides which element it is, and the electrons decide how it bonds."]},{"name":"Counting particles","cards":[{"term":"Atomic number (Z)","def":"How many protons an atom has: the whole value shown on each periodic table square.","hook":"Z = protons.","asks":[{"q":"An atom has 26 protons. What is its atomic number?","right":"26","wrong":[["52","That doubles the protons; atomic number is just the protons."],["13","That halves the protons."],["30","30 would be its neutron count for Fe-56, not its atomic number."]],"exp":"Atomic number = number of protons. 26 is iron."},{"q":"An atom has atomic number 17. Which is true?","right":"It has 17 protons","wrong":[["It has 17 neutrons, because the atomic number counts the particles in the nucleus","Z counts protons only."],["Its mass number is 17","Mass number adds neutrons."],["It has 17 valence electrons","Valence electrons max out at 8."]],"exp":"The atomic number is the number of protons."}]},{"term":"Mass number (A)","def":"Protons plus neutrons in one atom.","hook":"A = p + n.","asks":[{"q":"An atom has 11 protons and 12 neutrons. What is its mass number?","right":"23","wrong":[["11","11 is the atomic number."],["12","12 is the number of neutrons."],["1","That subtracts instead of adding."]],"exp":"Mass number = protons + neutrons = 23."},{"q":"An atom of mass number 40 has 20 neutrons. How many protons does it have?","right":"20","wrong":[["60, because you add the neutrons to the mass number to get the protons","Mass number = protons + neutrons, so subtract."],["40","That's the mass number."],["2","Subtract, don't divide."]],"exp":"Protons = mass number − neutrons = 40 − 20 = 20."}]},{"term":"Neutron count","def":"Mass number minus atomic number. If no isotope is given, round the atomic mass to get the mass number.","hook":"n = A - Z.","asks":[{"q":"How many neutrons are in ³⁵₁₇Cl?","right":"18","wrong":[["17","17 is the number of protons."],["35","35 is the mass number."],["52","That adds instead of subtracting."]],"exp":"Neutrons = 35 - 17 = 18."},{"q":"Sodium's atomic mass is 22.99 and Z = 11. If no isotope is given, how many neutrons does sodium have?","right":"12","wrong":[["11.99, found by subtracting the atomic number from the atomic mass as written","Round the atomic mass first: 23 − 11 = 12."],["23","That's the mass number."],["11","That's the proton count."]],"exp":"Round 22.99 to 23, then 23 − 11 = 12."}]},{"term":"Electrons in a neutral atom","def":"Equal to the proton count (Z), because the positive and negative charges must balance.","hook":"Neutral: e = p.","asks":[{"q":"How many electrons are in a neutral magnesium atom (Z = 12)?","right":"12","wrong":[["10","10 is for Mg²⁺, which lost 2 electrons."],["2","2 is magnesium's valence electrons."],["24","24 is its rounded atomic mass."]],"exp":"Neutral atoms have as many electrons as protons."},{"q":"A neutral atom has 15 electrons. Which element is it? (P is Z = 15)","right":"Phosphorus","wrong":[["Sulfur, because a neutral atom always has one more electron than protons","Neutral means electrons = protons."],["Silicon","That's Z = 14."],["Chlorine","That's Z = 17."]],"exp":"In a neutral atom electrons = protons, so 15 electrons means Z = 15."}]},{"term":"Electrons in an ion","def":"Protons minus the charge. A 2+ ion has 2 fewer negative particles than protons; a 3- ion has 3 more. The nucleus does not change.","hook":"e = Z - charge.","asks":[{"q":"How many electrons are in O²⁻ (Z = 8)?","right":"10","wrong":[["6","Subtracting 2 is for a positive ion; O²⁻ gained 2."],["8","8 is for a neutral oxygen atom."],["16","16 is oxygen's mass number."]],"exp":"Electrons = 8 + 2 = 10."},{"q":"How many electrons are in Al³⁺ (Z = 13)?","right":"10","wrong":[["16, because a positive ion gains three electrons to get its charge","Positive means electrons were lost."],["13","That's a neutral atom."],["3","That's the charge."]],"exp":"Electrons = protons − charge = 13 − 3 = 10."}]}],"intro":["Atomic number = protons. Mass number = protons + neutrons, so neutrons = mass number − atomic number. A neutral atom has as many electrons as protons; an ion has protons minus its charge."]},{"name":"Bohr models and valence electrons","cards":[{"term":"Valence electrons","def":"The negative particles in the outermost energy level. For representative elements the group tells how many (group 1 has 1, group 2 has 2, group 13 has 3, and so on through 18 with 8).","hook":"Outer shell = valence.","asks":[{"q":"Nitrogen is in group 15. How many valence electrons does it have?","right":"5","wrong":[["15","Use the last digit of groups 13-18: group 15 means 5."],["7","7 is nitrogen's atomic number."],["3","3 is how many it gains to form N³⁻."]],"exp":"Group 15 elements have 5 valence electrons."},{"q":"Sulfur (group 16) and oxygen (group 16) have how many valence electrons each?","right":"6","wrong":[["16, because the group number is the number of valence electrons for every element","For groups 13 to 18, subtract 10."],["2","That's the electrons they gain."],["8","That's a full octet."]],"exp":"Group 16 elements have 6 valence electrons."}]},{"term":"Bohr model drawing","def":"Draw the nucleus, then one ring per principal energy level (the period number), placing the valence electrons (from the group) on the outer ring.","hook":"Rings from the period, outer dots from the group.","asks":[{"q":"A Bohr model of magnesium (period 3, group 2) has how many rings and outer electrons?","right":"3 rings, 2 outer","wrong":[["2 rings, 3 outer","Swapped: the period gives rings, the group gives outer electrons."],["3 rings, 12 outer","12 is the total electrons, not the outer ones."],["12 rings, 2 outer","There is one ring per energy level, not per electron."]],"exp":"Period 3 gives 3 rings; group 2 gives 2 valence electrons."},{"q":"A Bohr model has 2 rings and 7 electrons on the outer ring. Which element is it?","right":"Fluorine","wrong":[["Chlorine, because it is the halogen that has seven electrons in its outer ring","Chlorine needs 3 rings (period 3)."],["Nitrogen","Nitrogen has 5 outer electrons."],["Neon","Neon has 8 outer electrons."]],"exp":"2 rings = period 2; 7 outer electrons = group 17: fluorine."}]},{"term":"Octet","def":"A complete valence shell of 8 electrons. Only hydrogen and helium have a valence shell that holds 2.","hook":"Eight is great.","asks":[{"q":"Why does chlorine gain one electron when it forms an ion?","right":"To reach 8 outer","wrong":[["To lose a proton","Gaining electrons never changes protons."],["To reach 2 outer","Only H and He are complete with 2."],["To become neutral","Gaining an electron makes it negative, not neutral."]],"exp":"Chlorine has 7 valence electrons; one more completes the octet."},{"q":"Oxygen has 6 valence electrons. What does it tend to do to complete its octet?","right":"Gain 2 electrons","wrong":[["Lose 6 electrons, since losing them leaves an empty and stable outer shell","Gaining 2 is easier than losing 6."],["Gain 6 electrons","That would give 12."],["Lose 2 electrons","That gives 4, not 8."]],"exp":"Oxygen gains 2 electrons to reach 8, forming O²⁻."}]},{"term":"Atomic mass","def":"The decimal value on each periodic table square: the average of all of an element's isotopes, weighted by how common each one is.","hook":"Decimal = average.","asks":[{"q":"Carbon's atomic mass is 12.011. Why isn't it exactly 12?","right":"It averages its isotopes","wrong":[["Electrons add a bit","Electrons are nearly massless."],["It was measured incorrectly","The decimal is real: it is a weighted average."],["Protons weigh 1.001","The decimal comes from the isotope mix."]],"exp":"Atomic mass is a weighted average of all of an element's isotopes."},{"q":"Why does a periodic table square show 24.31 for magnesium instead of a whole number?","right":"It averages magnesium's isotopes","wrong":[["It is the number of protons plus electrons in one magnesium atom","That would be a whole number."],["It counts only neutrons","It's an average mass."],["It's a rounding error","It's a weighted average."]],"exp":"Atomic mass is the average of all isotopes, weighted by how common each is."}]}],"intro":[
