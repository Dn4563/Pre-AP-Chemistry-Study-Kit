"To draw a Bohr model, the period gives the number of rings and the group gives the electrons on the outer ring (the valence electrons). Atoms are most stable with 8 valence electrons, an octet. The decimal on each table square is the atomic mass, an average of the element's isotopes."]}],"intro":["Every atom is built from three particles. This deck is about what each one does and how to count them from the periodic table, which is the math behind most of the chapter's problems."]},{"id":4,"name":"Isotopes","optional":false,"sections":[{"name":"What isotopes are","cards":[{"term":"Isotopes","def":"Atoms of the same element with the same number of protons but different numbers of neutrons, so different mass numbers.","hook":"Same protons, different neutrons.","asks":[{"q":"Carbon-12 and carbon-14 have the same number of what?","right":"Protons","wrong":[["Neutrons","They differ in neutrons (6 and 8)."],["Mass number","Their mass numbers are 12 and 14."],["Nucleus particles","Their nucleus counts are 12 and 14."]],"exp":"Isotopes have the same protons and different neutrons."},{"q":"Which pair are isotopes of each other?","right":"Chlorine-35 and chlorine-37","wrong":[["Argon-40 and calcium-40, since they have exactly the same mass number","Different elements, different proton counts."],["Na and Na⁺","That's an atom and its ion."],["O₂ and O₃","Those are molecules, not isotopes."]],"exp":"Isotopes are the same element with different mass numbers."}]},{"term":"Chemistry of isotopes","def":"Atoms of one element with different neutron counts react almost identically, because how an atom reacts depends on its electrons, not its neutrons.","hook":"Same electrons, same chemistry.","asks":[{"q":"Why do carbon-12 and carbon-14 react the same way?","right":"Same electrons","wrong":[["Same neutrons","They have different numbers of neutrons."],["Same mass","Their masses differ."],["Both have no charge","Charge is not what makes reactions alike; electrons are."]],"exp":"Chemistry depends on electrons, which isotopes share."},{"q":"Water made with deuterium instead of hydrogen-1 still reacts like water. Why?","right":"Same electrons; only neutrons differ","wrong":[["Deuterium has an extra proton, which keeps the charges and reactions the same","Deuterium has an extra neutron, not proton."],["Deuterium has no electrons","It has 1 electron."],["Neutrons control reactions","Electrons do."]],"exp":"Reactions depend on electrons, not neutrons."}]},{"term":"Isotopes in nature","def":"Elements are usually found as a mixture of atoms with different neutron counts.","hook":"Nature mixes them.","asks":[{"q":"Why is chlorine's atomic mass 35.45 and not a whole number?","right":"It is a mix of isotopes","wrong":[["It has half a neutron","Every atom has a whole number of neutrons."],["Its electrons add extra mass","Electrons are nearly massless."],["It is only Cl-35","Then its mass would be close to 35.0."]],"exp":"Natural chlorine is a mixture of isotopes."},{"q":"A sample of copper from a mine contains atoms of different mass numbers. Is that unusual?","right":"No; elements are usually mixtures of isotopes","wrong":[["Yes, because every atom of one element must have exactly the same mass","Isotopes differ in mass."],["Yes; it must be two elements","Same element, different neutrons."],["Yes; it must be contaminated","Isotope mixtures are normal."]],"exp":"Elements are usually found as a mixture of isotopes."}]},{"term":"Hydrogen-1","def":"The most common form of H: 1 proton and no neutrons, mass number 1.","hook":"Plain hydrogen, no neutron.","asks":[{"q":"How many neutrons are in ordinary hydrogen-1?","right":"0","wrong":[["1","1 is its number of protons."],["2","2 neutrons is tritium, hydrogen-3."],["3","3 would be mass number 4, not hydrogen-1."]],"exp":"1 - 1 = 0 neutrons."},{"q":"Hydrogen-1 is the only common atom with which feature?","right":"No neutrons","wrong":[["No protons in its nucleus, so its mass comes from the electron alone","It has 1 proton."],["No electrons","Neutral H-1 has 1 electron."],["Two protons","It has 1."]],"exp":"Hydrogen-1 has 1 proton and no neutrons."}]},{"term":"Deuterium","def":"Hydrogen-2: 1 proton and 1 neutron, mass number 2.","hook":"Deu = two.","asks":[{"q":"Deuterium is hydrogen-2. How many neutrons does it have?","right":"1","wrong":[["2","2 is its mass number."],["0","0 neutrons is hydrogen-1."],["3","That adds instead of subtracting."]],"exp":"2 - 1 = 1 neutron."},{"q":"Compare deuterium and tritium.","right":"Tritium has one more neutron","wrong":[["Tritium has one more proton, which is why it has a higher mass number","Both have 1 proton."],["They are different elements","Both are hydrogen."],["Deuterium is heavier","Tritium is heavier."]],"exp":"Deuterium: 1 p, 1 n (mass 2). Tritium: 1 p, 2 n (mass 3)."}]},{"term":"Tritium","def":"Hydrogen-3: 1 proton and 2 neutrons, mass number 3.","hook":"Tri = three.","asks":[{"q":"How many neutrons are in tritium (hydrogen-3)?","right":"2","wrong":[["3","3 is the mass number."],["1","1 neutron is deuterium."],["0","0 neutrons is hydrogen-1."]],"exp":"3 - 1 = 2 neutrons."},{"q":"What is the mass number of tritium?","right":"3","wrong":[["2, because tritium has two particles in its nucleus besides its electron","1 proton + 2 neutrons = 3."],["1","That's hydrogen-1."],["4","Tritium has 3."]],"exp":"Tritium is hydrogen-3: 1 proton + 2 neutrons."}]}],"intro":["Isotopes are atoms of one element with different numbers of neutrons, so different mass numbers. They react the same way, because reactions depend on electrons. Most elements in nature are a mix of isotopes. Hydrogen's three are hydrogen-1, deuterium and tritium."]},{"name":"Isotopic notation","cards":[{"term":"Isotopic notation","def":"Written with the mass number (A) as a superscript and the atomic number (Z) as a subscript to the left of the symbol, for example ¹³₆C. An ion's charge goes at the upper right.","hook":"Mass on top, protons on the bottom.","asks":[{"q":"In ¹⁴₆C, what does the 6 tell you?","right":"The protons","wrong":[["The neutrons","Neutrons = 14 - 6 = 8."],["The mass number","The mass number is the top number, 14."],["The charge","Charge goes at the upper right; there is none here."]],"exp":"The bottom number is the atomic number: protons."},{"q":"An isotope is written ⁵⁶₂₆Fe. How many neutrons does it have?","right":"30","wrong":[["56, which is the top number and counts every particle in the nucleus","Subtract Z: 56 − 26 = 30."],["26","That's the proton count."],["82","Subtract, don't add."]],"exp":"Neutrons = mass number − atomic number = 56 − 26 = 30."}]},{"term":"Hyphen notation","def":"The element name followed by the mass number, for example carbon-13 or Re-187.","hook":"Name dash mass.","asks":[{"q":"How is ⁴¹₂₀Ca written in hyphen notation?","right":"Calcium-41","wrong":[["Calcium-20","20 is the atomic number; hyphen notation uses the mass number."],["Calcium-21","21 is the neutron count."],["Calcium-61","That adds 41 and 20."]],"exp":"Name, dash, mass number."},{"q":"\"Uranium-238\" tells you what number directly?","right":"The mass number","wrong":[["The atomic number, which is the number of protons in each uranium atom","Hyphen notation gives the mass number."],["The number of neutrons","You'd subtract Z to get that."],["The charge","No charge is shown."]],"exp":"Hyphen notation is the element name plus the mass number."}]},{"term":"Same element test","def":"Two symbols match only if they share an atomic number (Z). Equal mass numbers with different Z values are different substances.","hook":"Check the bottom number.","asks":[{"q":"Which pair is the same element?","right":"¹⁴₇X and ¹⁵₇X","wrong":[["¹⁴₆X and ¹⁴₇X","Same mass number but different atomic numbers."],["¹²₆X and ¹²₅X","Different atomic numbers mean different elements."],["¹⁶₈X and ¹⁶₉X","Different atomic numbers mean different elements."]],"exp":"Same bottom number (Z = 7) means same element."},{"q":"Do ⁴⁰₁₈X and ⁴⁰₂₀X show the same element?","right":"No; different atomic numbers","wrong":[["Yes, because they have exactly the same mass number written on top","Equal mass numbers don't make the same element."],["Yes; same symbol letter","X is a placeholder; Z decides."],["Only if they're ions","Z still decides."]],"exp":"Two symbols match only if they share an atomic number."}]}],"intro":["Two ways to write an isotope: isotopic notation puts the mass number on top and the atomic number at the bottom left of the symbol (¹³₆C), and hyphen notation writes the name and the mass number (carbon-13). To check if two symbols are the same element, compare the bottom numbers."]},{"name":"Average atomic mass","cards":[{"term":"Relative (percent) abundance","def":"How common each isotope of an element is, as a share or decimal of all its atoms.","hook":"How many of each.","asks":[{"q":"Boron is 80% boron-11. What does the 80% mean?","right":"Fraction of B-11 atoms","wrong":[["Mass of B-11 in grams","Abundance is a share of atoms, not a mass."],["Neutrons in B-11","B-11 has 6 neutrons, not 80."],["How stable B-11 atoms are","Abundance is about how common, not how stable."]],"exp":"Abundance is how common each isotope is."},{"q":"Element Y is 75% Y-35 and 25% Y-37. In 100 atoms of Y, about how many are Y-37?","right":"25","wrong":[["37, since the mass number tells you how many of the hundred atoms there are","Abundance gives the share."],["75","That's Y-35."],["50","The share is 25%."]],"exp":"Relative abundance is the share of atoms: 25% of 100 is 25."}]},{"term":"Weighted average atomic mass","def":"The sum of (each isotope's abundance as a decimal × how heavy that isotope is). This is the decimal value shown on the periodic table.","hook":"Like a weighted class average.","asks":[{"q":"Element X is 90% X-20 and 10% X-22. Which average mass makes sense?","right":"20.2","wrong":[["21.0","That is a plain average; X-20 is far more common."],["21.8","That treats X-22 as the common one."],["42.0","That adds the masses without weighting."]],"exp":"0.90(20) + 0.10(22) = 20.2."},{"q":"An element is 50% X-10 and 50% X-12. What is its average atomic mass?","right":"11","wrong":[["12, because the heavier isotope always counts more toward the average","Equal shares give the midpoint."],["10","That ignores X-12."],["22","That's a sum, not an average."]],"exp":"0.50 × 10 + 0.50 × 12 = 11."}]},{"term":"Isotopic mass","def":"How heavy one particular form of an element is. In the Candium lab each type of candy played the part of one form.","hook":"One isotope's mass.","asks":[{"q":"In the Candium lab, what did the average mass of one candy type stand for?","right":"One isotope's mass","wrong":[["The element's atomic number","Atomic number is a proton count, not a mass."],["The class's total mass","The total mixes every type together."],["The number of neutrons","The lab measured masses, not particles."]],"exp":"Each candy type was an isotope with its own mass."},{"q":"In the Candium lab, why did each candy type get its own average mass?","right":"Each type stood for one isotope","wrong":[["Each candy type stood for a different element in the periodic table","All candies were one element, Candium."],["To find the number of protons","It was about mass."],["To find the charge","It was about mass."]],"exp":"Each candy type played one isotope, and its average mass stood for that isotope's mass."}]}],"intro":["Each isotope has its own mass and its own relative abundance (how common it is). The atomic mass on the table is a weighted average: multiply each isotope's mass by its abundance as a decimal and add. Common isotopes pull the average toward them. The Candium lab modeled this with candy."]},{"name":"Isotope examples","cards":[{"term":"Carbon-12","def":"The most common form of element 6 (C): 6 protons and 6 neutrons, mass number 12.","hook":"6 + 6.","asks":[{"q":"A carbon atom has 6 neutrons. Which isotope is it?","right":"Carbon-12","wrong":[["Carbon-6","The name uses the mass number (6 + 6 = 12), not the neutron count."],["Carbon-13","Carbon-13 has 7 neutrons."],["Carbon-14","Carbon-14 has 8 neutrons."]],"exp":"Mass number = 6 protons + 6 neutrons = 12."},{"q":"Carbon-12 and carbon-14 differ in mass number by 2. Why?","right":"Carbon-14 has 2 more neutrons","wrong":[["Carbon-14 has 2 more protons, so it is heavier than carbon-12 by two","Both have 6 protons."],["Carbon-14 has 2 more electrons","Electrons don't add to mass number."],["Carbon-12 lost 2 protons","Both have 6 protons."]],"exp":"Carbon-12 has 6 neutrons; carbon-14 has 8."}]},{"term":"Carbon-13","def":"A form of element 6 (C) with 6 protons and 7 neutrons, mass number 13.","hook":"6 + 7.","asks":[{"q":"How many neutrons are in carbon-13?","right":"7","wrong":[["13","13 is the mass number."],["6","6 is the number of protons."],["19","That adds 13 and 6 instead of subtracting."]],"exp":"13 - 6 = 7 neutrons."},{"q":"Write carbon-13 in isotopic notation.","right":"¹³₆C","wrong":[["⁶₁₃C, with the mass number written at the bottom and the atomic number on top","Mass number goes on top."],["¹³₇C","Carbon's Z is 6."],["⁷₆C","7 is the neutron count, not the mass number."]],"exp":"Mass number 13 on top, atomic number 6 below."}]},{"term":"Carbon-14","def":"A form of element 6 (C) with 6 protons and 8 neutrons, mass number 14.","hook":"6 + 8.","asks":[{"q":"How many neutrons are in carbon-14?","right":"8","wrong":[["14","14 is the mass number."],["6","6 is the number of protons."],["20","That adds 14 and 6 instead of subtracting."]],"exp":"14 - 6 = 8 neutrons."},{"q":"A carbon atom has mass number 14. How many protons and neutrons does it have?","right":"6 protons, 8 neutrons","wrong":[["8 protons and 6 neutrons, since the larger number is always the protons","Carbon always has 6 protons."],["7 protons, 7 neutrons","Carbon has 6 protons."],["14 protons, 0 neutrons","14 is the total."]],"exp":"Carbon has 6 protons, so 14 − 6 = 8 neutrons."}]},{"term":"Oxygen-16","def":"A form of element 8 (O) with 8 protons, 8 neutrons and 8 electrons, mass number 16.","hook":"8 + 8.","asks":[{"q":"How many neutrons are in oxygen-16?","right":"8","wrong":[["16","16 is the mass number."],["10","10 neutrons is oxygen-18."],["9","9 neutrons is oxygen-17."]],"exp":"16 - 8 = 8 neutrons."},{"q":"Write oxygen-16 in isotopic notation.","right":"¹⁶₈O","wrong":[["⁸₁₆O, with the atomic number written on top and the mass number below","Mass number goes on top."],["¹⁶₁₆O","Oxygen's Z is 8."],["⁸₈O","Mass number is 16."]],"exp":"Mass number 16 on top, atomic number 8 below."}]},{"term":"Oxygen-17","def":"A form of element 8 (O) with 8 protons, 9 neutrons and 8 electrons, mass number 17.","hook":"8 + 9.","asks":[{"q":"An oxygen atom has 9 neutrons. Which isotope is it?","right":"Oxygen-17","wrong":[["Oxygen-9","The name uses the mass number (8 + 9 = 17), not the neutron count."],["Oxygen-16","Oxygen-16 has 8 neutrons."],["Oxygen-18","Oxygen-18 has 10 neutrons."]],"exp":"Mass number = 8 protons + 9 neutrons = 17."},{"q":"How many electrons does a neutral oxygen-17 atom have?","right":"8","wrong":[["9, the same as its neutron count, since neutrons and electrons are paired","Electrons equal protons."],["17","That's the mass number."],["10","That's O²⁻."]],"exp":"A neutral atom has electrons equal to its protons: 8."}]},{"term":"Oxygen-18","def":"A form of element 8 (O) with 8 protons, 10 neutrons and 8 electrons, mass number 18.","hook":"8 + 10.","asks":[{"q":"What do oxygen-16 and oxygen-18 have different numbers of?","right":"Neutrons","wrong":[["Protons","Both have 8 protons; that's what makes them oxygen."],["Electrons","Both neutral atoms have 8 electrons."],["Atomic number","Both have atomic number 8."]],"exp":"Oxygen-18 has 10 neutrons; oxygen-16 has 8."},{"q":"How many neutrons are in oxygen-18?","right":"10","wrong":[["18, because the number after the hyphen counts the neutrons directly","18 is the mass number; subtract 8."],["8","That's the proton count."],["9","That's oxygen-17."]],"exp":"18 − 8 = 10 neutrons."}]}],"intro":["These are the isotopes from your slides. Carbon always has 6 protons and oxygen always has 8; only the neutrons change. For each one, subtract the atomic number from the mass number to get the neutrons."]}],"intro":["Atoms of the same element don't all weigh the same. This deck explains why (different numbers of neutrons), how to write each version, and how the periodic table's decimal masses are worked out from them."]},{"id":5,"name":"Ions and Ionic Compounds","optional":false,"sections":[{"name":"Forming ions","cards":[{"term":"Ion","def":"An atom or group of atoms that has gained or lost electrons and so carries a charge. The nucleus does not change.","hook":"Gained or lost electrons.","asks":[{"q":"An atom has 11 protons and 10 electrons. What is it?","right":"An ion","wrong":[["A neutral atom","Neutral atoms have equal protons and electrons."],["An isotope","Isotopes differ in neutrons, not electrons."],["A new element","The protons (11, sodium) did not change."]],"exp":"Unequal protons and electrons make an ion: Na⁺."},{"q":"Which change turns a neutral atom into an ion?","right":"Gaining or losing electrons","wrong":[["Gaining or losing protons in the nucleus, which changes the atom's charge","That changes the element; ions change electrons."],["Gaining neutrons","That makes an isotope."],["Losing neutrons","That makes an isotope."]],"exp":"An ion has gained or lost electrons; the nucleus doesn't change."}]},{"term":"Cation","def":"A positive ion, formed when an atom loses electrons. Metals tend to form this kind of ion.","hook":"Cats are paws-itive.","asks":[{"q":"Calcium loses two electrons. What does it become?","right":"A cation, Ca²⁺","wrong":[["An anion, Ca²⁻","Losing electrons makes it positive, not negative."],["An isotope of calcium","Isotopes differ in neutrons, not electrons."],["A neutral atom","It has 2 more protons than electrons now."]],"exp":"Losing electrons makes a positive ion."},{"q":"An atom has 20 protons and 18 electrons. What is it?","right":"A cation with a 2+ charge","wrong":[["An anion with a 2- charge, because it has two more protons than electrons","More protons than electrons means positive."],["A neutral atom","Protons and electrons don't match."],["An isotope","Isotopes differ in neutrons."]],"exp":"20 positive − 18 negative = 2+, a cation."}]},{"term":"Anion","def":"A negative ion, formed when an atom gains electrons. Nonmetals tend to form this kind of ion.","hook":"A negative ion.","asks":[{"q":"Sulfur gains two electrons. What does it become?","right":"An anion, S²⁻","wrong":[["A cation, S²⁺","Gaining electrons makes it negative."],["An isotope of sulfur","Isotopes differ in neutrons."],["A new element","Electrons never change the element."]],"exp":"Gaining electrons makes a negative ion."},{"q":"Which of these elements is most likely to form an anion?","right":"Bromine","wrong":[["Potassium, since it is very reactive and easily changes its electron count","Metals form cations."],["Calcium","A metal: forms a cation."],["Aluminum","A metal: forms a cation."]],"exp":"Nonmetals gain electrons and form anions."}]},{"term":"Why atoms ionize","def":"To complete their valence shell (an octet). One particle gives up electrons and another takes them until both have complete octets.","hook":"Everyone wants eight.","asks":[{"q":"Why does sodium give up an electron to chlorine?","right":"Both complete octets","wrong":[["To gain a proton","Ions never change protons."],["To become a noble gas","Na⁺ has a full shell but is still sodium."],["To become heavier","Losing an electron makes it slightly lighter."]],"exp":"Na loses 1, Cl gains 1, and both reach complete outer shells."},{"q":"Magnesium gives 2 electrons to oxygen. What do both atoms gain from this?","right":"Both end up with complete octets","wrong":[["Both end up with more protons, which makes them heavier and more stable","Protons don't change."],["Both become noble gases","They only match a noble gas's electrons."],["Both become neutral","They become ions."]],"exp":"Atoms ionize to complete their valence shells."}]},{"term":"Metals lose, nonmetals gain","def":"Elements left of the staircase give up electrons and become cations; elements right of it take electrons and become anions.","hook":"Metals give, nonmetals take.","asks":[{"q":"Potassium and fluorine react. Which one loses electrons?","right":"Potassium","wrong":[["Fluorine","Fluorine is a nonmetal; it gains electrons."],["Both lose one","One must lose and one must gain."],["Neither one","An ionic bond forms by transfer."]],"exp":"Metals lose electrons; nonmetals gain them."},{"q":"Calcium and chlorine react. What happens to the electrons?","right":"Calcium loses; chlorine gains","wrong":[["Chlorine loses electrons and calcium gains them, since chlorine is on the right","Elements right of the staircase gain."],["Both lose electrons","One gives, one takes."],["Both gain electrons","One gives, one takes."]],"exp":"Metals (left) give up electrons; nonmetals (right) take them."}]}],"intro":["An ion is an atom that has gained or lost electrons; the nucleus stays the same. Metals (left of the staircase) lose electrons and become positive cations. Nonmetals (right) gain electrons and become negative anions. Both do it to complete an octet."]},{"name":"Charges by group","cards":[{"term":"Group 1 charge","def":"Alkali metals lose 1 valence electron and form +1 ions, such as Na⁺ and K⁺.","hook":"One electron out, +1.","asks":[{"q":"Lithium is in group 1. What ion does it form?","right":"Li⁺","wrong":[["Li²⁺","2+ is for group 2."],["Li⁻","Metals lose electrons, so the ion is positive."],["Li⁷⁻","Lithium loses 1 electron rather than gaining 7."]],"exp":"Group 1 loses 1 electron: +1."},{"q":"Rubidium is in group 1. What compound does it form with chlorine?","right":"RbCl","wrong":[["RbCl₂, because rubidium is a large atom and can hold more chlorine atoms","Group 1 forms +1, so 1:1 with Cl⁻."],["Rb₂Cl","That would need Cl²⁻."],["RbCl₃","That would need Rb³⁺."]],"exp":"Group 1 forms +1 ions; Rb⁺ + Cl⁻ = RbCl."}]},{"term":"Group 2 charge","def":"Alkaline earth metals lose 2 valence electrons and form +2 ions, such as Mg²⁺ and Ca²⁺.","hook":"Two electrons out, +2.","asks":[{"q":"What is the formula of the ion barium forms?","right":"Ba²⁺","wrong":[["Ba⁺","1+ is for group 1; barium is in group 2."],["Ba²⁻","Metals form positive ions."],["Ba³⁺","3+ is for group 13."]],"exp":"Group 2 forms 2+ ions."},{"q":"How many electrons does a calcium atom lose when it forms its ion?","right":"2","wrong":[["1, the same number that sodium and the other group 1 metals lose","Group 2 loses 2."],["6","That's what oxygen-family atoms have."],["8","That's a full octet."]],"exp":"Alkaline earth metals lose 2 valence electrons to form +2 ions."}]},{"term":"Group 13 charge","def":"Column 13 forms +3 ions (for example Al³⁺ and Ga³⁺).","hook":"Lose 3.","asks":[{"q":"What ion does gallium (group 13) form?","right":"Ga³⁺","wrong":[["Ga³⁻","Gallium is a metal, so it loses electrons."],["Ga⁺","1+ is for group 1."],["Ga⁵⁺","Group 13 loses 3 electrons, not 5."]],"exp":"Group 13 forms 3+ ions."},{"q":"Aluminum and oxygen form a compound. What is its formula?","right":"Al₂O₃","wrong":[["AlO, since both elements give or take the same number of electrons","Al³⁺ and O²⁻ need a 2:3 ratio."],["Al₃O₂","Subscripts swapped."],["AlO₃","Charges don't balance."]],"exp":"Al³⁺ and O²⁻ cross over to Al₂O₃."}]},{"term":"Group 15 charge","def":"Nitrogen family nonmetals gain 3 electrons to complete the octet and form -3 ions, such as N³⁻ and P³⁻.","hook":"5 + 3 = 8.","asks":[{"q":"What ion does nitrogen (group 15) form?","right":"N³⁻","wrong":[["N⁵⁻","Nitrogen gains 3 to reach 8, not 5."],["N³⁺","Nitrogen is a nonmetal; it gains electrons."],["N²⁻","2- is for group 16."]],"exp":"Group 15 gains 3 electrons: 3-."},{"q":"Nitrogen has 5 valence electrons. Why does it form N³⁻?","right":"Gaining 3 completes its octet","wrong":[["It loses 3 electrons, which leaves it with a positive charge of three","It gains, so the charge is negative."],["It gains 5 electrons","That would give 10."],["It loses 5 electrons","That doesn't give N³⁻."]],"exp":"5 + 3 = 8: gaining 3 electrons gives N³⁻."}]},{"term":"Group 16 charge","def":"Oxygen family nonmetals gain 2 electrons and form -2 ions, such as O²⁻ and S²⁻.","hook":"6 + 2 = 8.","asks":[{"q":"Selenium is in group 16. What ion does it form?","right":"Se²⁻","wrong":[["Se⁶⁻","Selenium gains 2 to reach 8, not 6."],["Se²⁺","Selenium is a nonmetal; it gains electrons."],["Se⁻","1- is for group 17."]],"exp":"Group 16 gains 2 electrons: 2-."},{"q":"Calcium and sulfur form a compound. What is its formula?","right":"CaS","wrong":[["CaS₂, because sulfur needs two calcium atoms to balance its charge","Ca²⁺ and S²⁻ balance 1:1."],["Ca₂S","Charges don't balance."],["Ca₂S₂","Reduce to lowest ratio: CaS."]],"exp":"Ca²⁺ and S²⁻ balance 1:1."}]},{"term":"Group 17 charge","def":"Halogens gain 1 electron and form -1 ions, such as F⁻ and Cl⁻.","hook":"7 + 1 = 8.","asks":[{"q":"What ion does iodine (group 17) form?","right":"I⁻","wrong":[["I⁷⁻","Iodine gains 1 to reach 8, not 7."],["I⁺","Iodine is a nonmetal; it gains electrons."],["I²⁻","2- is for group 16."]],"exp":"Group 17 gains 1 electron: 1-."},{"q":"Magnesium and fluorine form a compound. What is its formula?","right":"MgF₂","wrong":[["MgF, since magnesium and fluorine each have a charge of one on their ions","Mg is 2+, so it needs two F⁻."],["Mg₂F","Charges don't balance."],["MgF₃","That would need Mg³⁺."]],"exp":"Mg²⁺ needs two F⁻."}]},{"term":"Noble gas charge","def":"Group 18 tends not to form ions because its valence shell is already complete.","hook":"Already done.","asks":[{"q":"Which element is least likely to form an ion?","right":"Neon","wrong":[["Sodium","Sodium readily forms Na⁺."],["Oxygen","Oxygen readily forms O²⁻."],["Calcium","Calcium readily forms Ca²⁺."]],"exp":"Neon's valence shell is already full."},{"q":"Which ion has the same electron arrangement as argon, and why doesn't argon itself form ions?","right":"Cl⁻; argon's shell is already full","wrong":[["Na⁺, because argon gives away its electrons to sodium to fill its shell","Na⁺ matches neon, and argon doesn't give electrons."],["Ne; argon is a metal","Argon is a noble gas."],["O²⁻; argon is too heavy","O²⁻ matches neon; mass isn't the reason."]],"exp":"Noble gases tend not to form ions because their valence shell is full; Cl⁻ reaches argon's arrangement."}]},{"term":"Transition metal charges","def":"Many elements in columns 3 to 12 can form ions of different sizes (for example Fe²⁺ or Fe³⁺, Cu⁺ or Cu²⁺), so a problem must tell you which one.","hook":"Middle block: it varies.","asks":[{"q":"Which element's ion charge must be given in a problem?","right":"Iron","wrong":[["Sodium","Sodium is always 1+."],["Chlorine","Chlorine's ion is always 1-."],["Magnesium","Magnesium is always 2+."]],"exp":"Transition metals like iron have variable charges."},{"q":"A problem asks for the formula of iron chloride but doesn't give iron's charge. What's wrong?","right":"Iron can be 2+ or 3+","wrong":[["Nothing, because iron always forms a +2 ion like the other group 2 metals","Iron is a transition metal with variable charges."],["Iron doesn't form ions","It does."],["Chlorine's charge varies","Chloride is always -1."]],"exp":"Transition metals have variable charges, so a problem must say which one."}]}],"intro":["The group tells you the charge. Groups 1, 2 and 13 lose electrons: +1, +2, +3. Groups 15, 16 and 17 gain electrons: −3, −2, −1. Noble gases don't form ions. Transition metals can have more than one charge, so a problem has to tell you which."]},{"name":"Bonds and formulas","cards":[{"term":"Bond","def":"The sharing or giving and taking of electrons between two atoms.","hook":"Share or swap.","asks":[{"q":"What happens to electrons when two atoms form a bond?","right":"Shared or transferred","wrong":[["They are destroyed","Electrons are not destroyed in a bond."],["They join the nucleus","Electrons stay outside the nucleus."],["They become protons","Electrons never turn into protons."]],"exp":"A bond is the sharing or giving and taking of electrons."},{"q":"In table salt, sodium gives an electron to chlorine. In water, H and O share electrons. What do both have in common?","right":"Both are bonds","wrong":[["Both are ionic bonds, because electrons move between the atoms in each case","Sharing is covalent, not ionic."],["Neither is a bond","Both are bonds."],["Both are covalent","Salt's electrons are given, not shared."]],"exp":"A bond is the sharing or giving and taking of electrons."}]},{"term":"Ionic bond","def":"The electrostatic force of attraction between a cation and an anion. Forms between a metal and a nonmetal.","hook":"Opposites attract.","asks":[{"q":"What holds Na⁺ and Cl⁻ together in table salt?","right":"Opposite charges attract","wrong":[["Shared electron pairs","Sharing is a covalent bond."],["A shared nucleus","Each ion keeps its own nucleus."],["Neutrons shared between them","Neutrons stay in each nucleus."]],"exp":"The electrostatic attraction between a cation and an anion."},{"q":"Which pair would form an ionic bond?","right":"Potassium and iodine","wrong":[["Carbon and oxygen, since both are nonmetals that sit near each other","Two nonmetals share electrons: covalent."],["Nitrogen and hydrogen","Two nonmetals: covalent."],["Neon and argon","Noble gases don't bond this way."]],"exp":"Ionic bonds form between a metal and a nonmetal."}]},{"term":"Covalent compound","def":"A substance in which atoms are held together by sharing electrons, never fully transferring them. Formed between nonmetals.","hook":"Co-valent = co-share.","asks":[{"q":"Which pair of elements would form a covalent compound?","right":"Carbon and oxygen","wrong":[["Sodium and chlorine","A metal and a nonmetal form an ionic compound."],["Calcium and oxygen","Calcium is a metal, so this is ionic."],["Lithium and nitrogen","Lithium is a metal, so this is ionic."]],"exp":"Two nonmetals share electrons."},{"q":"Why is CO₂ covalent but NaCl ionic?","right":"C and O are both nonmetals","wrong":[["CO₂ is a gas and NaCl is a solid, and only solids can form ionic bonds","State doesn't decide bond type."],["Carbon is a metal","Carbon is a nonmetal."],["NaCl has more atoms","Number of atoms doesn't decide."]],"exp":"Covalent compounds form between nonmetals; ionic between a metal and a nonmetal."}]},{"term":"Chemical formula","def":"Shows the types of atoms and the number of each in one unit of a compound, using element symbols and subscripts. A subscript of 1 is not written.","hook":"Symbols plus subscripts.","asks":[{"q":"How many oxygen atoms are in one unit of Al₂O₃?","right":"3","wrong":[["2","2 is the number of aluminum atoms."],["5","5 is the total number of atoms."],["1","The subscript 3 applies to oxygen."]],"exp":"The subscript after O is 3."},{"q":"How many atoms in total are in one unit of Ca(NO₃)₂?","right":"9","wrong":[["5, counting one calcium, one nitrogen and three oxygen atoms in the unit","The 2 doubles everything in the parentheses."],["6","That doubles the nitrogen but not the oxygen."],["8","That doubles the oxygen but not the nitrogen."]],"exp":"1 Ca + 2 N + 6 O = 9 atoms."}]},{"term":"Ionic formula rule","def":"Write the cation first, then the anion, with enough of each that the charges add to zero. The finished compound is electrically neutral.","hook":"Charges sum to zero.","asks":[{"q":"Is MgCl a correct formula? Why or why not?","right":"No: charges don't cancel","wrong":[["Yes: one of each","+2 and -1 add to +1, not zero."],["Yes: metal comes first","Order is right, but the charges must cancel too."],["No: chlorine must come first","The metal does go first; the problem is the charge."]],"exp":"Mg²⁺ needs two Cl⁻: MgCl₂."},{"q":"Which formula is written correctly?","right":"K₂O","wrong":[["OK₂, because you can write the ions of an ionic compound in either order","The cation goes first."],["KO","Charges don't add to zero."],["KO₂","Charges don't add to zero."]],"exp":"Cation first, and the charges must add to zero: two K⁺ and one O²⁻."}]},{"term":"Crossover method","def":"Swap each ion's charge number to become the other ion's subscript, then reduce to the lowest ratio. Ba²⁺ and P³⁻ give Ba₃P₂.","hook":"Cross the charges.","asks":[{"q":"Use the crossover method for Al³⁺ and O²⁻. What is the formula?","right":"Al₂O₃","wrong":[["Al₃O₂","The charges were not crossed: each ion takes the other's number."],["AlO","+3 and -2 do not cancel one to one."],["Al₂O₂","That reduces wrong; Al₂O₂ has +6 and -4."]],"exp":"Cross 3 and 2 over: Al₂O₃."},{"q":"Use the crossover method for Ca²⁺ and O²⁻. What is the final formula?","right":"CaO","wrong":[["Ca₂O₂, because each charge becomes the other ion's subscript exactly","Reduce to the lowest ratio."],["CaO₂","Charges don't balance."],["Ca₂O","Charges don't balance."]],"exp":"Crossing gives Ca₂O₂, which reduces to CaO."}]},{"term":"Polyatomic ion","def":"A charged group of two or more atoms covalently bonded together. It stays together as one unit in a formula; use parentheses if you need more than one, as in Ca(CN)₂.","hook":"One ion, many atoms.","asks":[{"q":"Why is Ca(CN)₂ written with parentheses?","right":"CN stays one unit","wrong":[["Calcium is doubled","The 2 applies only to what is inside the parentheses."],["It is covalent","Ca(CN)₂ is ionic; parentheses group the ion."],["It shows the charge","Charges are not written in the formula."]],"exp":"The 2 means two whole CN⁻ ions."},{"q":"Why is Mg(OH)₂ written with parentheses?","right":"There are two OH units","wrong":[["To show that the magnesium is bonded to the oxygen more strongly than hydrogen","Parentheses show a unit repeated."],["Because Mg has 2 protons","It's about the OH count."],["To show OH is an element","OH is a polyatomic ion."]],"exp":"A polyatomic ion stays together; parentheses show more than one of it."}]},{"term":"Properties of ionic compounds","def":"Strong and brittle, with high melting points. They conduct electricity when melted or dissolved in water, not as solids.","hook":"Hard, high-melting, conduct when free to move.","asks":[{"q":"Solid salt does not conduct electricity, but salt water does. Why?","right":"Its ions can move","wrong":[["Water is a metal","Water is a covalent compound."],["Salt melts in water","Dissolving is not melting."],["Salt loses its charge","The ions keep their charges."]],"exp":"Dissolved or melted, the ions are free to move."},{"q":"An unknown solid has a very high melting point, shatters when hit and conducts only when dissolved. What is it most likely?","right":"An ionic compound","wrong":[["A metal, because metals melt at high temperatures and conduct electricity","Metals conduct as solids and bend."],["A covalent gas","It's a solid."],["A noble gas","Noble gases are gases."]],"exp":"Ionic compounds are brittle, melt at high temperatures and conduct when melted or dissolved."}]}],"intro":["When a metal gives electrons to a nonmetal, the opposite charges attract: an ionic bond. Nonmetals share electrons instead: a covalent bond. To write an ionic formula, put the cation first and use the crossover method so the charges add to zero. Polyatomic ions stay together as one unit, in parentheses if you need more than one."]}],"intro":["Atoms gain or lose electrons to get a full outer shell, and the charged atoms that result stick together to form compounds like salt. This deck covers why ions form, what charge each group takes, and how to write the formulas."]},{"id":6,"name":"Molar Mass and the Mole","optional":false,"sections":[{"name":"Molar mass","cards":[{"term":"Molar mass","def":"The grams in one mole of a substance (g/mol). Add up the atomic weights of every atom in the formula.","hook":"Add them all up.","asks":[{"q":"What is the molar mass of water, H₂O? (H = 1.008, O = 16.00)","right":"18.02 g/mol","wrong":[["17.01 g/mol","That counts only one hydrogen."],["34.02 g/mol","That counts two oxygens."],["16.00 g/mol","That is oxygen alone."]],"exp":"2(1.008) + 16.00 = 18.02 g/mol."},{"q":"What is the molar mass of NaCl? (Na = 22.99, Cl = 35.45)","right":"58.44 g/mol","wrong":[["12.46 g/mol, found by subtracting the smaller mass from the larger one","Add the masses."],["35.45 g/mol","That's chlorine only."],["22.99 g/mol","That's sodium only."]],"exp":"22.99 + 35.45 = 58.44 g/mol."}]},{"term":"Molar mass with subscripts","def":"Multiply each element's atomic weight by the small number after its symbol before adding. MgCl₂ = 24.31 + 2(35.45) = 95.21 g/mol.","hook":"Count every atom.","asks":[{"q":"In CaCl₂, how many times do you add chlorine's mass?","right":"2","wrong":[["1","The subscript 2 means two Cl atoms."],["3","3 is the total number of atoms."],["0","Chlorine is part of the formula."]],"exp":"Multiply Cl's mass by its subscript, 2."},{"q":"What is the molar mass of CO₂? (C = 12.01, O = 16.00)","right":"44.01 g/mol","wrong":[["28.01 g/mol, adding the mass of one carbon and the mass of one oxygen","The 2 means two oxygens."],["56.02 g/mol","Only oxygen gets the 2."],["32.00 g/mol","That's only the oxygens."]],"exp":"12.01 + 2(16.00) = 44.01 g/mol."}]},{"term":"Molar mass with parentheses","def":"A subscript after a bracketed group multiplies everything inside it. Ca(CN)₂ has 1 Ca, 2 C and 2 N.","hook":"The outside number multiplies the inside.","asks":[{"q":"How many oxygen atoms are in one unit of Ca(NO₃)₂?","right":"6","wrong":[["3","The 2 outside the parentheses doubles the 3 inside."],["5","That adds 3 and 2 instead of multiplying."],["2","2 is the number of NO₃ groups."]],"exp":"2 × 3 = 6 oxygen atoms."},{"q":"What is the molar mass of Mg(OH)₂? (Mg = 24.31, O = 16.00, H = 1.008)","right":"58.33 g/mol","wrong":[["41.32 g/mol, adding one magnesium, one oxygen and one hydrogen together","The 2 doubles O and H."],["57.32 g/mol","Hydrogen is doubled too."],["42.33 g/mol","Oxygen is doubled too."]],"exp":"24.31 + 2(16.00) + 2(1.008) = 58.33 g/mol."}]}],"intro":["Molar mass is the mass of one mole of a substance, in g/mol. Add up the atomic masses of every atom in the formula. A subscript multiplies the element before it; a subscript after parentheses multiplies everything inside."]},{"name":"Mole conversions","cards":[{"term":"Mole","def":"The chemist's counting unit: 6.022 × 10²³ particles (atoms, molecules or formula units).","hook":"A chemist's dozen.","asks":[{"q":"You have 1 mole of water molecules. How many molecules is that?","right":"6.022 × 10²³","wrong":[["18.02 molecules","18.02 is the mass of a mole in grams, not a count."],["1 molecule","A mole is a huge count, not one particle."],["3 molecules","3 is the atoms in one molecule."]],"exp":"One mole = 6.022 × 10²³ particles."},{"q":"Which contains more particles: 1 mole of helium atoms or 1 mole of water molecules?","right":"The same: 6.022 × 10²³ each","wrong":[["The water, because each water molecule is much heavier than a helium atom","Mass doesn't change the count in a mole."],["The helium","A mole is the same count for anything."],["Neither has a set count","A mole is 6.022 × 10²³."]],"exp":"A mole is a counting unit: 6.022 × 10²³ particles of anything."}]},{"term":"Avogadro's number","def":"6.022 × 10²³, the count of particles in one mole.","hook":"6.022 × 10²³ per mole.","asks":[{"q":"How many atoms are in 2.00 mol of copper?","right":"1.20 × 10²⁴","wrong":[["6.02 × 10²³","That is only 1 mol."],["2.00","2.00 is the number of moles."],["3.01 × 10²³","That divides by 2 instead of multiplying."]],"exp":"2.00 × 6.022 × 10²³ = 1.20 × 10²⁴."},{"q":"How many molecules are in 0.500 mol of CO₂?","right":"3.011 × 10²³","wrong":[["1.204 × 10²⁴, multiplying Avogadro's number by two instead of by a half","Multiply by 0.500, not 2."],["6.022 × 10²³","That's 1 mol."],["0.500","That's moles, not molecules."]],"exp":"0.500 × 6.022 × 10²³ = 3.011 × 10²³."}]},{"term":"Grams to moles","def":"Divide a sample's mass by its molar mass: mass × (1 mol / molar mass).","hook":"Grams ÷ molar mass.","asks":[{"q":"How many moles are in 36.04 g of water (18.02 g/mol)?","right":"2.000 mol","wrong":[["649.4 mol","That multiplies instead of dividing."],["0.5000 mol","That divides molar mass by grams."],["18.02 mol","That is the molar mass, not the moles."]],"exp":"36.04 ÷ 18.02 = 2.000 mol."},{"q":"How many moles are in 11.69 g of NaCl (58.44 g/mol)?","right":"0.2000 mol","wrong":[["683.2 mol, multiplying the mass by the molar mass instead of dividing","Divide by molar mass."],["5.000 mol","That's molar mass ÷ mass, upside down."],["11.69 mol","Grams aren't moles."]],"exp":"11.69 ÷ 58.44 = 0.2000 mol."}]},{"term":"Subscript ratio","def":"The small numbers in a formula tell how many moles of each element are in one mole of compound: 1 mol CCl₄ contains 4 mol Cl.","hook":"The subscript is the ratio.","asks":[{"q":"How many moles of H atoms are in 3 mol of CH₄?","right":"12 mol","wrong":[["3 mol","That is the moles of CH₄, not H."],["4 mol","That is per 1 mol of CH₄."],["0.75 mol","That divides instead of multiplying."]],"exp":"3 mol × 4 H per CH₄ = 12 mol H."},{"q":"How many moles of O atoms are in 2 mol of Al₂O₃?","right":"6 mol","wrong":[["4 mol, because aluminum oxide has two aluminum atoms in each formula unit","That's aluminum; oxygen's subscript is 3."],["3 mol","That's per 1 mol."],["2 mol","Multiply by the subscript."]],"exp":"2 mol × 3 O per unit = 6 mol O."}]},{"term":"Roadmap to atoms","def":"grams → (÷ molar mass) → moles of compound → (× subscript) → moles of one element → (× 6.022 × 10²³) → particle count.","hook":"Grams, moles, moles, atoms.","asks":[{"q":"To go from grams of a compound to number of atoms, what comes first?","right":"Divide by molar mass","wrong":[["Multiply by 6.022 × 10²³","That comes last, after moles of atoms."],["Multiply by the subscript","That comes after you have moles."],["Add the atomic masses","That only finds the molar mass."]],"exp":"Grams → moles → moles of atoms → atoms."},{"q":"You know the moles of a compound and want the number of one element's atoms. Which steps come next?","right":"× subscript, then × 6.022 × 10²³","wrong":[["÷ molar mass, then × 6.022 × 10²³, the same steps you use when starting from grams","You already have moles; no molar mass step."],["× molar mass only","That gives grams."],["÷ 6.022 × 10²³ only","That goes the wrong way."]],"exp":"Moles of compound × subscript = moles of the element, then × Avogadro's number = atoms."}]},{"term":"Formula unit","def":"The smallest repeating piece of an ionic compound, such as one Al₂S₃. Ionic compounds are counted this way, not in molecules.","hook":"Ionic = formula units.","asks":[{"q":"Why do we count NaCl in formula units, not molecules?","right":"It is ionic","wrong":[["It is a gas","NaCl is a solid."],["It has one atom","NaCl has two ions per unit."],["It is a covalent compound","Molecules are covalent; NaCl is ionic."]],"exp":"Ionic compounds are counted in formula units."},{"q":"Which substance is counted in formula units rather than molecules?","right":"CaCl₂","wrong":[["H₂O, because it is made of more than one kind of atom bonded together","Water is covalent: molecules."],["CO₂","Covalent: molecules."],["O₂","Covalent: molecules."]],"exp":"Ionic compounds like CaCl₂ are counted in formula units."}]}],"intro":["One mole is 6.022 × 10²³ particles (Avogadro's number). To go from grams to atoms: divide by molar mass to get moles, multiply by the subscript to get moles of one element, then multiply by Avogadro's number. Ionic compounds are counted in formula units, not molecules."]}],"intro":["Atoms are too small to count one by one, so chemists count them by weighing. This deck covers the mole, molar mass, and the roadmap that turns grams into a number of atoms."]}],"sq":[{"deck":1,"q":"A student finds an element that is shiny, can be drawn into wire, and conducts electricity. Where is it most likely on the periodic table?","opts":["Left of the staircase","Right of the staircase","On the staircase itself","In group 18"],"ans":0,"exp":"Conductive, ductile and shiny are metal properties; metals sit left of the staircase.","why":["","Elements there are nonmetals: brittle and poor conductors.","Metalloids have mixed properties; this sample shows only metallic ones.","Noble gases are gases, not shiny conductors you can draw into wire."]},{"deck":1,"q":"Element Q is in period 3 and group 2. Which statement about Q is true?","opts":["It has 3 valence electrons","It has 2 valence electrons","It forms a 2- ion","It is a halogen"],"ans":1,"exp":"Group number gives valence electrons for representative elements; period gives energy levels.","why":["3 is the period, which gives energy levels, not valence electrons.","","Group 2 metals lose electrons and form 2+ ions.","Halogens are group 17. Group 2 is the alkaline earth metals."]},{"deck":1,"q":"Which element is a nonmetal even though it is on the left side of the table?","opts":["Lithium","Aluminum","Hydrogen","Beryllium"],"ans":2,"exp":"Hydrogen sits in group 1 but is a nonmetal.","why":["Lithium is an alkali metal.","Aluminum touches the staircase but is a metal.","","Beryllium is an alkaline earth metal."]},{"deck":2,"q":"A model shows electrons scattered through a sphere of positive charge. Which result later disproved it?","opts":["Atoms emit negative particles","Beryllium emitted neutral rays","Electrons occupy orbitals","Alpha particles bounced back"],"ans":3,"exp":"Rutherford's bouncing alpha particles showed a dense nucleus, which plum pudding could not explain.","why":["That result supported the model; it is how Thomson found electrons.","That discovery (the neutron) came after the model was already replaced.","The orbital model came later still and replaced Bohr's orbits.",""]},{"deck":2,"q":"Which scientist would say electrons travel in fixed orbits like planets?","opts":["Niels Bohr","J. J. Thomson","Ernest Rutherford","James Chadwick"],"ans":0,"exp":"Bohr's 1913 model put electrons in fixed orbits, or energy levels.","why":["","Thomson placed electrons inside a ball of positive charge.","Rutherford found the nucleus but could not locate the electrons.","Chadwick discovered the neutron."]},{"deck":2,"q":"Why was the neutron the last of the three particles to be found?","opts":["It is far lighter than a proton","It has no charge to detect","It is found outside the nucleus","It only exists in ions"],"ans":1,"exp":"Chadwick detected it as neutral radiation; with no charge, it was hard to find.","why":["Neutrons have about the same mass as protons.","","Neutrons are inside the nucleus.","Neutrons are in nearly every nucleus, ion or not."]},{"deck":3,"q":"An atom has 17 protons, 18 neutrons and 18 electrons. What is it?","opts":["An argon atom","A neutral chlorine atom","A chloride ion, Cl⁻","A Cl⁺ cation"],"ans":2,"exp":"17 protons make it chlorine; 18 electrons give a 1- charge.","why":["Argon has 18 protons. This particle has 17, so it is chlorine.","A neutral atom would have 17 electrons, not 18.","","One extra electron gives a negative charge, not positive."]},{"deck":3,"q":"Which particle count tells you an atom's chemical behavior?","opts":["Its number of neutrons","Its mass number","Its number of energy levels","Its number of electrons"],"ans":3,"exp":"The chemistry of an atom arises from its electrons.","why":["Neutrons change the isotope; isotopes behave almost the same.","Mass number counts nucleus particles, which do not bond.","Energy levels matter, but the electrons in them do the bonding.",""]},{"deck":3,"q":"How many rings should a Bohr model of sulfur (period 3, group 16) have, and how many electrons on the outer ring?","opts":["3 rings, 6 outer electrons","6 rings, 3 outer electrons","3 rings, 16 outer electrons","2 rings, 6 outer electrons"],"ans":0,"exp":"Period 3 gives 3 energy levels; group 16 gives 6 valence electrons.","why":["","Swapped: the period gives rings and the group gives valence electrons.","An outer ring holds at most 8; group 16 means 6 valence electrons.","Sulfur is in period 3, so it has 3 energy levels."]},{"deck":4,"q":"Two atoms both have 8 protons; one has 8 neutrons and the other 10. What are they?","opts":["Two different elements","Isotopes of oxygen","Two ions of oxygen","Two compounds"],"ans":1,"exp":"Same protons, different neutrons: oxygen-16 and oxygen-18.","why":["Both have 8 protons, so both are oxygen.","","Ions differ in electrons, not neutrons.","These are single atoms, not bonded compounds."]},{"deck":4,"q":"Chlorine's atomic mass is 35.45. Which isotope is most common?","opts":["Chlorine-37","Chlorine-36","Chlorine-35","They are equally common"],"ans":2,"exp":"A weighted average lands closest to the most abundant isotope.","why":["If Cl-37 were most common, the average would be closer to 37.","The average is closest to 35, not 36.","","Equal amounts would give an average of 36."]},{"deck":4,"q":"In the Candium lab, what did each type of candy represent?","opts":["One element in a compound","One subatomic particle","One energy level","One isotope of an element"],"ans":3,"exp":"Each candy type was an isotope with its own mass and abundance.","why":["All the candies were one 'element', Candium.","Each candy type stood for a whole isotope, not a particle.","The lab was about masses and abundance, not energy levels.",""]},{"deck":5,"q":"Magnesium and nitrogen react. What is the formula of the compound?","opts":["Mg₃N₂","Mg₂N₃","MgN","MgN₂"],"ans":0,"exp":"Mg²⁺ and N³⁻ cross over to Mg₃N₂.","why":["","Subscripts crossed onto the wrong ions: 2(+2) + 3(-3) = -5.","Mg²⁺ and N³⁻ do not cancel one to one.","1(+2) + 2(-3) = -4, not zero."]},{"deck":5,"q":"Why does sodium form Na⁺ instead of Na⁷⁻?","opts":["Sodium has no valence electrons","Losing 1 electron is easier","Sodium is a nonmetal","Na⁷⁻ would have too many protons"],"ans":1,"exp":"With 1 valence electron, losing it reaches a complete shell faster than gaining 7.","why":["Sodium has 1 valence electron, which it loses.","","Sodium is an alkali metal; metals lose electrons.","Gaining electrons never changes protons."]},{"deck":5,"q":"A compound is hard, brittle, melts at 800 °C and conducts when dissolved. What kind of compound is it?","opts":["Covalent","A pure metal","Ionic","A noble gas"],"ans":2,"exp":"These are the properties of ionic compounds.","why":["Covalent compounds usually have low melting points and do not conduct when dissolved.","A metal is an element, not a compound, and it conducts as a solid.","","Noble gases are elements and rarely form compounds."]},{"deck":6,"q":"Two students find the molar mass of Na₂S. One gets 55.06 g/mol. What did they do wrong?","opts":["Used the wrong mass for sulfur","Added an extra sulfur","Nothing; that is correct","Counted only one sodium"],"ans":3,"exp":"The subscript 2 on sodium must be counted.","why":["22.99 + 32.07 = 55.06 uses the right masses; the 2 on Na was skipped.","Two sulfurs would make it much heavier.","The correct molar mass is 2(22.99) + 32.07 = 78.05 g/mol.",""]},{"deck":6,"q":"Which needs Avogadro's number to solve?","opts":["Moles of CO₂ to molecules","Grams of CO₂ to moles","Moles of CO₂ to moles of O","Formula to molar mass"],"ans":0,"exp":"Avogadro's number converts between moles and particles.","why":["","That uses the molar mass, not Avogadro's number.","That uses the subscript ratio.","That only adds atomic masses."]},{"deck":6,"q":"Which sample has the most atoms in total?","opts":["1 mol of He","1 mol of CH₄","1 mol of CO₂","1 mol of NaCl"],"ans":1,"exp":"CH₄ has 5 atoms per molecule, more than the others.","why":["1 mol of He has 1 mol of atoms; 1 mol of CH₄ has 5.","","1 mol of CO₂ has 3 mol of atoms.","1 mol of NaCl has 2 mol of ions."]}],"flows":[{"id":"F1","title":"How the model of the atom changed","deck":2,"steps":["Dalton: solid indivisible atoms (1810)","Thomson: electrons, plum pudding (1897)","Rutherford: dense positive nucleus (1911)","Bohr: electrons in fixed orbits (1913)","Chadwick: the neutron (1932)","Modern: electrons in orbitals"]},{"id":"F2","title":"From atoms to an ionic compound","deck":5,"steps":["Metal atom loses electrons","Cation forms","Nonmetal atom gains electrons","Anion forms","Opposite charges attract (ionic bond)","Neutral formula, charges sum to zero"]},{"id":"F3","title":"Counting particles from a symbol","deck":3,"steps":["Protons = atomic number (Z)","Neutrons = mass number (A) - Z","Electrons = Z - charge"]},{"id":"F4","title":"Weighted average atomic mass","deck":4,"steps":["Turn each percent into a decimal","Multiply each decimal by that isotope's mass","Add the products","Check: the answer lands near the most common isotope"]},{"id":"F5","title":"Grams to atoms","deck":6,"steps":["Grams of compound","÷ molar mass = moles of compound","× subscript = moles of one element","× 6.022 × 10²³ = number of atoms"]}],"trees":["THE ATOM\n├─ Nucleus (tiny, dense, positive; almost all the mass)\n│  ├─ Protons: positive; number = atomic number (Z); sets the element\n│  └─ Neutrons: neutral; number = mass number (A) - Z; varies in isotopes\n└─ Electrons (outside the nucleus; nearly massless)\n   ├─ Neutral atom: electrons = protons\n   ├─ Cation: lost electrons (positive)\n   └─ Anion: gained electrons (negative)","THE PERIODIC TABLE\n├─ Metals (left of the staircase, plus the inner transition rows)\n│  ├─ Group 1: alkali metals (+1)\n│  ├─ Group 2: alkaline earth metals (+2)\n│  ├─ Groups 3-12: transition metals (variable charges)\n│  └─ Inner transition metals: lanthanides (58-71), actinides (90-103)\n├─ Metalloids (on the staircase): B, Si, Ge, As, Sb, Te\n└─ Nonmetals (right of the staircase, plus H)\n   ├─ Group 17: halogens (-1)\n   └─ Group 18: noble gases (no ions)","IONS\n├─ Cations: metals lose electrons (Na⁺, Mg²⁺, Al³⁺)\n└─ Anions: nonmetals gain electrons (Cl⁻, O²⁻, N³⁻)"],"tables":[{"title":"Ion charges by group","rows":[["Group","Name","Ion charge","Example"],["1","Alkali metals","+1","Na⁺"],["2","Alkaline earth metals","+2","Mg²⁺"],["3-12","Transition metals","Varies","Fe²⁺ or Fe³⁺"],["13","Boron family","+3","Al³⁺"],["14","Carbon family","4+ or 4-","none to memorize"],["15","Nitrogen family","-3","N³⁻"],["16","Oxygen family","-2","O²⁻"],["17","Halogens","-1","Cl⁻"],["18","Noble gases","No ion","Ne"]]},{"title":"The subatomic particles","rows":[["Particle","Charge","Location","Mass","What it decides"],["Proton","Positive","Nucleus","Has mass","The element (atomic number)"],["Neutron","Neutral","Nucleus","Has mass (about a proton's)","The isotope"],["Electron","Negative","Outside the nucleus","Nearly massless","Chemical behavior and charge"]]},{"title":"Ionic versus covalent","rows":[["","Ionic","Covalent"],["Electrons","Transferred (given and taken)","Shared, never fully transferred"],["Elements","Metal + nonmetal","Nonmetal + nonmetal"],["Held together by","Attraction between cation and anion","Shared electrons"],["Example","NaCl, MgCl₂","CH₄, CO₂, CF₄"]]},{"title":"Isotope examples","rows":[["Isotope","Protons","Neutrons","Electrons (neutral)","Mass number"],["Carbon-12","6","6","6","12"],["Carbon-13","6","7","6","13"],["Carbon-14","6","8","6","14"],["Hydrogen-1","1","0","1","1"],["Hydrogen-2 (deuterium)","1","1","1","2"],["Hydrogen-3 (tritium)","1","2","1","3"],["Oxygen-16","8","8","8","16"],["Oxygen-17","8","9","8","17"],["Oxygen-18","8","10","8","18"]]}],"watch":[{"deck":1,"text":"The review sheet says the actinide series is named \"because they follow the element actinide.\" The element is actinium (Ac, atomic number 89), as the periodic table on the slides shows. \"Actinide\" is the name of the series, not an element."},{"deck":1,"text":"Aluminum touches the metalloid staircase but is a metal. The review sheet calls this out; the slide's metalloids are B, Si, Ge, As, Sb and Te."},{"deck":1,"text":"The review sheet says there are 11 gases and 2 liquids at 25 °C but does not list them. Know the counts; if your teacher expects you to name them, check your notes."},{"deck":2,"text":"The guided notes spell the name \"JJ Thompson.\" The slides spell it Thomson, which is correct."},{"deck":3,"text":"\"Round the atomic mass to get the mass number\" only works when no isotope is named. If the problem gives the isotope (carbon-13, Re-187, ⁴⁶Ti), use that mass number instead."},{"deck":5,"text":"The review sheet says \"a positive atom is called a cation.\" A charged atom is an ion: a cation is a positive ion and an anion is a negative ion. A neutral atom has no charge."},{"deck":5,"text":"The review sheet lists charges for groups 1, 2, 13, 15, 16 and 17 but skips group 14. The slide's charge chart shows group 14 as 4+ or 4-, so it has no single charge to memorize."},{"deck":3,"text":"Long answer problem 4 asks about \"Pb-297.\" Real lead isotopes are around Pb-204 to Pb-208, so this is probably a typo for Pb-207 (VERIFY with your teacher). The method is the same: lead always has 82 protons; neutrons = mass number - 82; a 2+ ion has 80 electrons."},{"deck":4,"text":"The isotope slides say \"Nuclear number = 6 + 6 = 12.\" That is the mass number: protons plus neutrons. Use \"mass number\" on the test, as the review sheet and the other slides do."}],"practice":{"sections":[{"name":"Long answer","mode":"practice","tips":["Write the setup with units, then the answer. Check Answer shows the worked solution.","Self-mark each part honestly; partly right goes into Retest Missed Questions."],"questions":[{"id":"LA1","type":"frq","topic":"Ions","title":"Long answer 1","stem":"Halogen ions.","data":[],"parts":[{"k":"a","prompt":"What ion is formed by all members of the halogens?","model":"A 1- ion (an anion), such as F⁻, Cl⁻, Br⁻ or I⁻."},{"k":"b","prompt":"Explain what happens to the atom as it ionizes.","model":"A halogen has 7 valence electrons. It gains 1 electron to complete its octet. Its protons and nucleus do not change, so the extra electron gives it a 1- charge."}]},{"id":"LA2","type":"frq","topic":"Ions","title":"Long answer 2","stem":"A compound contains an unknown ion X and forms the ionic compound XCl₂. Ion X contains 10 electrons.","data":[],"parts":[{"k":"a","prompt":"What is the charge on X? Explain.","model":"2+. Two Cl⁻ ions give 2-, so X must be 2+ for the compound to be neutral."},{"k":"b","prompt":"What is the identity of element X?","model":"Protons = 10 + 2 = 12, so X is magnesium (Mg²⁺)."}]},{"id":"LA3","type":"frq","topic":"Ionic formulas","title":"Long answer 3","stem":"A member of the alkali metal family whose most stable ion contains 36 electrons forms a compound with chlorine.","data":[],"parts":[{"k":"a","prompt":"Identify the metal.","model":"Alkali metals form 1+ ions, so protons = 36 + 1 = 37: rubidium (Rb⁺)."},{"k":"b","prompt":"What is the correct formula for this compound?","model":"Rb⁺ and Cl⁻ balance one to one: RbCl."}]},{"id":"LA4","type":"frq","topic":"Subatomic particles","title":"Long answer 4","stem":"An ion of Pb-297 has lost 2 electrons. (VERIFY: real lead isotopes are about Pb-204 to Pb-208, so 297 may be a typo. Use the number as given; the method is the same.)","data":[],"parts":[{"k":"a","prompt":"How many protons, neutrons and electrons are in the ion?","model":"Protons = 82 (lead's atomic number). Neutrons = 297 - 82 = 215. Electrons = 82 - 2 = 80."},{"k":"b","prompt":"How many subatomic particles in total?","model":"82 + 215 + 80 = 377."},{"k":"c","prompt":"Write the isotopic notation.","model":"²⁹⁷₈₂Pb²⁺: mass number 297 on top, atomic number 82 below, charge 2+ at the upper right."}]},{"id":"LA5","type":"frq","topic":"Molar mass","title":"Long answer 5","stem":"Calcium cyanide, Ca(CN)₂.","data":[],"parts":[{"k":"a","prompt":"Count the atoms of each element.","model":"1 Ca, 2 C, 2 N (the 2 outside the parentheses doubles both C and N)."},{"k":"b","prompt":"What is the molar mass?","model":"40.08 + 2(12.01) + 2(14.01) = 92.12 g/mol."}]},{"id":"LA6","type":"frq","topic":"Ionic formulas","title":"Long answer 6","stem":"Barium bonds with phosphorus.","data":[],"parts":[{"k":"a","prompt":"Give the ion each element forms.","model":"Barium (group 2) forms Ba²⁺; phosphorus (group 15) forms P³⁻."},{"k":"b","prompt":"What ionic compound forms?","model":"Cross the charges: Ba₃P₂. Check: 3(+2) + 2(-3) = 0."}]},{"id":"LA7","type":"frq","topic":"Ionic formulas","title":"Long answer 7","stem":"Lithium bonds with nitrogen.","data":[],"parts":[{"k":"a","prompt":"Give the ion each element forms.","model":"Lithium (group 1) forms Li⁺; nitrogen (group 15) forms N³⁻."},{"k":"b","prompt":"What ionic compound forms?","model":"Cross the charges: Li₃N. Check: 3(+1) + (-3) = 0."}]},{"id":"LA8","type":"frq","topic":"Ions","title":"Long answer 8","stem":"An ion with a charge of 4+ has 46 electrons and 70 neutrons.","data":[],"parts":[{"k":"a","prompt":"What element is this?","model":"Protons = 46 + 4 = 50, so it is tin (Sn⁴⁺)."},{"k":"b","prompt":"What is its mass number?","model":"Mass number = protons + neutrons = 50 + 70 = 120."}]},{"id":"LA9","type":"frq","topic":"Molar mass","title":"Long answer 9","stem":"Carbonic acid, H₂CO₃.","data":[],"parts":[{"k":"a","prompt":"What is the molar mass?","model":"2(1.008) + 12.01 + 3(16.00) = 62.03 g/mol."}]},{"id":"LA10","type":"frq","topic":"Subatomic particles","title":"Long answer 10","stem":"Explain each of the following.","data":[],"parts":[{"k":"a","prompt":"Why does an ionic bond form?","model":"A metal loses electrons to become a cation and a nonmetal gains them to become an anion, so both complete their octets. The opposite charges attract: that electrostatic force is the ionic bond."},{"k":"b","prompt":"Why does the identity of an element depend on the number of protons it has?","model":"The number of protons is the atomic number, which sets the element. Electrons can be gained or lost (ions) and neutrons can vary (isotopes), but changing the protons makes a different element."},{"k":"c","prompt":"Why is atomic mass on the periodic table a decimal?","model":"Elements exist as a mixture of isotopes. The table lists the average of their masses, weighted by each isotope's abundance, so it is usually not a whole number."},{"k":"d","prompt":"Why do elements in the same group have similar chemical behavior?","model":"Elements in the same group have the same number of valence electrons, and chemical behavior comes from the electrons, so they bond in similar ways."}]},{"id":"SP102","type":"frq","topic":"Ions","title":"Textbook 102","stem":"A metal ion with a 2+ charge contains 34 neutrons and 27 electrons.","data":[],"parts":[{"k":"a","prompt":"Identify the metal ion.","model":"Protons = 27 + 2 = 29: copper, Cu²⁺."},{"k":"b","prompt":"Determine its mass number.","model":"29 + 34 = 63."}]},{"id":"SP98","type":"frq","topic":"Ions","title":"Textbook 98","stem":"How many electrons are in each ion?","data":[],"parts":[{"k":"a","prompt":"Se²⁻","model":"34 + 2 = 36."},{"k":"b","prompt":"Br⁻","model":"35 + 1 = 36."},{"k":"c","prompt":"Cr³⁺","model":"24 - 3 = 21."},{"k":"d","prompt":"Rb⁺","model":"37 - 1 = 36."},{"k":"e","prompt":"Bi³⁺","model":"83 - 3 = 80."},{"k":"f","prompt":"Cu²⁺","model":"29 - 2 = 27."}]},{"id":"SP107","type":"frq","topic":"Subatomic particles","title":"Textbook 107","stem":"Give the protons, neutrons and electrons in each.","data":[],"parts":[{"k":"a","prompt":"⁴¹₂₂Ti","model":"22 p, 19 n, 22 e."},{"k":"b","prompt":"⁶⁴₃₀Zn²⁺","model":"30 p, 34 n, 28 e."},{"k":"c","prompt":"⁷⁶₃₂Ge","model":"32 p, 44 n, 32 e."},{"k":"d","prompt":"⁸⁶₃₆Kr","model":"36 p, 50 n, 36 e."},{"k":"e","prompt":"⁷⁵₃₃As³⁻","model":"33 p, 42 n, 36 e."},{"k":"f","prompt":"⁴¹₁₉K⁺","model":"19 p, 22 n, 18 e."}]},{"id":"SL1","type":"frq","topic":"Ions","title":"Slide problem","stem":"A certain ion X⁺ contains 54 electrons and 78 neutrons.","data":[],"parts":[{"k":"a","prompt":"Identify the element.","model":"Protons = 54 + 1 = 55: cesium (Cs⁺)."},{"k":"b","prompt":"What is the mass number?","model":"55 + 78 = 133."}]},{"id":"SL2","type":"frq","topic":"Average atomic mass","title":"Slide problem","stem":"A class average works like an atomic mass: 65% of students scored 100, 25% scored 95 and 10% scored 90.","data":[],"parts":[{"k":"a","prompt":"What is the class average?","model":"0.65(100) + 0.25(95) + 0.10(90) = 97.75."},{"k":"b","prompt":"How is this like average atomic mass?","model":"Each score (isotope mass) is multiplied by the fraction of students (abundance) who got it, then the products are added."}]}]},{"name":"True/False","mode":"practice","tips":["One wrong word makes a statement false. Check the particle (proton, neutron, electron) and the direction (gain or lose)."],"questions":[{"id":"T1","type":"tf","topic":"Periodic table","stem":"Metals are found to the left of the metalloid staircase.","ans":true,"exp":"Metals are left of the staircase and in the inner transition rows."},{"id":"T2","type":"tf","topic":"Periodic table","stem":"Hydrogen is a metal because it sits in group 1.","ans":false,"exp":"Hydrogen is a nonmetal even though it sits on the left."},{"id":"T3","type":"tf","topic":"Periodic table","stem":"Elements in the same period have the same number of valence electrons.","ans":false,"exp":"Same period means the same number of electron shells. Same group means the same valence electrons."},{"id":"T4","type":"tf","topic":"Periodic table","stem":"At room temperature (25 °C) there are 11 gaseous elements and 2 liquid elements.","ans":true,"exp":"The rest are solids."},{"id":"T5","type":"tf","topic":"Periodic table","stem":"The actinide series is named after the element actinium.","ans":true,"exp":"It follows actinium (Ac, 89). Your review sheet wrote \"actinide\" by mistake."},{"id":"T6","type":"tf","topic":"History of the atom","stem":"Thomson's plum pudding model placed electrons in fixed orbits around a nucleus.","ans":false,"exp":"Thomson had electrons scattered in a sphere of positive charge. Fixed orbits are Bohr's model."},{"id":"T7","type":"tf","topic":"History of the atom","stem":"Chadwick discovered the neutron by bombarding beryllium with alpha particles.","ans":true,"exp":"The neutral radiation was a stream of neutrons."},{"id":"T8","type":"tf","topic":"History of the atom","stem":"Dalton's theory says atoms are created and destroyed in chemical reactions.","ans":false,"exp":"Dalton said atoms are not created or destroyed; reactions only regroup them."},{"id":"T9","type":"tf","topic":"Subatomic particles","stem":"Almost all of an atom's mass is in its nucleus.","ans":true,"exp":"Protons and neutrons have mass; electrons are nearly massless."},{"id":"T10","type":"tf","topic":"Subatomic particles","stem":"The number of electrons determines which element an atom is.","ans":false,"exp":"The number of protons does. Electrons determine chemical behavior and charge."},{"id":"T11","type":"tf","topic":"Isotopes","stem":"Isotopes of an element have different chemical properties because they have different numbers of neutrons.","ans":false,"exp":"Isotopes have almost identical chemistry, because chemistry depends on electrons."},{"id":"T12","type":"tf","topic":"Isotopes","stem":"Carbon-13 has 7 neutrons.","ans":true,"exp":"13 - 6 = 7."},{"id":"T13","type":"tf","topic":"Ions","stem":"A cation is formed when an atom gains electrons.","ans":false,"exp":"Gaining electrons makes an anion. A cation forms when an atom loses electrons."},{"id":"T14","type":"tf","topic":"Ions","stem":"Noble gases tend not to form ions because their valence shell is complete.","ans":true,"exp":"They already have an octet (helium has 2)."},{"id":"T15","type":"tf","topic":"Ionic formulas","stem":"Ionic compounds are electrically neutral overall.","ans":true,"exp":"The charges of the cations and anions add to zero."},{"id":"T16","type":"tf","topic":"Ionic formulas","stem":"Covalent compounds form when a metal transfers electrons to a nonmetal.","ans":false,"exp":"That describes an ionic compound. Covalent compounds share electrons between nonmetals."},{"id":"T17","type":"tf","topic":"Molar mass","stem":"The unit of molar mass is grams per mole (g/mol).","ans":true,"exp":"Molar mass is the mass of one mole."},{"id":"T18","type":"tf","topic":"Mole conversions","stem":"One mole of CCl₄ contains 4 moles of chlorine atoms.","ans":true,"exp":"The subscript gives the mole ratio."},{"id":"T19","type":"tf","topic":"Isotopes","stem":"Oxygen-17 has 9 neutrons.","ans":true,"exp":"17 - 8 = 9."},{"id":"T20","type":"tf","topic":"Isotopes","stem":"Oxygen-18 has more protons than oxygen-16.","ans":false,"exp":"Both have 8 protons; oxygen-18 has 2 more neutrons."}]},{"name":"Labeling","mode":"practice","tips":["Pick a label for every item, then press Check Answer. Each correct item counts toward the point."],"questions":[{"id":"L1","type":"label","topic":"Isotopes","stem":"For each pair, decide whether they are isotopes, the same atom, or different elements.","labels":["Isotopes","Same atom","Different elements"],"items":[{"t":"¹²₆C and ¹³₆C","ans":0,"exp":"Same Z (6), different mass numbers."},{"t":"Carbon-12 and ¹²₆C","ans":1,"exp":"Two ways of writing the same atom."},{"t":"Argon-40 and argon-41","ans":0,"exp":"Same element, different mass numbers."},{"t":"¹¹₅B and boron-10","ans":0,"exp":"Both boron (Z = 5), different mass numbers."},{"t":"13 p, 13 n and 14 p, 13 n","ans":2,"exp":"Different proton counts: aluminum and silicon."},{"t":"²²₁₀X and ²²₁₁X","ans":2,"exp":"Same mass number but different atomic numbers."}]},{"id":"L2","type":"label","topic":"Periodic table","stem":"Classify each element.","labels":["Metal","Nonmetal","Metalloid"],"items":[{"t":"Aluminum (Al)","ans":0,"exp":"Touches the staircase but is a metal."},{"t":"Silicon (Si)","ans":2,"exp":"On the staircase."},{"t":"Hydrogen (H)","ans":1,"exp":"A nonmetal even though it sits on the left."},{"t":"Selenium (Se)","ans":1,"exp":"Right of the staircase."},{"t":"Germanium (Ge)","ans":2,"exp":"On the staircase."},{"t":"Calcium (Ca)","ans":0,"exp":"Group 2, left side."},{"t":"Tellurium (Te)","ans":2,"exp":"On the staircase."},{"t":"Bromine (Br)","ans":1,"exp":"A halogen, right of the staircase."}]},{"id":"L3","type":"label","topic":"Periodic table","stem":"Name the family each element belongs to.","labels":["Alkali metal","Alkaline earth metal","Transition metal","Halogen","Noble gas"],"items":[{"t":"Potassium (K)","ans":0,"exp":"Group 1."},{"t":"Strontium (Sr)","ans":1,"exp":"Group 2."},{"t":"Iron (Fe)","ans":2,"exp":"Group 8, in the 3-12 block."},{"t":"Iodine (I)","ans":3,"exp":"Group 17."},{"t":"Argon (Ar)","ans":4,"exp":"Group 18."},{"t":"Cesium (Cs)","ans":0,"exp":"Group 1."},{"t":"Barium (Ba)","ans":1,"exp":"Group 2."},{"t":"Chlorine (Cl)","ans":3,"exp":"Group 17."}]},{"id":"L4","type":"label","topic":"Ions","stem":"Give the charge of the ion each element usually forms.","labels":["+1","+2","+3","-1","-2","-3","No ion"],"items":[{"t":"Rubidium (Rb)","ans":0,"exp":"Group 1."},{"t":"Barium (Ba)","ans":1,"exp":"Group 2."},{"t":"Gallium (Ga)","ans":2,"exp":"Group 13."},{"t":"Fluorine (F)","ans":3,"exp":"Group 17."},{"t":"Sulfur (S)","ans":4,"exp":"Group 16."},{"t":"Nitrogen (N)","ans":5,"exp":"Group 15."},{"t":"Krypton (Kr)","ans":6,"exp":"Noble gas: complete valence shell."},{"t":"Lithium (Li)","ans":0,"exp":"Group 1."}]},{"id":"L5","type":"label","topic":"Ions","stem":"Decide whether each particle is a cation, an anion or a neutral atom.","labels":["Cation","Anion","Neutral atom"],"items":[{"t":"Chlorine with 18 electrons","ans":1,"exp":"17 protons, 18 electrons: charge 1-."},{"t":"Sodium with 10 electrons","ans":0,"exp":"11 protons, 10 electrons: charge 1+."},{"t":"Oxygen with 8 electrons","ans":2,"exp":"8 protons, 8 electrons."},{"t":"Iron with 23 electrons","ans":0,"exp":"26 protons, 23 electrons: charge 3+."},{"t":"Nitrogen with 10 electrons","ans":1,"exp":"7 protons, 10 electrons: charge 3-."},{"t":"Argon with 18 electrons","ans":2,"exp":"18 protons, 18 electrons."}]},{"id":"L6","type":"label","topic":"Subatomic particles","stem":"Match each description to the particle.","labels":["Proton","Neutron","Electron"],"items":[{"t":"Its number sets which element it is","ans":0,"exp":"Atomic number = protons."},{"t":"Its number changes when an ion forms","ans":2,"exp":"Ions gain or lose electrons."},{"t":"Its number differs between isotopes","ans":1,"exp":"Isotopes differ in neutrons."},{"t":"Determines chemical behavior","ans":2,"exp":"Electrons do the bonding."},{"t":"Nearly massless","ans":2,"exp":"Electrons are nearly massless."},{"t":"Neutral and in the nucleus","ans":1,"exp":"Neutrons have no charge."}]},{"id":"L7","type":"label","topic":"History of the atom","stem":"Match each discovery or model to the scientist.","labels":["Dalton","Thomson","Rutherford","Bohr","Chadwick"],"items":[{"t":"Plum pudding model","ans":1,"exp":"Electrons in a sphere of positive charge."},{"t":"Gold foil experiment and the nucleus","ans":2,"exp":"Alpha particles and metal foil."},{"t":"Electrons in fixed orbits","ans":3,"exp":"Fixed energy levels."},{"t":"Discovery of the neutron","ans":4,"exp":"Beryllium and alpha particles."},{"t":"Atoms are regrouped, never destroyed, in reactions","ans":0,"exp":"Part of Dalton's atomic theory."},{"t":"Discovery of the electron","ans":1,"exp":"Cathode ray tubes."}]},{"id":"L8","type":"label","topic":"Isotopes","stem":"How many neutrons does each isotope have?","labels":["0","1","2","6","7","8","9","10"],"items":[{"t":"Carbon-12","ans":3,"exp":"12 - 6 = 6."},{"t":"Carbon-13","ans":4,"exp":"13 - 6 = 7."},{"t":"Carbon-14","ans":5,"exp":"14 - 6 = 8."},{"t":"Hydrogen-1","ans":0,"exp":"1 - 1 = 0."},{"t":"Hydrogen-2 (deuterium)","ans":1,"exp":"2 - 1 = 1."},{"t":"Hydrogen-3 (tritium)","ans":2,"exp":"3 - 1 = 2."},{"t":"Oxygen-16","ans":5,"exp":"16 - 8 = 8."},{"t":"Oxygen-17","ans":6,"exp":"17 - 8 = 9."},{"t":"Oxygen-18","ans":7,"exp":"18 - 8 = 10."}]}]},{"name":"Crossover formulas","mode":"practice","tips":["Write the cation and anion with charges, cross the numbers over, then reduce to the lowest ratio.","Read every choice, then cross off the ones you can prove wrong."],"questions":[{"id":"X1","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Li and O?","options":["Li₂O","LiO₂","LiO","No compound forms"],"ans":0,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: Li₂O.","why":["","The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","A metal and a nonmetal form an ionic compound."]},{"id":"X2","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Mg and Cl?","options":["Mg₂Cl","MgCl₂","MgCl","No compound forms"],"ans":1,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: MgCl₂.","why":["The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","","The charges of these two ions are not equal in size, so one of each does not balance.","A metal and a nonmetal form an ionic compound."]},{"id":"X3","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Al and F?","options":["Al₃F","AlF","AlF₃","No compound forms"],"ans":2,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: AlF₃.","why":["The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","","A metal and a nonmetal form an ionic compound."]},{"id":"X4","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Ba and N?","options":["Ba₂N₃","BaN","No compound forms","Ba₃N₂"],"ans":3,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: Ba₃N₂.","why":["The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","A metal and a nonmetal form an ionic compound.",""]},{"id":"X5","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from K and S?","options":["K₂S","KS₂","KS","No compound forms"],"ans":0,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: K₂S.","why":["","The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","A metal and a nonmetal form an ionic compound."]},{"id":"X6","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Sr and O?","options":["Sr₂O₂","SrO","SrO₂","No compound forms"],"ans":1,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: SrO.","why":["Sr²⁺ and O²⁻ already balance one to one; reduce 2:2 to 1:1.","","That needs Sr⁴⁺. Strontium forms 2+ ions.","A metal and a nonmetal form an ionic compound."]},{"id":"X7","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Na and P?","options":["NaP₃","NaP","Na₃P","No compound forms"],"ans":2,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: Na₃P.","why":["The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","","A metal and a nonmetal form an ionic compound."]},{"id":"X8","type":"mcq","topic":"Ionic formulas","stem":"Use the crossover method: what compound forms from Ga and Cl?","options":["Ga₃Cl","GaCl","No compound forms","GaCl₃"],"ans":3,"exp":"Write each ion's charge, cross the numbers over as subscripts, and reduce. Formula: GaCl₃.","why":["The subscripts are crossed onto the wrong ions, so the charges do not add to zero.","The charges of these two ions are not equal in size, so one of each does not balance.","A metal and a nonmetal form an ionic compound.",""]}]},{"name":"MCQ Set A: atoms and isotopes","mode":"practice","tips":["Read every choice, then cross off the ones you can prove wrong.","For particle questions write Z, A and the charge first: p = Z, n = A - Z, e = Z - charge.","For formulas, write both ion charges before you look at the choices, then check the sum is zero.","Distractors are built from real mistakes: a skipped subscript, swapped abundances, a reversed crossover. Name the mistake behind each wrong choice."],"questions":[{"id":"A1","type":"mcq","topic":"Isotopes","stem":"A certain isotope contains 23 protons and 28 neutrons. What are its mass number and identity?","options":["51, vanadium","28, nickel","23, vanadium","51, antimony"],"ans":0,"exp":"Mass number = protons + neutrons = 23 + 28 = 51. Atomic number 23 is vanadium (V).","why":["","28 is the neutron count, not the atomic number. The element is set by the 23 protons.","23 is the atomic number. The mass number adds protons and neutrons: 23 + 28 = 51.","Antimony has 51 protons. Here 51 is the mass number; the 23 protons make it vanadium."]},{"id":"A2","type":"mcq","topic":"History of the atom","stem":"In Rutherford's experiment most alpha particles passed straight through the metal foil. What did this show?","options":["Electrons are spread through positive charge","The atom is mostly empty space","The nucleus contains neutral particles","Electrons orbit in fixed energy levels"],"ans":1,"exp":"If most particles meet nothing, most of the atom is empty space.","why":["That is Thomson's plum pudding model, which this experiment disproved.","","Neutrons were found later, by Chadwick in 1932. Alpha particles passing through says nothing about them.","That is Bohr's 1913 model. Particles passing through show empty space, not orbits."]},{"id":"A3","type":"mcq","topic":"History of the atom","stem":"A few alpha particles in Rutherford's exper
